  "title": "纳指创新高！Meta引爆AI交易，英特尔涨超12%，原油跌至两周低位_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "纳指创新高！Meta引爆AI交易，英特尔涨超12%，原油跌至两周低位\n\n 2026年09月22日 07:09 第一财经\n\n 10年期美债收益率失守5%关口。 \n\n*三大股指普涨，标普500指数逼近7800点；\n\n*派拉蒙宣布已与美国加利福尼亚州及其他11个州达成和解协议，与华纳合并扫清了障碍；\n\n*美国与丹麦就格陵兰地位的外交谈判取得进展，部分格陵兰标的翻倍。\n\n周一美股全线走高，AI权重股领涨大盘。美债收益率自近期高位回落，布伦特原油跌至两周低位，市场押注本周联合国大会期间中东谈判有望取得进展。\n\n截至收盘，道琼斯工业平均指数上涨366.19点，涨幅0.71%，报52048.83点，纳斯达克综合指数涨2.26%，报27122.09点，创下历史收盘新高，标普500指数涨1.49%，报7764.70点。\n\n【热门股表现】\n\n个股方面，明星科技股集体上扬，受近期Muse AI智能体发布催化， Meta大涨11.43%领跑，富国银行上调Meta目标价，英伟达、特斯拉涨超2%。\n\n芯片板块集体走强，费城半导体指数涨4.29%。英特尔大涨12%，AMD上涨约10%，市值突破1万亿美元，高通涨幅也超过9%。\n\n存储芯片标的分化，美光科技涨2.77%，希捷科技涨2.16%，西部数据涨1.54%，SK海力士涨0.73%，闪迪跌1.41%。\n\n光通信板块普涨，康宁涨5.89%，Lumentum涨2.53%，Coherent涨1.31%。\n\n华纳兄弟上涨11%，创10月以来最大涨幅，派拉蒙天舞下跌2.9%。当地时间9月21日，派拉蒙宣布已与美国加利福尼亚州及其他11个州达成和解协议。这些州此前曾提起诉讼，试图阻止该公司与华纳兄弟探索公司之间价值1100亿美元的合并交易；此次和解为这两大好莱坞巨头的合并扫清了障碍。\n\n比特币创7个多月新高，带动Coinbase、Strategy涨幅超4%。\n\n美国与丹麦就格陵兰地位的外交谈判取得进展，美股格陵兰相关标的大涨。Greenland Mines股价涨230%，Greenland Energy涨幅超一倍。\n\n【市场概述】\n\n中东局势方面，据央视新闻报道，伊朗总统办公室21日宣布，总统佩泽希齐扬将于22日启程前往美国出席联合国大会。消息称，美国政府采取敌对举措，拒绝向佩泽希齐扬的媒体团队发放签证，因此他将不携带媒体团队前往纽约。第81届联合国大会一般性辩论将于22日在纽约拉开帷幕。另据美国方面消息，佩泽希齐扬预计23日在联合国大会上发表讲话。上周末美伊双方仍有言语交锋，但美国总统特朗普表示愿意与伊朗总统会面。\n\n美国10年期基准国债收益率跌破关键心理关口5%，10年期美债收益率下行4.1个基点至4.96%。\n\nB.Riley Wealth首席市场策略师阿特·霍根称：“市场习惯紧盯油价与美国10年期国债收益率。今天这两个变量，至少短期而言，从市场逆风转为利好。”\n\n美联储上周为抗击通胀，三年来首次加息，投资者对利率前景仍存警惕。CME 美联储观察工具显示，交易员定价下月再次加息概率为 50%。\n\n芝加哥联储主席古尔斯比周一在伦敦一场活动上表示，供给冲击已经成为经济常态，政策制定者不能再简单忽略这类冲击。古尔斯比称：“我们需要证据证明这些冲击确实在消退，否则很难看到一条可信的路径将通胀带回2%目标；更难继续维持‘无视供给冲击’的政策思路。”\n\nYardeni Research 总裁埃德・亚德尼（Ed Yardeni）在周一研报写道：能源价格长期维持高位，增加了美联储进一步收紧货币政策的理由。供给端风险并未消失：中东冲突持续威胁石油生产与航运；乌克兰打击俄罗斯炼油厂，叠加对俄制裁，进一步收紧全球燃料供给。他表示：“能源冲击持续时间越久，产生通胀第二轮传导效应的风险就越大。”\n\n【大宗表现】\n\n国际油价跌至两周低位，纽约商品交易所10月交货的轻质原油期货价格下跌4.52美元，收于每桶95.78美元，跌幅为4.51%；11月交货的伦敦布伦特原油期货价格下跌3.53美元，收于每桶100.34美元，跌幅为3.4%。\n\n贵金属市场走弱，纽约商品交易所9月交割的COMEX黄金期货跌0.91%，报4345.80美元/盎司，COMEX白银期货跌1.10%，报65.82美元/盎司。",
  "deep": "## AI 解读\n\n核心要点：\n\n1. AI叙事再度主导市场：Meta受Muse AI智能体发布催化大涨11.4%，带动英伟达、特斯拉走强，纳指创历史新高。芯片板块全面爆发，费城半导体指数涨4.3%，英特尔涨12%、AMD涨10%并突破万亿美元市值，AI算力需求预期从GPU向CPU、光通信、存储等全产业链扩散。\n\n2. 宏观逆风阶段性缓解：10年期美债收益率失守5%关键关口，布伦特原油跌至两周低位，此前压制估值的两大变量同步转向。市场押注联合国大会期间中东谈判取得进展，地缘风险溢价短期回落。\n\n3. 风险偏好全面回升：派拉蒙与华纳1100亿美元合并扫清障碍、比特币创七个多月新高、格陵兰概念股暴涨，显示资金风险偏好处于高位。\n\n影响分析：\n\n短期看，美债收益率回落与油价下行构成估值支撑，AI产业链从核心算力向边缘标的扩散，市场广度改善。但需警惕两个隐患：一是美联储加息概率仍达50%，古尔斯比明确提示供给冲击常态化，能源高位若持续将强化二次通胀风险；二是中东谈判若未果，油价与避险情绪可能迅速反转。当前上涨建立在“逆风转顺风”的阶段性窗口上，持续性取决于本周联合国大会地缘进展与后续通胀数据验证。",

  "lede": "新华财经| 2026年09月22日\n\n美联储三年来首次加息至3.75%-4%后，古尔斯比、穆萨勒姆与卡什卡利三位地方联储主席的讲话，揭示了央行应对持续性供给冲击的深层逻辑转变。三人分别从打破“看穿”惯例、主张渐进式紧缩及警示通胀跨部门扩散三个维度，论证了进一步收紧政策的必要性。\n\n新华财经北京9月22日电 美联储将联邦基金利率目标区间上调25个基点至3.75%-4%，标志着货币政策对持续性供给冲击的认知发生根本性转向。本周初，美联储官员相继发表讲话。三位地方联储主席的表态，分别从理论逻辑、操作路径与通胀结构三个维度，深度拆解了美联储当前的决策框架。他们的分析不仅解释了本轮加息的内在动因，也预示着未来政策“更高、更久”的演进方向。\n\n古尔斯比：供给冲击常态化打破“看穿”逻辑，直面经济阵痛\n\n芝加哥联储主席奥斯坦·古尔斯比（Austan Goolsbee）明确指出，供给冲击正变得“更频繁、打击更猛烈、持续更久”，一旦其对通胀的影响变得持续，“‘看穿’背后的部分逻辑便不再成立”。\n\n自20世纪70年代以来，各国央行通常将供给冲击视为暂时性因素并选择“看穿”。但古尔斯比基于疫情后供应链问题、徘徊在每桶100美元附近的油价以及持续升级的关税等事实，判定这类冲击已成为经济的“常态特征”。这一判断直接推翻了特朗普政府官员关于“供给冲击对价格只构成一次性冲击”的传统论点。\n\n在政策推演上，古尔斯比展现了极度的现实主义。他坦言，应对供给冲击虽不必像应对需求过热时那样激进，但“压低通胀的唯一办法就是加息，缩小供需之间的缺口”。这意味着经济必须经历就业、工资和增长的下降，以适应“一个新的、不那么有利的均衡”。古尔斯比将这种滞胀型冲击下的痛苦权衡视为必然，并直言“唯一的回头之路就是那条艰难的路”。\n\n穆萨勒姆：当前利率仍处“宽松一侧”，力主渐进式紧缩\n\n圣路易斯联储主席穆萨勒姆（Alberto Musalem）则聚焦于“如何执行紧缩”的操作路径。他提出了一个关键判断：即便经历了上周的加息，当前3.75%-4%的联邦基金利率目标区间仍处于“宽松一侧”，货币政策可能仍在一定程度上刺激经济。\n\n基于这一判断，穆萨勒姆对未来的通胀风险进行了概率评估。他认为，若不进一步收紧政策，未来18个月通胀显著高于2%目标的可能性，要高于回落至目标水平的可能性。这一量化视角的风险评估，为年内继续加息提供了直接依据。\n\n在操作策略上，穆萨勒姆明确倾向于“较早通过渐进方式提高利率”。他的逻辑在于，提前采取较小幅度的渐进式收紧，对经济造成的扰动更小，从而降低未来不得不大幅加息的可能性。这种“早且小”的策略，反映出美联储试图在控制通胀与避免经济硬着陆之间寻找最优解，同时也暗示本轮加息并非一次性调整，而是一个持续的校准过程。\n\n卡什卡利：通胀压力跨部门扩散，经济韧性提供紧缩空间\n\n明尼阿波利斯联储主席尼尔·卡什卡利（Neel Kashkari）指出，通胀压力已超出中东战争引发的油价冲击范围，“蔓延至经济的方方面面”，特别是服务业同样存在明显的通胀压力。\n\n如果通胀仅局限于能源或关税等特定领域，央行尚可寄望于冲击消退；但当价格压力扩散至服务业等广泛领域时，意味着通胀预期可能正在脱锚，价格压力已具备内生持续性。卡什卡利作为7月反对维持利率不变的官员之一，其核心担忧在于“等待太久才加息，可能会面临通胀根深蒂固的风险”。\n\n同时，卡什卡利评估了宏观经济的承受能力。他认为，尽管面临地缘政治冲突和贸易问题，美国经济和劳动力市场依然强劲。这种经济韧性为美联储通过更高利率抑制价格压力提供了充足的空间，使得央行在推进紧缩时不必过度担忧立即引发深度衰退。\n\n内部图景：地方联储的“鹰派共识”与主席的“温和定调”\n\n三位地方联储主席的讲话，可以清晰看到一条完整的鹰派逻辑链条：古尔斯比确立了必须应对持续性供给冲击的理论前提，卡什卡利提供了通胀已广泛扩散的现实证据，穆萨勒姆则规划了渐进式加息的操作路径。然而，这一逻辑链条与美联储主席沃什的表态存在微妙温差。沃什在新闻发布会上将加息定性为“撤除宽松”，并明确表示“不认为我们职责中的两个部分——价格稳定与充分就业——在中期内会相互冲突”，否认需要损害劳动力市场来达到2%的通胀目标。\n\n三位地方联储主席侧重于揭示抗通胀的潜在成本与结构性风险，以管理市场预期；而美联储主席则更侧重于安抚市场情绪，强调政策调整的平稳性。但最新点阵图显示，18名提交预测的官员中有16人预计年内至少还会再加息一次，2026年底利率中值预测升至4.1%，且通胀回归2%目标被推迟至2029年。点阵图表明，三位地方联储主席所描绘的“艰难之路”，实质上已成为美联储官员们的主流共识。\n\n编辑：马萌伟\n\n客服热线：400-6123115\n\n客服邮箱：xinhuacaijing@xinhua.org",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 政策逻辑根本转向：美联储三年来首次加息至3.75%-4%，标志其对供给冲击的认知从“暂时性看穿”转向“常态化应对”。古尔斯比明确打破传统“看穿”框架，承认压低通胀必须经历就业与增长下降的“阵痛”。\n2. 鹰派共识成形：三位地方联储主席从理论前提（古尔斯比）、通胀结构（卡什卡利）、操作路径（穆萨勒姆）构建完整紧缩逻辑链。穆萨勒姆判断当前利率仍处“宽松一侧”，力主“早且小”的渐进紧缩。\n3. 内部分歧有限：主席沃什以“撤除宽松”温和定调、安抚市场，但点阵图显示18人中16人预计年内至少再加息一次，2026年底利率中值升至4.1%，通胀回归2%推迟至2029年——鹰派逻辑已成主流共识。\n\n影响分析\n\n其一，紧缩周期拉长。“更高、更久”成为政策主基调，市场需重新定价利率路径，年内再度加息概率显著上升。其二，滞胀风险实质化。供给冲击常态化叠加通胀跨部门扩散，美联储被迫在增长与物价间做痛苦权衡，经济“硬着陆”尾部风险不容忽视。其三，预期管理分化。地方联储释放鹰派信号以压制通胀预期，主席则侧重安抚市场，这种“鹰派共识+温和定调”的组合，意在为渐进紧缩争取政策空间，但若通胀韧性超预期，内部分歧可能再度放大。",

  "title": "中信期货有限公司 - 美股收盘：纳指涨超2%再创新高 Meta市值单日暴增1.29万亿",
  "src": "Exa 搜索",
  "lede": "2026-09-22 来源：财联社\n\n财联社9月22日讯（编辑 史正丞）昨夜今晨，伴随着科技龙头集体拉涨，纳斯达克指数时隔近4个月再创收盘新高。\n\n截至收盘，标普500指数涨1.49%，报7764.7点；纳斯达克综合指数涨2.26%，报27122.09点；道琼斯工业平均指数涨0.71%，报52048.83点。\n\n### （纳指日线图，来源：TradingView）\n\n今日美股大涨的“头功”得记在扎克伯格名下。\n\n随着 Meta推出的个人AI助手Muse取代ChatGPT，成为美国iOS平台上最受欢迎的免费应用，资本市场对AI概念的炒作热情再度喷发。\n\n据分析机构Sensor Tower的统计，Muse是在上周五取代ChatGPT，成为美国市场上最受欢迎的免费iOS应用。截至发稿时，Muse依然牢牢占据“榜一”的位置。\n\n### （来源：苹果应用商店）\n\n受此消息刺激， Meta周一大涨11.43%，单日市值逾1900亿美元，约合人民币1.29万亿元。\n\n简单来说，Muse是Meta替普通用户搭建并运好的“AI办事助理”。它和 OpenClaw （“龙虾”）属于相近方向，主要区别在于“技术小白拿来即用”与“自己搭建、自己掌控”。 按照Meta的介绍，Muse拥有一台在云端运行的专属虚拟电脑和浏览器，可以连接用户授权的应用，浏览网页、填写表格、处理邮件、协助购物和预订旅行。\n\n### （来源：Meta官网）\n\nMeta表示，对于大多数用户而言，使用Muse是免费的，而对于那些需要更多功能和额度的用户，也有相应的付费订阅可供选择。\n\n伯恩斯坦的分析师斯泰西·拉斯贡周一对媒体表示：“我认为，到目前为止，大多数基于智能代理的技术应用其实并不是为普通人设计的。而现在，像Muse这样的智能代理，或许具备更广泛的应用潜力。”\n\n与这轮行情一样，目前尚不清楚Muse的热度到底能维持多久。不过面对友商的AI产品爆火，美国互联网圈子也表现出截然不同的态度。\n\n电商巨头亚马逊已在上周日以“隐私与安全风险”为由，禁止Muse访问其网站。亚马逊的一位发言人在接受媒体采访时表示：“我们认为，那些能够代表客户在其他商家处进行购买的第三方应用，应当透明地运作，并尊重服务提供商关于是否参与此类服务的决定。”\n\n与此同时，另一家电商平台Shopify宣布与Meta合作接入Muse。Shopify的首席执行官托比亚斯·吕特克周一宣布，该平台将与Muse携手，在其在线商店中引入智能体结账功能。\n\n热门股表现\n\n按市值排名，截至收盘，英伟达涨2.3%、苹果涨0.85%、谷歌-A涨1.55%、微软涨1.59%、亚马逊涨1.87%、台积电涨2.41%、SpaceX跌0.56%、Meta涨11.43%、博通涨1.6%、特斯拉涨3.03%、SK海力士涨0.73%、美光科技涨2.77%、礼来涨1.04%、伯克希尔哈撒韦-A跌1.5%。\n\n作为直接受益于Muse的板块，美股CPU概念股集体大涨。截至收盘， AMD涨9.95%、英特尔涨12.14%、高通涨9.29%、ARM涨17.16%。分析师和股民已经形成共识，智能体应用的爆火有利于提升服务器CPU需求。\n\nAMD也加入英伟达、博通和美光科技的行列，成为历史上第四家市值达到1万亿美元的美国芯片公司。\n\n### （来源：companiesmarketcap）\n\n与AI相关的板块个股多数走高。光通信板块的Lumentum涨2.53%、康宁涨5.89%，两家公司携手高通，在欧洲光通信会议（ECOC）联合演示面向AI横向扩展的高密度芯粒间光互连系统；存储板块的美光科技、希捷科技均涨超2%，企业级数据存储和数据管理Everpure涨9.14%。\n\n其他个股方面，CDN和网络安全概念股阿卡迈涨12.33%、超微电脑涨5.4%、迈威尔科技涨5.38%、应用材料涨4.42%，新思科技涨4.38%。\n\n“癌症疫苗”牛股莫德纳周一收涨12.27%，接近回到8月19日发布“癌症疫苗”结果后创出的年内高点。\n\n### （莫德纳日线图，来源：TradingView）\n\n公司周一发布公告，宣布其与默沙东联合开发的在研个体化mRNA新抗原疗法intismeran autogene的三项研究摘要，已获接收在10月23日至27日于马德里举行的2026年欧洲肿瘤内科学会（ESMO）大会上展示。\n\n随着比特币周一从8.1万暴涨至8.7万美元，加密货币概念股集体走强。Strategy涨9.47%、嘉楠科技涨11.88%、Coinbase涨3.5%。\n\n另外，受丹麦将与美国签订安全协议影响，多只格陵兰概念股周一暴涨。其中，Critical Metals涨38.63%、格陵兰能源涨140%、格陵兰矿业涨230.53%。",
  "deep": "## AI 解读\n\n核心要点：\n\n1. AI应用端迎来“iPhone时刻”：Meta旗下AI助手Muse取代ChatGPT登顶美国iOS免费榜，标志着AI智能体（Agent）从开发者工具走向大众消费级产品，市场将其定性为AI商业化落地的关键拐点。\n2. 资本市场暴力定价：Meta单日涨11.43%、市值暴增1900亿美元，纳指再创新高；CPU概念股（AMD+9.95%、英特尔+12.14%、ARM+17.16%）集体暴涨，反映市场预期智能体大规模部署将拉动服务器算力需求。\n3. 生态阵营分化：亚马逊以安全为由封禁Muse，Shopify则主动接入，AI智能体的商业入口争夺战已实质性开打。\n\n影响分析：\n\n短期看，市场正在从“算力叙事”向“应用叙事”切换——Muse的爆发证明AI Agent具备真实用户粘性，这将重新定价整个AI产业链的价值分布，应用层和CPU/基础设施层同时受益。中期需关注两点风险：一是Muse热度能否持续，用户留存率是关键验证指标；二是平台封锁（如亚马逊）可能引发AI智能体跨平台互操作性的监管博弈。若Agent模式跑通，电商、旅游、SaaS等领域的流量分发逻辑将被重构，传统平台护城河面临侵蚀。",

  "lede": "A股市场今日早盘低开低走，午后两点开始强力反攻，最终实现三大指数集体上涨。\n\n截至收盘，沪指涨0.22%，深证成指涨0.22%，创业板指涨0.09%。\n\n个股方面，上涨股票数量接近3000只，逾70只股票涨停。煤炭、能源、文化传媒、航运港口、化纤、多元金融等板块涨幅居前，工程机械、采掘、非金属材料、生物制品等板块跌幅居前。\n\n今日迎来霜降节气，大江南北天气转凉。A股市场早盘也迎来一波冷空气，沪指盘中一度跌约1%。\n\n然而下午2点后，资金突然蜂拥进场，A股三大股指集体拉升翻红。\n\n消息面上，商务部新闻发言人就中美经贸磋商有关问题答记者问。\n\n此外，今日市场仍有不少赛道温度火热，尤其是科技板块亮点多多，赚钱效应并不差。\n\n一般而言，新股和次新股表现是衡量大盘冷热的重要温度计。今日在大盘调整期间，新股与次新股表现抢眼。建发致新20cm涨停，昊创瑞通、云汉芯城涨超10%，联合动力、广东建科、艾芬达跟涨。\n\n新股和次新股大涨对重新凝聚人气起到了重要作用。而这些次新股本身就以科技板块为主。\n\n我们以次新股云汉芯城为例。该公司是国内最早一批推出电子元器件B2B线上商城并以此开展业务的企业之一，目前已成为我国电子元器件领域B2B领军企业。公司股票于9月30日在深交所创业板挂牌上市，发行价27元/股，首日收盘价即达116.8元/股。之后云汉芯城继续大涨，今日收盘价已较上市首日收盘价再次翻倍。\n\n以新股、次新股为代表的科技股躁动，或进一步强化A股科技主线。\n\n华金证券首席策略分析师邓利军在研报中提到，“十五五”期间，驱动中国经济增长的变量可能主要在于全要素生产率的提升、资本和劳动力供给的质量提升。从宏观环境的转变上看，“十五五”规划可能侧重扩大内需、科技自立自强等方向。\n\n邓利军表示，“十五五”规划落地可能对A股走势影响有限，但可能进一步强化科技主线，可关注以下行业：\n\n一是科技自立自强与现代化产业体系建设方向上，计算机、电子、通信、机器人等新质生产力相关行业；\n\n二是消费提振与民生保障方向上，创新药、新消费等相关行业；\n\n三是绿色低碳转型方向上，电新、农林牧渔等“双碳”目标相关行业；\n\n四是新发展格局和深化改革开放方向上，有色金属、电新、石化等“反内卷”和国企改革相关的行业；\n\n五是自主可控和国家安全方向上，航空航天、深地经济、海洋经济等相关的行业。\n\n总之，越接近10月末，政策出台时间越临近。A股方向等待可能不会太久了。\n\n最后我们再来看看今日霜降节气中另一火热板块——煤炭。\n\n今日煤炭股掀起涨停潮，陕西黑猫、山西焦化、云煤能源、上海能源、郑州煤电、大有能源、辽宁能源、安泰集团等涨停。其中大有能源更是录得“10天9板”行情。\n\n近期，在供需紧张的背景下，煤炭市场已经有了涨价的现象。天风证券研报称，近期国内动力煤价格超预期大涨。截至2025年10月17日，秦皇岛港Q5500动力末煤价格748元/吨，周环比大涨43元/吨。\n\n天风证券认为，安全检查和超产核查政策仍限制供应增量，此外大秦线检修持续，叠加南方天气转凉，北方供暖或提前，上调年内动力煤目标价至750～800元/吨。\n\n山西证券表示，看好四季度煤炭板块投资机会，煤炭弹性品种排序靠前。随着“反内卷”相关政策落地，四季度国内煤炭供应增量预期有限，煤价向下有所支撑。而四季度迎峰度冬，需求可期，预计均价也将在一定程度上环比修复。当前板块整体估值已经较低，近期市场风格切换需求提升，煤炭具备补涨动力，板块逢低可增配，优选弹性品种。\n\n### 网友看法\n\n### 联系我们\n\n在线咨询：\n\n微信号：79111873\n\n工作日：9:30-18:30，节假日休息",
  "deep": "## AI 解读\n\n# A股尾盘拉升深度解读\n\n核心要点：\n\n1. V型反转信号明确：早盘沪指一度跌约1%，午后2点资金蜂拥进场，三大指数集体翻红，上涨个股近3000只、逾70只涨停，显示下方承接力较强。\n2. 科技主线持续强化：新股次新股表现抢眼（云汉芯城较首日收盘再翻倍），以科技板块为主的次新股躁动重新凝聚人气，印证科技仍是当前市场核心主线。\n3. 煤炭板块独立走强：动力煤价格超预期上涨（周环比+43元/吨），大有能源“10天9板”，供需偏紧叠加“反内卷”政策预期形成共振。\n4. 政策窗口临近：中美经贸磋商消息面催化叠加“十五五”规划预期升温，市场等待方向选择。\n\n影响分析：\n\n尾盘拉升释放两个信号：一是当前点位资金分歧虽大，但做多意愿并未消退，短期下行空间有限；二是结构性行情特征显著，科技+煤炭双主线并行，赚钱效应集中在题材端而非指数端。展望后市，10月末政策密集期是关键变量，“十五五”规划若进一步强化科技自立自强方向，计算机、电子、通信等新质生产力板块有望持续受益；煤炭板块在迎峰度冬与供给约束下，四季度仍具补涨动能。但需注意，指数层面缩量反弹的持续性存疑，投资者应关注政策落地节奏与量能配合情况，避免追高短期涨幅过大品种。",

  "url": "https://finance.sina.com.cn/roll/2026-09-22/doc-inisrnpx2579972.shtml",
  "title": "特斯拉人形机器人量产在即 中国产业链公司迎合作新机遇_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "特斯拉人形机器人量产在即 中国产业链公司迎合作新机遇\n\n 2026年09月22日 02:15 上海证券报 \n\n| |\n| --- |\n| 均胜电子研制的人形机器人灵巧手 |\n\n| |\n| --- |\n| 特斯拉在第八届中国国际进口博览会上展示的人形机器人 |\n\n特斯拉人形机器人量产在即\n\n中国产业链公司迎合作新机遇\n\n◎记者 俞立严 陈铭 \n\n特斯拉正在牵手中国产业链公司，为人形机器人Optimus的量产做准备。上海证券报记者获悉，特斯拉机器人团队已于近日到拓普集团、三花智控、均胜电子等总部位于浙江宁波的上市公司开启审厂工作。特斯拉本轮审厂导向人形机器人Optimus的量产，有望向中国供应链企业派发相关订单。\n\n业内专家对记者表示，伴随智能化的发展，中国多家产业链企业此前已经从汽车业务向机器人业务拓展。随着特斯拉机器人产能的增加，其对于机器人零部件的需求也将大幅增加。在此背景下，特斯拉倾向于牵手既有机器人研制能力又与其在新能源汽车业务上有过合作的中国企业作为量产人形机器人零部件供应商。\n\n特斯拉机器人团队前往宁波多家上市公司审厂\n\n9月21日，针对近日特斯拉启动新一轮机器人业务量产审厂的传闻，特斯拉中国方面未回应相关情况。不过，宁波当地产业链人士对记者确认，特斯拉机器人团队上周前往拓普集团、三花智控、均胜电子等宁波上市公司，开启审厂工作。其中，多家上市公司此前在新能源汽车零部件领域已与特斯拉有过多年合作，这些公司有望为特斯拉量产人形机器人Optimus供应机器人零部件。\n\n即将开启量产的是特斯拉第三代人形机器人Optimus，也是特斯拉首款为量产设计的机器人机型。相比前代，特斯拉重点升级了手部灵巧机构、关节执行器，用于优先承担工厂内物料搬运、简单流水线辅助等工业任务。单机长期目标成本为2万美元至3万美元。\n\n特斯拉在2026年5月宣布Optimus生产项目开工，这也是特斯拉得克萨斯州超级工厂扩建项目的一部分。特斯拉CEO马斯克设定的长期产量目标是：一旦该生产线满负荷运转，Optimus的年产量将达到1000万台，预计于2027年年中投产。这一产量将远超特斯拉在加利福尼亚州弗里蒙特工厂单独建设的年产100万台的试点生产线。\n\n业内专家对记者分析称，随着特斯拉美国机器人产线产能的增加，动辄年产上百万台，特斯拉对于机器人零部件的需求将大幅增加。在此背景下，既有机器人零部件研制能力又处于特斯拉新能源汽车供应链的中国企业优势明显。\n\n此次特斯拉机器人团队前往宁波审厂并非偶然。新能源汽车产业是宁波制造业第一大行业，已经形成从研发、整车到检测服务的完整生态链。随着智能化技术发展，宁波新能源汽车产业的一个突出特点是零部件与人形机器人产业高度协同。据宁波市经济和信息化局数据，人形机器人约80%的零部件品类与新能源汽车产业链高度重合，企业可快速实现技术迁移与产能切换。\n\n在这些上市公司中，均胜电子2026年集中发布了灵巧手、第三代AI头部总成、具身智能体大脑、电子皮肤和固液混合电池等机器人核心部件和系统方案。其中，具身智能体大脑解决方案EAOS+EAPC，成为均胜电子本轮机器人业务布局中的核心看点。\n\n在项目合作方面，均胜电子已与智元机器人、银河通用、瑞士RIVR等国内外机器人企业建立合作，围绕控制器、机器人部件、定制开发和测试验证等环节推进联合研发、产品送样及供货。在海外项目中，公司已批量交付机器人后脑勺、颈部、肩部、膝盖及手指等部件，并推进下一代头部显示方案和头部总成供货。\n\n三花智控则沿着机电一体化方向切入机器人执行器。2026年半年报显示，公司仿生机器人机电执行器核心产品已稳步推进批量交付与产线爬坡。\n\n中国机器人产业链优势不只是产能\n\n据车百会研究院统计，截至2026年8月，全球已有近20家主流车企以自研、孵化、投资等方式驶入具身机器人赛道，累计规划投入超千亿元，中国车企更是个中主力。\n\n业内专家表示，相对于整车企业而言，中国汽车产业链企业所面临的机遇其实更大。就像新能源汽车浪潮，孕育成长了宁德时代等中国动力电池企业，以特斯拉为代表的全球机器人巨头有望带动中国汽车产业链企业跨界发展，开辟全新的业务增长空间。\n\n罗兰贝格预测，在基准情景下，到2035年，全球人形机器人整机市场规模有望达到7500亿美元。若技术迭代、供应链成熟和应用扩张按当前轨迹持续推进，到2050年，整机市场规模有望超过4万亿美元。\n\n围绕执行器、灵巧手、计算与连接、感知系统、能源与充电、结构件、装配与供应链服务，一条新的产业价值链正在形成。以2035年为例，仅身体执行器的市场规模便可能达到260亿美元至790亿美元，手部执行器系统则将贡献90亿美元至260亿美元。",
  "deep": "## AI 解读\n\n## 特斯拉Optimus量产审厂：中国供应链的\"第二增长曲线\"\n\n核心要点\n\n1. 事件：特斯拉机器人团队赴宁波审厂拓普集团、三花智控、均胜电子，为第三代人形机器人Optimus量产做准备，有望派发零部件订单。\n2. 产品定位：Optimus三代为首款量产机型，重点升级灵巧手与关节执行器，优先切入工厂物料搬运等工业场景，单机目标成本2万-3万美元。\n3. 产能规划：得州工厂目标年产量1000万台，2027年中投产，远超弗里蒙特100万台试点线。\n4. 产业逻辑：人形机器人约80%零部件与新能源汽车产业链重合，特斯拉倾向选择\"既有机器人研制能力、又是汽车业务伙伴\"的中国供应商。\n\n影响分析\n\n短期看，审厂落地意味着订单兑现窗口临近，宁波汽车零部件集群有望率先受益，均胜电子（灵巧手、具身智能大脑）、三花智控（机电执行器）等已具先发优势。中期看，特斯拉百万级产能规划将催生巨大的零部件需求，中国供应链凭借技术迁移能力与产能切换速度，有望复制宁德时代在动力电池领域的崛起路径。长期看，罗兰贝格预测2035年全球人形机器人整机市场规模达7500亿美元，执行器、灵巧手等核心环节将形成千亿美元级新价值链。中国企业的核心竞争力不仅是产能，更在于\"汽车+机器人\"双业务协同带来的技术复用与客户黏性。风险在于量产节奏、成本下探速度及地缘政治对供应链的潜在扰动。",
  "no": 128
 },

  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 战略定位明确：Altman确认OpenAI正自主研发人形机器人，但明确表态优先考虑长期技术前景，而非短期家庭应用落地。这意味着OpenAI将人形机器人视为长期战略资产，而非快速商业化的消费品。\n2. 差异化路径：与Figure、特斯拉Optimus等直接瞄准家庭/工业场景的玩家不同，OpenAI选择“先技术、后场景”的路线，强调基础能力积累优先于场景适配。\n3. 生态信号：结合OpenAI此前对Figure的投资与自身硬件团队扩张，此举暗示其可能从“模型供应商”向“软硬一体平台”延伸，减少对合作伙伴的依赖。\n\n影响分析\n\n短期看，这一表态降低了市场对人形机器人快速进入家庭的预期，对主打家庭场景的初创公司形成一定叙事压力。中期看，OpenAI若将大模型能力与本体硬件深度耦合，可能重塑行业竞争格局——从“硬件比拼”转向“具身智能模型+本体”的系统性竞争。长期看，Altman的“长期优先”策略符合其一贯的AGI叙事，人形机器人或成为其通用智能落地物理世界的关键载体。但风险在于：自主研发周期长、资本消耗大，且需直面特斯拉等已具备量产与数据优势的对手。行业应关注OpenAI何时披露具体技术路线与时间表。",

  "url": "https://www.voachinese.com/a/trump-xi-summit-and-the-fate-of-14b-taiwan-arms-sales-package-20260921/8201580.html",
  "title": "特习峰会将至，被推迟的140亿美元对台军售命运如何备受关注",
  "src": "Exa 搜索",
  "lede": "- 锺辰芳\n\n 2026年9月22日 06:40 \n\n \n\n 资料照片：美国总统唐纳德·特朗普与中国国家主席习近平在北京中南海花园谈话。(2026年5月15日) \n\n华盛顿 — \n\n美国总统唐纳德·特朗普(Donald Trump)星期四(9月24日)将在白宫接待来访的中国国家主席习近平，台湾议题被普遍认为是无法避开的话题，尤其是特朗普总统在前一次访问北京后说，他已暂停批准一笔新的对台军售。目前这个军售方案前途如何依然不明朗，也引起多方猜测。一名白宫发言人告诉美国之音，正如特朗普总统所说，他将在短时间内对一笔新的对台军售案作出决定。\n\n尽管特朗普总统此前已公开表示，习近平将于9月24日访问白宫，不过中国外交部直到星期一(9月21日)才正式宣布习近平访美的消息。\n\n中国外交部发言人宣布，“应美利坚合众国总统特朗普邀请，国家主席习近平将于9月23日至25日对美国进行国事访问。”\n\n中国外交部发言人郭嘉昆在星期一的例行记者会上说，元首外界对中美关系“具有不可替代的战略引领作用”，两国元首在半年内实现互访具有历史性、里程碑意义，中方愿与美方一起丰富两国“建设性战略稳定关系内涵，加强对话合作，妥善管控分歧。\n\n特朗普在5月与习近平的北京峰会后推迟了批准140亿美元新的对台军售，又说对台军售是美国与中国之间很好的“谈判筹码”，此次峰会在关于台湾的议题上双方将如何交锋外界都十分关注。一般认为，习近平将持续在台湾议题上对特朗普施压，也有分析说，对台军售可能被推迟到年底，过了亚太经合组织APEC与G-20峰会后才宣布，还有可能整个军售方案被拆分成较小的方案。\n\n白宫：总统将在短时间内就新对台军售做决定\n\n美国之音就对台军售是否受特朗普与习近平峰会影响而推迟、整个方案是否将被拆分，以及美国的地区盟友担忧延后对台军售可能影响台海与地区安全稳定等问题分别向白宫、国务院和战争部请求置评。\n\n一名白宫发言人在答复美国之音的电邮中做了以下3个重点答复：\n\n“·正如特朗普总统说过，他将在短时间内针对一个新的对台军售方案作出决定。\n\n·总统在2025年12月批准了111亿美元的对台军售，这与1950年代以来的美国政策保持一贯。\n\n·在他的第一个任期内，特朗普总统批准的对台军售比历史上其他任何一位总统都多。在他的第二个任期中，特朗普总统在第一年批准的数量要多过乔·拜登(Joe Biden)总统整个四年任期。”\n\n战争部官员在给美国之音的电邮中说，战争部对此提问没有任何信息可提供，请记者向国务院询问。国务院至记者发稿前没有回复。\n\n美国众议院中国问题特设委员会主席、密歇根州共和党籍联邦众议员约翰·穆勒纳尔(John Moolenaar)上星期五(9月18日)在一封写给特朗普总统的信中，要求他拒绝中国干预美国武器出口及与盟友安全合作的企图，同时肯定了特朗普任内对台军售，并呼吁继续强化对中国的威慑。\n\n“我对您的两次任期内向台湾出售美国军事装备创下历史纪录表示赞赏，并随时准备支持您继续努力，遏制中共煽动可能摧毁全球经济的军事灾难。”他写道。\n\n台湾和亚洲盟友密切关注\n\n曾任白宫国家安全委员会东亚和大洋洲事务高级主任的埃德加·卡根(Edgard Kagan)，上星期四在一个关于特习峰会的媒体简报中说，台湾显然是峰会中的一个重要议题，“中方想要持续冻结军售，我认为他们会对此施压，而且我认为5月发生的情况，真正重要的部分倒不是军售本身，而是总统基本上复述了习近平对台湾所设的框架。”\n\n特朗普在5月访问北京时与习近平会晤，尽管他未在两人会面时触及台湾，但在峰会后说出不乐见台湾独立、军售是美国与中国很好的“谈判筹码”，以及他将暂停批准140亿美元对台军售等说法，引起包括台湾和日本在内的一些亚洲盟友担忧，特朗普在此次峰会中是否会对习近平让步。\n\n“任何在台湾议题上软化的迹象都会非常令人警戒，”美国智库亚洲协会政策研究所政治安全事务主任埃玛·钱莱特-埃弗里(Emma Chanlett-Avery)告诉路透社，美国的盟友对美国对华政策最终将走向何方深感忧虑。\n\n现任华盛顿智库战略与国际研究中心(CSIS)费和中国研究项目顾问的卡根在该智库的在线简报上说，他预计中方还会想看看能否在台湾议题上再有任何收获，而且他们也会持续要求美方在涉台事务上更加克制，“我认为这是美国在地区的伙伴及盟友都在非常密切观察的事情，尤其在台湾更是如此。”\n\n对台军售方案或拆分\n\n该智库中国实力项目主任林洋(Bonny Lin)也认为，习近平对台湾的目标没有改变，“北京那端甚至更乐观地认为习近平与特朗普的会面能有助于管控美国的对台政策。”",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 军售被“筹码化”：特朗普亲口将140亿美元对台军售称为对华“谈判筹码”，并在北京峰会后主动暂停批准，实质是把台湾议题纳入中美交易框架，而非基于台海安全逻辑。\n2. 峰会前的施压窗口：习近平此访将台湾议题列为必谈项，中方目标是“持续冻结”军售；白宫仅以“短时间内决定”模糊回应，方案可能被推迟至年底APEC/G20之后，或被拆分为小额批次以降低政治冲击。\n3. 盟友信任承压：从日本到台湾，亚洲伙伴对美方“软化迹象”高度警戒，国会层面（穆勒纳尔）与行政部门出现明显温差。\n\n影响分析\n\n短期看，军售大概率不会在峰会期间高调宣布，最可能的路径是“技术性推迟+分批处理”，既保留筹码又不彻底激怒国会与盟友。但真正的风险不在军售本身，而在特朗普公开复述中方对台框架、将安全承诺降格为交易变量——这动摇了美国对台政策“可预测性”这一核心资产。一旦盟友认定美国的安全承诺可随峰会气氛浮动，区域威慑的可信度将被侵蚀，反而可能刺激北京在台海采取更大胆的试探。对北京而言，此次峰会的价值不在于拿到军售冻结的书面承诺，而在于验证了“施压即可让美方自我设限”这一路径的有效性。",

  "deep": "## AI 解读\n\n核心要点\n\n1. 产品矩阵：小米MiMo发布Pro与Flash双版本全模态模型，均基于规模化强化学习训练，主打开源路线。\n2. 性能对标：Pro版在多数Agent基准上比肩Claude Opus 5、GPT-5.6 Sol，Artificial Analysis Intelligence Index得分46，刷新开源模型纪录。\n3. 能力边界：覆盖编码、computer use、3D推理与创作，指向通用智能体（Agent）场景。\n\n影响分析\n\n其一，开源阵营再获强援。46分意味着开源模型首次在综合智能指数上逼近闭源第一梯队，削弱了“开源落后闭源一代”的行业叙事，对依赖闭源API的企业形成议价压力。\n\n其二，小米AI战略升级。从终端厂商切入基础模型第一梯队，MiMo与小米“人车家全生态”协同想象空间大——computer use与3D推理能力可直接赋能手机Agent、汽车座舱与IoT设备，形成软硬一体的差异化壁垒。\n\n其三，竞争格局生变。全模态+Agent是2025年主战场，小米以开源换生态、以性能换话语权，或将吸引开发者迁移，倒逼闭源厂商加速迭代或调整定价。但需警惕：基准得分与实际落地体验仍有差距，开源模型的商业闭环与算力可持续性仍是长期考验。",

  "deep": "## AI 解读\n\n核心要点：不列颠哥伦比亚省在加州起诉 OpenAI，指控其在 Tumbler Ridge 枪击案前已标记出 ChatGPT 上的可疑活动，却未向警方转介。该案造成 8 死 27 伤，受害者含 5 名儿童。诉讼将 AI 平台的内容预警责任推至司法前台。\n\n影响分析：此案的核心争议在于 AI 服务商对\"已标记风险信号\"的处置义务边界。若法院认可\"标记即触发转介义务\"，将实质确立 AI 平台的主动报告责任，冲击现有以事后配合为主的监管框架。对 OpenAI 而言，风险不止于赔偿——一旦败诉，可能被迫重构安全流程，将用户行为预警纳入强制合规。更广泛看，这是全球首例将 AI 预警失效与大规模伤亡直接挂钩的诉讼，可能引发连锁立法，推动各国要求 AI 企业对高危信号承担类似金融反洗钱的报告义务。技术中立抗辩在生命损失面前将愈发难以立足。",

  "src": "X：Elon Musk (@elonmusk, xAI)",
  "lede": "马斯克援引Artificial Analysis评测宣称，Grok 4.7使xAI在智能体编码领域跃居第三，仅次于Anthropic和OpenAI。这是马斯克首次以第三方评测背书方式为xAI编码能力做公开定位，头部梯队仍由Anthropic与OpenAI把持，xAI已进入第一阵营追赶区间。短期看，此举借权威评测将Grok从“追赶者”叙事拉入“三强”框架，直接对标OpenAI与Anthropic，有助于争夺开发者与企业客户；智能体编码作为当前AI商业化最清晰赛道之一，涉及自动化软件工程、代码代理等高价值场景，排名即议价权。中期看，第三名距前二仍有实质差距，评测口径、任务集与真实工程表现未必一致，xAI需以产品落地而非排名证明实力；若Grok 4.7在稳定性与工具链集成上兑现承诺，三强格局可能演变为更激烈贴身竞争，反之“第三”或沦为营销话术。对行业而言，头部集中度进一步提升，中小玩家窗口正在收窄。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 排名定位：马斯克援引 Artificial Analysis 评测，宣称 Grok 4.7 让 xAI 在智能体编码（agentic coding）领域跃居第三，仅次于 Anthropic 和 OpenAI。\n2. 竞争格局：头部梯队仍由 Anthropic、OpenAI 把持，xAI 已进入第一阵营的追赶区间。\n3. 信号意义：这是马斯克首次以第三方评测背书的方式，为 xAI 的编码能力做公开定位。\n\n影响分析\n\n短期看，这是 xAI 的一次品牌卡位——借权威评测把 Grok 从\"追赶者\"叙事拉入\"三强\"框架，直接对标 OpenAI 与 Anthropic，有助于争夺开发者与企业客户。智能体编码是当前 AI 商业化最清晰的赛道之一，涉及自动化软件工程、代码代理等高价值场景，排名即议价权。\n\n中期看，第三名距前二仍有实质差距，且评测口径、任务集与真实工程表现未必一致，xAI 需用产品落地而非排名证明实力。若 Grok 4.7 在稳定性与工具链集成上兑现承诺，三强格局可能演变为更激烈的贴身竞争；反之，\"第三\"或沦为营销话术。\n\n对行业而言，头部集中度进一步提升，中小玩家的窗口正在收窄。",

  "id": "finance-1789987821538-9",
  "day": "2026-09-21",
  "pub": "2026-09-21 03:59:34.000Z",
  "time": "9月21日 03:59",
  "cat": "finance",
  "imp": "normal",
  "url": "https://finance.sina.com.cn/wm/2026-09-21/doc-inisqetx0765605.shtml",
  "title": "美联储紧急放鹰！油价下跌救不了通胀，10月加息悬念再起_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "美联储紧急放鹰！油价下跌救不了通胀，10月加息悬念再起\n\n 2026年09月21日 11:31 市场资讯\n\n（来源：商界观察）\n\n刚刚结束 9月加息会议，全球金融市场还在消化加息落地带来的震荡，美联储官员的表态又给行情添上变数。就在全球周一开盘前几个小时，一个非常微妙的时间窗口，明尼阿波利斯联储主席卡什卡利登上福克斯新闻，抛出一番分量十足的鹰派讲话。\n\n这个采访平台本身就很有看点，福克斯新闻的《 SundayMorningFutures》，也是特朗普过往多次接受专访的节目。在市场热烈讨论 10月要不要继续加息的节点，这番讲话很快被彭博、路透两大通讯社广泛转载。\n\n周一开盘的盘面并没有走出一边倒的行情：布伦特原油小幅走高，黄金、美股期货短暂跳空低开之后又快速收复失地， 10年期美债收益率死死卡在 4.99%这个敏感关口，不上不下。没有爆发大起大落，但是每一个交易者心里都清楚，接下来几天，市场就要用价格投票，回应美联储释放出来的信号。\n\n一、通胀不止油价，这才是讲话最硬核的信号\n\n最近市场一直存在一种乐观猜想：现在通胀走高，很大程度是中东冲突推高油价造成的。未来如果地缘冲突缓和、油价回落，通胀压力自然减轻，美联储是不是就可以停止加息？\n\n卡什卡利直接给出了不一样的答案：未必。\n\n在采访里他明确提出，民众日常感受到的通货膨胀，远远不只是石油价格。通胀压力已经渗透到美国经济方方面面，就算把能源、食品这类波动大的项目剔除出去，核心通胀依旧处在偏高位置东方财富网。地缘冲突带来的油价冲击只是外部扰动，真正麻烦的是内生性的物价上涨。\n\n除此之外，他还提到了美国经济的现实底色。即便面对地缘冲突、贸易摩擦多重外部麻烦，美国经济韧性超乎预期，劳动力市场依旧保持强劲。\n\n这一点非常关键。对于美联储来说，加息最大的顾虑，就是怕把经济直接压垮、就业大面积恶化。现在经济和就业都扛住了紧缩，相当于削弱了美联储停止加息的一大理由。经济足够扛，就给继续加息留出操作空间。\n\n二、市场反应平淡，但不要忽视“集体表态”的风险\n\n有意思的是，卡什卡利这番强硬表态出来，周一开盘市场并没有出现剧烈崩盘。美股期货、黄金短暂下探之后快速拉回，美债收益率也没有瞬间冲破 5%大关。\n\n之所以反应平淡，有两个现实原因。\n\n第一，卡什卡利本身就是美联储内部公认的鹰派人物，过去多次会议当中，他就坚持主张更早加息。 7月议息会议多数官员选择按兵不动的时候，他就是三名投出反对票、要求加息的委员之一。市场早就熟悉他的立场，这一次发言，并没有带来超预期的反转。\n\n第二， 9月刚刚落地一轮加息，市场已经提前消化了一部分紧缩预期，对鹰派言论形成一定“抗体”。\n\n但投资者不能就此掉以轻心。真正危险的，从来不是某一个官员的单独发言，而是多位联储官员，接连释放口径趋同的信号。\n\n本周开始，市场交易的核心主线，就是 10月议息会议要不要再度加息。当前利率期货给出的 10月加息概率来到 56.5%，已经偏向一半以上。如果后续陆续有更多委员跟进卡什卡利的思路，持续强调通胀顽固、经济韧性，那么加息预期还会进一步升温，到时候市场就很难继续保持淡定。\n\n还要特别注意，卡什卡利不是边缘人物，今年他拥有 FOMC议息会议投票权，他的观点会直接参与政策表决。北京时间周一晚间 18点 30分，芝加哥联储主席古尔斯比即将发表公开讲话，这是接下来的一大看点。\n\n三、10年期美债4.99%，一个决定短期市场走向的数字\n\n现在全市场目光，都盯紧 10年期美债收益率 4.99%这个关口，这是全球资产最重要的定价锚，股市、黄金、大宗商品，全都要看它的脸色行事证券时报。\n\n两种情景，会走出完全不同的行情。\n\n第一种，如果后续能够稳稳收在 4.99%下方。这就意味着，当前卡什卡利释放的鹰派利空，已经不足以推动长端利率继续往上冲。利空出尽的状态下，未来几个交易日，美债收益率很有可能迎来回落。收益率下行，会减轻全球股市、黄金的压力，风险资产会迎来喘息机会。\n\n第二种，如果价格站稳 5%上方，那就是另一番局面。 5%是一个极强的心理关口，一旦站稳，往往代表新一轮上行行情开启。 5%以上的无风险美债收益，会对全球资金形成强大虹吸，资金会从股市、黄金等风险资产流出，压制各类资产估值，全球市场都要跟着承受压力上海证券报...。\n\n周一并没有重磅经济数据出炉，没有重磅决议公布，属于相对平静的交易日。但恰恰是这种没有外力干预的时刻，才最能看出市场真实的内心选择。盘面的涨跌，就是所有投资者用真金白银投出的选票，美债收益率最终收在什么位置，很大程度会定调接下来一段时间全球市场的基调。\n\n四、不要简单押注单边行情\n\n很多人会简单理解，官员放鹰，那就一定利空股市黄金，美债收益率必然一路冲高。现实资本市场往往不会这么干脆利落。",
  "deep": "## AI 解读\n\n# 美联储“鹰派喊话”的深层信号：通胀叙事切换与美债5%关口博弈\n\n核心要点提炼\n\n卡什卡利此番表态的实质，是美联储在引导市场完成一次通胀叙事的切换——从“油价推动的阶段性通胀”转向“内生性核心通胀顽固”。其逻辑链条清晰：核心通胀居高不下+经济韧性超预期+劳动力市场强劲=加息顾虑被削弱，政策空间反而打开。作为今年FOMC票委，卡什卡利的鹰派立场具有直接表决权重，绝非边缘噪音。当前利率期货定价10月加息概率已达56.5%，市场天平正在倾斜。\n\n影响分析\n\n短期核心变量锁定10年期美债收益率4.99%关口。若站稳5%上方，无风险利率的虹吸效应将压制全球风险资产估值，股市、黄金承压；若被压回下方，则“利空出尽”逻辑成立，风险资产有望喘息。但需警惕真正的风险并非单一官员表态，而是多位联储官员口径趋同形成的“集体鹰派”合力——本周古尔斯比等人的讲话将是关键验证窗口。对投资者而言，当前不宜简单押注单边行情，美债收益率的最终落点才是定调全球市场基调的锚。",
  "no": 137
 },

  "src": "X：通义千问 / Qwen (@Alibaba_Qwen)",
  "lede": "通义千问发布 Qwen-Image-2.1，一个 7B 参数的原生图像生成与编辑模型，生成和编辑共用单一检查点，最多支持 10 张参考图。模型自带提示词增强 LLM，已集成 diffusers 和 ComfyUI，并在 Hugging Face Spaces 提供免安装的浏览器在线 demo：https://huggingface.co/spaces/hugging-apps/qwen-image-2-1",
  "deep": "## AI 解读\n\n核心要点\n\n1. 架构创新：Qwen-Image-2.1 以 7B 参数实现\"生成+编辑\"共用单一检查点，打破传统文生图与图像编辑模型分离的范式，降低部署与维护成本。\n2. 多图参考能力：最多支持 10 张参考图输入，显著增强角色一致性、风格迁移与多主体组合场景的可控性。\n3. 生态友好：内置提示词增强 LLM，原生集成 diffusers 与 ComfyUI，并提供 Hugging Face 免安装在线 demo，开箱即用门槛极低。\n\n影响分析\n\n对开发者而言，单检查点+轻量参数意味着更低显存占用与更简单的管线，7B 规模在消费级显卡上具备落地可能，将加速图像工作流的本地化部署。对行业而言，\"生成编辑一体化\"是当前多模态模型的重要演进方向——统一表征可减少任务间割裂，提升迭代效率，也预示开源阵营正快速缩小与闭源商用模型的差距。叠加 diffusers、ComfyUI 的即时适配，Qwen 有望在开源图像生态中抢占事实标准位置，进一步压缩中小型图像工具厂商的差异化空间。",

  "deep": "## AI 解读\n\n# 东方财富“全球财经快讯”页面分析\n\n## 一、核心要点提炼\n\n1. 产品定位：该页面是东方财富网旗下的实时财经资讯聚合入口，定位为“全球财经快讯”，主打外汇、股市、期货、汇率等多资产类别的行情速览。\n2. 功能特征：页面设置9秒自动刷新机制，并提供声音提示、桌面提示、语音播报等多模态提醒，强调“快”字当头的资讯时效性。\n3. 当前状态：新闻流显示“暂无相关内容”，而各大指数表格（亚洲、美洲、欧洲股市、中国概念股、期指、汇率）均为空数据，表明该页面当前处于未加载或数据源中断状态，实际信息量为零。\n\n## 二、影响分析\n\n从产品设计看，东方财富试图以“快讯+行情”一体化对标彭博、路透等终端，但当前页面暴露两个问题：其一，数据加载失败或接口异常，直接影响用户体验与平台可信度，尤其在市场波动时段，行情空白可能引发用户焦虑与流失；其二，内容与行情割裂——快讯区与行情表各自独立，缺乏事件与价格波动的关联标注，削弱了“快讯”的决策参考价值。对投资者而言，此类页面若无法稳定输出有效数据，将迫使其转向Wind、同花顺等竞品；对东方财富而言，需优先排查数据链路稳定性，并强化快讯与行情的联动设计，否则“全球财经快讯”易沦为流量入口而非决策工具。",

 },
 {
  "id": "robotics-1790125206776-3",
  "day": "2026-09-21",

  "url": "https://news.iresearch.cn/yx/2026/09/566953.shtml",
  "title": "大一统模型Pelican-Unify：让具身智能在“想象”中学会行动_互联网_艾瑞网",
  "src": "Exa 搜索",
  "lede": "导语：\n\n9月的上海，华为全联接大会2026以“智启新未来”为主题，系统阐述AI基础设施的构建新路径。在华为云生态伙伴开放麦上，北京人形机器人创新中心有限公司（以下简称“北京人形”）多模态算法负责人张怡，以《从“预测世界”到“执行任务”：世界模型驱动机器人的理解、规划与行动》为题，分享了北京人形统一具身世界模型 Pelican-Unify 的探索与实践。\n\n一、真正的分水岭，在泛化能走多远\n\n“具身智能这几年最不缺的，是令人惊叹的演示。最缺的，是换一个场景、换一个物品、换一台本体之后，还依然能够完成任务的能力。”\n\n张怡开门见山，把行业争论的焦点从“演示效果”拉回到“泛化能力”这个硬指标上。她把具身智能模型的泛化拆成了四层递进的台阶：背景泛化、组合泛化、交叉泛化，以及最难企及的域外泛化。\n\n“泛化上限，决定了具身智能是从实验室走向真实世界的通行证，还是一张只在一个考场有效的准考证。”\n\n二、真正的统一，是共享表示、相互约束、共同训练\n\n这也是 Pelican-Unify 的立论之本。\n\n张怡介绍，Pelican-Unify 是北京人形的统一具身世界模型，整体参数量 14B，已完成真机推理验证。它的架构是：\n\n上层，是一个统一的 VLM理解器与推理器。 负责理解与推理——把场景、指令、视觉上下文和动作历史映射进同一个语义空间，生成面向任务、动作与未来后果的任务链式推理，并将这条推理链压缩为稠密隐变量，传递给下层。\n\n下层，是一个统一的未来生成器。 基于上层传来的隐变量，一个共享的扩散Transformer架构同时生成未来视频和未来动作——机器人在“想象中”看到任务将如何展开，也在“想象中”得到自己该做的每一个动作。\n\n训练目标，是统一的。 语言损失、视频损失、动作损失三者反向传播到同一个共享表示中，相互约束、共同优化。\n\n“很多多模态模型，是把几个能力在输出端拼在一起。我们主张的统一，是共享表示、相互约束、共同训练——这是本质区别。”张怡强调， Pelican-Unify对三类泛化以及对扩散模型有益的能力要提升，原本的通用理解能力要守住。\n\n三、双线并进才是务实的答案\n\n张怡介绍了北京人形的具身大模型技术版图——双线并进。\n\n一条是大小脑分层架构。以具身多模态大模型 Pelican-VL 为“大脑”，负责意图理解、空间感知、自然交互与任务规划；以运控模型为“小脑”，负责全身控制、双臂协作、稳定移动与定位导航。这条路线成熟稳定，支撑着当下规模化落地的主力场景。\n\n另一条，是以 Pelican-Unify 为代表的世界模型大一统路线——理解、规划、预测与行动在同一个模型中完成，代表更前沿的架构方向。\n\n两条路线都跑在同一套“一脑多能”与“一脑多机”的“地基”上：具身天工通用人形机器人平台与慧思开物通用具身智能平台。一套智能系统，能跨工业、商用、家庭、特种作业多场景复用，也能驱动各种机器人硬件。\n\n“模型再先进，也要有一副好身体和一块好平台来承载；数据再稀缺，也要有闭环让它转起来。这是全栈公司才有的便利，也是我们的责任。”\n\n四、把模型放进生态里打磨\n\n“具身智能不是一家企业能闭环的事。数据、算力、工具链、场景，每一个环节都需要伙伴。”她介绍了北京人形与华为云的深度协同：此前，北京人形已参与华为云“百模千态，云聚共赢”生态合作计划发布仪式，正式成为华为云具身智能生态合作伙伴，并入驻华为云行业AI梦工厂具身智能专区首批机构。\n\n在标准共建层面，双方围绕SC42《人工智能 具身智能云协议要求》开展线上讨论，并对《人工智能 具身智能数据质量规范 第2部分：生成数据》《人形机器人与具身智能 灵巧手技术规范》提交了反馈意见——“把工程实践沉淀成标准，让后来者不必重复踩坑，这是头部企业应该做的事。”\n\n面向未来，双方将聚焦三个方向深度协同：依托华为云算力底座与开发平台加速具身大模型研发迭代；联合搭建开放共享的开发者社区，整合数据集与仿真环境，降低行业研发门槛；深耕多元应用场景，以“云+端”软硬协同模式攻克产业化难点。\n\n五、“人机共生”的美好未来\n\n北京人形把“创新技术、服务人类、改变世界”作为理念——技术是出发点，人是目的地，让机器人先在想象中预演风险，再在现实中安心走进产线、家庭与危险现场。\n\n作为工信部与北京市政府联合授牌的国家地方共建具身智能机器人创新中心、国内首家具身智能软硬件全栈科技公司，北京人形以“具身天工”与“慧思开物”两大平台为双核心，朝着“全球具身智能领导者”稳步前行。\n\n以「慧思开物」为底座，北京人形正践行“不止步、不独行、不筑墙、不踩坑”，以“开物生态 万物·生”向全球伙伴开放代码、工具链与创新土壤。\n\n当机器人开始“想象未来”，它也在帮人类预演一个更远的未来。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 技术路线分野：北京人形推出14B参数统一具身世界模型Pelican-Unify，主张“共享表示、相互约束、共同训练”的真统一架构，区别于输出端拼接的多模态方案；通过扩散Transformer同时生成未来视频与动作，让机器人在“想象”中完成规划与执行。\n2. 泛化能力为标尺：将泛化拆解为背景、组合、交叉、域外四层递进，直指行业“演示惊艳、落地失效”的痛点。\n3. 双线并进策略：成熟的大小脑分层架构（Pelican-VL+运控模型）支撑当下落地，世界模型大一统路线押注前沿，共用“一脑多能/多机”平台底座。\n4. 生态协同：与华为云在算力、开发者社区、行业标准（SC42等）三方向深度绑定。\n\n影响分析\n\n此举标志着具身智能竞争从“单点演示”转向“泛化能力+架构范式”的系统性比拼。世界模型路线若验证成功，将显著降低跨场景、跨本体的迁移成本，加速机器人从实验室走向产线、家庭与特种作业。统一架构对算力与数据闭环要求极高，头部企业与云厂商的生态绑定或成行业标配，中小玩家门槛进一步抬升。标准共建的参与则意味着北京人形正争夺行业话语权，具身智能的“安卓时刻”可能提前到来。",
  "no": 140
 },

  "title": "小米发布并开源 MiMo-V2.6 系列，扩展强化学习规模迈向自我提升",
  "src": "公众号：小米 MiMo",
  "lede": "小米创办人、董事长兼CEO雷军通过个人微信公众号宣布，小米自主研发的全新AI大模型MiMo正式开源，该模型参数规模为70亿，在数学推理和代码生成两大核心能力上表现突出。MiMo在数学推理评测榜单GSM8K和MATH上分别取得89.7%和56.4%的得分，代码生成评测HumanEval得分达到71.3%，均超越同参数规模的开源模型。模型权重已在Hugging Face平台开放下载，采用Apache 2.0开源协议，允许商业使用。雷军表示，MiMo由小米AI实验室主导研发，后续将持续迭代并探索在手机、汽车等终端场景的落地应用。",
  "deep": "## AI 解读\n\n核心要点：小米以70亿参数切入开源大模型赛道，MiMo在数学推理（GSM8K 89.7%、MATH 56.4%）和代码生成（HumanEval 71.3%）上超越同规模开源模型，采用Apache 2.0协议允许商用，并明确指向手机、汽车等终端落地。\n\n影响分析：\n1. 战略卡位：小米选择70亿参数这一“端侧友好”区间，与其硬件生态高度契合。开源+商用友好的协议，意在快速吸引开发者、建立生态话语权，而非直接对标千亿级通用大模型。\n2. 行业信号：继Meta、阿里、DeepSeek后，小米加入开源阵营，进一步压缩闭源中小模型的生存空间。参数效率竞赛加剧，“同等规模性能更强”成为新竞争焦点。\n3. 落地想象：若MiMo成功嵌入澎湃OS与汽车座舱，小米将形成“模型—终端—数据”闭环，这是纯模型厂商难以复制的壁垒。但70亿参数能否支撑车机级复杂推理，仍需验证。\n4. 风险提示：开源模型性能易被快速追平，先发优势窗口有限。小米需在迭代速度与终端整合深度上持续投入，否则可能沦为“发布即巅峰”。",
  "no": 141
 },
 {
  "id": "ai-1790038802641-1",

  "title": "xAI 发布 Grok 4.7，主打编码与知识工作",
  "src": "xAI：News（网页）",
  "lede": "xAI宣布推出基于Grok的智能新闻聚合功能，该功能可实时抓取并分析全球新闻源，为用户提供个性化摘要与深度解读。系统支持多语言处理，首批覆盖英语、中文、西班牙语等12种语言，计划于2025年第三季度向X Premium+订阅用户开放测试。xAI表示，该工具将优先展示经过事实核查的内容，并标注信息来源的可信度评级。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 产品定位：xAI推出基于Grok的新闻聚合功能，切入的是“信息处理”而非单纯“信息获取”赛道——实时抓取、个性化摘要、深度解读三合一。\n2. 差异化设计：事实核查前置+来源可信度评级，直击当前AI摘要工具最大的信任痛点。\n3. 落地节奏：12种语言覆盖，2025 Q3向X Premium+测试，典型的订阅制变现路径。\n\n影响分析\n\n此举本质是把Grok从“对话助手”升级为“信息中介”，直接对标Perplexity、Artifact余脉及传统聚合器。对xAI而言，这是借助X平台内容生态实现闭环的关键一步——用新闻场景拉动Premium+订阅，同时为Grok积累高频使用数据。\n\n更深层的影响在于“可信度评级”机制：若标准透明，可能倒逼行业建立AI信息溯源规范；若黑箱操作，则沦为新的舆论操弄工具。xAI需警惕自证公信力的悖论——由一家社交媒体公司定义“可信来源”，本身就是争议点。\n\n短期看，这是订阅增长工具；长期看，是xAI争夺“AI时代信息入口”的战略落子。成败取决于核查机制的独立性，而非技术本身。",
  "no": 142
 },

  "deep": "## AI 解读\n\n核心要点\n\n1. Kimi Code Desktop 1.0 作为官方桌面客户端发布，macOS（Apple与Intel芯片）与Windows双平台同步上线，标志月之暗面正式将代码能力从Web端延伸至本地桌面端。\n2. 选择\"桌面客户端\"形态而非纯插件或API，意味着Kimi意图切入开发者日常高频工作场景，直接对标Cursor、GitHub Copilot等AI编程工具。\n3. 双平台+双芯片架构同步覆盖，显示其在工程适配上的投入已具备规模化交付能力，而非小范围灰度测试。\n\n影响分析\n\n短期看，桌面端补齐了Kimi Code在交互体验上的短板——本地文件读写、项目级上下文管理、IDE外独立运行等能力，是纯网页工具难以替代的。这将降低开发者使用门槛，提升用户粘性与使用频次。\n\n中期看，此举加剧了国内AI编程赛道竞争。字节Trae、阿里通义灵码、腾讯CodeBuddy已先后布局，Kimi以桌面客户端形态入局，差异化在于其长上下文与推理能力能否在复杂代码任务中形成体验优势。\n\n关键变量在于：一是能否与主流IDE形成高效协同而非割裂；二是订阅定价与免费额度策略能否撬动开发者迁移。若产品力兑现，Kimi有望从\"对话工具\"升级为\"生产力入口\"，但若仅停留在客户端封装层面，则难逃同质化竞争。",

  "deep": "## AI 解读\n\n核心要点\n\n1. 量级反超：中国开源权重模型在Hugging Face累计下载量达约3.2B，是美国的两倍，自2025年7月起形成约1.6B的领先优势。\n2. 全面领先：优势不局限于下载量，还覆盖基准测试成绩与学术采用率，意味着领先具有结构性而非偶然性。\n3. 政策信号：该综述直接面向美国国会汇报，本质是将“开源生态主导权”上升为国家安全与产业竞争议题。\n\n影响分析\n\n第一，开源权重模型正成为AI扩散的主渠道。下载量领先意味着全球开发者、创业公司与研究机构的默认技术底座正转向中国模型，这种“事实标准”一旦形成，迁移成本极高，美国闭源厂商的生态护城河将被稀释。\n\n第二，学术采用领先具有长期复利效应。论文引用、微调衍生与工具链适配会持续加固中国模型的技术话语权，美国若仅靠闭源API难以逆转。\n\n第三，此事进入国会视野，预示美国可能出台针对开源模型出口、算力或数据的新限制，中美AI竞争将从模型能力延伸至生态治理与规则制定层面。短期看是份额之争，长期看是AI基础设施主导权之争。",

  "lede": "Artificial Analysis 发布 Grok 4.7 评测，该模型在 Intelligence Index 得 46 分，较 Grok 4.6 高 2 分，AA-Briefcase 得 1657 Elo（+111），仅次于 Claude Opus 5 和 Claude Fable 5.1。",
  "deep": "## AI 解读\n\n核心要点\n\n- Grok 4.7 在 Artificial Analysis Intelligence Index 得分 46，较 4.6 提升 2 分，进步幅度温和但方向明确。\n- AA-Briefcase 知识工作基准达 1657 Elo（+111），跃居第三，仅次于 Claude Opus 5 与 Claude Fable 5.1，标志其在智能体知识工作场景跻身第一梯队。\n- 编码代理得分升至 56，显示工程类任务能力同步增强。\n\n影响分析\n\n此次评测释放两个信号。其一，xAI 在智能体（agentic）知识工作这一高价值赛道上快速缩小与 Anthropic 的差距，+111 Elo 的跃升幅度在同类迭代中相当显著，意味着 Grok 正从\"通用对话模型\"向\"可交付专业任务的代理\"转型。其二，竞争格局进一步向头部集中：知识工作前三名被 Claude 与 Grok 包揽，OpenAI 在该细分基准上的相对位置值得关注。\n\n对企业的现实含义是，智能体知识工作的选型不再只有 Claude 单一选项，多模型策略的议价空间扩大。但需注意，Elo 类基准反映的是相对偏好而非绝对可靠性，实际部署仍应结合具体任务验证。总体看，Grok 4.7 是一次扎实的能力补强，而非颠覆性突破。",

  "title": "数字生命卡兹克访谈汉化组：AI 时代字幕组与漫画组的真实处境",
  "src": "公众号：数字生命卡兹克",
  "lede": "作者访谈多位字幕组与漫画汉化组成员，发现他们并不抵触AI。Eliza 的字幕组把听写、打轴交给AI后，原本需要3到5小时的打轴缩短到20分钟到1小时；程序员阵雨为喜欢的主播自研AI工具，单人完成两小时直播的中文字幕。漫画汉化组则因嵌字质量等原因仍坚持人工制作，成员看重的是同好社群与爱好本身。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. AI已在字幕生产环节实现实质性替代：听写、打轴等重复性劳动被AI大幅压缩，效率提升3-10倍，单人即可完成过去需团队协作的直播字幕工作。\n2. 字幕组与漫画组对AI态度务实而非对抗：从业者主动拥抱工具，抵触情绪远低于外界预期，核心原因在于其非商业化、兴趣驱动的组织形态。\n3. 漫画汉化仍保留人工壁垒：嵌字环节对排版美学和语境适配要求高，AI尚难胜任，但这一壁垒并非永久性的。\n\n影响分析\n\n这一案例揭示了AI对内容生产链条的冲击并非“一刀切”。在标准化程度高、容错率高的环节（听写、打轴），AI替代已不可逆；而在审美判断和社群属性强的环节（嵌字、翻译润色），人工仍有缓冲空间。更值得关注的是组织形态的变化：AI让“单人成军”成为可能，传统字幕组依赖的协作分工体系可能被瓦解，社群黏性随之松动。对于平台和版权方而言，这意味着灰色地带的字幕生产将更分散、更难追踪。而对从业者来说，真正的风险不在于AI抢走工作，而在于当工具门槛降至零，兴趣社群赖以存续的“共同劳动”这一纽带可能消失。",

 },

  "url": "https://tomtunguz.com/ai-comes-for-the-if-statement",
  "title": "Tomer Tunguz 谈 AI 优化 if-then 判断：专用决策器把分类成本降近百倍",
  "src": "Tomer Tunguz 博客（VC 分析）",
  "lede": "Tomer Tunguz 撰文提出最新一波 AI 正在接管软件中的 if-then 判断原语，Jev 与 SemIf 这类专用决策器以数百毫秒返回结果，成本比传统生成式调用低约 76x 到 209x。作者在自己的 Agent 中替换了约四分之一的调用，在 98 条人工核验的生产邮件线程上，Jev 达到 80%、本地 SemIf 达到 82% 的分类准确率，高于生产模型的 47%。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 范式转移：AI 正从\"万能生成\"转向\"专用决策\"，if-then 判断这一软件基础原语被专用决策器接管。\n2. 效率跃升：Jev、SemIf 等专用决策器响应仅数百毫秒，成本较传统生成式调用降低约 76x–209x。\n3. 实证数据：在 98 条人工核验的生产邮件线程上，Jev 准确率 80%、本地 SemIf 82%，显著高于生产模型的 47%；作者已替换 Agent 中约 1/4 的调用。\n\n影响分析\n\n这揭示了一条被忽视的降本路径：并非所有 AI 任务都需要大模型。分类、路由、条件判断等结构化决策，本质是\"窄任务\"，专用小模型在准确率与成本上双重碾压通用模型。对企业而言，这意味着 Agent 架构将从\"单一巨型模型\"走向\"分层决策栈\"——高频、低复杂度的判断下沉到廉价专用器，通用模型只保留在真正需要推理的长尾环节。76x–209x 的成本差不是优化，而是重构 ROI 的量级变化，可能加速 AI 应用从\"演示\"走向\"规模化部署\"。值得警惕的是，47% 到 82% 的准确率跃升样本量偏小（98 条），结论的普适性仍需更大规模验证。",
  "no": 148
 },

  "title": "Linear 重构 CI 流程应对 AI 编码带来的验证瓶颈，PR 等待时间从 6 分钟降至 5 分钟",
  "src": "Linear：Now（RSS）",
  "lede": "AI编码工具大幅提升代码产出速度后，验证环节（CI）取代编码成为新瓶颈，PR等待时间反而拖慢整体交付节奏。Linear通过重构CI流程——疑似采用并行化、缓存优化、测试分片等手段——将PR等待从6分钟以上压缩至5分钟出头，单测runner时间约减半。这是“AI提效”进入深水区的典型案例：写代码不再是约束，验证吞吐才是。短期看，这是工程效率的局部优化；长期看，它揭示了AI编码普及后的系统性重构需求。当生成速度提升数倍，传统CI架构（串行、全量、单机）必然失配。Linear的实践指向一个趋势：CI/CD需要为“高频小批量提交”重新设计，测试选择、增量验证、并行调度将成为标配能力。更深远的影响在于组织层面：若验证环节跟不上，AI带来的编码红利会被抵消，“提效”沦为纸面数字。谁能率先打通“生成—验证”闭环，谁就能真正兑现AI生产力。这也意味着DevOps工具链将迎来新一轮针对AI工作流的改造竞争。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 瓶颈转移：AI编码工具大幅提升代码产出速度后，验证环节（CI）成为新瓶颈，PR等待时间反而拖慢整体交付节奏。\n2. 优化路径：Linear通过重构CI流程（疑似并行化、缓存优化、测试分片等手段），将PR等待从6分钟+压缩至5分钟出头，单测runner时间约减半。\n3. 信号意义：这是\"AI提效\"进入深水区的典型案例——写代码不再是约束，验证吞吐才是。\n\n影响分析\n\n短期看，这是工程效率的局部优化；长期看，它揭示了AI编码普及后的系统性重构需求。当生成速度提升数倍，传统CI架构（串行、全量、单机）必然失配。Linear的实践指向一个趋势：CI/CD需要为\"高频小批量提交\"重新设计，测试选择、增量验证、并行调度将成为标配能力。\n\n更深远的影响在于组织层面：若验证环节跟不上，AI带来的编码红利会被抵消，\"提效\"沦为纸面数字。谁能率先打通\"生成—验证\"闭环，谁就能真正兑现AI生产力。这也意味着DevOps工具链将迎来新一轮针对AI工作流的改造竞争。",

  "title": "美国打伊朗 欧洲为啥“不跟” - 天泉新闻",
  "src": "Exa 搜索",
  "lede": "美以军事打击伊朗进入第10天，一个现象引人注目：欧洲盟友几乎集体“作壁上观”，西班牙等直言反对美国做法。要知道，此前打伊拉克、利比亚、南联盟等，北约盟友可是美国集结的重要军事力量。\n\n欧洲盟友“不跟”，从一个侧面反映出国际格局特别是跨大西洋关系的深刻变化。对此，北京外国语大学欧盟与区域发展研究中心主任崔洪建向侠客岛进行了深度分析。\n\n伊朗首都德黑兰被袭击（图源：外媒）\n\n1、侠客岛：过去对外动武，欧洲总是紧随美国。这次美以联手打伊朗，欧洲集体不跟，并有一些中立乃至反对声音。美欧过往的紧密军事合作关系为何变成这样？\n\n崔洪建：过去美国总拉着欧洲，是为体现美欧之间的跨大西洋同盟关系和其后的“西方中心”秩序。但在美以联合对伊朗采取的军事行动中，欧洲国家要么事先不知情，要么事后拒绝向美国提供支持，美欧军事关系出现重大变化。\n\n伊朗距离欧洲很近，此前欧洲在伊朗核问题外交谈判中是重要攸关方，因为欧洲国家在中东地区有巨大的能源和商业利益。但在美伊谈判期间，美国突然联手以色列军事打击伊朗，并且绕开欧洲，这在外交、军事层面都将欧洲排除在外。欧洲第一时间强烈感受到被边缘化的冲击，美国则在新的全球战略中赋予欧洲不同以往的角色。\n\n2、侠客岛：欧洲国家在谴责伊朗对邻国发动报复性袭击的同时，对是否参与对伊军事行动措辞非常谨慎。西班牙对美批评尤其激烈，明确表示反对战争，并拒绝美国使用其军事基地打击伊朗。如何看待这些国家的态度？\n\n崔洪建：以前英国一直是美国在对外军事行动中最“可靠”的盟友，因此这次英国受冲击最大、立场选择最为困难、前后也最矛盾。英首相斯塔默先是以伊拉克战争为教训，政治上和美国拉开距离，并拒绝为美国提供军事基地；很快又表态，同意美国“特定且有限”使用其军事基地。\n\n政治上保持距离，行动上避免脱离，“既要又要”的应对策略被英国展示得淋漓尽致。\n\n法国出于大国地位考虑，对美国行动的反应最强烈：批评美以军事行动未征求联合国安理会意见，未获安理会授权，不符合国际法；主动与包括中国在内的相关方开展外交行动；军事上试图保持“代表欧洲”独立介入而非“配合美国”的姿态。这就与英国有了区别。\n\n德国态度相对消极暧昧。3月初默茨访美，正好赶上美以对伊采取行动，德国某种程度上被动卷入事态。出于历史原因，支持以色列在德国是某种政治正确，此前巴以问题上德国就倾向支持以色列。对美以军事行动，德国没有提出明确批评，是出于强烈的政治因素和政策惯性。\n\n那西班牙这次为啥如此“硬刚”美国？\n\n一是地理位置上，中东如果乱，位于大西洋和地中海咽喉位置的西班牙将首当其冲，面临贸易通道受阻、难民涌入等问题。因此西班牙政府的态度，延续了在中东问题上的政策连贯性，即主张稳定地区形势，反对以色列单方面改变现状；\n\n二是西班牙与美国有积怨，此前美国对西加征关税、要求增加北约军费等举动，已引发西班牙强烈不满，这次白宫又威胁切断与西班牙的所有贸易关系；\n\n三是政治立场上，左翼执政的西班牙在国际事务中秉持的理念与白宫相左。近年来西班牙希望在大国博弈中寻求更平衡多元的外交立场，反对盲目接受所谓美欧共同立场。西班牙“美国的政治动机不能证明其行动合法”的逻辑，体现出更多基于国际关系准则，而非按意识形态划界的理性。\n\n（图源：央视新闻）\n\n3、侠客岛：英法德三国领导人3月1日联合声明称，可能对伊朗采取“必要且相称的防御行动”，摧毁其发射导弹和无人机的能力。怎么看这种表态？\n\n崔洪建：伊朗事关欧洲周边安全和通道安全。中东是欧洲重要的能源供应来源，无论伊核问题还是美以军事打击伊朗，都将对欧洲的能源、贸易、安全产生不可忽视的直接影响。\n\n经历了事发之初各自表态的相对混乱阶段后，欧洲主要国家意识到需要介入其中、发挥作用，不能完全沦为被边缘化的旁观者。\n\n欧洲首选是外交介入。欧洲看清楚了，就算想置身事外，也无法避免被局势卷入其中，比如英法在海湾国家的侨民、军事基地、经济利益都会受到波及，因此希望变被动为主动。\n\n联合声明核心内容有二：一是以外交方式表明军事介入的可能，保留欧洲尤其是英法德三国根据事态变化随时军事介入的权利；二是在各方博弈中明确合作伙伴，欲将联系密切、利益相连的海湾国家作为主要合作对象，试图以“安全提供者”的姿态，为海湾国家提供安全保护、介入争端。\n\n但为避免与伊朗直接冲突，这份声明又为可能的军事介入设定了条件：一是突出军事介入的“防御性质”，试图与美以行动拉开距离，说欧洲是保护海湾国家；二是强调必要性、对称性，采取军事手段不以升级冲突为目的。\n\n欧洲采取这种姿态，是想避免和伊朗发生直接冲突，也避免国际社会批评。\n\n4、侠客岛：英国已参与协助海湾国家防御来自伊朗的军事打击，以“支持其在海湾地区的盟友”。马克龙确认，法国“戴高乐”号航母也已抵达地中海，应对中东地区紧张局势，保障法国及其盟友的安全。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n美以打击伊朗进入第10天，欧洲盟友集体“不跟”，与伊拉克、利比亚战争时期形成鲜明反差。这并非偶然：美国此次绕开欧洲发动军事行动，将欧洲在外交与军事层面双重边缘化，直接冲击了跨大西洋同盟的运作逻辑。欧洲内部反应分化——西班牙立场最强硬，明确反对战争并拒绝美军使用其基地；英国采取“政治上保持距离、行动上有限配合”的矛盾策略；法国试图以“代表欧洲独立介入”的姿态区别于美国；德国则因历史与政治因素态度消极暧昧。英法德联合声明提出可能采取“防御性”军事行动，但刻意与美以拉开距离。\n\n影响分析\n\n欧洲“不跟”折射出三重深层变化：其一，跨大西洋关系正从“美国主导、欧洲跟随”转向欧洲寻求战略自主，美国在新全球战略中对欧洲的角色定位已发生根本调整；其二，欧洲因地理邻近和能源、贸易利益攸关，无法真正置身事外，但又不愿被绑上美国战车，被迫在“介入”与“克制”之间走钢丝；其三，西班牙等国的“硬刚”表明，美国单边施压（关税威胁、军费要求）正在反噬同盟凝聚力，欧洲内部基于国际法准则而非意识形态划界的理性声音在上升。总体来看，此次分歧将加速欧洲防务自主进程，但短期内欧洲仍缺乏独立应对中东危机的军事能力，其“安全提供者”角色的实际效力有待观察。",

  "title": "伊朗传达七项谈判条件，这回美国“态度认真”了？",
  "src": "Exa 搜索",
  "lede": "新民晚报\n\n取得突破性进展的可能性很小。\n\n僵持已久的美伊谈判似现重启可能。据央视新闻报道，伊朗19日已向美国传达七项谈判条件。另有消息人士称，美国已准备好与伊朗谈判且“态度认真”。专家分析认为，美伊谈判具备重启基础，但受固有分歧、地区冲突外溢、各方政治博弈等多重因素制约，短期内难以实现突破性进展。\n\n谈判迎来重启窗口\n\n伊朗最高国家安全委员会秘书雷扎伊19日表示，伊朗已通过卡塔尔向美国传达了开启任何谈判所需的七项条件，包括美国结束所有针对伊朗的战事、解冻被冻结的伊朗资产并结束海上封锁等。如果美国希望摆脱其一手造成的困境并避免越陷越深，那么除了接受伊朗的条件外别无他途。\n\n另据相关人士透露，卡塔尔和巴基斯坦作为调解方已告知伊朗，美国准备好与伊朗谈判并达成协议，且态度认真。\n\n沙特首都利雅得一机场附近浓烟滚滚 图源：GJ\n\n上海外国语大学中东研究所教授、中国中东学会副会长刘中民认为，眼下美伊确实存在重启谈判的可能。\n\n首先，美伊军事冲突和经济封锁与反封锁斗争相交织的状态，使双方都面临巨大压力。美国军事和经济“双管齐下”，成本投入巨大，但依然没有达到想要的结果，同时国内中期选举的压力更为迫切。伊朗则面临因冲突长期化导致的军事、安全、经济、社会等方面的巨大压力。\n\n其次，处在冲突夹缝中的海湾国家希望冲突降级并走向政治解决，尤其是沙特等海湾国家不断向美国施加压力。最近胡塞武装与沙特冲突不断升级，更使美国和沙特面临波斯湾和红海两线压力陡增的挑战。\n\n最后，巴基斯坦、卡塔尔、阿曼等斡旋国与美伊双方的外交接触始终存在，为美伊谈判提供了沟通渠道和平台。\n\n欲获突破面临挑战\n\n在刘中民看来，尽管美伊谈判有可能重启，但取得突破性进展的可能性很小。\n\n一方面，美伊之间的根本性分歧始终存在，甚至在近期呈现进一步扩大的趋势。从伊朗提出的条件看，与此前美伊谅解备忘录内容基本一致，美国显然难以接受。其中最迫切的问题仍然是霍尔木兹海峡问题，而核问题、导弹问题、代理人问题等固有分歧同样难以协调。从当前博弈的胶着状态看，双方都陷入了追求“胜利”的心理怪圈，既要妥协又要获得体面的“胜利”，使谈判困难重重。\n\n另一方面，目前冲突外溢范围扩大，胡塞武装和沙特的冲突与美伊冲突形成联动。考虑到也门内部问题以及胡塞和沙特的长期矛盾，这一冲突存在超出美伊冲突的特殊性，不排除成为相对独立的第二战场的可能。而美国推卸责任与胡塞武装单独“媾和”的做法，并不利于冲突降级。若胡塞与沙特冲突扩大化、长期化，也不利于促成美伊谈判。\n\n“此外，美伊双方的国内政治、以色列的政策选择、美以同伊朗及‘抵抗阵线’的多点冲突联动，都是制约美伊谈判的重要因素。”刘中民说，“而美国特朗普政府朝令夕改，更令谈判充满不确定性。”\n\n出品 深海区工作室\n\n撰稿 王若弦\n\n编辑 齐旭\n\n这标志着联大最有看点和戏剧性甚至最具火药味的时刻即将到来。\n\n联合国大会会场\n\n更受关注的是，面对秘书长古特雷斯发出的预警——世界已进入“深度不确定性时代”，各国能否抓住“地球村年会”的契机，切实加强合作，应对全球威胁，郑重兑现本届联大主题“重建信任、管理变革”的承诺。\n\n“辩论”有何看点\n\n持续一周的一般性辩论素有“世界领导人峰会”之称，向来是每届联大的重头戏。\n\n其间，各国代表有机会就全球重大问题畅所欲言，并表达各自优先关切。\n\n今年将有近130位国家元首和政府首脑将登上绿色大理石讲台发言。\n\n巴西代表将按惯例第一个发言。\n\n由于在联合国成立初期，各国代表都不愿先开口，而巴西代表总是率先发言，于是形成惯例。\n\n今年，巴西总统卢拉将第一个登台。卢拉已放话，出席联大期间将要求美国不要干涉巴西选举。\n\n作为东道国，美国代表一般安排在第二位发言。\n\n美国总统特朗普将于22日第一天发表讲话。\n\n据美国常驻联合国代表华尔兹介绍，特朗普将重点阐述美国政府如何处理伊朗问题等全球复杂问题，以及展示他已经或正在促成的和平协议。\n\n伊朗总统佩泽希齐扬已获“交战方”美国的签证，预计将于23日发言。\n\n这将是美以伊战事持续近7个月来，伊朗首次在最权威、最具代表性的国际舞台上发声。\n\n外界预计，佩泽希齐扬将利用联大讲台抨击美以侵略行为，争取国际舆论支持。\n\n以色列总理内塔尼亚胡也安排在23日发言。今年会否重演去年多国代表在其讲话时集体退场一幕，将是一大悬念。\n\n遭美国拒签的巴勒斯坦总统阿巴斯将在24日以预录视频方式发言。这是阿巴斯连续两届联大被美国拒发签证。\n\n另一对“交战方”：乌克兰总统泽连斯基、俄罗斯外长拉夫罗夫将分别在23日、26日发表演讲。\n\n外界还注意到，今年中等强国、全球南方国家在联合国的角色日益凸显，折射国际体系变化趋势。\n\n英国首相伯纳姆、日本首相高市早苗将“首秀”联大，加拿大、法国、越南、印尼等国领导人也将到场。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n伊朗通过卡塔尔向美方传达七项谈判条件（结束战事、解冻资产、解除海上封锁等），卡塔尔与巴基斯坦作为调解方称美方“态度认真”。但专家判断，谈判虽存重启窗口，突破性进展可能性很小。与此同时，伊朗总统佩泽希齐扬将借联大讲台首次在国际舞台发声，美伊博弈正从战场延伸至多边外交场。\n\n影响分析\n\n短期看，美伊双方各有压力——美国深陷军事经济双重成本与中期选举压力，伊朗承受冲突长期化的安全与经济代价，海湾国家又持续施压要求降级，这构成了谈判重启的现实基础。但根本性分歧（霍尔木兹海峡、核问题、代理人网络）不仅未缩小，反而在“既要妥协又要体面胜利”的心理怪圈中进一步固化。更关键的是，胡塞武装与沙特冲突正形成联动外溢，可能演变为独立的第二战场，直接冲击谈判环境。联大舞台则提供了另一个观察窗口：伊朗首次以“交战方”身份发声，意在争取国际舆论，而美以伊三方同台，博弈将从双边密室转向多边公开场。总体判断：谈判窗口微开，但结构性矛盾与地区冲突外溢决定了短期内难有实质突破。",

  "title": "西门子和Humanoid将物理AI带入工厂车间：与NVIDIA一起在工业运营中部署人形机器人_软件动态_智能制造新闻_新闻_e-works数字化企业网",
  "src": "Exa 搜索",
  "lede": "2026年09月21日 来源：西门子\n\n- 西门子与英伟达达成战略合作，携手打造全 AI 驱动的自适应生产基地。双方已在德国埃尔朗根的西门子工厂开展人形机器人测试，取得实际落地里程碑成果。\n- HMND 01 Alpha 专为工业场景打造，具备先进的操作作业能力。\n- 西门子 Xcelerator 提供工厂级可扩展产品组合，用于工业系统集成。\n- 英伟达加速仿真与开发进程，助力项目更快落地部署。\n\n 西门子与 Humanoid 公司宣布，在将物理 AI 从愿景落地为工业现实的进程中达成一项里程碑成果。依托英伟达物理 AI 技术栈打造的 Humanoid HMND 01 轮式 Alpha 人形机器人，已在德国埃尔朗根的西门子电子工厂完成作业测试，可自主执行物流任务。本次成果延续了西门子与英伟达在国际消费电子展（CES）上公布的战略合作，双方目标是打造全球首个全 AI 驱动的自适应生产基地。 \n\n \n\n制造业迎来物理 AI 时代 物理 AI 这一学科旨在训练智能机器在物理世界中感知、推理并执行动作，它有望彻底改变产品制造方式。想要弥合 AI 研究与真实工厂需求之间的鸿沟，离不开一套高性能生态体系：世界级 AI 算力与仿真能力、经过验证的机器人平台，以及可将所有要素整合起来的成熟工业自动化基础设施。 HMND 01 Alpha 机器人部署于西门子物流作业场景，可自主完成料箱搬运任务 —— 为人工操作人员拾取、转运和放置物料箱。本次测试达成全部目标性能指标：每小时可搬运 60 个料箱，连续运行时长超 8 小时，自主拾取与放置成功率高于 90%。 依托西门子 Xcelerator 搭建工业底层支撑 人形机器人的真正价值，在于成为车间内深度集成、可协同作业的生产资产。这要求机器人能够与生产系统及其他自动导引车实时交换数据，和其他设备、操作人员同步工作流，并具备自适应能力，可动态响应不断变化的现场工况。倘若缺少这种深度集成，即便是技术最先进的机器人，也只能作为孤立设备存在。 西门子通过 Xcelerator 产品组合提供这一关键能力层，涵盖完整数字孪生、AI 感知、集成控制、PLC - 机器人接口，同时配套集群管理、工业通信网络与高性能驱动系统。上述技术共同构成数字骨架与自动化基础设施，保障人形机器人高效运行，并与整个工厂环境协同工作。最终形成一套工厂级方案，支持在各类工业场景部署人形机器人。 依托英伟达函数库、开发框架与 AI 基础设施加速智能能力落地 Humanoid 公司已将英伟达全套物理 AI 技术栈集成至 HMND 01 机器人平台，其中包括用于边缘计算的英伟达 Jetson Thor、用于仿真的英伟达 Isaac Sim，以及用于强化学习与策略训练的英伟达 Isaac Lab。这套方案大幅压缩了开发周期。团队采用仿真优先的硬件设计思路，可在虚拟环境中优化执行器选型、关节强度与质量分布，将原型开发周期从常规的 18–24 个月缩短至仅 7 个月。 英伟达机器人与边缘 AI 副总裁迪普?塔拉（Deepu Talla）表示：“未来工厂需要能够和工人协同、自主感知、推理并自适应的机器人，以此解决传统自动化难以应对的劳动力短缺与生产运营复杂度难题。由西门子提供工业集成底层支撑，Humanoid 部署英伟达全套物理 AI 技术栈 —— 从仿真优先训练到实时边缘推理，本次落地应用为人形机器人在真实车间达成生产目标铺平了道路。” Humanoid：研发工厂级人形机器人 Humanoid 是一家总部位于英国的人工智能与机器人企业，其研发的 HMND 01 Alpha 人形机器人专为工业环境打造。HMND 01 搭载全向轮移动平台，具备先进操作能力，依托自研 AI 框架 KinetIQ 驱动；该机器人面向以人为中心的作业空间设计，可适配多样化任务，完成复杂动作。 Humanoid 创始人兼首席执行官阿尔乔姆?索科洛夫（Artem Sokolov）表示：“我们的目标是打造不仅能在受控实验室环境运行，还可在真实工厂环境中落地、承担实际工业任务的人形机器人。与西门子、英伟达的合作赋予我们强大优势：将英伟达领先的 AI 基础设施、仿真工具与开发框架，和西门子深厚的工业经验及系统集成能力融为一体。我们共同证明，人形机器人已具备真实工业场景落地部署的条件。”\n\n责任编辑：邓珊珊 (dengshanshan@e-works.net.cn)",
  "deep": "## AI 解读\n\n核心要点\n\n1. 三方协同落地：西门子（工业集成）、英伟达（物理AI算力与仿真）、Humanoid（机器人本体）形成完整技术闭环，HMND 01轮式人形机器人在西门子埃尔朗根工厂完成真实物流作业验证。\n2. 性能达标：每小时搬运60个料箱、连续运行超8小时、自主抓取成功率超90%，已满足工业级基础门槛。\n3. 开发提速：仿真优先策略将原型周期从18–24个月压缩至7个月，验证了\"虚拟训练+边缘推理\"范式的工程可行性。\n4. 集成是关键：西门子Xcelerator提供数字孪生、PLC-机器人接口与集群管理，解决人形机器人\"孤岛化\"痛点。\n\n影响分析\n\n此次落地标志着人形机器人从实验室演示迈入工厂级部署的临界点。其真正价值不在机器人本体，而在于\"物理AI+工业自动化底座\"的融合范式——仿真训练降低试错成本，工业集成层解决协同调度，二者共同构成可复制的部署模板。对制造业而言，这意味着劳动力短缺与柔性生产难题获得新解；对产业格局而言，英伟达巩固AI基础设施地位，西门子卡位工业集成入口，Humanoid等本体厂商则面临\"平台依附\"与\"自主生态\"的路径选择。短期看，物流搬运是最先跑通的场景；中长期，能否切入装配等复杂工序，将决定人形机器人的真实天花板。",
  "no": 153
 },

  "title": "优必选柳州万台级工厂投产，每10分钟下线一台人形机器人 - 机器人大讲堂",
  "src": "Exa 搜索",
  "lede": "优必选柳州万台级工厂投产，每10分钟下线一台人形机器人 - 机器人大讲堂\n\n## 优必选柳州万台级工厂投产，每10分钟下线一台人形机器人\n\n林越 2026-09-21 1344人形机器人\n\n9月12日，柳州优必选万台级工业人形机器人超级智慧工厂投产仪式在北部生态新区举行。该工厂是优必选打造的全球首个适配万台级产能的工业人形机器人智能制造标杆工厂，依托工业仿真系统智能规划、数字化智慧大脑全域调度，落地用机器人造机器人的智造模式。按照产线设计节拍，每10分钟可下线1台机器人，年规划产能超万台。优必选联合西门子量身打造人形机器人专属数字化智造底座，破解了人形机器人零部件繁多、转运频次高、装配精度高、产品迭代快的量产痛点。\n\nWalker S2的技术配置\n\n Walker S2是面向智能制造场景的全尺寸工业人形机器人，通过迭代的群脑网络2.0，搭载自研的全球首个专用于工业人形机器人本体的智能体技术Co-Agent。Walker S2身高1.76米，可复现拟人步态行走与精细操作能力，集成第四代工业级灵巧手与仿生手臂。其灵巧手采用类人尺寸设计，可实现亚毫米级的精细操作，耐久性经测试超过8万次。仿生手臂采用全中空结构与集成走线设计，支持自主换电等高难度动作。Walker S2实现了国内首个头部采用纯RGB双目视觉方案，类人眼双目立体视觉感知能力有效提升人形机器人对工厂环境的适应性。52自由度的仿生躯体配合第四代灵巧手，可在0到1.8米全空间范围内完成15公斤负载搬运及正负162度腰部灵活转动。\n\nCo-Agent和自主换电\n\n Walker S2搭载了优必选自研的工业人形机器人协作智能体Co-Agent，融合多模态推理大模型、具身交互大模型、技能类小模型以及类人思维链技术，赋予Walker S2意图理解、任务规划、工具调用和自主异常处理等闭环作业能力，并通过工业实训积累的亿级数据持续优化算法。Walker S2采用高功率高扭矩腰关节设计及动态平衡算法，可完成灵活摸地、极限下蹲、远距离抓取等高难度动作。该机器人全球首次实现自主换电，搭载双电池同充同放、标准化电池仓快换、双臂协同精准换电等技术，可实现7×24小时不间断作业。\n\n万台级产能意味着什么\n\n 年规划产能超万台这个数字，放在人形机器人行业里是一个新的量级。此前多数人形机器人公司的年产量在几百台到几千台之间，万台级产能对应的供应链管理、质量控制、成本控制要求完全不同。工厂用机器人造机器人，把自研的具身智能技术反向用到生产线上，让机器人从终端产品变成核心生产工具。这个逻辑如果跑通，量产成本、交付节奏、品控一致性都会拉开差距。柳州工厂的产线节拍每10分钟下线一台，这个速度对应的是一年约5万台的产能上限，实际产出取决于订单和供应链的匹配。优必选已全面迈入工业、商用和家庭消费三箭齐发的发展阶段，万台级工厂为这三大场景的落地提供了产能支撑。",
  "deep": "## AI 解读\n\n# 优必选万台级工厂投产：人形机器人从\"样机叙事\"迈向\"产能叙事\"\n\n核心要点\n\n1. 产能量级跃迁：年规划产能超万台，10分钟/台节拍（理论年上限约5万台），将行业量产基准从\"百台级\"拉升至\"万台级\"，供应链、品控、成本逻辑随之重构。\n2. \"机器人造机器人\"闭环：自研具身智能技术反向嵌入产线，机器人从终端产品变为生产资料，若跑通将形成成本与交付节奏的代差优势。\n3. 技术栈就位：Walker S2搭载Co-Agent智能体、纯RGB双目视觉、自主换电（7×24小时作业）、亚毫米级灵巧手，参数指向真实工业场景而非演示。\n4. 生态协同：联合西门子打造专属数字化智造底座，破解多零部件、高精度装配的量产痛点。\n\n影响分析\n\n短期看，万台产能的实际释放取决于订单与供应链匹配度，节拍≠出货，需警惕\"产能先行、需求滞后\"的错配风险。中期看，若\"机器人造机器人\"闭环验证成功，优必选将在成本曲线上拉开与仍处手工装配阶段的竞争对手的差距，加速行业洗牌。更关键的是，工业、商用、家庭三线并进的产能底座一旦成型，人形机器人竞争焦点将从\"技术演示\"转向\"规模化交付能力\"——这正是行业从概念期跨入产业期的分水岭。柳州工厂的真正价值，不在于下线速度，而在于它是否证明了人形机器人可以像汽车一样被\"制造\"。",
  "no": 154
 },

  "lede": "9月20日，启元机器人发布会现场人流涌动。与以往人形机器人偏向工业场景的演示不同，这场发布会把机器人从实验室和展厅带进了普通家庭的模拟场景——展台围绕家庭生活搭建了沉浸式样板间，直观展示机器人如何融入三代同堂的日常。\n\n \n\n两款新品：一个“可定义”，一个“可变形”\n\n发布会上，Q1与T1正式揭晓并开启预售。Q1是全球首个小尺寸全身力控人形机器人，88厘米、15公斤，能折叠塞进背包，支持外观结构件定制；T1则是全球首个可变形个人机器人，100厘米、16公斤，可在轮足人形与四足形态间自主切换。一个主打“可定义”，一个主打“可变形”，分别切入开发潮玩与户外影像，定位清晰、互补而非重叠。记者了解到，当前版本机器人电量耗尽后仍需手动关机、拔电池充电，但后续将升级自动回充功能。\n\n生态接入：WorkBuddy让机器人“长出”耳朵眼睛和手脚\n\n在家庭场景，人虽在办公室，用户可通过WorkBuddy远程向机器人下达指令：“给我的宝宝讲一个恐龙故事。”WorkBuddy在云端检索生成内容，机器人配合手势、表情向家人语音分享，故事精彩处还会手舞足蹈。\n\n此外，启元还与飞阔科技达成合作，共建健康监测功能。用户与机器人握手即可完成心率、血氧等基础健康状态检测，在交互聊天中同步获取健康反馈。\n\n家庭场景落地：从远程通讯到AI教育\n\n在智慧家庭展区，工作人员演示了人机即时通讯功能。用户通过APP留言“奶奶，我今晚不回去吃饭了”，机器人收到消息后自主前往卧室找到奶奶，并询问是否接通电话。小朋友无需操作手机，直接呼叫机器人就能联系在外家长，机器人之间也能互加好友、互相传话。\n\n记者看到，展区还演示了全屋智能设备联动，一句语音指令即可调控灯光、家电，机器人能识别家庭成员身份，为老人提供用药提醒，为家长管理家庭能耗。\n\n \n\n教育是本次重点发力的赛道。展台设置了完整的K12人工智能教育板块，覆盖小学、初中、高中全学段。启元AI启蒙课让孩子通过实体机器人学习AI认知、工程实践、人机协作等六大AI素养；推出的AI具身智能编程课，把抽象Python代码变成机器人看得见的动作。机器人还配套英语口语交互功能，可与孩子开展多轮英文对话，实时纠错并生成练习报告。\n\n现场还亮相了启元机器人“直播搭子”，人形机器人站在环形补光灯前直接参与直播互动，探索在直播、内容创作领域的商业化落地。启元机器人本次新品的核心思路，是让机器人不再只是展厅里的表演展品，而是拥有温度、能感知家庭成员需求的家庭伙伴。\n\n文、图/广州日报新花城记者：陈庆辉 视频/广州日报新花城记者：陈庆辉 广州日报新花城编辑：麦晓颖\n\n通过直播非法猎捕野生鸟类引流，售卖狩猎工具；被平台多次封禁账号后，频繁更换小号继续开播——近日，浙江台州市公安局黄岩分局侦破一起非法狩猎案件，抓获两名涉案人员。\n\n2024暑期档票房破75亿\n\n据网络平台实时数据，截至7月30日18时35分 ，2024年暑期档（6月-8月）档期总票房（含预售）突破75亿！《抓娃娃》《默杀》《云边有个小卖部》暂列档期票房榜前三位。\n\n俞敏洪：与辉同行的全部净利润奖励给董宇辉\n\n7月25日，俞敏洪在微信公号发布《致东方甄选股东朋友的一封公开信》。\n\n上半年我国跨区域人员流动量324.1亿人次\n\n \n\n上半年，交通运输经济运行持续向好、总体平稳，货运量、港口货物吞吐量、人员流动量等交通运输主要指标均实现较快增长。\n\n低至五折！大理、拉萨等热门目的地机票便宜了\n\n \n\n​暑运期间，民航市场火热。记者了解到，这个暑期西北、西南等地区干支线增班最多。\n\n理财档案丨增厚储蓄险收益浮动收益产品上位\n\n近日有消息称，人身险产品预定利率将再度“降档”。其中，传统型人身险产品的预定利率或将从3%下调至2.5%，这距离预定利率3.5%下调至3.0%还不足1年。\n\n“提前还房贷”再度升温，如何还款更划算？\n\n \n\n伴随着一系列降息和房贷新政落地，当前首套房和二套房贷款利率均降至“3时代”，新增房贷与存量房贷利率差距加大，部分差距已高达100BP，同样是200万元房贷，总利息相差27万元左右。\n\n人民币盘中升破7.21 对美元汇率创下5月初以来新高\n\n7月25日，在岸、离岸人民币对美元汇率上涨，且涨势盘中进一步扩大，均升破7.21关口，当日在岸人民币对美元涨超680个基点，离岸人民币对美元涨超580个基点，创下5月初以来的新高。\n\n六大行下调人民币存款利率 中小银行梯次跟进\n\n \n\n今年首轮存款降息开启！昨日，工行、农行、中行、建行、交行、邮储六大国有银行集体宣布下调存款利率。\n\n东方甄选：主播董宇辉离职",
  "deep": "## AI 解读\n\n# 启元机器人发布深度解读\n\n核心要点：\n\n1. 产品差异化定位：Q1主打“可定义”（88cm/15kg，可折叠、外观定制），切入开发潮玩；T1主打“可变形”（100cm/16kg，轮足人形与四足自主切换），切入户外影像。两者互补而非重叠，避免内部竞争。\n\n2. 生态能力构建：通过WorkBuddy实现云端指令生成与远程交互，联合飞阔科技实现握手健康检测，并打通全屋智能设备联动，机器人正从孤立硬件向“家庭智能中枢”演进。\n\n3. 场景落地路径清晰：从远程通讯、AI教育（K12全学段覆盖）、健康监测到直播商业化，启元选择以家庭为锚点、教育为突破口，避开工业场景的正面竞争。\n\n影响分析：\n\n启元此次发布标志着人形机器人从“技术展示”向“消费级产品”的关键转折。其意义不在于技术参数的突破，而在于场景定义能力——将机器人嵌入三代同堂的家庭叙事，以情感陪伴和教育刚需降低用户接受门槛。若自动回充等体验短板如期补齐，启元有望率先打开人形机器人C端市场，但需警惕：家庭场景对安全性和可靠性的容错率极低，规模化交付后的品控将是真正考验。",
  "no": 155

  "url": "https://hebei.ifeng.com/c/8wbF3CWkicj",
  "title": "乐享科技以太大模型机器人完成全球首次户外机器人全自主直播_凤凰网",
  "src": "Exa 搜索",
  "lede": "2026年09月21日 15:42:04 来自河北\n\n9月16日，乐享科技在上海完成全球首次具身智能大模型长时户外全自主直播：搭载其全新以太大模型的机器人在真实户外环境中连续作业1小时，从点单、任务规划、烧烤到上菜，全程自主完成。这也是全球首次，多台机器人在真实开放环境中自主交互、协作完成一整套任务。\n\n直播结束两天后，乐享科技于9月18日进一步发布以太大模型真实场景应用的第二个\"一镜到底\"视频。\n\n本次直播在线上超550万观众及现场超30位行业媒体的见证下进行。现场6名顾客随机点单、更改及新增需求，并可随意挪动物品、打断任务。直播中还出现插曲：原定的一位顾客临时未能到场，乐享科技没有停播，也没有调整流程，而是从围观观众中随机邀请了一位补位，将\"0预设、0剧本\"贯彻到底。全程没有遥操，也没有剪辑掉\"失误\"片段的机会。\n\n直播中，机器人展现出多项此前未有模型公开展示的能力：\n\n双机自主协作。烧烤机器人守在炉前，服务机器人穿梭于烤炉与餐桌之间，两台机器人互相传递任务信息，共同判断任务进度与配合方式。\n\n直播中两台机器人被观众称为\"二爷\"和\"五弟\"：服务机器人会将顾客的个性化需求（如多加辣椒粉）告知烧烤机器人；感觉顾客等久了，也会主动追问出餐进度。据介绍，这一双机交互全程没有一个预设的触发条件。\n\n长程任务断点续做。点单中途有顾客临时要求取水，机器人先将水送达，再回到桌边继续未完成的点单。期间它还主动为顾客递上纸巾——没有人提出过这一需求，完全来自机器人对场景规则的自主理解。\n\n精细操作与现场自学习。烧烤机器人按顾客要求将调料精准撒到食物上，并在恰当的时间主动刷上酱汁。它第一次抓调料瓶时未拿稳，经数次尝试后动作明显变稳——每一次抓取的成败，都直接成为修正下一次动作的依据。\n\n开放环境全身协调控制。直播场地完全开放，桌椅位置与人员动线事先无法预设。机器人迈出的每一步都是现场看、现场判断、现场决定，不依赖提前建好的地图和写死的路线。\n\n支撑此次直播的以太大模型，是乐享科技推出的全球首个跨本体通用具身大模型，具备主动感知、多模态理解、流式记忆、动力学建模、持续自我迭代五项相互咬合的核心能力，并实现了三个\"全球第一\"：\n\n全球第一个能量驱动的通用智能模型。不直接预测动作，而是把目标完成度、动力学一致性、记忆一致性、物理约束等统一为连续的能量景观，沿能量梯度持续推理、主动探索、生成动作。\n\n全球第一个类人脑神经元模型。把\"大脑—脊髓\"的贯通机制搬进机器，运动轨迹不靠数据\"猜\"、靠物理约束\"学\"。\n\n全球第一个自进化的具身智能模型。 Evolution Manager让自我模型与世界模型从参数级到模型级持续自进化，部署不是能力的天花板，而是成长的起点。\n\n乐享科技表示，拿下\"全球首次\"不是这场直播最重要的意义。真正重要的是：一个具身智能模型，开始能离开高度受控的实验室，在不断变化的真实世界里持续工作。烧烤只是一次\"真题\"考试，未来不管机器人走进家庭、商业服务还是更多真实场景，它面对的始终是一个无法提前写完所有答案的世界。\n\n9月18日，乐享科技发布的第二个\"一镜到底\"视频，在此前十分钟双机协作的基础上，进一步加入了外界对任务的频繁打断、更精细的操作任务，以及机器人对人的意图理解与人机交互。",
  "deep": "## AI 解读\n\n# 乐享科技以太机器人直播：具身智能的\"真实验证\"时刻\n\n核心要点\n\n1. 技术里程碑：全球首次具身智能大模型长时户外全自主直播，双机协作完成点单、烧烤、上菜全流程，全程零遥操、零预设、零剪辑。\n2. 能力突破：以太大模型展示双机自主协作、长程任务断点续做、精细操作现场自学习、开放环境全身协调控制四项此前未公开的能力。\n3. 架构创新：能量驱动模型、类人脑神经元模型、自进化模型三项\"全球第一\"，将部署视为成长起点而非能力天花板。\n\n影响分析\n\n此次直播的意义不在\"首次\"，而在于验证了具身智能从受控实验室走向开放真实世界的可行性。550万观众见证的\"0剧本\"模式，实质是对模型泛化能力与实时决策能力的极限压力测试——临时补位观众、随意打断、物品挪动等变量，恰恰是真实场景的常态。这标志着行业竞争焦点正从\"演示能力\"转向\"持续自主作业能力\"。若以太架构的能量驱动与自进化路径可复制，将显著降低机器人部署的场景适配成本，加速具身智能在家庭服务、商业场景的商业化落地。但需关注：单次直播的成功尚不足以证明长周期稳定性，真实世界的\"长尾问题\"仍是下一阶段的核心考验。",

  "title": "利雅得遭遇空袭，美国发安全警报，沙特胡塞冲突或“迅速升级”",
  "src": "Exa 搜索",
  "lede": "【环球时报驻美国特约记者 冯亚仁 环球时报特约记者 吴鸣】在沙特阿拉伯首都利雅得罕见拉响防空警报后，美国国务院于当地时间19日晚间针对中东地区发布新的安全警报，称也门胡塞武装同沙特阿拉伯的军事冲突有可能“迅速升级”。同日，美国总统特朗普提前结束周末行程返回白宫，引发猜测。据美媒报道，美国政府对动用本国军队阻止胡塞武装没有太大兴趣。外界正将目光投向此前签订共同防御协议的“麦加联盟”，这份协议能否发挥作用，仍然要打上一个问号。\n\n美建议“重新考虑”前往中东\n\n美国驻中东多国大使馆19日发布新的安全警报称，由于中东局势紧张，安全环境仍然复杂，存在发生不可预见的局势升级的可能性，身处中东地区的美国人应“保持高度警惕”，注意航班取消、空域关闭和旅行中断等情况。安全警报还称，“伊朗支持的胡塞武装已对沙特阿拉伯发动敌对行动，其中包括针对民用机场的行动。这场军事冲突有可能迅速升级。居住在中东地区以外的美国公民应认真重新考虑前往或途经该地区的旅行计划”。\n\n沙特首都利雅得曾于19日凌晨和上午两次传出爆炸声，这是也门胡塞武装与沙特7月冲突升级以来，利雅得首次响起空袭警报。据美联社、英国广播公司等媒体报道，胡塞武装发言人萨雷亚19日晚发表声明称，当天动用“大量弹道导弹、巡航导弹和无人机”袭击利雅得的“敏感目标”以及沙特阿美石油公司位于红海港城延布的设施，并称这些袭击是对沙特企图袭击也门首都萨那的回应。该组织称，将继续执行“以封锁对封锁，以升级对升级”的方针。\n\n特朗普提前返回白宫\n\n据法新社20日报道，就在沙特和也门胡塞武装针锋相对互袭之际，美国总统特朗普缩短了周末在戴维营的行程，于19日晚间出人意料地提前返回白宫。白宫未对这一行程变化作出解释。\n\n美国有线电视新闻网（CNN）国家安全分析师亚历克斯·普利萨斯援引消息人士的话称，特朗普在戴维营举行会议，“商讨和审查对也门的打击方案”。据CNN报道，美国官员承认，也门胡塞武装正推进战事，其最终目标是控制曼德海峡。但美国政府释放出的信号是：美国对动用本国军队阻止胡塞武装没有太大兴趣。然而，即便获得美国额外的情报和目标定位支持，沙特仍未能有效阻止胡塞武装夺取也门沿海重镇，这令海湾国家及美国官员感到沮丧。\n\n土外长称将给予沙特支持\n\n随着胡塞武装持续打击沙特目标，外界正在关注后者与巴基斯坦和土耳其于8月签署的《麦加共同防务协议》是否会发挥作用。根据这份协议，对三国中任何一国的武装攻击将被视为对三国全体的攻击。\n\n据路透社报道，土耳其外长费丹19日表示，针对沙特遭遇袭击，土耳其将信守协议承诺，“他们可能有一些军事需求，尤其是在一些技术问题上。我们完全有能力满足这些需求”。巴基斯坦军方发言人此前也曾表态将“从外交和实质行动上”支持沙特。不过，卡塔尔半岛电视台20日援引多名分析人士的话称，从政治和法律角度来看，启动程序在原则上是可能的，但“在实践中却很复杂”。尽管胡塞武装对沙特的袭击符合触发共同防御的情境，但该协议尚未获得土耳其和巴基斯坦议会的批准，现阶段更像一份“政治宣言”。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 冲突升级信号明确：胡塞武装首次对利雅得发动大规模导弹与无人机袭击，目标涵盖民用机场及沙特阿美设施，标志着双方冲突从也门边境向沙特核心腹地延伸，打击烈度和政治象征意义均显著上升。\n2. 美国态度矛盾：一方面发布安全警报、特朗普紧急返白宫研判局势，另一方面明确无意直接军事介入，仅倾向提供情报与目标支持，反映其战略重心不在中东、不愿被拖入新冲突。\n3. “麦加联盟”面临实战检验：土耳其、巴基斯坦表态支持沙特，但协议未经两国议会批准，法律约束力有限，实际军事响应能力存疑。\n\n影响分析\n\n此次袭击意味着胡塞武装已具备打击沙特纵深战略目标的能力，沙特本土安全成本将大幅攀升，红海航运与能源设施风险加剧。美国“有限介入”姿态可能进一步削弱海湾盟友对其安全承诺的信心，促使沙特加速寻求多元化安全保障。若“麦加联盟”无法有效兑现，沙特将陷入“盟友失信、对手升级”的双重困境。更宏观来看，胡塞武装背后伊朗的影子清晰可见，曼德海峡控制权之争正成为中东地缘博弈的新爆点，地区局势存在失控风险。",
  "no": 157
 },

  "url": "https://c.m.163.com/news/a/L7AFN97G0556BRY2.html",
  "title": "沙特向美求援无果，转头就找了北京！中国能让伊朗收手吗？",
  "src": "Exa 搜索",
  "lede": "2026年9月的中东，最刺眼的一幕不在战场，在电话线上。\n\n沙特王储小萨勒曼给白宫连打两通电话，都没得到自己想要的答案。转过头，他把求助信号发到了北京。\n\n多家外媒披露，小萨勒曼在9月上旬先后拨通了特朗普的专线。第一通是通报也门局势，第二通直接开口，请求美军出手打击胡塞武装。特朗普拒绝了。\n\n白宫给出的理由很硬：美国当前的焦点是伊朗，不会把地面部队投进也门。沙特花了几十年、砸了几千亿美元在美制武器上，换来的却是一句“帮不上忙”。\n\n沙特为什么这么急？答案在曼德海峡。9月10日前后，胡塞武装拿下也门西海岸重镇穆哈港，紧接着夺取丕林岛和哈尼什群岛，整条红海南部海岸线易手。\n\n胡塞用不到十天，就把这条全球最忙碌的水道之一攥在了手里。\n\n丕林岛上现在飘的是胡塞的旗帜，导弹和无人机可以直接压制航道。这不是骚扰，是把刀架在了脖子上。\n\n这刀砍到沙特的什么地方？砍到了石油出口的备份通道。\n\n伊朗自2026年2月底与美以爆发冲突后，一直在霍尔木兹海峡制造压力。\n\n沙特绕开霍尔木兹的备用路线，就是那条横穿国土、日输送能力约500万桶的东西输油管道，出口终点在红海边的延布港。\n\n红海这头被胡塞卡住，管道那头又不太平，沙特的石油等于两头挨堵。\n\n8月产量掉到日均600万桶，创下三十多年来的新低。\n\n胡塞的火力还压到了沙特本土。\n\n9月8日，胡塞用弹道导弹加无人机同时打了阿卜哈、海米斯穆谢特、吉赞、纳季兰四座沙特南部城市。吉赞的下游工业园区和一处空军基地被命中，多处石油设施起火，几十人受伤。\n\n沙特南部边境线上，天天有警报响。这已经不是2015年刚开战那种小打小闹的水平了。\n\n沙特也不是没找过其他人。海湾几名官员透露，利雅得先后向法国、英国、巴基斯坦、埃及递过话，希望对方支援拦截弹和技术人员。\n\n可惜这几年红海上空的胡塞导弹雨，把西方的库存全耗空了。五角大楼在国会作证时都承认，“爱国者”和“萨德”的先进拦截弹存在短缺。\n\n沙特要的不是同情心，是能打下来无人机的实弹。这个东西现在西方谁都拿不出富余的。\n\n问了一圈，利雅得只剩一个选项。能让胡塞真正收手的钥匙，握在德黑兰手里。能让德黑兰听得进去话的人，在北京。\n\n9月中旬，路透社援引三名伊朗消息人士的说法，沙特已经通过外交渠道向中国求助。\n\n北京随后通过非公开管道向伊朗方面递了口信，希望伊朗动用对胡塞的影响力，别让冲突扩散到中国最看重的能源通道上。\n\n为什么找中国？账很清楚。大宗商品数据公司Kpler统计，2025年中国买家占到了伊朗海运原油出口的八成以上，日均约140万桶。\n\n伊朗被美国制裁压得喘不过气，能续命的钱袋子基本靠对华石油贸易。\n\n一位驻中东的西方资深外交官直言，北京是全球屈指可数还能对德黑兰施加实际影响的角色之一。这话听着朴素，含金量却很高。\n\n中方递信的方式也很讲究。9月中旬，伊朗外长阿拉格齐访问北京，与王毅外长举行了会谈。\n\n三位伊朗消息人士没有确认口信是否就是在这次会晤上当面交的，但时间点摆在这里，谁都看得懂。\n\n整个过程里，中方没有丢出任何威胁，也没有暗示要动用经济手段施压。这是一种典型的非胁迫式斡旋，靠的是共同利益，不是大棒。\n\n伊朗那边给出的公开回应带着弦外之音。\n\n德黑兰表示，地区的稳定和和平，前提是美国与以色列停止对伊朗的战争。翻成大白话就是：胡塞是我们手上不多的牌，什么时候把这张牌收回来，得看我们的安全焦虑什么时候有人帮忙解决。\n\n中方口信递到了，但伊朗给不给面子、给多少面子，眼下还打着问号。\n\n沙特最寒心的地方还在后面。就在利雅得求美国出手的同时，美国官员正在阿曼首都马斯喀特跟胡塞代表私下会面。\n\n据也门方面的消息人士披露，胡塞在会上向美方承诺继续遵守2025年5月达成的红海停火协议，不动美国船只，不动以色列以外多数国家的商船。\n\n有一条例外——沙特的船不在保护范围内。这层意思，明眼人一看就懂。\n\n美国和胡塞私下里的这层默契，把沙特架在了火上烤。\n\n一位海湾国家官员对西方记者说的原话是：“特朗普打的这场仗，账单却压到了我们头上。”\n\n沙特王室花大价钱买美国武器，把石油定价权交给美元，换来的却是盟友在背后跟自己的敌人做交易。这种滋味，估计比丢了几个岛还难受。\n\n石油美元的裂缝就从这里往外冒。过去几十年，石油、美元、美军这三样咬合成一个闭环。\n\n美国给沙特兜底安全，沙特用美元结算石油，美元借此坐稳全球储备货币的位置。\n\n现在胡塞用几十枚导弹就让美国选择袖手旁观，这份“兜底”值多少钱，市场已经开始重新估价了。答案很朴素：不值原来那个价了。\n\n数据也在说话。业内的一个观察是，截至2026年上半年，美元在中东石油结算里的占比已经跌破六成，几年前这个数字还稳定在九成以上。\n\n德意志银行的分析师在近期报告里写过一句话：伊朗冲突有可能成为石油美元瓦解、石油人民币时代开启的催化剂。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 沙特安全依赖失效：小萨勒曼两度致电特朗普求援遭拒，美方明确不愿在也门投入地面力量。胡塞武装十日之内夺取曼德海峡关键岛屿，直接威胁沙特红海石油出口备份通道（东西管道—延布港），叠加霍尔木兹方向伊朗施压，沙特石油出口“两头挨堵”，8月产量跌至三十年新低。\n2. 求助转向北京：利雅得在英、法、巴基斯坦、埃及均无法提供拦截弹后，通过外交渠道请中国向伊朗传递口信，要求约束胡塞、保障能源通道。中国以非胁迫方式斡旋，依托的是对伊朗石油出口（占其海运原油八成以上）的实际影响力。\n3. 美国“背后交易”暴露盟友裂痕：美方一边拒绝沙特，一边在马斯喀特与胡塞密谈，胡塞承诺不袭击美国船只，但沙特船只不在保护范围内。\n\n影响分析\n\n这一事件标志着中东安全架构出现结构性松动。美国对沙特的“安全兜底”承诺实质性贬值，石油—美元—美军闭环出现裂缝：中东石油结算中美元占比已跌破六成。沙特被迫将安全诉求部分转向北京，中国则获得一个不以军事存在为前提的斡旋支点。但伊朗将胡塞视为安全博弈筹码，中方口信能否转化为实际约束仍存变数。核心趋势是：海湾国家安全自主性上升，石油人民币结算的催化剂效应正在显现，而美国在中东的信誉折损，可能比胡塞的导弹更具长期杀伤力。",
  "no": 158
 },

  "lede": "2026年9月的中东，最刺眼的一幕不在战场，在电话线上。\n\n沙特王储小萨勒曼给白宫连打两通电话，都没得到自己想要的答案。转过头，他把求助信号发到了北京。\n\n多家外媒披露，小萨勒曼在9月上旬先后拨通了特朗普的专线。第一通是通报也门局势，第二通直接开口，请求美军出手打击胡塞武装。特朗普拒绝了。\n\n白宫给出的理由很硬：美国当前的焦点是伊朗，不会把地面部队投进也门。沙特花了几十年、砸了几千亿美元在美制武器上，换来的却是一句“帮不上忙”。\n\n沙特为什么这么急？答案在曼德海峡。9月10日前后，胡塞武装拿下也门西海岸重镇穆哈港，紧接着夺取丕林岛和哈尼什群岛，整条红海南部海岸线易手。\n\n胡塞用不到十天，就把这条全球最忙碌的水道之一攥在了手里。\n\n丕林岛上现在飘的是胡塞的旗帜，导弹和无人机可以直接压制航道。这不是骚扰，是把刀架在了脖子上。\n\n \n\n这刀砍到沙特的什么地方？砍到了石油出口的备份通道。\n\n伊朗自2026年2月底与美以爆发冲突后，一直在霍尔木兹海峡制造压力。\n\n沙特绕开霍尔木兹的备用路线，就是那条横穿国土、日输送能力约500万桶的东西输油管道，出口终点在红海边的延布港。\n\n红海这头被胡塞卡住，管道那头又不太平，沙特的石油等于两头挨堵。\n\n8月产量掉到日均600万桶，创下三十多年来的新低。\n\n \n\n胡塞的火力还压到了沙特本土。\n\n9月8日，胡塞用弹道导弹加无人机同时打了阿卜哈、海米斯穆谢特、吉赞、纳季兰四座沙特南部城市。吉赞的下游工业园区和一处空军基地被命中，多处石油设施起火，几十人受伤。\n\n沙特南部边境线上，天天有警报响。这已经不是2015年刚开战那种小打小闹的水平了。\n\n \n\n沙特也不是没找过其他人。海湾几名官员透露，利雅得先后向法国、英国、巴基斯坦、埃及递过话，希望对方支援拦截弹和技术人员。\n\n可惜这几年红海上空的胡塞导弹雨，把西方的库存全耗空了。五角大楼在国会作证时都承认，“爱国者”和“萨德”的先进拦截弹存在短缺。\n\n沙特要的不是同情心，是能打下来无人机的实弹。这个东西现在西方谁都拿不出富余的。\n\n \n\n问了一圈，利雅得只剩一个选项。能让胡塞真正收手的钥匙，握在德黑兰手里。能让德黑兰听得进去话的人，在北京。\n\n9月中旬，路透社援引三名伊朗消息人士的说法，沙特已经通过外交渠道向中国求助。\n\n北京随后通过非公开管道向伊朗方面递了口信，希望伊朗动用对胡塞的影响力，别让冲突扩散到中国最看重的能源通道上。\n\n \n\n为什么找中国？账很清楚。大宗商品数据公司Kpler统计，2025年中国买家占到了伊朗海运原油出口的八成以上，日均约140万桶。\n\n伊朗被美国制裁压得喘不过气，能续命的钱袋子基本靠对华石油贸易。\n\n一位驻中东的西方资深外交官直言，北京是全球屈指可数还能对德黑兰施加实际影响的角色之一。这话听着朴素，含金量却很高。\n\n中方递信的方式也很讲究。9月中旬，伊朗外长阿拉格齐访问北京，与王毅外长举行了会谈。\n\n三位伊朗消息人士没有确认口信是否就是在这次会晤上当面交的，但时间点摆在这里，谁都看得懂。\n\n整个过程里，中方没有丢出任何威胁，也没有暗示要动用经济手段施压。这是一种典型的非胁迫式斡旋，靠的是共同利益，不是大棒。\n\n \n\n伊朗那边给出的公开回应带着弦外之音。\n\n德黑兰表示，地区的稳定和和平，前提是美国与以色列停止对伊朗的战争。翻成大白话就是：胡塞是我们手上不多的牌，什么时候把这张牌收回来，得看我们的安全焦虑什么时候有人帮忙解决。\n\n中方口信递到了，但伊朗给不给面子、给多少面子，眼下还打着问号。\n\n \n\n沙特最寒心的地方还在后面。就在利雅得求美国出手的同时，美国官员正在阿曼首都马斯喀特跟胡塞代表私下会面。\n\n据也门方面的消息人士披露，胡塞在会上向美方承诺继续遵守2025年5月达成的红海停火协议，不动美国船只，不动以色列以外多数国家的商船。\n\n有一条例外——沙特的船不在保护范围内。这层意思，明眼人一看就懂。\n\n \n\n美国和胡塞私下里的这层默契，把沙特架在了火上烤。\n\n一位海湾国家官员对西方记者说的原话是：“特朗普打的这场仗，账单却压到了我们头上。”\n\n沙特王室花大价钱买美国武器，把石油定价权交给美元，换来的却是盟友在背后跟自己的敌人做交易。这种滋味，估计比丢了几个岛还难受。\n\n \n\n石油美元的裂缝就从这里往外冒。过去几十年，石油、美元、美军这三样咬合成一个闭环。\n\n美国给沙特兜底安全，沙特用美元结算石油，美元借此坐稳全球储备货币的位置。\n\n现在胡塞用几十枚导弹就让美国选择袖手旁观，这份“兜底”值多少钱，市场已经开始重新估价了。答案很朴素：不值原来那个价了。\n\n \n\n数据也在说话。业内的一个观察是，截至2026年上半年，美元在中东石油结算里的占比已经跌破六成，几年前这个数字还稳定在九成以上。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 沙特安全依赖失效：胡塞武装十天内控制红海南部海岸线，直接威胁沙特绕开霍尔木兹的延布港输油通道，沙特石油产量跌至三十年新低。美国拒绝出手，沙特转向中国求助。\n2. 中国成为关键斡旋方：中国占伊朗海运原油出口八成以上，是少数能对德黑兰施加实质影响的力量。中方以非胁迫方式递话，要求伊朗约束胡塞，避免冲突波及能源通道。\n3. 美沙信任裂痕加深：美国一边拒绝沙特，一边与胡塞在马斯喀特私下接触，且沙特船只不在停火保护范围内。石油-美元-美军的安全闭环出现结构性松动。\n\n影响分析\n\n此次事件标志着中东安全架构的一次实质性位移。沙特数十年来的“石油换安全”模式遭遇根本性质疑——当胡塞导弹落在沙特本土、红海航道被掐断时，美制武器的堆积并未转化为有效保护，而美国选择与沙特的对立面做交易，进一步动摇了利雅得对华盛顿的战略信任。\n\n中国则借此展示了另一种介入路径：不靠军事存在，而靠经济相互依赖施加影响。这一模式能否真正让伊朗收手尚待观察，但北京已成功将自己定位为中东安全事务中不可绕过的角色。\n\n更深层的影响在金融层面。美元在中东石油结算中的占比跌破六成，是石油美元体系松动的量化信号。若沙特的安全焦虑持续无法通过美国解决，其推动非美元结算、多元化安全伙伴的动力将显著增强，中东地缘格局与全球货币秩序可能同步进入重构期。",
  "no": 159
 },

  "lede": "坦荡的雪莉\n\n利雅得机场附近出现火焰和浓烟，也门胡塞武装称袭击沙特首都。也门的胡塞武装声称，他们用导弹和无人机袭击了沙特首都利雅得的“敏感”地点。就在数小时前，有人目击到利雅得主要机场附近升起火焰和浓烟。\n\n胡塞武装没有具体说明在利雅得的袭击目标，但称还攻击了红海城市延布的一处沙特阿美设施。延布是沙特重要的石油出口枢纽。胡塞武装称，此次行动是对也门首都萨那遭袭的回应。\n\n与胡塞武装交战的沙特主导军事联盟表示，其防空系统在周六凌晨拦截并摧毁了一枚射向利雅得的导弹，时间以利雅得当地时间计。该联盟在声明中还表示，已挫败针对沙特西南部城市比什和法拉桑、西部城市塔伊夫，以及红海沿岸城市延布的袭击。声明中未提及是否造成损失。\n\n沙特民防部门当天凌晨通过手机向利雅得及首都以东的哈拉季市发送警报，提醒防范空袭风险；周六上午又解除警报。媒体记者在利雅得奥拉亚地区听到爆炸声，随后收到解除警报的通知。美伊战争今年爆发后，利雅得曾多次发布类似警报；但自7月与胡塞武装冲突升级以来，这是首次发布警报。\n\n胡塞武装控制着也门人口最密集的地区及北部大部分区域。该组织在7月宣布对利雅得实施海上封锁后，持续袭击沙特阿拉伯，目标包括红海上的沙特船只。这些袭击波及沙特城市、能源基础设施和航运，对全球石油供应构成新的威胁。在霍尔木兹海峡仍遭封锁的情况下，海湾地区经红海运输的主要替代航线也面临风险。\n\n土耳其外交部长哈坎·菲丹表示，鉴于胡塞武装持续发动袭击，沙特阿拉伯可能需要军事支持。土耳其已准备依据一项与巴基斯坦在内的三方防务协定提供协助。\n\n目前尚不清楚土耳其可能提供何种支持。菲丹在接受土耳其NTV电视台采访时称，沙特的需求可能涉及“一些技术问题”。这项三方协议上月签署，规定对三国中任何一国的武装攻击，都将被视为对三国的攻击。\n\n胡塞武装军事发言人叶海亚·萨雷周五称，该组织已挫败萨那发生的若干未具体说明的“犯罪企图”，并将此归咎于沙特阿拉伯，表示将作出回应。这个与伊朗结盟的组织本月早些时候通过快速推进控制了也门整段红海海岸线。该组织称，近几天来沙特空军已对其发动数百次空袭。\n\n胡塞武装与沙特阿拉伯的战事，已成为更广泛战争中的新冲突战场。这场战争始于2月底美国和以色列对伊朗的打击。美国总统唐纳德·特朗普拒绝了沙特阿拉伯要求美国直接军事介入、打击胡塞武装的请求。\n\n伊朗最高国家安全委员会秘书穆赫辛·雷扎伊周六接受媒体采访时表示，德黑兰希望沙特阿拉伯与胡塞武装之间的战争结束，并称他相信也门人同样希望与沙特达成和解。雷扎伊还表示，伊朗已通过调解人向美国传达重启停滞谈判的条件，其中包括“结束所有战线上的战争”。他说，与卡塔尔和巴基斯坦调解人的磋商仍在继续，德黑兰正等待特朗普的回应。\n\n联合国安理会周五发表声明，“以最强烈的措辞谴责胡塞武装持续袭击沙特阿拉伯王国，包括影响民用和能源基础设施的袭击。这些袭击已造成平民受伤，其中包括妇女和儿童”。安理会在声明中还谴责“胡塞武装在也门的军事升级”。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 冲突升级：胡塞武装首次自7月冲突升级以来对利雅得发动导弹/无人机袭击，目标涵盖首都“敏感地点”及红海石油枢纽延布的阿美设施，沙特防空系统称已拦截。\n2. 战略意图：胡塞武装明确将袭击定性为对沙特空袭萨那的报复，且其本月已控制也门全段红海海岸线，具备更强的对沙海上封锁与远程打击能力。\n3. 外部博弈：土耳其表态可能依三方防务协定向沙特提供军事支持；伊朗释放和谈信号但设条件；美国拒绝直接介入，联合国安理会发最强谴责。\n\n影响分析\n\n此次袭击标志着也门战事从边境摩擦升级为对沙特核心经济与民用目标的直接打击，红海航运与全球石油供应链风险陡增——在霍尔木兹海峡仍受封锁的背景下，沙特经红海的替代出口路线同样受威胁，油价与航运保险成本面临上行压力。土耳其的介入表态若落地，可能将冲突从代理人战争推向多国直接对抗，进一步复杂化地区安全架构。伊朗“促和”姿态与胡塞武装持续袭击之间存在明显张力，反映德黑兰在施压与谈判之间的双重策略。联合国谴责虽具象征意义，但缺乏执行机制，短期内难以遏制军事升级。整体来看，该事件将也门冲突更深地嵌入美伊博弈与红海安全危机之中，地区局势正从“多点摩擦”向“系统性风险”演变。",

  "lede": "大国之翼\n\n美国跟伊朗的军事冲突又传出突发情况！9月21日凌晨，Al-Arabiya网报道披露，在华盛顿与德黑兰的言辞升级之际，伊朗军队于周日晚间宣布，又在霍尔木兹海峡上空击落了一架美军所属的“欧比特”侦察无人机。这是今年2月份美伊开战以来，伊朗击落的第54架美国军用无人机。\n\n根据伊朗军队官方透露的消息，该无人机在当地时间18:30被革命卫队使用本土防空系统击落并摧毁，伊朗通讯社“伊朗通讯社”援引其报道称，该无人机被击落的地点位于该国东南部的霍尔木兹海峡上空。\n\n3天前即9月18日,俄罗斯卫星通讯社报道，伊朗革命卫队表示，在波斯湾伊朗基什岛上空击落一架美国MQ-9无人机，建功的也是革命卫队新型改进的防空系统。\n\n眼看着美军损失日益增加，美国方面有点气急败坏，总统特朗普更是公开撂下狠话要让伊朗付出代价。Al-Arabiya网另一篇报道披露，在美伊双方紧张局势不断升级、以及相互威胁的背景下，美国总统特朗普在接受媒体采访时突然表示，“关于伊朗，很快就会发生大事”。\n\n特朗普表示“正在就伊朗做出决定。”而摆在他面前共有3 个选项：“消灭伊朗”，让其“经济腐烂”，或者达成“协议和交易”。特朗普还向伊朗当局发出了新的警告，暗示“可能炸毁整个伊朗”。\n\n跟伊朗开战至今，美军的伤亡总数已经接近千人，其中伤者数量增至820人。经济损失更是令人咂舌。9月18日，俄罗斯塔斯社报道，美国对伊朗进行军事行动的成本已达到约436亿美元的天价。其中直接用于保障军事行动物资供应和补充军械库的支出占据了主要份额，约280亿美元专门用于消耗的高精度弹药、防空系统拦截导弹和巡航导弹。\n\n面对特朗普“炸毁整个伊朗”的威胁，伊朗方面也是强硬回应。伊朗联合战斗部队指挥部在早些时候表示，德黑兰收到了美国正准备恢复军事行动的消息，并警告称“任何美国的袭击都将招致对美国基地和利益的持续打击”。\n\n伊朗最高国家安全委员会秘书长雷扎伊也强调，只有在满足伊朗的7项条件后，才有可能恢复谈判。伊朗议会主席巴格尔•卡利巴夫表示，他的国家通过中间人将条件转达给了美国， “除非这些条件得到满足，伊朗人民的合法权利得到承认，以及美国的承诺得到履行，否则将没有任何途径重返先前的谈判条件或恢复霍尔木兹海峡的开放。”\n\n伊朗武装部队哈塔姆安比亚中央总部发布消息称，如果美国决定再次攻击伊朗，伊朗将对所有代表美国在中东利益的基地和设施发动打击。伊朗方面还警告中东地区各国，如果他们加入美国的侵略，将无法指望伊朗武装力量对他们保持克制。",
  "deep": "## AI 解读\n\n# 美伊冲突升级：无人机消耗战背后的战略僵局\n\n核心要点：\n\n1. 战场态势：伊朗在霍尔木兹海峡再击落一架美军无人机，自2月开战以来累计击落54架，革命卫队新型防空系统持续建功，显示伊朗本土防御能力未被削弱。\n2. 美方困境：美军伤亡近千人、军事开支达436亿美元，特朗普抛出“消灭/经济窒息/达成协议”三选项，威胁“炸毁整个伊朗”，但选项本身即暴露战略两难。\n3. 伊方底线：伊朗提出7项复谈条件，警告将打击所有美军中东基地，并威慑地区国家不得配合美方行动。\n\n影响分析：\n\n当前美伊已陷入典型的“消耗战僵局”。伊朗以低成本防空系统持续消耗美军高价值资产，436亿美元的开支与近千伤亡正在侵蚀美国国内政治耐心。特朗普的“三选项”表态实质是战略焦虑的投射——“消灭伊朗”意味着全面战争的高昂代价，“经济腐烂”需要漫长周期，而“协议”又面临伊朗7项条件的门槛。伊朗则通过“打击所有美军基地”的威慑，试图将冲突成本外溢至整个中东，迫使地区国家向华盛顿施压。短期内，双方均缺乏决定性军事手段，冲突将维持“低烈度、高频率”的无人机攻防与言辞升级模式。真正的风险在于误判：一次造成美军重大伤亡的袭击，可能迫使特朗普从威胁滑向有限打击，而伊朗的“持续打击”承诺将使地区美军基地网络面临系统性压力。霍尔木兹海峡的航运安全与全球油价将成为下一阶段博弈的敏感传导点。",

  "title": "安理会秘密投票，中美俄激烈交锋后，联合国秘书长选举将爆冷？",
  "src": "Exa 搜索",
  "lede": "勇士军武闲谈\n\n在这里，听见中国走向世界的号角\n\n9月18日，联合国秘书长选举迎来关键节点，第三轮意向性投票展现了复杂的竞争格局。\n\n尽管格林斯潘暂居领先，但中俄的“劝阻”立场为选举增添变数，而罗德里格斯-伯基特与格罗西等人也在全力争取关键支持。\n\n随着联合国大会即将召开，最终拉票进入白热化阶段，大国博弈的主旋律依然未变。\n\n谁能在五常的算计中突围而出？选举结果会否打破现有预测，带来意想不到的结局？\n\n根据外界拼凑的结果，在第三轮意向性投票中，蕾韦卡·格林斯潘以9票“鼓励”领先其他候选人，引发了普遍关注。\n\n这位来自哥斯达黎加的女性，曾担任该国副总统，现任联合国贸易与发展会议秘书长，以其突出的经济与发展领域经验，一路从低调候选人跃升为“领跑者”。\n\n她的领先并不足以令人安心，反而恰恰暴露了她最大的障碍：中俄联手给出了“劝阻”票。\n\n对于格林斯潘的争议，焦点在于她与以色列的特殊关系。\n\n作为一个犹太家庭的后代，她的姐姐早已定居以色列，其侄辈还有曾在以军服役的经历；此外，以色列政府公开支持她参选，这引发了一些国家对她未来在巴以问题上中立性的不信任。\n\n尤其是中东国家的态度或成为关键，而中俄作为拥有一票否决权的安理会常任理事国，显然要综合考虑与阿拉伯国家关系的影响。\n\n此外，联合国秘书长除了需要在国际经济议题上发挥作用，还必须在俄乌冲突、中东和平等“硬安全”领域表现出公正与强势的调解能力，而格林斯潘在这些领域的经验明显较为单薄。\n\n更为棘手的是，如果中俄在接下来的正式投票中坚持反对，格林斯潘将彻底与秘书长之位失之交臂，尽管她在意向性投票中落后的国家支持率相对较少，但安理会的“一票否决”决定了领先并不等于胜出。\n\n从这里看，她的领先更像纸上谈兵，突破中俄态度的制约，是她的竞选生涯中最大的难题。\n\n伯基特与格罗西是目前的焦点候选人，一位是拉美多边主义的倡导者，另一位则是深受美国青睐的“亲西方技术型人才”。\n\n但无论投票结果还是势头，两人的竞选充满不确定性。\n\n伯基特在第二轮曾领先，却在第三轮投票中因6票“劝阻”显出乏力，他以推动多边主义和气候合作著称，7月访华时重申支持一个中国原则，努力争取发展中国家的支持。\n\n部分常任理事国对小国候选人的“天然不信任”以及中东国家的犹豫，使他的选情更为复杂。\n\n相比之下，美国更倾向于支持格罗西。格罗西因在福岛核废水、伊核协议、乌东核安全等议题上的表现深得西方青睐，但也因此在中俄眼中显得“西方化”过重。\n\n此外，作为阿根廷人，他还因马岛争端可能遭英国反对。\n\n尽管格罗西在国际核能领域的专业能力毋庸置疑，但地缘政治争端可能成为他迈向秘书长职位的最大障碍。美国的策略同样值得关注。\n\n第一轮投票时，华盛顿支持格林斯潘，试图切断智利前总统巴切莱特的竞选空间。\n\n在巴切莱特因美方施压退选后，美国显然选择赌注押在格罗西身上，但能否打破安理会内复杂的平衡，仍是未知数。\n\n在这场大国力量对抗的拉锯战中，区域与性别的“象征性突破”始终成为联合国内部讨论的背景议题。\n\n这反映的不仅是候选人的关系复杂，更是整个拉美地缘在全球外交棋局中影响力不足的缩影。\n\n此外，围绕非洲候选人，如塞内加尔前总统萨勒等的有限支持，也让这场选举继续被五常主导。\n\n在更大的国际舆论领域中，虽然出现越来越多关于“选出首位女性秘书长”的呼声，但以推动全球安全为核心的联合国，仍在优先考虑怎样能找到那个能平衡五常利益、同时又不失执行力的候选人。\n\n对于这场选举，在许多分析人士看来，根本不只是单一候选人脱颖而出的问题，而是如何在五常的巨大撕裂中找到一条狭窄的纵向通道。\n\n在所有候选人都面临某些常任理事国强烈排斥的时候，“妥协者”反倒可能成为最终的赢家。值得注意的是，各方一直绕不开的“地缘政治”和“一票否决”问题，在现阶段的这种动荡国际局势中会被进一步放大。\n\n大国在乌克兰问题、中东冲突以及对其他全球性议题上的分歧，很可能会直接牵扯到这场选举的最终调性。\n\n联合国秘书长的选举从来都少不了“最后时刻的反转”，这一次也不例外。\n\n从意向性投票的波动和各国分歧来看，大概率会有更多候选人在下一轮之前被迫“体面退出”，而最终胜出的那位，可能不会是最响亮的名字，而是那个在中美俄欧之间找到最微妙平衡点的人。\n\n如果真的爆冷，那也多半是拉丁美洲范围内的最终妥协。\n\n安理会最终的决议，无论是谁胜出，都将成为一次世界格局的缩影。而这场选举的每一张票，或许都暴露了五常之间的真实态度和全球未来的权力博弈逻辑。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n联合国秘书长遴选进入第三轮意向性投票，格林斯潘以9票“鼓励”暂时领跑，但中俄联手投下“劝阻”票，实质上已亮明否决底牌。其障碍集中在两点：一是犹太背景及以色列公开支持引发阿拉伯国家对其巴以中立性的质疑；二是在俄乌、中东等“硬安全”议题上经验单薄。伯基特第二轮领先、第三轮遭6票“劝阻”势头回落；格罗西获美方青睐，却因“西方化”色彩过重及马岛争端面临中俄与英国的潜在阻力。\n\n影响分析\n\n此次选举的本质不是候选人竞争，而是五常撕裂格局下的“可接受性测试”。意向性投票的领先毫无决定性意义——安理会一票否决权决定了任何被任一常任理事国排斥的候选人直接出局。当前大国在乌克兰、中东议题上的深度对立，正被完整投射到秘书长人选的筛选中，候选人被迫在“专业能力”与“大国容忍度”之间做取舍。值得关注的是，性别与区域代表性（尤其是拉美与非洲）虽被反复提及，但在五常利益面前始终是次要变量。最终胜出者大概率不是声量最大的名字，而是能在中美俄欧之间找到最窄平衡通道的“妥协型”人选。若出现爆冷，最可能的形式是拉美阵营内部重新整合后推出的折中方案。这场选举将成为观察未来数年大国协调机制是否仍具弹性的关键窗口。",

  "lede": "周一（北京时间9月21日）亚市早盘，现货黄金交投于4373美元/盎司附近，金价受益于油价走低缓解了市场对通胀压力持续的担忧，日内或再决战4400美元/盎司关口；美原油交投于95.87美元/桶附近，尽管伊朗态度依然强硬，但市场预期胡塞武装减弱对沙特石油基础设施的袭击，且据悉，美方称已准备好与伊朗进行谈判，日内美原油或测试95美元/桶关口。 \n\n## 股市\n\n 美股上周五交投平淡，道琼斯工业指数下跌0.18%，收报51682.64点；标普500指数上涨0.17%，收报7650.50点；纳斯达克指数上涨0.40%，收报26522.55点，标普500指数11大板块中，科技板块涨幅最大，公用事业板块跌幅最大。 上周交易大致分为两个阶段：市场先是在美联储如普遍预期加息前焦躁等待，随后消化加息决定。半导体股上涨提振纳斯达克指数和标普500指数，但大盘普遍走弱，拖累道琼斯工业指数收低。 周线来看，标普500指数微跌，道指创下3月以来最大单周百分比跌幅。Horizon Investment Services首席执行官Chuck Carlson表示，投资者到周末已被周内动荡弄得筋疲力尽，因此谨慎行事；许多投资者不仅在评估美联储行动的短期影响，还在考虑其长期影响以及如何影响股票和固定收益投资，在外部事件可能导致周一市场剧烈波动的环境下，不愿在周末前押注任何方向。 芝商所FedWatch工具显示，金融市场目前预计美联储在10月会议上再次加息的概率为55.4%。 伯克希尔哈撒韦宣布沃伦·巴菲特将卸任董事长并出任名誉董事长，九个月前他已将首席执行官职位交给Greg Abel，该公司股价当日微跌。 Xenon Pharmaceuticals股价暴跌30.7%，此前有报告称其用于治疗重度抑郁症和双相抑郁症的试验性药物出现副作用，该公司随后暂时停止相关临床试验招募受试者。 \n\n## 金市\n\n 金价上周五升至一周高点，并录得四周来首次周线上涨，现货黄金收涨0.84%，收报4378.29美元/盎司，因油价走低缓解了市场对通胀压力持续的担忧。 EverBank全球市场总裁克里斯·加夫尼表示，油价回落减轻了通胀压力，因为原油一直是整体通胀的主要驱动因素，贵金属投资者此前预期美联储将加息而大举建立空头头寸，试图从预期中的黄金抛售中获利，这些头寸已迅速平仓。 油价下跌在一定程度上缓解了通胀担忧，但中东供应受到冲击的风险仍是市场主要关切。美元升至逾七周高点，使黄金对其他货币持有者而言更加昂贵。 美联储上周将利率上调25个基点，并暗示未来数月还将进一步加息；芝商所FedWatch工具显示，交易员目前预计美联储在10月下次会议上再次加息的概率为55%。尽管黄金传统上被视为对冲通胀的工具，但利率上升会使生息资产更具吸引力，从而削弱黄金的吸引力。 与此同时，上周印度黄金需求疲软，因买家预期价格将走低而暂缓购买；中国黄金溢价则持稳，受到强劲投资需求支撑。加夫尼表示，黄金目前正在测试每盎司4400至4440美元附近的阻力位，若能突破这一阻力位，金价进一步上涨的空间可能打开。 现货白银上涨1.61%，收报每盎司66.24美元；铂金上涨2.2%，至每盎司1812.50美元；钯金上涨1.5%，至每盎司1310.20美元，这三种贵金属均录得周线上涨。 \n\n## 油市\n\n 油价上周五下跌，美原油下跌5.56%，收报95.47美元/桶，布伦特原油下跌0.83%，收报103.20美元/桶，因市场预期胡塞武装减弱对沙特石油基础设施的袭击。 过去几周，随着美国和伊朗恢复相互攻击，与伊朗结盟的胡塞武装也加大军事行动力度，油价稳步上涨；近期军事行动加之全球炼油产能问题，推高了主要市场柴油等关键燃料价格。 美国汽车协会（AAA）数据显示，目前美国零售柴油价格为每加仑6.45美元，创历史新高，零售汽油均价为每加仑4.47美元，而往年此时汽油价格通常正在下降。 炼油数据提供商IIR Energy上周五表示，预计美国本周在产炼油产能将减少37.1万桶/日。Price Futures Group高级分析师Phil Flynn表示：“目前的问题不在供应，而在炼油环节。” 分析师表示未来数月前景仍不明朗；摩根大通表示，自美国和以色列今年2月开始对伊朗发动战争以来，该行首次无法为石油市场确定清晰的基线情境。霍尔木兹海峡仍基本处于封锁状态，上周五公布的初步航运数据显示，周四仅有四艘大宗商品运输船通过该海峡，低于约16艘的10日平均水平。 彭博上周五援引知情人士报道称，沙特阿美已通知至少两家欧洲炼油客户，在沙特通往红海的关键输油管道遭袭后，他们下个月将无法收到原油供应。沙特阿拉伯与伊朗支持的也门胡塞武装周四隔着边境再度相互发动袭击，随着中东战争蔓延并对供应构成新威胁，也门民众乘船进入红海躲避战火。 \n\n## 汇市",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 油价大幅回落，通胀预期降温：美原油单日暴跌5.56%至95.47美元，主因市场预期胡塞武装对沙特石油设施的袭击将减弱，叠加美方释放与伊朗谈判信号。但炼油环节瓶颈（美国柴油零售价创6.45美元/加仑历史新高）仍是结构性矛盾。\n2. 黄金获喘息，冲击4400关口：油价走低缓解通胀担忧，前期押注美联储加息而建立的黄金空头迅速平仓，金价升至一周高点4378美元，周线四周来首次上涨。\n3. 美联储加息阴影未散：10月再加息概率55.4%，美元升至七周高点，压制黄金上行空间。\n4. 中东地缘风险持续：霍尔木兹海峡通航量骤降至4艘（10日均值16艘），沙特阿美已通知欧洲客户下月断供，供应端风险未消。\n\n影响分析\n\n短期看，油价回落为风险资产提供喘息窗口，但这一缓解具有脆弱性——炼油产能瓶颈与霍尔木兹海峡封锁意味着供应冲击随时可能逆转。黄金正处于4400-4440美元关键阻力测试期，突破则打开上行空间，反之将受制于美元走强与加息预期。美股呈现\"半导体强、大盘弱\"的分化格局，投资者在美联储长期路径不明与中东局势外溢风险下趋于谨慎。核心矛盾在于：通胀压力是否真正缓解，取决于地缘溢价能否持续消退，而非单日油价波动。",

  "lede": "可能不止一两次！美联储鹰声再起 华尔街为更多加息做准备\n\n 2026年09月21日 07:13 智通财经APP\n\n 华尔街正在从美联储的言辞中寻找蛛丝马迹，为今年可能出现的更多加息做准备。美联储在上周一致投票决定将联邦基金利率目标区间上调25个基点至3.75%—4%，以遏制通胀。这是美联储自2023年7月以来首次加息。与此同时，最新点阵图显示，美联储政策路径正在朝着“更高、更久”的方向调整——2026年底联邦基金利率中值预测升至4.1%，且多数官员支持年内至少再加息一次。\n\n 投资者目前预计，美联储10月再次加息的可能性超过50%。信安资产管理全球固定收益部门首席投资官迈克尔·古赛在接受采访时表示：“这可能不会是加息一两次就结束。”他补充道：“如果他们确实试图通过摧毁需求来控制通胀，那么（加息）力度可能会更大。”\n\n 美联储在政策声明中表示，美国经济活动继续以稳健速度扩张，国内支出保持韧性，生产率增长强劲，资本投资稳健，就业增长与劳动力增长基本同步，失业率变化不大；与此同时，通胀仍处于高位，此次政策行动将有助于推动通胀更及时地回归2%的目标。\n\n 美联储主席沃什在新闻发布会上表示，美联储此次“撤回了一部分宽松政策”，目的是让金融和信贷环境与实现最终政策目标更加一致。他尤其强调，目前仍有太多商品和服务类别的价格以超过3%的年化速度上涨，并称今年夏季的通胀数据并未让他相信潜在通胀趋势已经出现有意义的改善。\n\n 此前一系列通胀数据强化了美联储重新收紧政策的理由。8月核心通胀升幅高于预期，引发市场担忧价格压力可能正在从关税以及能源价格冲击等因素向更广泛领域扩散。美联储最新预测显示，2026年PCE通胀率中值为3.7%，核心PCE通胀率预计为3.4%；更值得关注的是，官员目前预计整体PCE通胀直到2029年才会回到2%，较此前预期进一步推迟。\n\n 从美联储自身释放的信号来看，当前政策重心依然明显集中于控制通胀。官方声明强调，通胀仍处于高位，同时经济活动保持稳健、资本投资强劲、就业市场并未出现明显恶化，这意味着美联储目前仍有空间通过更高利率抑制价格压力。因此，美联储上周25个基点的加息可能并非一次孤立的政策调整。接下来公布的通胀、就业以及能源价格数据，将成为决定美联储是否在今年晚些时候继续收紧政策的关键因素。\n\n 在美联储上周释放出政策可能继续收紧的信号之后，市场很快作出反应。摩根士丹利首席美国经济学家迈克尔·加彭会后将预测调整为总计三次加息——包括上周三这次——高于此前预计的两次。\n\n 高盛经济学家预计美联储下一步将在10月再进行一次25个基点的加息，这改变了该行此前认为9月将是唯一一次加息的预期。该行经济学家们还表示，这次会议比他们预期的更为鹰派，并指出投票结果一致、以及沃什将此次加息描述为“取消了一剂宽松措施”都体现了这一点。\n\n 华尔街资深策略师埃德·亚德尼上周将标普500指数年底目标价从8400点下调至7900点，原因是他预计今年将不止一次加息。亚德尼写道：“风险在于，油价在更长时间内维持高位，将继续推动债券收益率走高。”他暗示，美联储此次加息可能只是一个加息周期的开始。他表示：“油价维持高位的时间越长，通胀根深蒂固的风险就越大，尤其是在经济保持韧性的情况下。”\n\n 相比之下，美国银行股票策略师萨维塔·苏布拉马尼安认为标普500指数将迎来更好的入场点。她指出：“我们正在进入一个季节性疲软时期，在我们看来，市场已经到了应该出现回调的时候。”该机构预计美联储今年还将在10月和12月分别各加息一次，并将标普500指数年底目标价小幅上调至7400点，意味着较当前水平约有3%的下跌空间。\n\n 华尔街策略师指出，尽管面临多重不利因素，包括债券收益率、油价上涨以及美元走强，但标普500指数依然表现强劲。Horizon首席投资官斯科特·拉德纳表示：“如果其中一些不利因素开始缓解，而我们又保有这样的盈利能力，那我们会非常期待第四季度的到来。”拉德纳表示，投资者应该关注“AI资本支出向下游传导效应的第二阶段”，例如基础设施相关企业，这些公司可能从第四季度的相关支出中受益。\n\n 此外，在利率走高的环境下，摩根大通资产管理公司全球市场策略师乔丹·杰克逊建议“在成长股和价值股之间保持健康的均衡配置”。他还更青睐大盘股而非小盘股，因为小盘股对利率上升更加敏感。\n\n责任编辑：郭建",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 政策转向确认：美联储自2023年7月以来首次加息25bp至3.75%-4%，点阵图显示2026年底利率中值升至4.1%，多数官员支持年内至少再加息一次，政策路径明确转向“更高、更久”。\n2. 通胀顽固超预期：8月核心通胀高于预期，美联储预测PCE通胀2029年才回归2%，较此前预期大幅推迟，沃什明确表示夏季数据未显示潜在通胀趋势有实质改善。\n3. 华尔街集体上修：摩根士丹利将加息预测从两次上调至三次，高盛、美银均预计10月、12月各加一次，市场定价10月加息概率超50%。\n4. 资产端已现反应：亚德尼下调标普500年底目标至7900点，美银给出7400点，均指向估值承压。\n\n影响分析\n\n美联储此次加息并非孤立调整，而是新一轮紧缩周期的起点。在经济增长稳健、资本投资强劲的背景下，美联储拥有继续收紧的空间，核心矛盾在于通胀回落速度远慢于预期，且压力正从关税、能源向更广泛领域扩散。对市场而言，利率“更高更久”意味着估值端持续承压，成长股与小盘股首当其冲，债券收益率与油价高位共振将进一步压缩风险偏好。策略上，建议均衡配置成长与价值、偏好大盘股，并关注AI资本开支向下游基础设施传导的第二阶段机会。后续通胀、就业及能源价格数据将决定加息节奏，市场波动率大概率上行。",

  "lede": "据天泉新闻于2024年08月26日 17时05分01秒发现，尾盘回暖沪深股指小幅收涨热点，A股三大股指8月26日集体小幅高开。早盘指数分化，但超3900股半日收涨。午后两市依旧窄幅震荡，尾盘走强带动沪指成功转涨。\n\n从盘面上看，锂电池产业链爆发，西部大基建、液冷服务器、基本金属、一体化压铸、消费电子、光伏概念股走强；CPO、仿制药、金融科技题材低迷。\n\n至收盘，上证综指涨0.04%，报2855.52点；科创50指数跌0.48%，报682.5点；深证成指涨0.16%，报8194.65点；创业板指跌0.1%，报1545.31点。\n\nWind统计显示，两市及北交所共3843家上涨，1346家下跌，平盘有162家。\n\n两市成交5265亿元，较前一交易日的5102亿元增加163亿元。其中，沪市成交2168亿元，比上一交易日2146亿元增加22亿元，深市成交3097亿元。\n\n据大智慧VIP，两市及北交所共有66只股票涨幅在9%以上，22只股票跌幅在9%以上。\n\n锂电池爆发，酒类股走低\n\n在板块方面，锂电池爆发，带动电力设备板块领涨两市，鹏辉能源（300438）、天力锂能（301152）、孚能科技（688567）、翔丰华（300890）、盟固利（301487）、圣阳股份（002580）等涨停或涨超10%。\n\n有色金属涨幅居前，东方锆业（002167）涨停，万顺新材（300057）、和胜股份（002824）、海星股份（603115）等涨超5%。\n\n房地产在利好消息刺激下快速走高，阳光股份（000608）、信达地产（600657）、空港股份（600463）等涨超6%。\n\n光模块（CPO）走低，中际旭创（300308）、天孚通信（300394）、太辰光（300570）、光迅科技（002281）等跌超3%。\n\n通信板块走低，菲菱科思（301191）跌超7%，恒信东方（300081）、世纪鼎利（300050）、美信科技（301577）等跌超4%。\n\n酒类股走低，食品饮料跌幅靠前，养元饮品（603156）跌超8%，西麦食品（002956）、妙可蓝多（600882）、承德露露（000848）等跌超3%。\n\n市场转机正在逐步孕育\n\n中信证券表示，国内存量政策正有序落地，后续增量政策仍需发力，政策起效仍需观察，外部信号显示美联储降息9月料将落地，下周半年报集中披露期过后，市场情绪有望见底回升，投资者对流动性预期比较敏感，而封闭型公募产品到期开放的规模和实际影响十分有限，预计市场量价继续磨底，当前依然建议聚焦红利与出海两条主线，待市场拐点出现后再转向绩优成长和内需主线。\n\n中信建投证券指出，市场转机正在逐步孕育。中报披露期即将过去，市场将完成盈利预期下修，同时美联储9月降息信号强烈，若配合国内政策加码发力信号，市场有望打开向上空间。短期除高胜率的稳定红利资产和中报超预期且景气持续方向，亦可关注中报利空落地后基本面预期改善方向。中期而言，重视产能周期变化，企业承受供给投放压力最大阶段将逐步过去，从A股资本开支和供给周期看，环境将类似2012—2013年。重点关注：银行、电力、汽车、家电、半导体链、军工、互联网等。\n\n华西证券认为，市场量能大幅萎缩反映多空双方博弈力量均出现衰减，A股地量往往对应短期地价。8月以来A股成交持续缩量后，市场存在阶段反弹的可能，海外流动性转向宽松或成为短期催化。中长期来看，还要考虑指数估值、盈利预期变动和风险溢价的修复情况。当前A股估值处于历史低位，风险溢价处于高位，企业盈利则仍处于磨底阶段，投资者需对居民预期改善的节奏保持耐心，耐心等待增量政策催化。配置上，“科技+红利”的“哑铃型”策略仍适用当下A股。具体行业配置上，建议关注：电子、电力、运营商、铁路公路、银行等。\n\n中金公司指出，展望后市，虽然投资者信心修复仍需更多积极因素累积，但当前市场下行风险有限，5月中下旬至今A股市场持续调整已有三个月左右，阶段性调整时间不短，且2021年以来的累积调整幅度较深；从交易情绪维度，以自由流通市值计算的换手率降至1.5%的历史底部水平；估值层面，沪深300股息率相比10年期国债利率超出1个百分点以上，已具备较好的估值吸引力；此外，外围市场压力也有所缓解，美国9月降息预期进一步抬升，人民币汇率进入双向波动状态。综上，当前市场已具备较多底部特征，也有部分积极信号开始显现，后续重点关注国内货币和财政政策逆周期调节力度。\n\n### 联系我们\n\n在线咨询：\n\n微信号：79111873\n\n工作日：9:30-18:30，节假日休息",
  "deep": "## AI 解读\n\n核心要点提炼：\n\n8月26日A股三大指数窄幅震荡，尾盘回暖小幅收涨。沪指涨0.04%报2855.52点，深成指涨0.16%，创业板指微跌0.1%。两市成交额5265亿元，较前日小幅放量163亿元，但整体仍处地量水平。全市场3843家上涨，赚钱效应偏暖。盘面分化显著：锂电池产业链爆发领涨，西部大基建、有色金属、房地产等走强；CPO、通信、酒类股走低。多家券商发布后市研判，普遍认为市场处于磨底阶段，转机正在孕育。\n\n影响分析：\n\n当前市场的核心矛盾在于“地量”与“地价”的博弈。成交额连续萎缩至5000亿级别，换手率降至历史底部，表明多空双方博弈力量均已衰减，这既是市场情绪冰点的信号，也往往对应阶段性底部的形成条件。锂电池板块的爆发具有指向性意义——作为产能周期调整最深的行业之一，其反弹暗示市场开始定价“供给出清”逻辑，这与中信建投提出的“环境类似2012-2013年”判断相呼应。\n\n积极因素正在累积：美联储9月降息预期升温，人民币汇率压力缓解，为国内货币政策打开空间；中报披露期结束后，盈利预期下修将告一段落。但需注意，市场从“底部特征具备”到“趋势性反转”仍需增量政策催化，当前券商一致推荐的“红利+科技”哑铃策略，本质上反映了市场在方向明朗前的防御性配置心态。投资者需耐心等待政策信号与情绪共振的拐点。",

  "title": "美联储卡什卡利：通胀仍然过高 且正蔓延至美国经济各个角落_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "美联储卡什卡利：通胀仍然过高 且正蔓延至美国经济各个角落\n\n 2026年09月21日 06:32 智通财经APP\n\n 明尼阿波利斯联储主席尼尔·卡什卡利表示，通胀率仍然过高，而且通胀压力已经超出中东战争引发的油价冲击范围。卡什卡利在接受采访时表示：“美国民众每天感受到的通胀远不只是油价上涨——它已经蔓延至经济的方方面面。”\n\n 美联储在上周一致投票决定将联邦基金利率目标区间上调25个基点至3.75%—4%，以遏制通胀。这是美联储自2023年7月以来首次加息。美联储在政策声明中表示，美国经济活动继续以稳健速度扩张，国内支出保持韧性，生产率增长强劲，资本投资稳健，就业增长与劳动力增长基本同步，失业率变化不大；与此同时，通胀仍处于高位，此次政策行动将有助于推动通胀更及时地回归2%的目标。\n\n 沃什在新闻发布会上表示，美联储此次“撤回了一部分宽松政策”，目的是让金融和信贷环境与实现最终政策目标更加一致。他尤其强调，目前仍有太多商品和服务类别的价格以超过3%的年化速度上涨，并称今年夏季的通胀数据并未让他相信潜在通胀趋势已经出现有意义的改善。\n\n 此前一系列通胀数据强化了美联储重新收紧政策的理由。8月核心通胀升幅高于预期，引发市场担忧价格压力可能正在从关税以及能源价格冲击等因素向更广泛领域扩散。美联储最新预测显示，2026年PCE通胀率中值为3.7%，核心PCE通胀率预计为3.4%；更值得关注的是，官员目前预计整体PCE通胀直到2029年才会回到2%，较此前预期进一步推迟。\n\n 美联储官员越来越担心，通胀并不仅仅局限于受到中东冲突或关税影响的领域。卡什卡利表示，有证据显示服务业同样存在通胀压力。他表示，将通胀降至目标水平是美联储的职责，而美联储拥有实现这一目标的工具。\n\n 卡什卡利是7月份反对维持利率不变决定的三名官员之一，当时他更倾向于加息。他当时曾警告称，如果等待太久才加息，可能会面临通胀根深蒂固的风险，并迫使美联储采取更加激进的行动。\n\n 此外，卡什卡利表示，尽管面临地缘政治冲突和贸易问题，美国经济依然表现出很强的韧性，劳动力市场也依然强劲。卡什卡利还表示：“我希望，随着其中一些冲突逐渐退居幕后，经济增长能够真正接管局面，并希望推动通胀下降。希望通胀降温能够占据主导，这将让美联储的工作容易得多。”\n\n 从美联储自身释放的信号来看，当前政策重心依然明显集中于控制通胀。官方声明强调，通胀仍处于高位，同时经济活动保持稳健、资本投资强劲、就业市场并未出现明显恶化，这意味着美联储目前仍有空间通过更高利率抑制价格压力。\n\n 更重要的是，与此前市场一度期待沃什上任后推动降息不同，最新点阵图显示，美联储政策路径正在朝着“更高、更久”的方向调整：2026年底联邦基金利率中值预测升至4.1%，且多数官员支持年内至少再加息一次——观察美联储未来政策操作的最新点阵图显示，18名提交利率预测的官员中，有16人预计年内至少还会再加息一次。与此同时，通胀回归2%目标的时间被推迟至2029年。\n\n 这意味着，本周25个基点的加息可能并非一次孤立的政策调整。接下来公布的通胀、就业以及能源价格数据，将成为决定美联储是否在今年晚些时候继续收紧政策的关键因素。\n\n责任编辑：郭建",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 通胀性质转变：卡什卡利明确警告，通胀已从油价、关税等外部冲击演变为全面性压力，服务业价格同样承压，意味着潜在通胀趋势恶化。\n2. 政策转向确认：美联储加息25bp至3.75%-4%，为2023年7月以来首次，点阵图显示16/18位官员支持年内至少再加息一次，2026年底利率中值升至4.1%。\n3. 预期显著恶化：2026年核心PCE预测达3.4%，整体PCE回归2%目标的时间推迟至2029年，较此前预期大幅延后。\n\n影响分析\n\n美联储正从\"等待观察\"转向\"主动压制\"，政策路径明确指向\"更高、更久\"。通胀广谱化意味着单靠供给端改善难以解决问题，利率需在限制性区间维持更长时间。对市场而言，降息预期需进一步后撤，美债收益率曲线有上移压力，美元短期获支撑。风险在于：若加息过度而经济韧性被高估，2027年可能面临增长骤降与政策转向滞后的双重冲击。后续通胀与就业数据将成为决定是否继续收紧的关键变量。",

  "lede": "据天泉新闻于2024年11月12日 08时31分08秒发现，美股三大指数集体收涨 特斯拉涨近9%热点，每经编辑：毕陆名\n\n美东时间周一，美股三大指数集体收涨，道指涨0.69%，标普500指数涨0.1%，纳指涨0.06%；均续创历史新高。特斯拉涨近9%，创下四年来最大五日涨幅，总市值1.12万亿美元，升至美股第七位。\n\n与此同时，加密货币概念股大涨，嘉楠科技涨超41%，MicroStrategy涨超25%，Coinbase涨超19%。\n\n截至发稿，比特币突破8.8万美元，续刷新高，24小时内涨超7500美元或9.5%，总市值逾1.72万亿美元。\n\n国际原油期货结算价大幅收跌。WTI 12月原油期货收跌2.3美元，跌幅3.32%，报68.04美元/桶。布伦特1月原油期货收跌2.04美元，跌幅2.76%，报73.87美元/桶。\n\n纽约金日内跌超65美元/盎司，最新报2628.9美元/盎司。纽约银日内跌近2%。\n\n消息面上，近期美联储降息落地，叠加特朗普胜选后华尔街认为美联储未来降息步伐将有所放缓，美元维持强势，黄金白银持续承压。\n\n## 美股三大指数均创历史新高\n\n美东时间周一，美股三大指数均续创历史新高，截至收盘，道指涨0.69%，标普500指数涨0.1%，纳指涨0.06%。\n\n热门科技股涨跌不一，特斯拉涨近9%，创下四年来最大五日涨幅，市值一夜大增923亿美元（约合人民币6672亿元），总市值1.12万亿美元，升至美股第七位。自11月4日收盘起算，特斯拉5个交易日大涨44.25%。\n\n奈飞、谷歌涨超1%；英特尔跌超4%，苹果、英伟达、微软、Meta跌超1%，亚马逊小幅下跌。\n\n比特币突破8.8万美元，续刷新高，24小时内涨超7500美元或9.5%，总市值逾1.72万亿美元。加密货币概念股大涨，嘉楠科技涨超41%，MicroStrategy涨超25%，Coinbase涨超19%。\n\n渣打银行预计，比特币将持续上涨并且在年底冲击10万美元，预计到2026年底，加密货币市场的总市值将从目前的2.5万亿美元增长到10万亿美元。\n\n纳斯达克中国金龙指数收涨0.59%，热门中概股多数上涨，小鹏汽车涨超5%，理想汽车涨近3%，京东、阿里巴巴涨超1%。爱奇艺跌超1%，高途跌超5%。\n\n消息面上，在特朗普上周胜选后，引发了市场对通胀的担忧。华尔街的经济学家和策略师下调对美国明年降息的预期。他们表示，特朗普的政策可能会刺激通胀并改变美联储的利率路径。\n\nIG市场策略师Yeap Jun Rong表示：“特朗普当选总统直接导致2025年之前的降息预期有所降低，潜在的‘红色浪潮’意味着对他的减税和支出计划的抵制很小，再加上他对提高关税的立场。”\n\n华尔街交易员现在认为，美联储在12月降息25个基点的可能性为68%，而特朗普获胜前的可能性约为83%。\n\n交易员们正在重新调整预期，美联储可能会将2024年的最终利率降至更接近3.5%的水平，而不是此前预期的3.0%。\n\n根据美联储决策者在9月份会议上发布的较长期经济预测显示，彼时决策者们平均预期，到2025年底，目标政策利率将在3.25%至3.5%，这远低于目前的4.5%至4.75%区间。\n\n但是，芝商所FedWatch工具显示，截至本周一，美联储12月维持利率不变的概率达到31.2%，高于一周前的20.0%；同时，美联储从现在到2025年6月仅降息25个基点或维持现有利率不变的可能性之和已飙升至为24.5%，而在美联储9月会议当天这一可能性为零。\n\n## 继续狂飙！特斯拉股价大涨\n\n截至收盘，特斯拉涨近9%，创下四年来最大五日涨幅。随着特斯拉股价节节攀升，其市值超过台积电，升至美股第七位。\n\n当前，市场看多特斯拉情绪浓厚。\n\n据证券时报报道，华尔街投资机构Wedbush Securities分析师丹·艾夫斯（Dan Ives）将特斯拉目标价从300美元上调至400美元。美国银行分析师将特斯拉的目标价从265美元上调至350美元，并维持买入评级。\n\n此外，数据显示，韩国散户正在大力买入美股，而最受韩国投资者欢迎的股票是特斯拉。截至上周，韩国个人投资者总共持有167亿美元的特斯拉股票。\n\n另一边，做空特斯拉的对冲基金损失惨重。据S3 Partners编制的数据，在美国大选日11月5日至上周五收盘期间，做空特斯拉的对冲基金账面损失至少为52亿美元。追踪500多家对冲基金头寸的Hazeltree提供的每周数据显示，截至11月6日，只有7%的对冲基金净做空特斯拉，低于7月初的17%。\n\n回顾上周，特斯拉股价连续攀升，周内大涨29%，市值突破1万亿美元大关，马斯克本人的身家也时隔3年重新站上3000亿美元，稳坐全球首富之位。\n\n每日经济新闻综合证券时报、公开信息\n\n### 网友看法",
  "deep": "## AI 解读\n\n# 美股新高背后的结构性分化：特斯拉与加密狂飙，传统资产承压\n\n核心要点提炼：\n\n1. 美股三大指数续创新高，但涨幅微弱（道指0.69%、标普0.1%、纳指0.06%），显示市场上行动能高度集中而非全面扩张。\n2. 特斯拉五日暴涨44%，市值升至美股第七，受华尔街集体上调目标价及韩国散户大举买入推动，空头损失惨重。\n3. 比特币突破8.8万美元，加密概念股集体飙升，渣打银行看多至年底10万美元。\n4. 原油、黄金、白银同步大跌，美元维持强势，降息预期显著降温。\n\n影响分析：\n\n当前市场的核心矛盾在于特朗普胜选后的政策预期重构。市场正在定价一个\"高通胀+慢降息+强美元\"的组合：减税与关税政策推升通胀预期，12月降息概率已从83%降至68%，2025年终端利率预期从3.0%上修至3.5%。这一组合利好风险资产中的成长叙事（特斯拉、加密货币），却对大宗商品形成系统性压制——原油受需求担忧与强美元双杀，黄金则因实际利率预期上行而承压。\n\n值得警惕的是，市场集中度风险正在积聚。指数新高由少数标的驱动，特斯拉与加密板块的暴涨带有强烈的情绪溢价特征。一旦降息路径进一步收紧或政策落地不及预期，高估值板块的回调弹性将远超大盘。投资者需关注12月FOMC会议前的预期博弈窗口。",

  "title": "鲍威尔罕见“放鸽” 哪类资产将受益 - 天泉新闻",
  "src": "Exa 搜索",
  "lede": "文/《清华金融评论》王茅\n\n美联储主席鲍威尔在全球央行年会上罕见“放鸽”，指出现在政策已经明显处于限制性区域，如果经济前景和风险的天平开始转向，我们就得相应地调整政策。市场认为美联储将在9月降息的概率重回90%以上。鲍威尔的言论，有利股市、有色金属、加密货币等。\n\n鲍威尔“放鸽”，市场一片欢腾 \n\n北京时间 8 月 22 日晚 10 点，在万众瞩目的美国怀俄明州 杰克逊霍尔全球央行年会上，美联储主席鲍威尔罕见地为降息打开了大门，发表了 “鸽派”言论。 \n\n鲍威尔明确指出，现在政策已经明显处于限制性区域，如果经济前景和风险的天平开始转向，我们就得相应地调整政策。鲍威尔还放弃“平均通胀目标制”，回归灵活通胀框架，更注重就业与通胀平衡，删除了“就业短缺”表述，允许就业适度超预期而不立即收紧政策。 \n\n鲍威尔的此番讲话，让市场认为美联储将于9月降息的概率重新站在90%上方，市场还预计2025年美联储将累计降息75—100个基点。\n\n美股三大指数全线收高，道琼斯指数涨1.89%，标准普尔500指数涨1.52%，纳斯达克指数涨1.88%。美国科技七巨头指数涨2.04%，中概股普遍走高。国际金属期货普遍收涨，COMEX黄金期货涨1.05%报3417.20美元/盎司，COMEX白银期货涨2.10%报38.88美元/盎司。比特币、以太坊分别涨超1%和7%。\n\n鲍威尔讲话主要观点 \n\n一是政策转向信号。鲍威尔明确表示，“风险平衡变化可能要求调整政策”，指出就业面临的下行风险正在上升，劳动力市场处于“供需同步放缓的脆弱平衡”。他强调，当前政策利率处于“限制性”区间，为降息提供空间。 \n\n二是通胀与关税影响。鲍威尔承认关税推高部分商品价格（7月核心PCE同比涨2.9%），但判断其影响可能是“一次性冲击”，而非持续性通胀。他警告需警惕两大风险，那就是关税延长调整周期，以及通胀预期脱锚引发工资—价格螺旋上涨。 \n\n三是美国经济数据疲软。2025年上半年美国GDP增速放缓至1.2%（2024年为2.5%），消费支出显著减弱；7月非农就业增长骤降至月均3.5万（前值16.8万）。他指出，美国失业率虽然稳定在4.2%的低位，但裁员风险上升。 \n\n四是货币政策框架调整。取消2020年“平均通胀目标制”，回归灵活通胀目标框架，不再承诺“通胀超调补偿”。新框架要求平衡双重使命（就业与通胀），强调政策无预设路径，完全依赖数据驱动。 \n\n鲍威尔言论对哪类资产有利\n\n美联储降息将利好以下资产：一是股市。美股中的科技/成长股收益，它们是利率敏感型板块，如特斯拉、英伟达等；A股及港股将获益，美联储降息预期增强，资金回流A股和港股预期增强。 \n\n二是黄金等有色金属。黄金等有色金属以美元计价，美联储将降息，美元指数将走低，这将刺激黄金、白银、铜、铝等有色金属（大多工业属性与货币属性并存）的价格走高，当然黄金、铜、铝等类股也将上扬。 \n\n三是加密货币。比特币、以太坊等加密货币，在宽松的流动性、风险偏好提升的推动下，也会迎来一波上涨行情。 \n\n鲍威尔此次“鸽派”转向直接推升全球风险资产价格，尤其利好中美股市及加密货币。9月降息已成高概率事件，投资者应关注通胀数据及就业报告变化。对中国市场而言，外部担忧缓解叠加估值优势，或持续吸引外资流入。\n\n注：本文“鲍威尔言论对哪类资产有利”的段落，只是对投资的一些观点，不构成任何投资建议。\n\n编辑丨王茅\n\n审核 | 丁开艳\n\n责编丨兰银帆‍\n\n### 网友看法\n\n1、网友股帮：当下对于A股市场来说，关注5日线支撑得失。5日线支撑不破，跌破5日线支撑，关注60日线附近以及成交量的变化。为强势，同时关注市场情绪面。从基本面来看，这次的10年创新高的牛市行情，应该算是水牛，目前稍有想象力的科技股市盈率基本都在100倍以上，目前对科技股的操作基本不看市盈率、市净率，只看想象力，之前一直给大家推荐的芯片板块也已经大涨，透支未来数年的业绩，从对股民负责任的角度分析，目前可以从涨幅过大的科技股切换到市盈率低且没有涨过的板块，如国家一直倡导的消费、有强烈补涨预期的旅游免税板块等。 最好的策略依然是波段持股待涨！中美贸易谈判取得突破、美国9月预期降息等利好的加持，对于大盘的走势，维持之前的观点，今年总体震荡上行。 股股帮近三十年股市投资感悟，股市繁荣的关键是： 1. 建立健全的上市制度和退市制度体系，完善投资者赔偿制度，优化入口、出口环节，通过市场化来不断优化上市队伍；2. 完善上市制度管理体系，让优秀的上市公司进来，保持良好的投资回报率，吸引海内外投资机构，形成正反馈，让进入股票市场的资金源源不断流入进来，股票市场要想发展，资金是最最重要的推手。3.制定严格大股东减持制度，健全投资者保护制度。",
  "deep": "## AI 解读\n\n# 鲍威尔“放鸽”深度解读：政策拐点已至，风险资产迎来重估窗口\n\n核心要点\n\n鲍威尔在杰克逊霍尔年会释放三重信号：一是明确政策处于限制性区间，为降息打开空间，9月降息概率重回90%以上；二是放弃“平均通胀目标制”，回归灵活框架，删除“就业短缺”表述，意味着美联储对就业超预期的容忍度提升；三是承认经济数据疲软——上半年GDP增速降至1.2%，7月非农骤降至月均3.5万，就业下行风险已取代通胀成为主要关切。本质上，这是一次从“抗通胀优先”向“稳就业优先”的框架切换。\n\n影响分析\n\n短期看，降息预期直接利好利率敏感型资产：科技成长股、黄金等有色金属、加密货币均获流动性溢价。但需注意两点：其一，市场已抢跑定价，若后续通胀数据反复，预期修正将引发波动；其二，对中国市场而言，外部流动性压力缓解叠加A股估值优势，外资回流逻辑增强，但国内基本面修复节奏仍是主导变量。中期看，美联储框架调整意味着货币政策更趋数据依赖，资产定价将从“降息交易”转向“衰退与软着陆的博弈”，投资者需密切关注就业与通胀的边际变化。",

  "lede": "2026-09-21 風暴雷達 0 0 0 \n\n# 🌍 全球金融风暴每日监控报告\n\n2026年9月21日 · 数据截至 2026-09-21 00:02:03\n\n## 1️⃣ 当前风暴等级\n\n🌥️ 临近级（10分/31项指标）\n\n8-12分 — 大量指标集体亮红灯，风暴轮廓可见\n\n异动指标\n\n6\n\n严重1个\n\n跨类别共振\n\n4\n\n13个类别中\n\n风暴评分\n\n10\n\n临近级\n\n指标采集\n\n31/31\n\n成功率\n\n### 📊 风暴等级说明\n\n| 等级 | 分数 | 说明 | 建议 |\n| --- | --- | --- | --- |\n| 🟢 萌芽级 | 1-3分 | 个别指标波动，正常范围 | 维持基本监控，无需过度反应 |\n| 🟡 酝酿级 | 4-7分 | 部分指标异动，风险在积聚 | 检查组合结构，增加对冲工具 |\n| 🟠 临近期 | 8-12分 | 大量指标集体亮红灯，风暴轮廓可见 | 大幅收缩敞口，启动防御 |\n| 🔴 爆发级 | 13+分（含趋势加速/共振加分） | 多系统全面告警，系统性风险迫在眉睫 | 现金为王，优先保证生存 |\n\n#### 📋 等级说明\n\n🌥️ 临近期（10分）：大量指标集体亮红灯，风暴轮廓可见。大幅收缩敞口，启动防御。\n\n## 2️⃣ 大白话解读 & 投资建议\n\n💡 当前市场处于临近级风险（10分），6个指标异动，涉及4个领域。\n\n席勒市盈率达到41.09，处于严重异动状态，这是需要重点关注的风险点。\n\n10Y美债收益率为4.94，出现异动信号，值得持续监控。\n\n30Y美债收益率为5.29，出现异动信号，值得持续监控。\n\nLME伦铜为14,550.49，出现异动信号，值得持续监控。\n\n日元兑美元为156.86，出现异动信号，值得持续监控。\n\n实际利率10Y-TIPS为2.61，出现异动信号，值得持续监控。\n\n📌 临近级信号下，建议控制仓位、增配避险资产。\n\n## 3️⃣ 日环比追踪 · 今日 vs 昨日\n\n对比区间: 2026-09-20 → 2026-09-21\n\n| 指标 | 方向 | 变动 | 昨日 | 今日 |\n| --- | --- | --- | --- | --- |\n| 10Y美债收益率 | ➡️ | +0.00% | 4.94 | 4.94 |\n| 30Y美债收益率 | ➡️ | +0.00% | 5.29 | 5.29 |\n| 2Y美债收益率 | ➡️ | +0.00% | 4.67 | 4.67 |\n| 美债10Y-2Y利差 | ➡️ | +0.00% | 0.2700 | 0.2700 |\n| 布伦特原油 | ➡️ | +0.00% | 99.69 | 99.69 |\n| 离岸人民币CNH | ➡️ | +0.00% | 6.69 | 6.69 |\n| LME伦铜 | ➡️ | +0.00% | 14,550.49 | 14,550.49 |\n| 美元指数DXY | ➡️ | +0.00% | 100.30 | 100.30 |\n\n⬆️ 0个恶化 / ⬇️ 0个改善 / ➡️ 31个持平\n\n### 🔴 严重异动\n\n| 类别 | 指标 | 当前值 | 状态 |\n| --- | --- | --- | --- |\n| 估值 | 席勒市盈率 | 41.09 | 🔴严重 |\n\n### 🟡 异动\n\n| 类别 | 指标 | 当前值 | 状态 |\n| --- | --- | --- | --- |\n| 美债利率 | 10Y美债收益率 | 4.94 | 🟡异动 |\n| 美债利率 | 30Y美债收益率 | 5.29 | 🟡异动 |\n| 工业商品 | LME伦铜 | 14,550.49 | 🟡异动 |\n| 汇率 | 日元兑美元 | 156.86 | 🟡异动 |\n| 估值 | 实际利率10Y-TIPS | 2.61 | 🟡异动 |\n\n✅ 正常指标（点击展开）\n\n| 类别 | 指标 | 当前值 | 状态 |\n| --- | --- | --- | --- |\n| 美债利率 | 2Y美债收益率 | 4.67 | ✅正常 |\n| 美债利率 | 美债10Y-2Y利差 | 0.2700 | ✅正常 |\n| 能源商品 | 布伦特原油 | 99.69 | ✅正常 |\n| 汇率 | 离岸人民币CNH | 6.69 | ✅正常 |\n| 汇率 | 美元指数DXY | 100.30 | ✅正常 |\n| 流动性 | 银行超额准备金 | 2,854,690.00 | ✅正常 |\n|   "deep": "## AI 解读\n\n# 深度解读：风暴“轮廓可见”，但尚未“登陆”\n\n核心要点提炼\n\n1. 风险等级升至“临近期”（10/31）：31项指标中6项异动、4类跨域共振，系统已从“酝酿”切换至“防御”模式。\n2. 估值端是唯一“严重”信号：席勒市盈率41.09，处于历史极端区间，意味着美股长期回报预期被大幅透支，这是本轮风暴的“震源”。\n3. 利率与汇率双高企：10Y美债4.94%、30Y美债5.29%，实际利率2.61%，叠加日元贬至156.86，全球美元流动性收紧与套息交易反转风险并存。\n4. 环比全线持平：31项指标无一恶化或改善，说明市场处于“高位僵持”——风暴轮廓可见，但触发机制尚未点火。\n\n影响分析\n\n当前格局的本质是“高估值+高利率+高汇率”三重挤压。席勒PE突破41，历史上仅1999年互联网泡沫与2021年流动性盛宴可比；而美债长端收益率逼近5%，意味着无风险利率对权益估值的压制已从“逆风”转为“重压”。日元156.86是套息交易的关键阈值，一旦突破前高，可能触发大规模平仓，进而放大全球波动。\n\n对A股而言，外部流动性收紧与风险偏好收缩构成短期压制，但人民币汇率6.69保持稳定，资本外流压力可控。策略上，建议将仓位降至中性以下，增配黄金、短久期美债及现金类资产，等待风暴信号从“持平”转向“恶化”或“改善”的明确方向后再做右侧决策。",

  "src": "Exa 搜索",
  "lede": "宇树最新发布了一款身高180厘米、名为Unitree H2的机器人，行动敏捷、优雅，显示出新款机器人在运动灵活性上取得重大提升。\n\n20日，宇树在其发布的视频中，揭示了这款“芭蕾舞者”机器人部分关键信息。该机器人在视频中模仿了芭蕾舞演员，并流畅地完成武术等复杂动作，显示其具备出色的平衡与控制能力。这是继H1、G1和R1之后，宇树公开的第四款人形机器人产品。\n\n尽管该公司尚未公布速度、负载等完整性能参数，但已披露的自由度数量和其所强调的“敏捷”特性，已引发市场对该机器人运动性能的广泛关注。这一新品的推出，不仅是宇树技术能力的展示，更是其“全尺寸、全场景、全价位”市场战略深化的明确信号，旨在通过更细分的产品矩阵抢占更多市场份额。\n\n## 技术升级：自由度跃升至31个\n\n据发布前的预热海报信息，H2在技术参数上的一大关键升级是其全身自由度（DOF）达到了31个。这一数字较同为180cm身高的H1基础版提升了63%，主要增加了手臂和腰部的自由度，使其上肢拥有了几乎媲美人类的冗余运动能力。\n\n自由度的提升意味着机器人能实现更灵活、更复杂的动作。据量子位分析，H2的自由度配置可能为“单腿6个、腰部3个、单臂7个、颈部2个”，这种设计需要更强的动力系统和更先进的运动控制算法来支持全身协调。\n\n从关键参数看，H2的定位十分明确。其180cm的身高，在当前具身智能浪潮中属于全尺寸人形机器人的“天花板”级别，与小鹏的Iron、天工Ultra等产品处于同一梯队。\n\n在更为关键的自由度指标上，H2的31个自由度虽然未及市场上最高的机型，例如包含灵巧手在内拥有81个自由度的天链T1 Pro，但已稳固进入30个自由度上下的主流“第二梯队”。这一梯队聚集了特斯拉的擎天柱（30个）、智元机器人的灵犀X2探索版（31个）以及逐际动力的LimX Oli（31个）等众多实力强劲的竞争者。这表明，宇树科技正以具有竞争力的技术规格，直接对标行业头部企业。\n\n10月以来，智元、宇树和Figure都发布了最新机器人，现在就等特斯拉了!\n\n## 加速产品细分，巩固市场版图\n\n“芭蕾舞者”的加入，使宇树的人形机器人产品矩阵更加完善，标志着公司正将其产品线从通用型向更精细化的应用领域拓展。此前，宇树已拥有H1、G1、R1等多款人形机器人。公司正在将其成功的机器狗产品线策略复制到人形机器人领域，即构建“全尺寸+全场景+全价位”的产品矩阵。\n\n在此战略下，不同产品将针对不同应用场景。例如，H1更偏向工业应用，而官方用“敏捷、优雅”来形容的H2，则可能瞄准科研开发、娱乐互动或更精细的服务场景。通过在同一尺寸下进行功能细分，并持续探索to B应用场景和下探to C价格门槛，宇树正试图在市场全面铺开，以技术积累和产品化能力抢占市场份额。\n\n这一战略背后，是公司对机器人未来角色的深刻思考。据报道，宇树创始人王兴兴曾表示，公司在ChatGPT出现后才正式启动人形机器人项目，其核心目标是“让机器人干活”。在最近一次公开采访中，他甚至提出“当机器人能大量创造价值时，国家可以对其征税”。\n\n### 网友看法\n\n1、网友飞雪连天：机器人只有小脑不够啊，还要聪明的大脑，对外界的环境自主做出反馈。\n\n2、网友星看影视：都是卧龙电驱提供的电机吗\n\n3、网友is李：nb\n\n4、网友覃州：[赞][赞][赞]\n\n5、网友东方红曰升空：【79岁曹德旺安排儿子接班，接班学是富家旺族长盛不衰必修课 - 今日头条】 点击链接打开 \n\n### 联系我们\n\n在线咨询：\n\n微信号：79111873\n\n工作日：9:30-18:30，节假日休息",
  "deep": "## AI 解读\n\n# 宇树H2发布：技术跃升与战略卡位的双重信号\n\n核心要点：\n\n1. 技术参数显著升级：H2身高180cm，全身自由度达31个，较H1基础版提升63%，增量主要集中于手臂和腰部，上肢运动能力接近人类冗余水平。这要求更强的动力系统与运动控制算法支撑全身协调，技术门槛明显抬升。\n\n2. 产品矩阵加速细分：H2是宇树第四款人形机器人，定位从H1的工业场景向科研、娱乐、精细服务延伸，标志着宇树正将机器狗领域“全尺寸+全场景+全价位”策略复制至人形赛道。\n\n3. 竞争卡位意图明确：31个自由度使H2进入特斯拉擎天柱、智元灵犀X2等所在的30自由度主流梯队，宇树以对标头部企业的技术规格抢占市场话语权。\n\n影响分析：\n\n短期看，H2的“敏捷优雅”定位填补了宇树在精细服务场景的产品空白，但完整性能参数尚未公布，实际落地能力仍待验证。中期看，10月以来智元、宇树、Figure密集发布新品，行业已进入产品迭代加速期，特斯拉的下一步动作将成为关键变量。值得关注的是，宇树通过自由度分层实现同尺寸下的功能差异化，这一策略若能跑通，将为国产人形机器人的商业化路径提供重要参照。但正如网友所言，“小脑” agility之外，“大脑”的自主环境反馈能力才是决定天花板的核心瓶颈。",

  "lede": "机器之心报道\n\n机器之心编辑部\n\n物理 AI，已经能让人产生错觉了？\n\n这是机器人还是真人？\n\n从昨天到今天，全球大半个互联网都在讨论小鹏的人形机器人 IRON。\n\n大家的「福尔摩斯」本能瞬间觉醒。\n\n小红书网友热议，发布会上步态演示的机器人，其实是真人 + 皮套。\n\n不过，面对铺天盖地的讨论，小鹏似乎一点也不慌。在一个网友评论：「100% 真人在里面」的下面，何小鹏回应道：「感谢认可。」\n\n11 月 6 日，小鹏汽车在广州新总部举行 AI Day 2025，正式宣布 —— 这不再只是造车公司，而是一家 AI 公司。\n\n基于自研的 Xpeng VLA 2.0 大模型，小鹏衍生出一整套 AI 定义的应用，最新一代人形机器人 IRON 一出场，旋即引发大量讨论。\n\n小鹏在机器人领域已深耕 7 年。从最早的四足形态一路进化，如今终于来到完全类人的阶段。\n\nIRON 拥有全新的「类人骨骼结构」、仿生肌肉系统以及「全覆盖柔性皮肤」，机械感大幅降低，观感更接近真实的人类。\n\n上一代 IRON 就能实现相对平稳的行走，而且据称既非预编程、也非远程操控。而这一次，走得更稳、更自然，甚至带点气场—— 虽然官方没细说是不是后台控制，但仅凭现场那几步，就足够让人印象深刻。\n\nIRON 身高约 1.78 米，比 1X 的 NEO 等公司的机器人更高些，体重达到 70kg。\n\n双手使用微型谐波关节，拥有 22 个自由度（DOF），仅比人类少 5 个。这意味着它已经能完成一些复杂的日常动作 —— 比如叠衣服、擦桌子、整理物品等精细任务。\n\n全身共有 65 个自由度，具备类人脊柱运动能力，比 NEO 还要多出 10 个。\n\n走出如此魔鬼的步伐，显然离不开背后运动「小脑」，虽然官方并未就此给出更多信息。但从上一代机器人的运控和硬件讨论来看，实力不俗。\n\n而从目前官方和网上流传内容看，硬件看起来很厉害。\n\n小鹏人形机器人正在带网友参观总部。来自 x@FredericLambert\n\n有意思的是，不同于 NEO 那种「保守」的击剑教练式造型，IRON 的外观可定制男性或女性特征 —— 通过柔性 3D 网格结构 与 软质皮肤材料，实现拟人的身体曲线与触感。\n\n和 NEO 类似，3D 打印的蜂窝网格织物，既能提供结构强度，又具备足够的柔韧性，触感也很温柔。\n\nIRON 的灵魂来自小鹏自研的 AI 大脑 —— 由 三颗图灵 AI 芯片 驱动，总算力高达 2,250 TOPS。\n\n它整合了 VLT + VLA + VLM 三大认知模型，能在同一套系统内实现视觉感知、语言理解与动作决策，做到所见即所动、所动能交流。\n\n头部采用 3D 曲面显示屏，不仅是「脸」，也是交互界面，实现更自然的人机交流。\n\n新 IRON 使用全固态电池，但尚未公布容量或续航。\n\n一些网友觉得看起来很像 eva 里的莉莉丝，不知道初号机什么时候发布。\n\n相比特斯拉、1X 等高喊 2026 年量产口号的玩家，小鹏显得更为克制。\n\n官方计划 2026 实现 IRON 的量产，但只会在自有商业场景中使用 —— 比如充当展厅导览员、接待员或销售顾问。\n\n事实上，小鹏此前已经尝试过让 IRON 上生产线 —— 任务是拧螺丝。结果发现，机器人干得还不如工人：效率低、维护贵、易损坏。于是，小鹏很现实地认为，暂时不适合规模化生产。\n\n何小鹏也并不避讳这一点。他认为，人形机器人终将进入工厂与家庭，但节奏不会太快。工业应用，大约 3–5 年；家庭普及：约 5–10 年。\n\n因此，明年你在全球的小鹏展厅就能看到 IRON 的身影，它会先作为门店员工上岗。\n\n与此同时，小鹏还将推出 IRON SDK，开放开发接口，邀请第三方共创更多应用场景。首批合作方包括 宝钢集团 等大型企业。\n\n不过在此之外，很多网友呼吁，能不能脱掉衣服再走一遍？你的看法呢？\n\n### 网友看法\n\n1、网友仁爱春风Gu：看胳膊的摆动，每一步都不一样，左右摆动不对称，而且每个胳膊的每次摆动也不同，可以推断是人伪装的。如果是机器的话，基于程序化设计，在平路走路时摆动幅度应该完全一样\n\n2、网友城事小瓦罐：“里面要是真人，这工作也太卷了！不仅要穿紧身衣闷在机器里，还得练猫步、学AI语音，时薪低于500我不干！”\n\n3、网友earthselfliver：真的太牛了，100%机器人，因为我感受不到人类的气息\n\n4、网友自由不如大自在：很简单，外衣全脱或者半脱或者关键部分露出机械，即可自证。\n\n5、网友文观山海：小鹏野心有点大啊，低空飞行，AI，机器人，未来的热门赛道都在布局\n\n6、网友智者千虑：确实是机器人，小鹏这波营销牛逼，故意展示的像真人，让大家吵，等拆开是机器人后，炸裂",
  "deep": "## AI 解读\n\n# 小鹏IRON：一场“恐怖谷”级别的品牌宣言\n\n核心要点提炼：\n\n1. 产品跃迁：IRON身高1.78米、70kg，全身65个自由度、手部22个DOF，搭载三颗图灵芯片（2250 TOPS）与VLT+VLA+VLM三模型融合架构，硬件参数已跻身全球人形机器人第一梯队。\n2. 战略定性：小鹏借AI Day正式宣告从“造车公司”转型为“AI公司”，机器人成为其物理AI叙事的核心载体。\n3. 务实路线：放弃激进量产，2026年仅在自有商业场景（展厅导览、接待）落地，工业应用3-5年、家庭5-10年——与特斯拉、1X的2026量产口号形成鲜明对比。\n4. 舆论焦点：“真人套皮”质疑刷屏，何小鹏以“感谢认可”四两拨千斤回应。\n\n影响分析：\n\n这场“真假之争”本质是一次成功的注意力套利——当公众无法分辨机器人与真人时，技术说服力已不言自明。对行业而言，小鹏用7年积累证明：人形机器人的竞争正从“能不能走”转向“像不像人”，而“像人”带来的恐怖谷效应本身就是最强的传播资产。更值得关注的是其战略克制：先做展厅员工而非工厂工人，既规避了技术不成熟的风险，又以低成本完成真实场景数据闭环。若2026年SDK生态如期开放，小鹏有望在“物理AI入口”争夺中占据先发身位。但挑战同样明确——全固态电池续航未公布、量产成本未知、商业化场景单一，从“惊艳亮相”到“规模盈利”之间，仍隔着一条需要真金白银填平的鸿沟。",

  "lede": "梦在深巷aqa\n\n特朗普要动真格了！\n\n伊朗革命卫队和国防军已进入最高战备状态，美国在中东地区的大使馆和军事基地也进入了最高戒备。老美有可能再度袭击伊朗或也门胡塞，规模可能会很大。有几个信号。\n\n1.2026年9月19日，特朗普于美国东部时间下午6点30分左右离开戴维营，并在晚上7点57分过后不久抵达白宫。\n\n2.美国国务院发布警报，警告伊朗支持的胡塞武装可能袭击沙特阿拉伯的机场，局势或进一步升级。\n\n3.美国驻以色列、阿曼、巴林、伊拉克、黎巴嫩等国的大使馆敦促美国公民保持警惕，或重新考虑旅行计划。\n\n4.以色列总理内塔尼亚胡也缩短了访美行程，并于当天提前返回以色列。\n\n5.19日，五角大楼附近的披萨店当天订单数出现激增。（据美媒此前报道，“披萨指数”通过追踪五角大楼附近披萨店的订单数推测美国国防部是否存在加班，借此预测美国的军事行动。）\n\n特朗普周四表示，伊朗战争正接近“一个重大转折点”。他问道：“我是要介入并彻底消灭他们，还是不要这样做？”\n\n下周是联合国大会，特朗普会和6个王爷国开会，他认为这场七个月的战争可能很快结束。\n\n这一次，老美海空都动了。9月17日，美国海军陆战队向战区网站证实，驻扎冲绳的美军第31海军陆战队远征队被紧急调往中东。\n\n海军陆战队把前沿临时补给点搞到更靠前的位置，目的就一个，给自己和联合部队的飞机加油、补弹，还直接把远程传感站点铺开。\n\n空军方面，美国正在直接摆出大规模攻击的架势，美国空军在中东各地、尤其是伊朗南部附近活动异常频繁。\n\n据报至少七架美国空中加油机正在波斯湾上空作业，数小时前，一架MQ-4C\"特里同\"侦察无人机刚刚完成了一次侦察飞行。伊朗媒体还报道称，阿巴斯港上空出现不明战斗机，不过这一说法尚未获得独立核实。这一轮活动紧接着伊朗中央军事司令部的警告而来——德黑兰称已掌握情报，显示美国可能发动新一轮打击，并威胁要对地区内的美国基地和利益实施报复。同时还警告中东地区各国，如果他们加入美国的侵略，将无法指望伊朗武装力量对他们保持克制。\n\n伊朗方面，据报道，伊朗在过去一小时内向所有武装力量发布最高级别的“100号警报”，涵盖伊朗伊斯兰革命卫队、正规军以及安全部队。\n\n这份警报的下发意味着全军进入临战状态：\n\n1. 作战人员取消休假、全员就位；阵地、雷达、导弹发射单元转入战时值守；情报、防空、远程打击单位全天候待命。\n\n2. 后勤、通信系统切换战时模式，做好随时发起反击、应对空袭的全套准备。\n\n综合来看，美国对伊朗发动新一轮打击的可能性仍然不大，因为华盛顿没有清晰、可达成的目标。但如果真的动手，德黑兰打算打击美国在海湾地区的军事和商业资产（美国企业）——重点在阿联酋、沙特和伊拉克。这一次，伊朗将摘掉手套。该地区没有任何美国资产会被视为它够不着的。\n\n局势来到高危临界点，地区擦枪走火的风险急剧升高。中东又一次站在冲突升级的悬崖边上。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 军事部署实质化：美军海空力量同步前压——第31海军陆战队远征队从冲绳紧急调往中东，至少7架加油机在波斯湾作业，MQ-4C完成侦察飞行。这不是威慑姿态，而是为持续空中打击预置前沿补给与传感节点。\n2. 伊朗进入临战状态：革命卫队与正规军同步启动“100号警报”，取消休假、导弹单元战时值守，并明确威胁打击美国在海湾的商业与军事资产（阿联酋、沙特、伊拉克），首次将美企列为目标。\n3. 外交信号密集：多国使馆预警、内塔尼亚胡提前返以、“披萨指数”异动、特朗普释放“重大转折点”表态，均指向决策窗口正在收窄。\n\n影响分析\n\n当前局势的核心矛盾在于：美方缺乏清晰可实现的战略目标，却已完成大规模打击的战术准备；伊朗则从“战略忍耐”转向“全域报复”姿态，明确将海湾美资纳入打击清单。这意味着一旦擦枪走火，冲突不会局限于伊朗本土，而会迅速外溢至整个波斯湾能源与商业走廊。\n\n对市场而言，霍尔木兹海峡通行风险与海湾美资安全溢价将同步上升，油价与地区保险成本面临重估。更关键的是，伊朗“摘掉手套”的表态打破了此前代理人博弈的默契边界——若美方动手，回应将是对等甚至超限的，而非象征性报复。联合国大会期间特朗普与海湾六国的会晤，将是判断局势走向的关键节点。",

  "src": "Exa 搜索",
  "lede": "## 财联社APP\n\n 财联社官方账号 09.21 08:39 \n\n财联社9月21日讯（编辑 卞纯）在美国总统特朗普周日表示将对伊朗作出重大决定后，作为美伊冲突的主要斡旋方之一，卡塔尔当天表示，美国希望与伊朗达成协议。\n\n综合央视新闻等媒体报道，卡塔尔外交部发言人马吉德·安萨里20日表示，卡塔尔正与美国和伊朗保持沟通，推动美伊恢复谈判。他称，多名美国政府官员表示，美方希望达成协议并结束冲突。\n\n安萨里在美国纽约举行的卡塔尔经济论坛期间表示，过去几周，卡塔尔一直与美国和伊朗交换意见，卡塔尔正努力弥合分歧。但他没有给出恢复谈判的时间表。\n\n> 他说：“我们听到多名美国政府官员表态，确认美国希望达成协议，希望找到结束这场战争的解决方案。”\n\n安萨里表示，任何解决方案都应确保地区稳定，同时推动国际社会就保护包括霍尔木兹海峡在内的战略水道达成共识。他指出，曼德海峡目前也受到地区冲突影响。\n\n> 他补充称：“将水道置于单一国家的主权之下，并将其作为武器使用，将为我们所有人树立一个危险的先例。”\n\n过去几个月，随着美伊冲突持续，卡塔尔与巴基斯坦一道，一直在双方之间进行调解。\n\n特朗普称将对伊朗作出重大决定\n\n在卡塔尔官员发表上述言论之前，美国总统特朗普周日在接受电话采访时表示，美国对伊朗问题正处于“决策阶段”，未来“不久”将发生“非常重大的事情”。\n\n特朗普表示，目前摆在桌面上的选项包括“彻底摧毁伊朗”，让伊朗经济继续恶化，或者达成协议。他还表示，他正在考虑“何时以及是否”对伊朗采取彻底军事行动。\n\n目前尚不清楚特朗普所说的“不久”具体意味着数小时还是数天。\n\n特朗普还表示，对于本周将赴纽约出席联合国大会的伊朗总统佩泽希齐扬，他不排除与对方会面。\n\n目前，国际社会对特朗普在联合国大会上与佩泽希齐扬会晤的可能性高度关注。佩泽希齐扬计划于周三在联合国大会上发表讲话，预计届时将阐述伊朗对国际事态的立场。\n\n针对更广泛的地区敌对行动，特朗普表示，在也门胡塞武装最近对沙特阿拉伯发动弹道导弹袭击后，华盛顿仍与该组织保持密切沟通，并表示该组织已同意避免与美军作战。\n\n与此同时，美国国务院周日发布安全警报称，“由于中东局势紧张，安全环境依然复杂，存在不可预见的局势升级的可能性”。\n\n美国国务院敦促中东地区的美国公民保持警惕，并敦促该地区以外的美国公民重新考虑前往或途经该地区的旅行。\n\n伊朗：美国除接受伊朗条件别无选择\n\n伊朗最高国家安全委员会秘书穆赫辛·雷扎伊9月19日接受卡塔尔半岛电视台采访时表示，伊朗已通过调解方卡塔尔与巴基斯坦向美国方面转达伊朗的谈判条件。伊朗发出的信息明确，即“如果美国希望摆脱其一手造成的困境，并避免越陷越深，那么除了接受伊朗的条件外，别无他途”。\n\n雷扎伊透露，重启谈判的条件包括解冻伊朗被冻结的资金、结束包括黎巴嫩在内的所有战线战争、不得干涉伊朗内政、不得与伊朗国内反对势力勾结、解除对伊朗的海上封锁等内容。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 美方释放双重信号：特朗普称对伊决策进入\"不久将发生重大事情\"的阶段，选项涵盖\"彻底摧毁\"\"经济施压\"与\"达成协议\"三条路径，同时不排除在联大会晤伊朗总统佩泽希齐扬。这种\"极限施压+留谈判窗口\"的组合是典型特朗普式博弈策略。\n\n2. 卡塔尔斡旋角色凸显：卡塔尔与巴基斯坦作为主要调解方，明确传递\"美方希望达成协议\"的信息，并强调霍尔木兹、曼德海峡等战略水道不应被\"武器化\"，指向伊朗以封锁海峡为筹码的核心议题。\n\n3. 伊朗设定前提条件：伊方通过调解方提出解冻资金、结束各战线战争、解除海上封锁等条件，立场强硬但留有谈判空间。\n\n影响分析\n\n短期看，联合国大会期间的\"特佩会\"可能性是最大变量——若成行，将是美伊关系破冰的关键信号；若破裂，军事选项权重上升，中东风险溢价将快速抬升。中期看，卡塔尔斡旋实质是海湾国家为避免战火外溢的自保之举，反映地区盟友对美伊全面冲突的深度忧虑。对市场而言，霍尔木兹海峡通行安全是油价的核心定价因子，任何谈判进展或破裂都将直接传导至能源与避险资产。整体判断：当前处于\"边缘博弈\"窗口期，协议与冲突的概率同时上升，不确定性本身即是最大风险。",

  "title": "特朗普准备下黑手了！硬刚中俄伊难奏效，把压力转向美国盟友？",
  "src": "Exa 搜索",
  "lede": "养牛的大昆\n\n当下的美国外交陷入了极其拧巴的尴尬困境，在全球核心博弈场域接连碰壁、毫无建树，大国博弈的筹码持续流失。\n\n一贯强势的特朗普政府不愿承认战略失利，索性调转枪口，把施压、制裁的手段对准了自家西方盟友，靠“窝里横”维系强硬人设，一场针对盟友的贸易与政治施压风暴已然全面开启。\n\n纵观特朗普本轮执政的外交成绩单，堪称全方位拉胯，在中俄伊三大核心博弈对手面前，几乎没拿到任何实质性优势，反而消耗了美国大量战略资源，国际话语权持续弱化。\n\n俄乌冲突是最典型的缩影。特朗普上台之初高调放话，宣称数周内就能终结冲突、拿捏俄罗斯，可现实狠狠打脸。\n\n冲突持续拉锯，俄军作战态势愈发稳固，乌军多次遭遇阵地失守、指挥所被端的窘境。\n\n美方数次派遣特使穿梭俄乌两国，极限施压、外交斡旋轮番上阵，却始终没能敲定停火框架，俄罗斯完全不买美国的施压套路，战略节奏丝毫未乱。\n\n中东战场的局面同样让美国颜面尽失，为压制伊朗，美国祭出海上封锁、军事空袭等多重手段，试图逼迫伊朗妥协退让。\n\n可结果截然相反，伊朗强势反击，导弹精准打击巴林美军第五舰队总部，这座美军中东核心指挥基地沦为废墟，数十架美军战机受损，军舰遭遇反舰导弹锁定威胁。\n\n美国国防部事后承认损失惨重，特朗普频繁对外造势宣称战事即将落幕，本质上只是无力续战、急于找台阶脱身。\n\n持续多年的中美贸易战，更是让美国搬起石头砸自己的脚。\n\n美方初衷是打压中国制造业、遏制中国产业升级、转嫁国内经济危机，但长期博弈下来，美国国内通胀居高不下，柴油价格屡创历史新高，民生成本持续攀升。反观中国，新能源、高端制造等产业逆势突围，产品畅销全球，在欧洲、东南亚市场的占有率稳步提升。\n\n美国不仅没能重创中国产业，反倒让本土制造业复苏乏力，民众为贸易战的代价持续买单。\n\n对外三大战场全盘遇阻，美国的全球霸权威慑力大打折扣。\n\n硬碰硬拼不过大国对手，特朗普政府便盯上了软肋——深度绑定美国、不敢轻易决裂的西方盟友，试图通过收割盟友利益，弥补对外战略失利的缺口，稳固国内选民支持。\n\n在对外战略受挫的焦虑下，特朗普对盟友的霸凌手段愈发肆无忌惮，贸易大棒、政治威胁、军费施压轮番上阵，彻底寒了一众盟友的心。\n\n加拿大是首个被重点针对的对象。\n\n特朗普始终执念于将加拿大变为美国第51个州，频繁公开抨击加拿大领导层，持续对加拿大木材、农产品、能源等核心产业加征层层关税。\n\n持续的贸易打压，让本就高度依赖美国市场的加拿大经济承压严重，美加关系在今年8月底贸易谈判破裂后跌至谷底。\n\n不止加拿大，欧洲盟友同样难逃施压。特朗普以北约成员国国防开支不达标为由，频繁指责德法等欧洲国家，强硬逼迫欧洲增加军费支出。\n\n同时无端发起贸易制裁，对欧洲钢铝产品加征关税，此前还因格陵兰岛归属争议，对丹麦、德国、法国等8个欧洲国家祭出惩罚性关税，用经济胁迫逼迫盟友妥协。\n\n这种“对外软、对内硬”的操作，让西方阵营人心惶惶。\n\n美国昔日“阵营领导者”的人设彻底崩塌，在外部博弈无法取胜时，就把盟友当成提款机、缓冲垫，靠欺负合作伙伴维持自身霸权体面，也直接催生了盟友的“自救突围”行动。\n\n特朗普的极致霸凌，直接倒逼盟友抱团自救，最重磅的变局便是加欧开启深度战略合作，加拿大正式谋求成为欧盟首个准成员国，彻底打破地缘合作常规格局。\n\n从规则层面来看，欧盟并无官方“准成员国”定义，但依据《欧盟运行条约》第217条，欧盟可与非欧洲第三方国家缔结联系协定，建立专属合作机制，且无地域限制，这为加拿大入欧合作提供了合法法理支撑。\n\n不同于正式成员国，加拿大不会使用欧元、不拥有欧盟理事会席位，仅与欧盟搭建全方位深度合作体系。\n\n双方的合作绝非表面外交噱头，而是实打实的战略互补，核心围绕四大支柱展开。其一，经济与资源合作，加拿大坐拥丰富锂、钴、稀土等关键矿产，恰好匹配欧盟绿色转型、电池制造的核心需求，助力双方升级贸易体系；\n\n其二，科技AI联盟，整合双方量子计算、网络安全、AI伦理治理资源，制衡中美科技产业主导格局；\n\n其三，国防工业一体化，打通军工产业链，强化集体安全能力；其四，北极联合治理，共同抢占极地地缘、环境、防务话语权。\n\n数据足以印证合作基础的扎实性，2016年欧盟与加拿大双边贸易额仅720亿欧元，2025年已飙升至1300亿欧元，欧盟对加出口额同步大幅增长。\n\n2024年欧盟超越中国，成为加拿大第二大贸易伙伴。对加拿大而言，这是摆脱75%出口依赖美国的破局之路；对欧盟来说，能补齐关键矿产短板，拓展域外战略纵深。\n\n这一颠覆性合作彻底激怒特朗普，据新华网、环球时报最新报道，9月16日特朗普公开表态，将欧盟吸纳加拿大为“联席成员”的行为定性为“敌对行为”，直接威胁对欧盟加征重税、切断部分美欧贸易，强硬阻挠加欧结盟。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 战略困境转移：特朗普政府在俄乌、中东、对华三条主线均未取得实质突破——俄乌停火框架落空、伊朗反击致美军基地受损、贸易战反噬美国通胀与制造业——大国博弈筹码持续流失。\n2. 施压对象转向盟友：因无法硬撼中俄伊，美国转而以关税、军费、政治威胁收割加拿大与欧洲盟友，本质是以“窝里横”弥补对外战略失利、维系国内强硬人设。\n3. 盟友自救突围：加拿大谋求成为欧盟首个“准成员国”，双方围绕关键矿产、AI科技、国防工业、北极治理构建深度互补合作，2025年双边贸易额已升至1300亿欧元，欧盟跃居加第二大贸易伙伴。\n4. 美方激烈反制：特朗普将加欧结盟定性为“敌对行为”，威胁加征重税、切断部分美欧贸易。\n\n影响分析\n\n此举标志美国霸权逻辑的根本性错位：当外部博弈无法取胜，便向内收割盟友，短期或能榨取谈判筹码，长期却加速西方阵营离心。加欧合作的制度突破（援引《欧盟运行条约》第217条）具有示范效应，一旦成型，将为其他美国盟友提供“去风险化”路径模板，削弱美国对盟友体系的规则主导权。更关键的是，加拿大75%出口依赖美国的格局若被逐步稀释，北美经济一体化根基将被动摇。特朗普的关税威胁或能延缓、但难以逆转这一趋势——压力越大，盟友抱团自救的动力越强，美国“阵营领导者”人设的崩塌正在从舆论层面转为制度层面的现实。",

  "lede": "利雅得遭遇空袭，美发布安全警报，沙特胡塞冲突或“迅速升级”\n\n 2026年09月21日 08:49 环球网\n\n在沙特阿拉伯首都利雅得罕见拉响防空警报后，美国国务院于当地时间19日晚间针对中东地区发布新的安全警报，称也门胡塞武装同沙特阿拉伯的军事冲突有可能“迅速升级”。同日，美国总统特朗普提前结束周末行程返回白宫，引发猜测。据美媒报道，美国政府对动用本国军队阻止胡塞武装没有太大兴趣。外界正将目光投向此前签订共同防御协议的“麦加联盟”，这份协议能否发挥作用，仍然要打上一个问号。\n\n美建议“重新考虑”前往中东\n\n美国驻中东多国大使馆19日发布新的安全警报称，由于中东局势紧张，安全环境仍然复杂，存在发生不可预见的局势升级的可能性，身处中东地区的美国人应“保持高度警惕”，注意航班取消、空域关闭和旅行中断等情况。安全警报还称，“伊朗支持的胡塞武装已对沙特阿拉伯发动敌对行动，其中包括针对民用机场的行动。这场军事冲突有可能迅速升级。居住在中东地区以外的美国公民应认真重新考虑前往或途经该地区的旅行计划”。\n\n沙特阿拉伯利雅得哈立德国王国际机场附近燃料库（视觉中国）\n\n沙特首都利雅得曾于19日凌晨和上午两次传出爆炸声，这是也门胡塞武装与沙特7月冲突升级以来，利雅得首次响起空袭警报。据美联社、英国广播公司等媒体报道，胡塞武装发言人萨雷亚19日晚发表声明称，当天动用“大量弹道导弹、巡航导弹和无人机”袭击利雅得的“敏感目标”以及沙特阿美石油公司位于红海港城延布的设施，并称这些袭击是对沙特企图袭击也门首都萨那的回应。该组织称，将继续执行“以封锁对封锁，以升级对升级”的方针。\n\n特朗普提前返回白宫\n\n据法新社20日报道，就在沙特和也门胡塞武装针锋相对互袭之际，美国总统特朗普缩短了周末在戴维营的行程，于19日晚间出人意料地提前返回白宫。白宫未对这一行程变化作出解释。\n\n美国有线电视新闻网（CNN）国家安全分析师亚历克斯·普利萨斯援引消息人士的话称，特朗普在戴维营举行会议，“商讨和审查对也门的打击方案”。据CNN报道，美国官员承认，也门胡塞武装正推进战事，其最终目标是控制曼德海峡。但美国政府释放出的信号是：美国对动用本国军队阻止胡塞武装没有太大兴趣。然而，即便获得美国额外的情报和目标定位支持，沙特仍未能有效阻止胡塞武装夺取也门沿海重镇，这令海湾国家及美国官员感到沮丧。\n\n土外长称将给予沙特支持\n\n随着胡塞武装持续打击沙特目标，外界正在关注后者与巴基斯坦和土耳其于8月签署的《麦加共同防务协议》是否会发挥作用。根据这份协议，对三国中任何一国的武装攻击将被视为对三国全体的攻击。 \n\n据路透社报道，土耳其外长费丹19日表示，针对沙特遭遇袭击，土耳其将信守协议承诺，“他们可能有一些军事需求，尤其是在一些技术问题上。我们完全有能力满足这些需求”。巴基斯坦军方发言人此前也曾表态将“从外交和实质行动上”支持沙特。不过，卡塔尔半岛电视台20日援引多名分析人士的话称，从政治和法律角度来看，启动程序在原则上是可能的，但“在实践中却很复杂”。尽管胡塞武装对沙特的袭击符合触发共同防御的情境，但该协议尚未获得土耳其和巴基斯坦议会的批准，现阶段更像一份“政治宣言”。\n\n环球时报-环球网驻美国特约记者 冯亚仁、环球时报-环球网特约记者 吴鸣\n\n编辑：王 丹\n\n校对：徐 童",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 胡塞武装首次对利雅得发动大规模空袭，动用弹道导弹、巡航导弹和无人机，打击目标包括利雅得“敏感目标”及沙特阿美在延布的设施，冲突烈度显著跃升。\n2. 美国发布中东安全警报并建议公民“重新考虑”旅行计划，特朗普提前返回白宫召开安全会议，但明确释放“不愿直接军事介入”的信号。\n3. 胡塞武装战略目标指向控制曼德海峡，沙特在获得美国情报支持下仍未能有效遏制其攻势。\n4. “麦加共同防务协议”（沙特-巴基斯坦-土耳其）理论上可触发集体防御，但协议尚未获各国议会批准，实际效力存疑。\n\n影响分析\n\n此次空袭标志着沙特-胡塞冲突进入新阶段：利雅得首次拉响防空警报，意味着胡塞武装的远程打击能力已突破沙特防空体系，对沙特国家安全构成实质性威胁。美国的态度是关键变量——既发布警报又表态不直接出兵，实质是将防务责任推给海湾盟友，暴露了美国中东安全承诺的有限性。\n\n“麦加联盟”面临首次实战检验，但土耳其和巴基斯坦的声援目前停留在政治表态层面，协议未经议会批准使其法律约束力大打折扣。若冲突持续升级，曼德海峡航运安全将受直接冲击，全球能源供应链面临新的地缘风险。整体来看，地区安全架构正从“美国主导”向“多极博弈”加速演变，短期内局势失控风险不容低估。",

  "lede": "（编辑 卞纯）在美国总统特朗普周日表示将对伊朗作出重大决定后，作为美伊冲突的主要斡旋方之一，卡塔尔当天表示，美国希望与伊朗达成协议。\n\n综合央视新闻等媒体报道，卡塔尔外交部发言人马吉德·安萨里20日表示，卡塔尔正与美国和伊朗保持沟通，推动美伊恢复谈判。他称，多名美国政府官员表示，美方希望达成协议并结束冲突。\n\n安萨里在美国纽约举行的卡塔尔经济论坛期间表示，过去几周，卡塔尔一直与美国和伊朗交换意见，卡塔尔正努力弥合分歧。但他没有给出恢复谈判的时间表。\n\n> 他说：“我们听到多名美国政府官员表态，确认美国希望达成协议，希望找到结束这场战争的解决方案。”\n\n安萨里表示，任何解决方案都应确保地区稳定，同时推动国际社会就保护包括霍尔木兹海峡在内的战略水道达成共识。他指出，曼德海峡目前也受到地区冲突影响。\n\n> 他补充称：“将水道置于单一国家的主权之下，并将其作为武器使用，将为我们所有人树立一个危险的先例。”\n\n过去几个月，随着美伊冲突持续，卡塔尔与巴基斯坦一道，一直在双方之间进行调解。\n\n特朗普称将对伊朗作出重大决定\n\n在卡塔尔官员发表上述言论之前，美国总统特朗普周日在接受电话采访时表示，美国对伊朗问题正处于“决策阶段”，未来“不久”将发生“非常重大的事情”。\n\n特朗普表示，目前摆在桌面上的选项包括“彻底摧毁伊朗”，让伊朗经济继续恶化，或者达成协议。他还表示，他正在考虑“何时以及是否”对伊朗采取彻底军事行动。\n\n目前尚不清楚特朗普所说的“不久”具体意味着数小时还是数天。\n\n特朗普还表示，对于本周将赴纽约出席联合国大会的伊朗总统佩泽希齐扬，他不排除与对方会面。\n\n目前，国际社会对特朗普在联合国大会上与佩泽希齐扬会晤的可能性高度关注。佩泽希齐扬计划于周三在联合国大会上发表讲话，预计届时将阐述伊朗对国际事态的立场。\n\n针对更广泛的地区敌对行动，特朗普表示，在也门胡塞武装最近对沙特阿拉伯发动弹道导弹袭击后，华盛顿仍与该组织保持密切沟通，并表示该组织已同意避免与美军作战。\n\n与此同时，美国国务院周日发布安全警报称，“由于中东局势紧张，安全环境依然复杂，存在不可预见的局势升级的可能性”。\n\n美国国务院敦促中东地区的美国公民保持警惕，并敦促该地区以外的美国公民重新考虑前往或途经该地区的旅行。\n\n伊朗：美国除接受伊朗条件别无选择\n\n伊朗最高国家安全委员会秘书穆赫辛·雷扎伊9月19日接受卡塔尔半岛电视台采访时表示，伊朗已通过调解方卡塔尔与巴基斯坦向美国方面转达伊朗的谈判条件。伊朗发出的信息明确，即“如果美国希望摆脱其一手造成的困境，并避免越陷越深，那么除了接受伊朗的条件外，别无他途”。\n\n雷扎伊透露，重启谈判的条件包括解冻伊朗被冻结的资金、结束包括黎巴嫩在内的所有战线战争、不得干涉伊朗内政、不得与伊朗国内反对势力勾结、解除对伊朗的海上封锁等内容。\n\n （财联社 卞纯）\n\n \n\n### 54岁藤原纪香，从未活在美颜滤镜里 \n\n草莓解说体育\n\n \n\n### 普京曾数次痛批列宁：一生最大的错误，就是把统一国家改造成联盟 \n\n \n\n### 罗梅罗：梅西该拿金球，退役后可能给最会营销的球员 \n\n \n\n### 从1.85万跌到不足7000：广州远郊楼盘五年跌六成的警示 \n\n \n\n刘姚尧的文字城堡\n\n \n\n### 早知道｜穆帅输球后言论引发热议 \n\n \n\n \n\n \n\n### 吴大辉：俄罗斯不会为启动谈判做出领土让步 \n\n \n\n### 我开厂挣了3600万，爹妈问我有多少存款，我只说4万，结果第二天妹妹带着她的公公婆婆找上门来 \n\n \n\n \n\n### 燃油车大局基本落定？不出意外，未来3年燃油车会出现这5个变化 \n\n周哥一影视\n\n \n\n### 出轨女子第二波聊天记录曝光，虎狼之词惊呆吃瓜网友，她嫌丢人开始批量投诉了 \n\n### 当一个城市中大量出现乘客拿着手机在出租车旁叫网约车的现象，说明了什么问题？ \n\n碧翰烽\n\n \n\n### 54岁黎姿近况曝光！参加公司董事会议，一副女强人打扮气场很强，脸部有科技既视感 \n\n小徐讲八卦\n\n \n\n### 诺维茨基：几年前我们是一支总决赛球队 期待看到球队的未来发展",
  "deep": "## AI 解读\n\n# 中东博弈进入关键窗口期：美伊谈判的“边缘策略”与结构性障碍\n\n核心要点：\n\n1. 美方信号矛盾：特朗普一面称“彻底摧毁伊朗”仍在桌面，一面不排除联大会晤佩泽希齐扬，典型“极限施压+留门”的边缘策略。\n2. 卡塔尔角色凸显：卡塔尔与巴基斯坦构成双轨调解通道，美方通过多哈传递“希望达成协议”信号。\n3. 伊朗条件明确：解冻资金、解除海上封锁、停止多战线战争，实质要求美方全面让步，门槛极高。\n4. 时间窗口：联大期间可能实现高层接触，但双方核心诉求差距仍大。\n\n影响分析：\n\n短期看，联大会晤若成行将释放降温信号，油价与地区风险溢价有望回落。但结构性矛盾未解——伊朗要求的是制裁全面解除与安全保障，美方要的是核让步与地区行为约束，双方底线尚未交集。特朗普“决策阶段”的表态既是谈判筹码，也意味着军事选项未排除。对市场而言，霍尔木兹海峡与曼德海峡的通行安全是核心变量，任何升级都将冲击全球能源供应链。卡塔尔的斡旋价值上升，但能否弥合分歧取决于美伊是否愿意在联大窗口期做出实质性妥协。",

  "lede": "继乌美在沙特会谈后，美俄也展开谈判，两次会谈总共耗时超过28小时。\n\n一座酒店、两个房间，美、俄、乌却各有立场。\n\n本次承办俄美、美乌会谈的沙特利雅得当地的酒店（资料图）\n\n一组人在这个房间，一组人在那个房间，有点像酒店里的穿梭外交。\n\n——美国总统乌克兰问题特使基思·凯洛格\n\n美国乌克兰问题特使基思·凯洛格（资料图）\n\n这次俄、美、乌齐聚沙特开展两两会谈之前，美国乌克兰问题特使基思·凯洛格就曾对相关会谈的模式作出说明。\n\n原本美方计划同时进行美乌、美俄谈判，美国穿插在两场谈判中，向俄乌双方实时传达对方的立场和意见。但最终这一模式并没有实际采用，而是依照先美乌谈再俄乌谈的方式。\n\n美俄会谈时长超12小时\n\n在23日美乌结束谈判后，美俄随即于24日展开会谈。会谈在持续超过12小时后，终于宣告结束。\n\n美俄是否会签署联合声明？\n\n仍未确定\n\n在当天的谈判结束后，俄新社援引相关人士的话报道称，双方就谈判结果达成的联合声明将于25日公布。美国白宫消息人士也表示，特朗普政府技术团队在利雅得促成的谈判进展非常顺利，预计不久的将来会有一个“积极的”公告。\n\n但根据24日俄总统新闻秘书佩斯科夫在回答媒体提问时的表态，俄罗斯和美国代表团没有计划在当天沙特阿拉伯首都利雅得举行的会谈结束后签署任何文件。\n\n佩斯科夫：此次会谈不轻松\n\n不过持续超12小时的谈判时间着实呼应了佩斯科夫23日对这次会谈的预期。\n\n俄总统新闻秘书（资料图）\n\n佩斯科夫23日表示，他预计这次会谈不会轻松。他说，两国将主要讨论俄总统是否同意恢复黑海粮食协议倡议这一议题。佩斯科夫同时指出，此前在落实该倡议时，“我们履行了所有义务，但对我们的义务从未履行过。”佩斯科夫还表示，不消除引发乌克兰危机的根源，就不可能解决这场冲突。俄美在解决俄乌冲突问题上还有很长的路要走，没有必要对前景过于乐观。\n\n俄方：这是一次“专家级磋商”\n\n实际上，早在本次俄美会谈进行前，俄方就已将本次会谈定性为聚焦特定议题的“专家级磋商”。\n\n俄罗斯总统助理乌沙科夫20日表示，24日的俄美会谈为专家级磋商。此次会谈是落实此前俄美元首通话关于组建专家组的共识。\n\n俄罗斯总统助理乌沙科夫（资料图）\n\n根据乌沙科夫20日公布的参会人员信息，此次俄美会谈俄方参会人员包括俄联邦委员会（议会上院）国际事务委员会主席卡拉辛和俄联邦安全局局长顾问别谢达。俄《共青团真理报》就此分析，俄方代表团未现外交部门主要代表，却有安全局代表，或表明双方将围绕特定具体议题，如军事情报展开谈判。美方对俄方停止对乌军事和情报支持的要求尚未回应，此次会谈或许会有回应。\n\n美乌会谈 5小时即结束‍\n\n而在俄美会谈前一日，美乌双方已经举行了一轮会谈。相较于俄美间超过12小时的会谈时间，美乌间的会谈则显得短得多，从媒体报道的内容时间上推算，乌美双方自会谈开始至结束持续约5小时。\n\n乌克兰国防部长乌梅罗夫当地时间23日夜间在社交媒体上发表了对当天这轮会谈的总结，他称会谈是“富有成效的”，双方讨论了包括能源在内的关键问题。乌梅罗夫称，乌方的目标是确保乌克兰以及整个欧洲公正和持久的和平。目前，美方尚未对会谈情况作出说明。\n\n据乌克兰国家通讯社报道，参加当天会谈的乌方代表团成员包括乌梅罗夫、总统办公室副主任帕维尔·帕利扎和伊戈尔·若夫克瓦、外交部国务秘书亚历山大·卡拉谢维奇和能源部副部长米科拉·科列斯尼克。\n\n重点围绕停火“技术”问题\n\n与俄美会谈俄方的定性类似，乌克兰方面也着重在与美国的讨论中就停火的“技术”问题进行会谈。\n\n在乌美23日于沙特利雅得举行会谈后，乌克兰总统泽连斯基当晚发表视频声明并表示，乌克兰和美国代表团当天在沙特阿拉伯首都利雅得举行的会谈“非常有益”。\n\n乌克兰总统泽连斯基（资料图）\n\n泽连斯基说，由军方、外交官和能源官员组成的乌方代表团正在利雅得与美方代表团就停火的“技术”问题进行第二轮会谈，乌国防部长乌梅罗夫参加会谈并向他汇报了当天会谈进展。“乌方团队的工作非常有建设性，（与美方）对话非常有益。乌方代表团正在继续工作。”\n\n泽连斯基：呼吁对俄施压\n\n尽管对美乌在沙特的这次会谈评价积极，但泽连斯基还是在视频讲话中呼吁各方继续对俄罗斯施压以促使俄方实现“真正”停火。\n\n泽连斯基称，俄罗斯是唯一在拖延冲突的一方，各方需要对俄罗斯施压，否则俄方将继续忽视达成停火的外交努力。泽连斯基说：“无论我们与伙伴们讨论了什么，我们都需要向（俄总统）普京施压，促使其下达停止袭击的真正命令。”\n\n俄乌仍未直接对话 白宫目标恐落空\n\n虽然俄、美、乌三方齐聚在沙特利雅得的同一座酒店就俄乌冲突进行谈判，但截至目前，俄乌这两个当事方仍然没有进行直接对话，双方在战场上的对抗反倒愈加激烈。双方互相指责对方缺乏谈判诚意。",
  "deep": "## AI 解读\n\n# 美俄乌沙特“穿梭谈判”：程序推进难掩实质分歧\n\n核心要点：\n\n1. 谈判模式降级：美方原计划“穿梭外交”实时传话，最终退化为“先美乌、后美俄”的串联式双边磋商，俄乌始终未直接对话，白宫设想落空。\n2. 时长悬殊暴露优先级：美乌会谈仅约5小时，美俄却超12小时，且俄方派出安全局代表而非外交主管，暗示军事情报等硬议题才是真正焦点，黑海粮食协议是核心切口。\n3. 成果预期被刻意压低：俄方明确“不签署文件”、佩斯科夫称“不会轻松”“没必要乐观”，与美方“进展顺利”的表态形成温差，联合声明能否落地仍是悬念。\n\n影响分析：\n\n此次会谈本质是技术性试探，而非突破性外交。俄方将议题锁定在黑海粮食协议与情报安全，意在绕开领土等核心矛盾，以“可操作议题”换取制裁松动空间；乌方聚焦停火“技术问题”并呼吁施压，反映其担心被美俄双边交易边缘化。三方同酒店却不同桌，说明信任赤字仍深，短期内停火无望，战场烈度或进一步上升。对市场而言，黑海粮食走廊若恢复将边际缓解农产品供给焦虑，但地缘风险溢价难以实质性回落。后续需紧盯联合声明是否发布及美方是否回应俄方情报诉求——这才是判断谈判是否“真进展”的关键信号。",

  "title": "中信建投：关注中美高层会晤 A股或迎来风偏改善期|债市|美债|油价|a股|美联储加息|市场流动性_网易订阅",
  "src": "Exa 搜索",
  "lede": "智通财经APP获悉，中信建投证券发布研究报告称，美联储加息落地之后，市场迎来了风偏改善，美债利率阶段性见到高点。市场激烈讨论此次加息路径包含几次加息，市场焦点不应在此，因为未来加息路径并不确定，诚就如沃什所提，弱化前瞻指引，意味着说美联储未来要兼顾更多维度变量，现在讨论加息次数为时过早。当下市场真正需要关注的中美高层会晤。中信建投倾向认为，此次中美高层会晤能够释放更多风偏改善信息。所以有可能接下来一到两个季度，市场迎来一段非常友好的风偏改善期。\n\n上周全球大类资产表现一览：\n\n上周油价与加息预期共振，全球资产定价转向防御，权益资产分化、利率上行、商品震荡。\n\nA股多数宽基指数修复反弹，成长风格明显占优；港股整体小幅收跌，恒生科技相对偏强。\n\n美股主要指数涨跌互现，标普500基本收平，科技板块相对占优。\n\n债市方面，中债收益率整体小幅下行，美债在美联储加息及通胀预期推动下呈熊平，短端调整更为显著。\n\n商品市场中，黄金、铜在加息落地后反弹，原油经历地缘冲高后回落，黑色系整体震荡走弱。\n\n外汇方面，美元指数升破100，受美联储鹰派加息支撑；人民币逆势升值，日元则有所走弱。\n\n一、中国股市：AH成长占优\n\n上周中国AH股回顾： AH成长占优。\n\nA股：上周市场迎来修复反弹，成长风格全面占优，科创 50 单周大涨 6.39% 领跑所有宽基，中小盘指数同步走强，大盘蓝筹表现相对偏弱。行业层面，电子、通信和机械板块领跌涨，煤炭、农林牧渔、石油石化板块领跌。\n\nH股：恒生指数小幅收跌，恒生科技指数偏强；市场核心变量是美联储议息会议意外释放更鹰派信号，新任主席上任后首次加息并暗示紧缩仍可能延续，香港随即跟随上调基准利率，港元融资成本抬升、美元走强与资金回流压力压制风险偏好。行业层面明显分化，医疗保健受创新药审批提速、海外合作预期及细分赛道管线进展提振领涨，能源板块则受油价预期受压拖累领跌。\n\n中国股市展望：静待行情修复。\n\nA股：临近长假假期，市场交投情绪通常趋于谨慎，短期或难以形成持续性主线，整体以震荡偏弱、结构性调整为主。操作上建议顺着修复主线逢低布局，聚焦三类高景气方向：一是AI上游半导体设备与材料，业绩兑现确定性强，回调后配置性价比凸显；二是受益于美元走弱与供给约束双轮驱动下的上游资源品，包括化工、工业有色等；三是业绩韧性强，且估值相对较低，包括非银金融等。\n\n港股：上周美联储加息\"靴子落地\"但基调偏鹰，点阵图暗示年内或再加息一次。海外流动性收紧对港股估值的压制短期难以解除，\"利空出尽\"预期落空后，市场或需要时间重新定价\"更高更久\"的利率环境。\n\n二、中国债市：上周中债收益率整体小幅下行。\n\n上周债市回顾：上周中债收益率整体小幅下行。在内部资金面边际收敛、外部美联储加息扰动下，债市走出“以我为主”的独立行情，利率债窄幅走强、中长端收益率震荡下行。全周10年期国债收益率下行0.79bp至1.682%，30年期国债收益率下行2bp至2.126%，短端基本持平，收益率曲线小幅走平。\n\n债市展望：债市多空博弈延续，维持低位震荡格局。央行近期精细化操作重在熨平跨季跨节资金波动，税期连续隔夜逆回购、9月18日新增14天期逆回购，资金面整体处于收敛但可控区间。\n\n短期内，当前收益率已压缩至低位、趋势性下行缺乏明确催化，叠加政府债供给高峰、季末考核与中秋国庆长假前资金扰动，以及美联储加息、油价与地缘扰动的外部约束。我们对后市维持低位偏强震荡判断，建议久期中性，后续重点跟踪地缘事件变化、关注资金面情况。\n\n三、美股：标普500基本收平，等权重口径下跌1.26%\n\n美股回顾：上周美股主要指数涨跌互现，标普500下跌0.08%，道琼斯下跌1.69%，纳斯达克综合指数上涨0.72%，纳斯达克100上涨0.94%，罗素2000下跌1.50%，费城半导体指数上涨0.83%。标普500在上周前三个交易日连续下跌、议息日收在7月31日以来低位，其后两个交易日累计上涨1.31%，收复此前跌幅的绝大部分。标普500等权重指数全周下跌1.26%，落后市值加权指数118个基点，道琼斯连续第三周下跌。\n\n板块上，11个板块中9个下跌，仅医疗保健上涨1.83%、信息技术上涨1.03%，公用事业下跌3.04%、金融下跌2.43%、房地产下跌2.05%居后，高股息板块的跌幅对应10年期美债收益率站上5%。半导体产业链是上周波动的主要来源：三家头部人工智能公司负责人在上周末呼吁放慢前沿模型开发，费城半导体指数在上周首个交易日下跌5.86%，较6月22日收盘高点的回撤扩大至23.94%，康宁当日下跌13.70%、全周下跌9.78%，同日软件板块ETF上涨5.04%。其后四个交易日费城半导体指数累计上涨7.10%，存储与半导体设备领涨，闪迪全周上涨9.70%，美光全周上涨4.16%。",
  "deep": "## AI 解读\n\n# 中信建投策略解读：风偏改善预期的逻辑与约束\n\n核心要点\n\n中信建投的核心判断可归纳为三点：其一，美联储加息落地本身并非关键变量，市场纠结于加息次数实属误判——弱化前瞻指引意味着美联储将兼顾更多维度变量，路径本身不可预测；其二，当前真正的定价锚是中美高层会晤，若释放积极信号，未来一到两个季度A股有望迎来“风偏改善期”；其三，短期节奏上，长假前交投谨慎，市场以震荡偏弱、结构性调整为主，建议沿AI上游半导体、上游资源品、低估值非银三条主线逢低布局。\n\n影响分析\n\n这一判断的合理之处在于，当前A股的核心矛盾确已从“外部紧缩”切换至“内部风险偏好”。美债利率阶段性见顶、人民币逆势升值，为国内风险资产提供了边际友好的外部环境。但需注意两点约束：一是港股已用“利空出尽落空”的走势提示，海外流动性收紧对估值的压制短期难以解除，A股风偏改善的持续性取决于会晤成果能否兑现为可交易的政策预期；二是国内债市走出“以我为主”的独立行情，收益率曲线走平，反映资金面收敛但可控，这意味着股市增量资金更多来自存量博弈下的风格切换，而非系统性宽松驱动。因此，“风偏改善期”更可能呈现为结构性机会而非全面普涨，成长风格的相对占优具备逻辑支撑，但需警惕会晤预期落空后的回摆风险。",

  "lede": "看要点\n\n本周美股将同时面对高利率、高油价和政策变化三重变量。\n\n撰文：潮向研究\n\n上周美股在加息后的震荡中分化收官。道指全周跌 1.7%，创 3 月以来最大周跌幅，纳指反而上涨 0.7%，芯片和 AI 硬件继续跑赢大盘。周末中东局势再度升温，胡塞武装袭击利雅得，美伊互放强硬信号，周一油价重新站上 101 美元；美中高层则在纽约围绕 AI、关税和关键矿产展开磋商。本周美股将同时面对高利率、高油价和政策变化三重变量。\n\n## 芯片股连续第四日走强，费半一周跑赢大盘\n\n费城半导体指数上周五涨 2.78%至 11921.69 点，连续第四个交易日走强。闪迪涨约 11%，Lumentum 涨超 4%，芯片设备股维持强势。\n\n标普 500 周五涨 0.17%报 7650.50 点，纳指涨 0.40%报 26522.550 点，道指跌 0.18%报 51682.64 点。VIX 跌 4.08%至 14.81。\n\n盘面宽度依旧偏弱，纽交所和纳斯达克下跌股票数量都多于上涨股票。七巨头涨跌分化，英伟达涨 1.34%，亚马逊涨 1.00%，谷歌涨 0.64%；苹果跌 0.26%，特斯拉跌 0.53%，微软跌 0.80%，Meta 跌 2.43%。纳斯达克金龙中国指数涨 0.76%至 5787.39 点。\n\n周初 AI 安全争议曾让芯片股急跌，随后光通信、存储和芯片设备率先收复失地。指数涨幅不大，科技股内部的强势方向却越来越集中。闪迪本轮上涨与存储芯片涨价的产业逻辑直接相关，资金正在往有明确业绩支撑的硬件方向聚拢。\n\n## 10 年期美债重回 5%，加息定价升至 55%\n\n利率压力上周五重新抬头。2 年期美债收益率升至 4.76%，10 年期升至 5.01%，重新站上 5%关口。美联储刚刚开启新一轮加息，市场对 10 月再次加息 25 个基点的定价升至 55%左右。\n\n高利率继续压着成长股估值，但半导体仍能跑赢大盘，说明近期产业催化和业绩预期对部分科技股形成了更强支撑。\n\nWTI 原油周五跌 1.58%至 100.30 美元/桶，布伦特原油跌 0.93%至 104.87 美元/桶。现货黄金涨 1.2%至 4390 美元附近。\n\n## 比特币重回 8 万美元，加密概念股大涨\n\n比特币周五大涨近 6%，重新站上 8 万美元，以太坊升至 2611 美元附近。\n\nCoinbase 涨约 12%，Strategy 涨约 15%，Robinhood 涨近 9%。此前美国加密市场结构法案推进受阻，板块一度承压，近期代币化股票和数字资产监管重新出现进展，加密资产随之快速反弹。\n\n监管节奏仍是这条线最直接的催化剂，本周继续关注美国数字资产政策是否有新的推进。\n\n## 巴菲特卸任伯克希尔董事长\n\n伯克希尔上周五完成新一轮交接。96 岁的沃伦·巴菲特正式卸任董事长，转任名誉董事长并继续留在董事会，长子 Howard Buffett 接任非执行董事长。\n\nGreg Abel 今年初已经接任 CEO，日常经营和重大资本配置仍由他负责。伯克希尔目前现金储备接近 3650 亿美元，接班后的资金使用会成为市场接下来观察 Abel 的重要窗口。\n\n## 周末中东再升级，油价重新站上 101 美元\n\n周五油价刚刚回落，周末局势再次出现变化。\n\n胡塞武装对沙特首都利雅得发动导弹和无人机袭击，美国随后发布安全警报。特朗普周日再次要求伊朗达成协议，伊朗军方也警告新的军事行动将引发持续报复。\n\n霍尔木兹海峡运输仍受到限制，红海航线风险再次上升。周一亚洲早盘，WTI 回到 101 美元附近，布伦特原油在 104 美元上方运行。\n\n油价如果继续上行，会重新推高通胀预期，也可能强化市场对后续加息的定价。卡什卡利周末再次强调，美国通胀压力已经扩散到服务业等领域，能源价格仍是其中一个重要变量。\n\n## 美中磋商聚焦 AI 和关键矿产\n\n美国财长贝森特与中国国务院副总理何立峰周日在纽约开始磋商，为本周特朗普与习近平会晤做准备。\n\n讨论内容包括 AI 安全、关税、稀土和关键矿产供应，以及农产品和波音飞机采购。对美股影响最大的仍是 AI、半导体政策和关键矿产供应。\n\n如果相关政策出现新的安排，英伟达、半导体设备、汽车和航空板块都可能很快给出反馈。\n\n## 本周关注\n\n周三美联储官员讲话。 加息落地后，多位美联储官员将发表讲话。如果继续释放鹰派信号，10 月加息定价可能从 55%进一步上升；如果措辞转鸽，长端利率可能获得短暂喘息。\n\n美中磋商的后续进展。 本周双方将继续讨论 AI、半导体、关税和关键矿产。如果出现具体进展，英伟达、半导体设备、稀土供应链和波音都可能受到影响。\n\n比特币能否站稳 8 万美元。 加密资产近期与美债利率的关系并不稳定，监管变化带来的影响明显增强。",
  "deep": "## AI 解读\n\n# 美股三重压力叠加：高利率、高油价与政策变量共振\n\n核心要点\n\n上周美股呈现\"指数分化、结构集中\"特征：道指周跌1.7%创半年最大周跌幅，纳指逆势涨0.7%，费半指数连续四日走强，资金明显向存储、光通信等有业绩支撑的AI硬件收敛。真正值得警惕的是宏观端的三重变量同步抬头——10年期美债收益率重回5.01%，市场对10月加息定价升至55%；WTI受中东局势再度升级推动站上101美元；美中纽约磋商则聚焦AI、关税与关键矿产。此外，比特币重回8万美元带动加密概念股大涨，巴菲特正式卸任伯克希尔董事长。\n\n影响分析\n\n当前市场的核心矛盾在于：产业景气（AI硬件）与宏观压制（利率+油价）形成对冲。半导体能逆势跑赢，说明业绩确定性正在战胜估值压力，但这一逻辑的持续性取决于两个外部条件——油价能否受控、加息预期能否见顶。若中东局势推动油价持续上行，通胀预期将被重新点燃，10月加息概率或从55%进一步走高，届时成长股估值承压将难以靠产业催化对冲。美中磋商是本周最大政策变量，AI与关键矿产若出现具体安排，英伟达、半导体设备及稀土供应链将快速反馈。比特币短期由监管节奏主导，与利率的传统相关性正在弱化，需警惕情绪驱动的波动放大。整体看，市场处于\"结构性机会尚存、系统性风险上升\"的敏感窗口。",

  "lede": "沃什加息重塑信誉，如何影响美股、黄金走势？\n\n 2026年09月21日 16:35 市场资讯\n\n（来源：红刊价投）\n\n文丨陈杰瑞\n\nJerry Chen\n\n编辑丨吴海珊\n\n9月 16日，美联储三年来首次加息，并且暗示未来货币政策将继续收紧。利率决议过后，美元升至 5周高点，黄金短线急跌，但科技股却意外保持坚挺。\n\n事实上，市场对此次加息的关注远超 25个基点本身：三年来首次加息意味着美联储正式走出观望。需要关注的是，美联储此次加息之后，究竟未来还会加息几次？大类资产走势将何去何从？\n\n美联储鹰派加息\n\n美联储在 9月会议上以 12比 0全票通过加息 25个基点的决定，将利率区间上调至 3.75%— 4.00%，这是三年来首次加息，兑现了其“遏制通胀”的决心。\n\n点阵图显示， 18位决策者中有 16位预计今年底前至少还将有一次加息（两人预计维持利率不变）至 4.00%— 4.25%区间，且在 2027年底维持这一水平。美联储在经济预测中还上调了今明两年的通胀预期和经济增速。\n\n尽管加息无法解决霍尔木兹海峡等供给侧问题，但通胀长期高于美联储 2%的目标，已经令沃什难以继续按兵不动。目前核心 PCE和 CPI分别约为 3.2%和 2.4%。\n\n沃什在新闻发布会上强调，目前很难将整体金融环境称为“限制性的”（ restrictive），并称此次加息只是“移除了一剂宽松”（ removed a dose of accommodation）。该表态相当鹰派，意味着他可能倾向于将高利率维持更久。但他本人反对提供前瞻性指引，因此未提交预测。\n\n他还表示经济（劳动力市场）强劲、投资（ AI）旺盛及地缘因素正在推动收益率上升，暗示油价已经不是唯一驱动因素。\n\n可见，美联储此次加息并非单纯的“一次性动作”，未来两次加息可能发生在 12月和 2027年 3月，但并不排除加息节奏提前。如果美联储认为通胀和金融环境没有改善， 10月加息也不能完全排除。不过考虑到 11月是重要的中期选举节点，这一可能性也并没有很大。\n\n然而，利率期货市场的隐含利率路径比美联储更为激进，数据显示美联储在 12月再次加息的概率高达 93%，且明年年底利率区间可能升至 4.50%— 4.75%区间。可见，此次沃什虽然鹰派，但其实市场早就已经走在了前面。\n\n议息会后，对利率前景更为敏感的 2年期美债收益率上涨 7个基点刷新两年新高，而长端的 20年期和 30年期下跌 1个基点， 10年期/2年期美债利差降至 6月 30日以来最低水平。这一变化凸显出此次鹰派加息一定程度上重塑了市场对美联储的信心，并缓解了长期美债的抛售。\n\n点阵图与利率期货路径之间的分歧，说明市场对美联储的信心正在重建而非削弱，“短端走强、长端企稳”被解读为市场认可央行抗通胀承诺的表现。沃什拒绝前瞻性指引，意味着未来政策路径不确定性更高，数据依赖将主导市场。\n\n美元指数隔夜重返 100关口升至 5周高点，非美货币全线承压，其中日元连续第三天走弱，美元/日元攀升至 156上方。\n\n黄金回落延续震荡格局\n\n黄金在 9月 16日最高触及 4368美元，但决议公布之后短线急跌近 100美元，最终收跌于 4264美元，录得连续第三天下跌，日线级别依然维持震荡下行走势。\n\n黄金面临的关键问题是当前环境并不十分有利。原因在于避险资产领域中黄金最接近的替代品——债券市场。债券和黄金传统上均被视为防御性资产，当其中一种资产变得更具吸引力时，往往可能减少对另一种的需求。这似乎是目前限制贵金属的主要因素之一。与债券不同，黄金不产生收益，这意味着当固定收益回报上升时，其相对吸引力往往会下降。\n\n这正是近期在发生的情况。即使在美联储决策公布之后，美国国债收益率仍持续攀升， 10年期美债收益率保持在 5%以上，这一水平已多年未见。这反映了市场对固定收益工具的偏好日益增强，这受到对美联储会更激进的预期支撑。因此，部分可用资金流可能会继续利好债券市场而非黄金。\n\n从 4小时图来看，金价仍处于下降楔形形态之内。 9月 17日早盘反弹在 4318美元附近（ 16日波幅的 61.8%回撤位）暂缓， 4365美元附近为此前的高点区域， 4250美元一线为市场关注的下方技术位置。\n\n综合考虑所有因素，黄金需求前景仍充满挑战。只要债券收益率维持高位，资金可能继续流向固收市场，降低黄金的吸引力，并使持续复苏变得更加困难。以下是几个需要关注的关键价格水平：\n\n4480美元是关键阻力位：看涨价格走势的关键障碍与近期高点一致，且部分与 200周期均线重合。若价格回升至该水平，可能开始恢复看涨倾向的相关性，并重振此前几周出现的上升趋势线。\n\n4330美元是近期阻力位：图表上的主要均衡区域以及上周多次有效的水平。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 政策转向确认：美联储以12:0全票加息25bp至3.75%–4.00%，为三年来首次，点阵图显示年内至少还有一次加息，2027年底前维持高位，沃什明确否认当前金融环境具\"限制性\"，鹰派信号明确。\n2. 市场已领先美联储：利率期货隐含12月加息概率达93%，明年末利率或升至4.50%–4.75%，市场定价比点阵图更激进，说明此次加息更多是\"追认\"而非\"超预期\"。\n3. 资产分化明显：美元重返100关口、2年期美债收益率创两年新高，但长端收益率回落，10Y/2Y利差收窄至6月底以来最低；黄金三日连跌，科技股意外坚挺。\n\n影响分析\n\n本次加息的核心意义不在于25bp本身，而在于重塑了市场对美联储抗通胀信誉的信任。\"短端走强、长端企稳\"的收益率曲线变化，表明市场认可央行的紧缩承诺，缓解了此前对长期通胀失控的担忧，这对美股估值构成一定支撑，也解释了科技股的韧性。\n\n对黄金而言，环境明显不利。10年期美债收益率站稳5%以上，债券作为黄金最接近的替代避险资产，其实际回报上升直接削弱了无息资产黄金的吸引力，资金持续流向固收市场。技术面上金价仍处下降楔形，4250美元为关键支撑，4480美元为扭转颓势的核心阻力。\n\n后续需紧盯12月议息及通胀数据，若核心PCE未见回落，加息节奏可能提前，届时美元与美债收益率将进一步上行，黄金短期难言反转。",

  "lede": "本周美股行情 - 2026-09-21 - TradingKey\n\n2026-09-21\n\n## 投资要点\n\n在 2026 年 9 月 14 日当周，面对粘性通胀和强劲的零售销售数据，FOMC 加息 25 个基点至 3.75%-4.00%。10 年期美债收益率上升（4.90%-5.00%）和高油价推动资金轮动至能源和防御性板块，对利率敏感型成长股和小盘股造成压力。即将公布的 PCE 数据和美联储官员讲话将决定短期市场情绪。投资策略看好优质超大市值股、能源板块和具备股息收益率的防御性股票，同时对高杠杆资产维持低配。\n\n市场回顾与分析\n\n在 2026 年 9 月 14 日至 2026 年 9 月 20 日的交易周内，宏观经济格局表现为通胀压力具有粘性、消费者需求强劲以及地缘政治风险上升。美国人口普查局于 2026 年 9 月 16 日报告称，美国 2026 年 8 月零售销售环比激增 1.2%，显著超出市场普遍预期，同时核心零售销售环比大增 1.4%，突显出强劲的消费者支出。与此同时，中东地缘政治紧张局势推高能源价格，使原油价格升至每桶 100 美元以上，推升了进口价格通胀，并推动基准 10 年期美债收益率逼近 4.90% 至 5.00%。这些强劲的增长和持续的通胀动态，为央行紧缩政策提供了宏观经济催化剂。\n\n从技术面和市场表现来看，在利率上升和行业轮动背景下，主要股指在 2026 年 9 月 14 日至 2026 年 9 月 20 日的整周期间经历了剧烈的盘中波动。美股市场在周初因科技和工业股走弱而承压，随后在周中企稳并于周末出现选择性反弹。行业表现反映出资金正从利率敏感型成长板块和高估值半导体标的，轮动至受高油价支撑的防御性板块和能源股。风格表现方面，价值股优于高 Beta 成长股，而由于金融条件收紧对小盘标的形成压制，小盘股整体持续承压。\n\n最重要的关键事件发生在 2026 年 9 月 16 日，联邦公开市场委员会一致投票决定将联邦基金利率目标区间上调 25 个基点至 3.75% 至 4.00%，标志着本轮政策周期的首次加息。美联储主席凯文·沃什（Kevin Warsh）在 2026 年 9 月 16 日的新闻发布会上指出，经济扩张稳健、资本投资强劲且国内支出具有韧性，同时强调持续的通胀需要坚定的货币政策立场以恢复价格稳定。随附的经济预测摘要将 2026 年实际 GDP 增速上调至 2.3%，并将 2026 年核心 PCE 通胀率上调至 3.4%，预测中位数显示参与者预计年内还将加息 25 个基点，使终端目标利率达到 4.1%。\n\n在整周时间内，资金流向和投资者情绪在机构和零售渠道均展现出谨慎且具备风险意识的姿态。随着养老基金向固定收益资产再平衡，以及企业股票回购活动进入财报季前的季节性禁售期，广义股票基金流向显示出选择性去风险和战术性现金积累。CBOE 波动率指数在高位震荡，期权市场定位表明看涨偏斜意愿降低，且针对宏观利率不确定性的对冲需求增加。市场预期迅速重新定价以消化“更长时间保持高利率”的政策轨迹，推动机构持仓向防御性收益资产和优质资产负债表标的倾斜。\n\n总体而言，市场呈现出周期末段调整阶段的特征，即强劲的经济增长势头与重启的货币政策紧缩发生冲突。企业基本面背景和资本支出周期依然具有韧性，但不断扩张的估值倍数面临贴现率上升和基准收益率居高不下的阻力。当前的主导市场逻辑锚定于坚韧的顶部经济活动与旨在遏制粘性通胀的紧缩金融条件之间的拉锯战。\n\n下周主要市场驱动因素与投资展望\n\n展望 2026 年 9 月 20 日之后的下周，市场参与者将聚焦于关键的宏观经济数据发布和企业政策信号。即将公布的关键经济指标包括 2026 年第二季度 GDP 最终修正值，以及将于 2026 年 9 月 30 日公布的包含个人消费支出（PCE）价格指数的 2026 年 8 月个人收入与支出数据；此外还有将于 2026 年 9 月 29 日发布的职位空缺与劳动力流动调查（JOLTS）数据。此外，投资者将密切关注美联储官员的定程演讲，以评估市场对今年秋末可能追加二次加息的共识。\n\n预计短期内的市场逻辑将围绕利率终端预期和企业利润率可持续性的价格发现展开。随着较高的基准收益率渗透至企业资本成本和消费者借贷渠道，股票估值可能对通胀上行数据保持敏感。然而，基础设施和高效技术领域的持续资本支出提供了底层基本面缓冲，这表明市场的回调将表现为行业层面的分化，而非系统性抛售。\n\n从资产配置角度来看，建议机构和零售投资组合采取平衡且具备选择性的股票策略。策略师建议保持对具备韧性现金流和自筹资金资本支出能力的优质巨头平台的配置，同时选择性加仓受益于高大宗商品价格的能源和原材料板块。",
  "deep": "## AI 解读\n\n# 核心要点提炼\n\n本周市场核心矛盾在于“强劲增长”与“重启紧缩”的正面碰撞。8月零售销售环比+1.2%、核心零售+1.4%显著超预期，叠加中东局势推升油价破百，共同构成美联储加息25bp至3.75%-4.00%的宏观催化。10年期美债收益率逼近5%，触发资金从利率敏感型成长股、高估值半导体及小盘股，向能源与防御性板块的显著轮动。点阵图暗示年内仍有25bp加息空间，终端利率4.1%，市场被迫重新定价“更高更久”路径。\n\n# 影响分析\n\n其一，估值端压力大于盈利端。 经济基本面（GDP上修至2.3%）与资本开支周期仍具韧性，但贴现率抬升正压缩估值倍数，市场进入“周期末段调整”特征——回调将以行业分化形式呈现，而非系统性抛售。\n\n其二，风格切换具备持续性。 价值优于成长、大盘优于小盘的格局在金融条件收紧下大概率延续。能源板块受高油价直接支撑，防御性股息资产受益于收益率曲线重构。\n\n其三，短期催化剂密集。 下周PCE数据与美联储官员讲话将决定利率终端预期的修正方向，JOLTS与GDP终值提供增长验证。若核心PCE超3.4%预期，成长股将面临二次杀估值。\n\n配置结论： 维持优质超大市值、能源及防御性股息资产超配，对高杠杆与小盘资产保持低配。",

  "title": "亮源新创发布Light-O1：Physical AI三段范式技术成果全部落位|机器人|light|预训练|physical_网易数码",
  "src": "Exa 搜索",
  "lede": "亮源新创Light-O1首次揭示了人类全身动作预训练的跨本体迁移扩展规律：用于预训练的人类动作数据越多，模型在适配不同机器人本体和视角后，动作预测越准确，为利用大规模人类数据提升机器人通用能力提供了依据。继规模化对齐（Scalable Alignment）和规模化部署（Scalable Deployment）成果之后，Light-O1推动亮源新创 Physical AI三段范式中的规模化预训练（Scalable Pre-Training）进入模型实践。\n\n当前，机器人动作模型主要依赖遥操作、UMI等方式专门采集训练数据。这类采集成本高、耗时长，覆盖不同任务还需要定制采集流程、组织和培训人员，并应对设备成本与操作易用性的限制。随着任务和场景增多，人员管理与采集组织也更加复杂。这些约束使数据规模和行为多样性难以同步扩展，成为机器人基础模型规模化发展的关键瓶颈。\n\n亮源新创Light-O1利用互联网视频中已有的海量人类行为，拓展机器人预训练的数据来源。这些视频记录了人类在不同环境中移动、操作物体、使用工具以及与他人交互的过程，在规模和多样性上补充专项采集数据的不足，使预训练的数据扩展不再完全依赖逐项组织的专门采集。\n\nLight-O1利用已有的海量人类行为拓展机器人预训练的数据来源\n\n在此基础上，亮源新创Light-O1围绕人类动作知识向机器人的迁移，建立了涵盖数据构建、自回归预训练与机器人适配的完整技术路径。其核心是从丰富的人类行为中学习可复用的动作知识，再将这些知识迁移至身体结构、观察视角和控制方式不同的机器人。具体而言，首先将视频中的人类行为整理为统一的多模态动作数据，再通过大规模预训练形成“在什么情境下、如何行动”的动作先验，最后利用目标机器人数据完成适配，让人类的行为经验转化为机器人的行动能力。\n\n沿着这条技术路径，亮源新创进一步验证了人类全身动作预训练的跨本体迁移扩展规律。研究使用不同规模、基于视频构建的人类动作数据进行预训练，再分别适配至第一视角人类采集数据、公开的人形机器人数据，以及亮源自有机器人的全身移动操作数据，评估预训练规模对不同视角和本体下动作预测能力的影响。\n\n亮源新创Light-O1将基于视频的人类动作预训练拓展至10万动作小时。结果显示，随着预训练数据规模扩大，模型在目标领域适配后的动作预测更加准确：动作预测损失呈幂律下降趋势，离线开环评估中的全身姿态误差也随之降低。这表明，人类动作预训练带来的收益能够跨越本体差异，迁移到机器人的动作预测中。这一迁移扩展规律，为进一步扩大人类动作数据规模、提升机器人的通用动作能力提供了依据。\n\n基于规模化人类动作预训练与后续适配，亮源新创Light-O1将指令理解、环境感知和全身行动连接起来，从真实场景中的全身协同操作，以及面向用户意图的理解与行动两个层面，展现通用全身智能。\n\n在真实环境中，协调全身持续完成任务。 搭载亮源新创Light-O1的自研小型人形机器人LightBot能够自主完成递毛巾、打开鞋柜归置拖鞋、捡垃圾等任务，将行动决策、移动导航和全身操作连接为连续的执行过程。面对执行失败、外界干扰以及物品类型和位置的变化，机器人能够根据环境与执行反馈调整行动，在必要时自主重试，体现出抗干扰能力和对不同物品与空间位置的泛化能力。\n\n面对自然语言指令，亮源新创Light-O1能够结合指令描述的情境，理解用户需求与隐含意图，推理完成目标所需的身体姿态、动作顺序与约束，再生成相应的全身动作。亮源新创此次同步在官网开源通用动作生成模型Light-O1-Preview，用户只需表达想要达到的目标，即可由模型进一步推导身体应该如何行动，并查看相应的推理过程，直接体验从“理解需求”到“生成行动”的完整过程。\n\n围绕“规模化预训练（Scalable Pre-Training）—规模化对齐（Scalable Alignment）—规模化部署（Scalable Deployment）”的三段范式，亮源新创已相继推出对应核心技术成果，此次发布的Light-O1则进一步确立了规模化预训练方向的核心技术路径。至此，亮源新创在三段范式上的核心技术成果均已落位，形成从基础模型预训练、能力对齐到真实世界部署的完整技术链路。\n\n更重要的是，这套技术体系的价值并不在于将研发流程划分为三个阶段，而在于建立一条可持续扩展的Physical AI能力增长路径：基础能力可以通过规模化预训练不断积累，进入物理世界的能力可以通过规模化对齐持续增强，真实部署又进一步把模型带入更多任务、环境和机器人本体。三者相互衔接，使Physical AI不再依赖单点能力突破，而是具备从数据、训练到真实世界应用持续迭代的系统性技术路径。\n\n \n\n### 人工智能送货机器人失灵瞬间",
  "deep": "## AI 解读\n\n# 亮源新创Light-O1深度解读\n\n核心要点\n\n1. 技术突破：Light-O1验证了\"人类动作预训练跨本体迁移扩展规律\"——预训练数据规模越大，模型适配不同机器人本体与视角后的动作预测越精准，损失呈幂律下降。这是机器人基础模型领域的首个规模化扩展性证据。\n\n2. 范式闭环：继规模化对齐、规模化部署后，规模化预训练落位，三段范式技术链路完整成型。\n\n3. 数据路径革新：以互联网海量人类视频替代高成本的遥操作/UMI专项采集，直击机器人基础模型\"数据规模难以扩展\"的核心瓶颈。\n\n影响分析\n\n- 行业层面：该路径若成立，将重构机器人数据采集的经济学——从\"逐任务定制采集\"转向\"视频预训练+少量适配\"，显著降低通用机器人能力扩展的边际成本，可能加速人形机器人从demo走向规模化落地。\n- 技术层面：幂律扩展规律为\"堆数据换通用性\"提供了可量化依据，类似LLM的Scaling Law逻辑首次在具身动作领域显现，或引导资本与研发资源向大规模动作数据基础设施倾斜。\n- 风险提示：视频数据到真实机器人控制的Sim-to-Real鸿沟、跨本体迁移的物理约束边界，仍需更大规模的真实部署验证。\n\n一句话判断：Light-O1的价值不在单点性能，而在于为Physical AI提供了一条\"可扩展\"的能力增长曲线——这是从工程突破迈向系统性范式的关键信号。",

  "lede": "###### 2026年09月21日 11:39 时代周报 \n\n要做“机器人中的苹果”？启元19999元起开卖人形机器人，上纬新材CEO田华：从“有趣”起步，让机器人逐步走向“有用”\n\n19999元起，启元两款量产消费级人形机器人正式开售，上纬新材的C端突围能成功吗？\n\n人形机器人行业正在由头部背景厂商把量产产品摆上C端货架。\n\n9月20日，上纬新材料科技股份有限公司（以下称“上纬新材”）旗下消费级具身智能品牌启元机器人在上海举办“我和我的个人机器人”主题新品发布会，正式发售启元Q1、启元T1两款个人机器人。\n\n图源：时代财经摄\n\n其中，启元Q1售价19999元，启元Q1探索版售价26999元；启元T1售价19999元，启元T1 Pro售价29999元。两款产品即日起正式开售，10月1日起按订单顺序陆续发货。上纬新材CEO田华当场承诺：“保证大家都有货”。\n\n业内普遍将2026年称为人形机器人量产元年，宇树、优必选、智元等头部厂商相继公布量产计划，面向个人的货架正陆续摆开，启元又能否与智元形成合力？\n\n启元Q1、T1面向家庭，先“有趣”再“有用”\n\n9月20日下午，上海西岸梦中心·梦工厂，2026启元机器人全球新品发布会在此举行。开场前，场馆外街边的展示区已经围起了人——几台Q1、T1机器人在开放区域转身、挥手、随音乐摆动，引起路人围观与互动。\n\n时代财经现场发现，新品机器人颇受小朋友欢迎。一些小朋友与机器人差不多高，“交朋友”一般握手、拥抱。父母在一旁照看，同时向工作人员询问产品功能和售后，“能不能陪孩子学英语？在家里磕着碰着怎么办？”\n\n小朋友和启元机器人互相比心 图源：时代财经摄\n\n主会场上，上纬新材CEO田华当场宣布，“今天是行业第一个量产消费级机器人发布会。”\n\n此次启元带来启元Q1、启元T1两款产品，定位各有侧重。启元Q1面向个人陪伴。身高约88厘米，体重约15公斤，可折叠装进背包，且外观结构件开源，支持3D打印定制外壳，用户可自行调整外观造型、性格特质、动作姿态和语音音色；启元T1主打可变形，采用跨形态架构，可在轮足人形与四足两种形态之间切换；高配的T1 Pro搭载英伟达Orin Nano芯片，支持双形态360°全向避障，并具备低电量自动导航回充、语音召唤、跟随载物等能力。\n\n启元Q1、启元T1售价均为19999元；面向开发者开放SDK、HDK及硬件拓展接口的Q1探索版售价26999元，T1 Pro售价29999元。产品即日起正式开售，10月1日起按订单顺序陆续发货。价格公布时，时代财经注意到，现场有观众脱口而出：“坏了，这回真买得起！”“这和新发的iPhone折叠屏价格差不多啊”。\n\n田华公布启元机器人Q1价格 图源：时代财经摄\n\n“总要有人迈出第一步。”上纬新材CEO田华表示，AI时代的核心交互入口，正从屏幕转向具备感知、交互、移动与执行能力的个人机器人；启元从成立第一天起就面向个人、面向家庭，“先从‘有趣’起步，让机器人逐步走向‘有用’”。\n\n在技术层面，启元公布了PrimeMotion运控、PrimeGo感知跟随、PrimeVista多模态交互三类AI模型，并披露家务基座大模型PrimeMind正在推进。配套的技能商店中，喜马拉雅、QQ音乐、有道、京东健康、携程等应用将陆续接入，目前已有超过1000名开发者参与生态共创。然而，需要指出的是，PrimeMind等面向家务的能力何时上线、适配哪些产品，发布会并未给出明确答案。\n\n人形机器人量产元年，C端货架刚刚摆开\n\n业内普遍将2026年称为人形机器人量产元年，宇树、优必选、智元等头部厂商相继公布量产计划，面向个人的货架也在这一年陆续摆开。只是各家的产品路线并不相同，价格带从两万元到近百万元均有分布。\n\n同处两万元级的是宇树科技的人形机器人R1于6月改价为2.99万元起并开放现货销售，官方定位为消费级入门人形机器人。今年6月30日，优必选发布消费级品牌“优世界”U1系列全尺寸超仿生机器人，其中U1 Lite售价11.98万元，高配版U1 Pro售价16.98万元，顶配U1 Ultra售价88万元至99万元，价格远超同行。\n\n江西财经大学投融资专委会研究员王楠（化名）指出，19999元的价格将使启元Q1和T1在市场上颇具竞争力，作为价格接近高端折叠屏手机的新型电子消费品，启元或许唯一需要考虑的是量产能否真的跟上。\n\n据田华现场分享，启元为量产给出的制造支撑是：生产线引入汽车工业的制造节拍与质量管理，平均每2.5分钟就有一台启元机器人下线，每个产品的装配数据可长期追溯。不仅如此，启元表示，2026年预计投入5亿元研发费用，未来5年计划投入10亿元建设生态。\n\n在智元的版图中，启元与智元分工清晰：智元主品牌面向工业与商用，而启元承担了智元系冲击C端的主任务。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 定价破局：启元Q1/T1以19999元起售，直接对标高端折叠屏手机，将人形机器人首次拉入大众消费电子价格带，显著低于优必选U1 Lite（11.98万元）等竞品。\n2. 战略卡位：上纬新材借启元品牌承担“智元系”C端突围任务，与主品牌智元（工业/商用）形成分工，瞄准家庭陪伴场景，以“有趣”为切入点渐进培育“有用”能力。\n3. 量产背书：宣称2.5分钟/台下线节拍、5亿研发投入、10亿生态基金，试图回应行业对量产交付能力的核心质疑。\n\n影响分析\n\n此举标志人形机器人从“技术展示”正式迈入“消费电子化”竞争阶段。短期看，低价策略有望快速激活尝鲜需求，抢占家庭入口心智，对宇树、优必选形成价格压力；中期看，真正的分水岭在于PrimeMind家务大模型能否如期落地——若“有趣”无法向“有用”跃迁，产品易沦为高价玩具，复购与口碑难以为继。长期看，启元若能与智元形成B/C协同，或加速行业从单点硬件转向“硬件+技能商店+开发者生态”的平台化竞争。风险在于：消费级机器人的安全标准、售后体系与真实使用场景均未成熟，量产爬坡与品控将是首要考验。",
  "no": 185
 },

  "title": "宇树开源了新大脑，机器人开始先预判再动手_中华网",
  "src": "Exa 搜索",
  "lede": "宇树开源了新大脑，机器人开始先预判再动手_中华网\n\n## 宇树开源了新大脑，机器人开始先预判再动手\n\n宇树于9月14日发布G1+，集中升级了机器人的感知与运动能力。\n\n颈部增加2个自由度，视觉系统升级为双目相机、广角单目相机和3D激光雷达；肩部与腰部电机的峰值扭矩提升一倍以上，发热量降低约70%。远场拾音系统升级为前4后2的六麦克风阵列，支持声源定位与降噪。头顶新增5个触摸点，背部增加DC 54.6V/5.7A外部供电接口，可支持持续供电运行。六项升级均集中在硬件，含税售价为9.5万元。\n\n身体越来越像人。装在里面那颗脑子，这次一个字没提。\n\n模型的事，四天前已经公布。9月10日，宇树发布新一代通用人形机器人基础模型UnifoLM-WLA-1.0，其中WLA是World-Language-Action，即世界-语言-动作。模型规模为6B；配套的UnifoLM-ER-1使用超过500万条具身推理样本，WLA模型使用约2500小时真机数据，一个模型覆盖64项任务，包括10项全身操作和54项桌面操作。9月11日，首批权重上线。\n\n一具身体挂价签，一颗脑子挂许可证。\n\n9 月 7 日晚上，一段 38 秒的视频。画面里没有遥控器，没有人举着 VR 头显。一台 G1 站在场地中间，人类拳手出拳，它双拳收到胸前格挡；一记鞭腿扫过来，它退后半步，稳住，回身还了一拳。视频上打了四个字：全程实拍，无加速。\n\n宇树把这场演示称作全球首次由世界模型实时驱动的全自主人形机器人格斗，背后是另一套模型 UnifoLM-X2-1.0。\n\n这三次发布集中在一周内：先用格斗演示实时决策能力，再开放新一代模型，随后发布升级后的机器人本体。\n\n01.先打一场，三天后再开源\n\n先把时间线摆出来。\n\n2025 年 9 月，UnifoLM-WMA-0 开源，WMA 是 World-Model-Action，核心词是世界。它的任务是把机器人动完之后世界会怎么变预测出来，可以当仿真引擎造训练数据，也可以接上动作头增强决策。\n\n2026 年 1 月，UnifoLM-VLA-0 开源，VLA 是 Vision-Language-Action，核心词换成动作。底座换到 Qwen2.5-VL，在 G1 上用一套策略跑通 12 类复杂操作任务。\n\n2026 年 9 月，宇树发布UnifoLM-WLA-1.0。WLA是World-Language-Action，即世界-语言-动作，指向世界建模、语言理解与动作生成的统一。\n\n把三个名称放在一起，可以看出宇树这一年的技术路线：先建模世界变化，再生成机器人动作，最后把世界变化预测、语言理解和动作生成纳入统一模型。\n\n宇树将9月发布的新模型命名为WLA-1.0。WLA是World-Language-Action，即世界-语言-动作，与前文所述统一世界建模、语言推理和动作生成的技术方向一致。\n\n9 月 7 日那场格斗用的 X2-1.0，没有出现在这批开源清单里。\n\n02.会认出杯子，不等于会伸手\n\n要理解 WLA 想解决什么，得先知道 VLA 卡在哪。\n\n过去两年机器人的视觉能力进展很快，能认出桌上是个杯子，能认出椅子和门。可认出和动手之间隔着一道沟。\n\n识别杯子，与判断杯子距桌沿多远、机械臂应从哪个角度接近、动作是否会碰倒旁边的水瓶，是两种不同层次的能力。这种感知与动作之间的落地差距可称为grounding gap。视觉语言模型从互联网图文中学到的知识，仍需经过具身数据训练才能转化为可靠的物理动作。\n\n宇树这次的答卷分两层。第一层是同步亮相的具身推理模型 UnifoLM-ER-1，4B 参数，底座是开源的 Qwen3-VL-4B，用了超过 500 万条具身推理样本，覆盖图像点预测、物体检测、多图推理、2D 轨迹预测、3D 物体检测、多图空间问答六类任务。\n\n在16项多模态感知与理解基准中，UnifoLM-ER-1有7项领先表中参评的开源模型：RefSpatial-Bench、Where2Place、PixMo-Point、BLINK、EmbSpatial、RoboSpatial和VSR。\n\n以其中两项为例：物体摆放预测Where2Place得分82.0，空间关系理解VSR得分88.1。两项基准都涉及机器人执行动作前的空间判断，例如目标位置能否放置物体、机械臂的运动是否会与周围物体发生干涉。\n\n这些分数需要结合评测方式理解。表中数据来自各模型的技术报告、公开论文和API测试，BLINK也只统计两个子任务，因此并非在统一模型版本、推理设置和评测流程下完成的横向比较。\n\n03.世界模型走了条省钱的路\n\n第二层是这套模型里最有意思的地方。\n\nVLA 之后，行业里冒出一条新路线，叫 WAM，World-Action Model，世界-动作模型。",
  "deep": "## AI 解读\n\n# 宇树“先预判再动手”：从本体竞赛转向大脑闭环\n\n核心要点\n\n1. 一周三连发，节奏即战略：9月7日格斗演示（X2-1.0实时决策）→9月10日开源WLA-1.0基础模型→9月14日发布G1+本体升级。先证明“脑子能打”，再开放“脑子”，最后卖“身体”，形成技术叙事到商业转化的完整链条。\n2. 技术路线清晰递进：WMA（预测世界变化）→VLA（生成动作）→WLA（世界-语言-动作统一），一年内完成三代模型迭代，核心是弥合“认出杯子”与“伸手拿杯子”之间的grounding gap。\n3. 硬件升级与模型开源解耦：G1+六项升级全在感知与运动硬件，售价9.5万元；模型权重单独开源。身体挂价签，脑子挂许可证——本体走量、模型建生态的双轨策略明确。\n\n影响分析\n\n宇树此举将竞争焦点从“机器人能做什么动作”推向“机器人能否预判再行动”。WLA若跑通，意味着人形机器人从遥操作演示迈向自主决策的关键一步，格斗视频中“无遥控、无VR、全程实拍”正是对这一能力的公开验证。开源策略则可能加速行业分工：中小团队可基于其模型做场景微调，宇树则通过生态锁定巩固本体出货优势。但需注意，X2-1.0未开源，核心实时决策能力仍握在手中，开源的是“基础能力”而非“最强能力”。真正的考验在于：WLA-1.0能否在非结构化环境中稳定泛化，而非仅在演示场景中“预判”成功。",

  "lede": "IP属地 中国·北京 编辑：沈如风 时间：2026-09-21 16:11:24 \n\n9月16日，乐享科技在上海完成全球首次具身智能大模型长时户外全自主直播：搭载其全新以太大模型的机器人在真实户外环境中连续作业1小时，从点单、任务规划、烧烤到上菜，全程自主完成。这也是全球首次，多台机器人在真实开放环境中自主交互、协作完成一整套任务。\n\n直播结束两天后，乐享科技于9月18日进一步发布以太大模型真实场景应用的第二个\"一镜到底\"视频。\n\n本次直播在线上超550万观众及现场超30位行业媒体的见证下进行。现场6名顾客随机点单、更改及新增需求，并可随意挪动物品、打断任务。直播中还出现插曲：原定的一位顾客临时未能到场，乐享科技没有停播，也没有调整流程，而是从围观观众中随机邀请了一位补位，将\"0预设、0剧本\"贯彻到底。全程没有遥操，也没有剪辑掉\"失误\"片段的机会。\n\n直播中，机器人展现出多项此前未有模型公开展示的能力：\n\n双机自主协作。烧烤机器人守在炉前，服务机器人穿梭于烤炉与餐桌之间，两台机器人互相传递任务信息，共同判断任务进度与配合方式。\n\n直播中两台机器人被观众称为\"二爷\"和\"五弟\"：服务机器人会将顾客的个性化需求（如多加辣椒粉）告知烧烤机器人；感觉顾客等久了，也会主动追问出餐进度。据介绍，这一双机交互全程没有一个预设的触发条件。\n\n长程任务断点续做。点单中途有顾客临时要求取水，机器人先将水送达，再回到桌边继续未完成的点单。期间它还主动为顾客递上纸巾——没有人提出过这一需求，完全来自机器人对场景规则的自主理解。\n\n精细操作与现场自学习。烧烤机器人按顾客要求将调料精准撒到食物上，并在恰当的时间主动刷上酱汁。它第一次抓调料瓶时未拿稳，经数次尝试后动作明显变稳——每一次抓取的成败，都直接成为修正下一次动作的依据。\n\n开放环境全身协调控制。直播场地完全开放，桌椅位置与人员动线事先无法预设。机器人迈出的每一步都是现场看、现场判断、现场决定，不依赖提前建好的地图和写死的路线。\n\n支撑此次直播的以太大模型，是乐享科技推出的全球首个跨本体通用具身大模型，具备主动感知、多模态理解、流式记忆、动力学建模、持续自我迭代五项相互咬合的核心能力，并实现了三个\"全球第一\"：\n\n全球第一个能量驱动的通用智能模型。不直接预测动作，而是把目标完成度、动力学一致性、记忆一致性、物理约束等统一为连续的能量景观，沿能量梯度持续推理、主动探索、生成动作。\n\n全球第一个类人脑神经元模型。把\"大脑—脊髓\"的贯通机制搬进机器，运动轨迹不靠数据\"猜\"、靠物理约束\"学\"。\n\n全球第一个自进化的具身智能模型。Evolution Manager让自我模型与世界模型从参数级到模型级持续自进化，部署不是能力的天花板，而是成长的起点。\n\n乐享科技表示，拿下\"全球首次\"不是这场直播最重要的意义。真正重要的是：一个具身智能模型，开始能离开高度受控的实验室，在不断变化的真实世界里持续工作。烧烤只是一次\"真题\"考试，未来不管机器人走进家庭、商业服务还是更多真实场景，它面对的始终是一个无法提前写完所有答案的世界。\n\n9月18日，乐享科技发布的第二个\"一镜到底\"视频，在此前十分钟双机协作的基础上，进一步加入了外界对任务的频繁打断、更精细的操作任务，以及机器人对人的意图理解与人机交互。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n乐享科技以太大模型机器人完成全球首次户外全自主直播，核心突破有三：一是去遥操、去剧本的真实开放环境验证，机器人连续作业1小时完成点单、烧烤、上菜全流程，中途随机补位顾客、临时改单等干扰均未中断任务；二是双机自主协作，两台机器人无预设触发条件下互相传递任务信息、协同判断进度；三是长程任务断点续做与现场自学习，机器人能自主处理插单、主动递纸巾，并通过抓取失败迭代修正动作。技术底座为全球首个跨本体通用具身大模型，主打能量驱动、类脑神经元与自进化三项机制。\n\n影响分析\n\n此次直播的行业意义不在\"烧烤\"本身，而在于验证了具身智能从受控实验室走向非结构化真实场景的可行性。开放环境下的全身协调控制、无预设多机协作、任务中断后的自主恢复，均是此前业内鲜有公开展示的能力，若能复现，将显著抬升具身智能的商业化门槛。对行业而言，这标志着竞争焦点从\"单点技能演示\"转向\"长时程自主性与泛化能力\"，遥操依赖和预设脚本的演示方式将加速被淘汰。需注意，单次直播仍属\"真题考试\"，其稳定性和跨场景迁移能力有待第三方复现验证，但方向性信号已足够明确：具身智能的落地叙事正从\"能不能做\"切换到\"能不能持续自主地做\"。",
  "no": 187
 },

  "title": "开启“机器人进家庭”时代！全球首个个人机器人启元Q1正式开售_凤凰网",
  "src": "Exa 搜索",
  "lede": "环球科技网\n\n2026年09月21日 11:47:05 来自北京\n\n你的第一个个人机器人,真的来了。\n\n9月20日,启元机器人在上海举办主题为“我和我的个人机器人”的全球首场发布会。会上,启元机器人正式开发售全球首个个人机器人启元Q1。\n\n作为品牌旗舰产品之一,启元Q1售价19,999元、启元Q1探索版售价26,999元,用户可通过启元机器人官方小程序、天猫、抖音、B站官方店铺,以及线下零售门店等参与订购,产品将于10月1日起陆续发货。个人机器人品类正式走向大众消费市场。\n\n“AI时代的重要个人终端,会是个人机器人。”发布会上,上纬新材CEO田华给出明确研判。他表示,个人机器人走进家庭会经历“有趣、有用、有爱”三个阶段,最终越来越懂用户,成为可靠、有温度的伙伴。\n\n上纬新材CEO 田华\n\n陪伴孩子成长的具身智能伙伴\n\n启元Q1并非“出场即定型”的机器人,它的软件功能可以不断更新、硬件支持自由改装,能够陪伴用户开放探索、共同成长,成为每个人探索AI与具身智能世界的入口。\n\n启元Q1跳脱传统屏幕局限,是陪伴孩子成长的具身智能伙伴。88厘米机身高度适配儿童站立视线,实现人机平视的平等沟通;身份、关系、偏好、场景、行为、边界等六重记忆能力,主动记录家庭成员喜好与相处细节,实现越用越懂用户的“养成式”陪伴。\n\n在学习上,感知模块化编程支持“手指一拖,自动生成程序”,无需复杂代码基础,即可将想法转化为机器人动作;内置行业唯一沉浸式任务卡训练模式的具身AI启蒙课,则将知识学习转化为闯关任务,摆脱灌输式学习模式。启元Q1还联合有道、编程猫、喜马拉雅、QQ音乐等合作伙伴,搭建覆盖AI启蒙、英语口语、思维训练的内容生态,为不同年龄段孩子提供体系化的成长学习支持。\n\n启元Q1能够摆脱千篇一律的造型,成为年轻人的具身科技潮玩。作为行业唯一支持3D打印外壳的个人机器人,启元Q1整机结构件全面开源,用户可自主设计外壳并3D打印改装外壳;依托PrimeFLOW创作引擎,它还支持性格、专属动作等自定义,用户仅凭一句话、一张图,即可生成专属机器人形态与人设,不管是居家陪伴、好友聚会还是短视频内容创作,都能够充分展现独属于使用者的个性表达。\n\n面向开发者等群体,启元Q1还能化身专业人士的具身实验平台。它实现从底层硬件到上层AI的全栈开放,产品配套SDK、HDK全套开发套件与PrimeToolkit一键直连工具链,兼容专业IDE插件,打通技能开发、仿真、真机验证的完整链路,让开发者自由释放创作灵感。\n\n建立全方位安全防护体系\n\n人机交互过程中,物理接触风险、个人信息保护等是消费级个人机器人走进千家万户不得不面对的现实命题。启元Q1通过将安全设计前置,搭建起了从物理交互到隐私数据的安全防护体系。\n\n在物理交互层面,启元Q1定制柔肤硅胶材质,全身采用无棱角的包裹式设计,搭配防夹关节,实现亲和接触;自研微型QDD准直驱关节,全身22个自由度,实现力控与位控的双向融合。用户一根手指就能推动手臂,牵手时全身协同同步联动、抱起时停止肢体运动不乱蹬、动作执行时感知周边环境防误伤,把握人机交互相处分寸,让陪伴更安心。\n\n同时,启元Q1拥有便携属性,47×37×21厘米折叠尺寸与99Wh可登机电池,既能装进20寸登机箱,也支持一键收纳进双肩背包,拓展了人形机器人的更多使用场景。\n\n在隐私安全层面,启元Q1同样坚持交互分寸边界。个人敏感信息执行本地脱敏处理,隐私权限默认关闭,调用前会明确告知用户人物档案、相处记忆等均在设备本地结构化存储,即便断网,机器人仍可识别人物、调取相处记忆,基础交互无需依赖云端。目前,启元机器人已在上海、深圳、西安、厦门、广州、杭州、武汉等城市落地线下体验门店,用户可实地体验产品交互能力。未来,面向个人机器人全新品类赛道,启元机器人也将持续推进技术与生态建设,推动具身智能进一步走进普通人的日常生活。\n\n上纬新材董事长 彭志辉\n\n上纬新材董事长彭志辉也在发布会现场分享了对个人机器人的理解:“机器人真正走向个人,不只是把技术做得更强,更重要的是让它真正进入每个人的生活与创造之中。”在他看来,个人机器人不应该只有一种标准答案,同一台启元Q1,可以是孩子的具身智能伙伴,可以是科技先锋的具身潮玩,也可以是一个面向开发者的专业实验平台。“机器人会越来越聪明、越来越有用,最后,成为人类创造力的延伸。它的属性,等着你来定义。”",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 品类破冰：启元Q1以19,999元起售，是全球首款面向大众市场正式开售的个人机器人，标志着人形机器人从工业/商用场景向消费级家庭场景的实质性跨越。\n2. 三重定位策略：同一硬件平台覆盖儿童陪伴（具身AI启蒙）、年轻人潮玩（3D打印开源改装）、开发者实验（全栈SDK/HDK开放），以“可成长、可定义”替代传统“出厂即定型”逻辑。\n3. 安全与隐私前置：物理层面采用柔肤硅胶、防夹关节、力位融合控制；数据层面强调本地脱敏、断网可用，直击家庭场景两大核心顾虑。\n\n影响分析\n\n短期看，2万元价格带处于“尝鲜门槛”与“大众普及”之间的临界点，首批用户大概率集中于一线城市中产家庭与科技爱好者，销量本身不是关键，品类认知建立才是核心目标。中期看，启元Q1的真正壁垒不在硬件参数，而在“六重记忆+养成式陪伴”能否形成用户粘性与数据飞轮——若成立，将复制智能音箱从“新鲜感”到“家庭基础设施”的路径，但天花板远高于前者。长期看，全栈开源+3D打印生态若吸引足够开发者，有望催生个人机器人的“应用商店”模式，但安全标准缺失、内容生态碎片化、以及“机器人进家庭”的伦理争议，将是品类规模化必须跨越的三道坎。上纬新材借此从材料端切入终端品牌，战略意图清晰，但执行验证周期至少需12-18个月。",
  "no": 188
 },

  "src": "X：通义千问 / Qwen (@Alibaba_Qwen)",
  "lede": "Qwen 宣布 Qwen-Image-2.1 现已支持 ComfyUI，权重开放。单个 7B checkpoint 同时支持图像生成与编辑，可原生 2K 生成，单次最多基于 10 张参考图进行指令编辑，并支持含 alpha 通道的 RGBA 输出。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 统一架构：Qwen-Image-2.1 以单一 7B checkpoint 同时覆盖图像生成与编辑，摒弃以往生成/编辑分模型的双轨路线，参数效率与部署便利性显著提升。\n2. 能力升级：原生支持 2K 分辨率输出；单次可基于最多 10 张参考图执行指令编辑，多图条件控制能力进入第一梯队；支持含 alpha 通道的 RGBA 输出，直接对接设计、电商、游戏等生产管线。\n3. 生态落地：官方支持 ComfyUI 并开放权重下载，意味着模型可被本地部署、二次开发与工作流集成，绕开闭源 API 的调用限制与成本约束。\n\n影响分析\n\n对开源社区而言，7B 体量意味着消费级显卡即可运行，叠加 ComfyUI 原生支持，落地门槛大幅降低，有望快速形成插件与工作流生态。对行业而言，生成与编辑合一的架构正在成为主流范式，闭源商业模型在\"多图参考编辑+高分辨率+透明通道\"这一组合上的差异化优势被进一步压缩。RGBA 输出的加入尤其关键——它把 AI 生成从\"出图\"推进到\"可直接合成\"的生产环节，对设计工具链和内容工业化流程构成实质冲击。总体看，这是开源阵营在多模态图像领域又一次能力对齐，竞争焦点正从单点指标转向工程可用性与生态整合。",

  "title": "特朗普为何要以“最高外交礼遇”接待习近平？ - 要闻解说- RFI",

  "lede": "发表时间： 20/09/2026 - 14:37\n\n 下周国际关注的焦点无疑将是“习近平访美”，上次他对美国进行国是访问还是在2015年，紧接着2016年，特朗普首次竞选总统，那时他还经常将中国描述为美国经济的威胁，指责中国掏空了美国制造业。十年后的今天，特朗普似乎像变了一个人。据悉，这一次为了迎接习近平到访，他甚至提前在白宫南草坪准备了直升机停机坪，并遗憾地表示自己计划建设的宴会厅无法及时完工，无法用于接待这位中国领导人。要知道，他通常都是直接在白宫接待贵宾，亲自前往停机坪迎接的情况极为罕见，因此这一次的最高外交礼遇可以说给足了中方“面子”。 \n\n 2026年5月15日星期五，美国总统唐纳德·特朗普（右）在北京中南海花园离开时，与中国国家主席习近平握手。 © Evan Vucci / Pool Reuters via AP \n\n为什么十年间特朗普的态度会有如此大的转变？ \n\n其实从这位美国领导人的一贯行事态度就能看出，他似乎对敌人总是很宽容，对盟友又过于严厉。十年前他需要靠针对中国的强硬言论入主白宫，但他很快发现，对中国施压完全没用。\n\n美联社发布的分析文章指出，特朗普一直坚称美国在各方面都领先于中国，但他去年试图通过不断升级的关税措施向中国施压，却未能取得预期效果。\n\n美联社采访的国际危机组织（International Crisis Group）高级顾问迈克尔·科夫里格（Michael Kovrig）表示：“特朗普之所以大幅调整对华策略，是因为他最初试图依靠超高关税和出口限制来施压中国的做法并未成功。”“习近平和特朗普进行了一场关于筹码和影响力的较量，而最终占上风的是习近平。”\n\n不过也不是态度强硬就管用，伊朗的态度也很强硬，最后换来的是更严厉的制裁。中国的筹码还在于自身的实力。十年间，中国不仅进一步扩大了在制造业领域的主导地位，还在人工智能、电动车等新兴技术领域快速推进。\n\n而且特朗普的对华关税政策并没有削弱中国制造业。中国不仅开拓了新的出口市场，也在许多行业挤压了其他工业化国家竞争者的空间。去年，中国对全球实现了1.2万亿美元的贸易顺差。更不要说，中国手里最重要的王牌是中国在电子产品所需稀土资源方面拥有的垄断地位。\n\n因此，在一个又一个有争议的问题上，特朗普都对习近平采取了相对宽容的态度。比如，对于有关中国向伊朗提供卫星图像的报道，特朗普轻描淡写地回应说：“我认为他的表现相当合理。”他还多次表达自己和习近平关系很好。\n\n特朗普的这种态度，是否也为他带来了一些象征性的成果呢？\n\n与习近平保持良好关系并非毫无收获。美联社的分析显示，民主党总统拜登执政期间，习近平仅在国际峰会场边与他举行过三次会谈，而特朗普则实现了双方互访的国是访问安排，这被视为世界两大经济体领导人之间高度互信的象征。根据美国方面的数据，与2025年同期相比，美国对华商品贸易逆差有所下降。不过，美国政府同时指出，中国似乎正在通过越南等第三国转运商品，以降低美国关税带来的影响。\n\n但是客观来讲，最终获利更多的还是中国。\n\n特朗普曾在公开演讲中嘲讽法国总统马克龙；由于部分北约成员国未全力支持其对伊朗发动战争的决定，他对北约的态度也时冷时热；此外，他还与长期盟友加拿大展开激烈贸易争端，甚至多次戏称加拿大应成为美国“第51个州”。\n\n可以说由于特朗普的“助攻”，尽管中国的过剩产能和产品倾销威胁本国经济，还是有越来越多的国家都希望与中国建立联系，来化解特朗普制造的问题。\n\n甚至有分析人士指出，他实际上是在替习近平执行分化西方阵营的策略，同时也帮助习近平塑造了中国作为一个更加稳定、更负责任大国的形象。\n\n那么下周的国是访问能否取得实质成果呢？\n\n美联社采访的美国乔治敦大学教授、前奥巴马政府国家安全委员会中国事务主任埃文·梅德罗斯（Evan Medeiros）说，此次访问最大的成果或许就是两国领导人之间的关系本身，而不是明确、可量化的政策目标。\n\n目前来看，中美双方目前都在利用贸易休战期进行战略调整。AI议题也成了双方的核心关切，尽管先进芯片获取受到限制，中国仍在持续加强军事实力和人工智能能力建设，与此同时，特朗普政府则积极推动稀土供应链合作项目。\n\n唯一确定的是，如果人工智能真的决定未来全球竞争格局，这对于特朗普及美国经济而言将构成重大挑战。 \n\n 作者： 左依",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 姿态逆转的实质：特朗普以罕见高规格接待习近平，并非个人好感的转变，而是对华施压策略失效后的务实回调。关税战未能削弱中国制造业，反而推动中国加速开拓新市场、巩固稀土等关键领域垄断地位。\n2. 筹码天平倾斜：2025年中国实现1.2万亿美元贸易顺差，在AI、电动车等赛道持续突破。科夫里格的判断点明关键——这是一场筹码与影响力的较量，占上风的是习近平。\n3. 象征性收益有限：互访安排与贸易逆差收窄是特朗普可宣扬的成果，但中国经第三国转运规避关税，实际获利更多仍在中方。\n\n影响分析\n\n此次访问的最大成果可能仅是领导人关系本身，而非可量化的政策突破。更深层的影响在于战略格局：特朗普对盟友的反复施压客观上推动各国寻求与中国建立联系，替中方完成了分化西方阵营的部分工作，并助力中国塑造“稳定、负责任大国”形象。中美双方正利用贸易休战期进行战略调整，AI与稀土供应链成为核心博弈点。若AI真决定未来竞争格局，美国面临的挑战将不止于贸易层面，而是结构性实力对比的持续位移。",
  "no": 190
 },

  "title": "Qwen 开源 Qwen-Image-2.1：7B 统一生成与编辑并原生支持透明图像",
  "src": "Qwen：Blog Retrieval（API）",
  "lede": "Qwen 团队开源 Qwen-Image-2.1，将文生图与图像编辑统一到一个模型中，视觉生成组件仅 7B 参数，并原生支持生成和编辑透明图像。模型支持最多 10 张参考图、圆形/涂鸦/独立蒙版指定局部编辑，通过混合粒度注意力架构和 KV cache 复用提升推理效率，同时改进文字渲染、人像光照与人物产品保真度，并覆盖全景图、信息图和分镜等任务。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 架构统一：Qwen-Image-2.1 将文生图与图像编辑合并进单一模型，视觉生成组件仅 7B 参数，打破以往“生成模型+编辑模型”分立的产品形态。\n2. 透明图像原生支持：直接生成和编辑带 alpha 通道的透明图，直击电商、设计、游戏素材等高频刚需场景，此前多为闭源商业工具的能力。\n3. 工程效率优化：混合粒度注意力 + KV cache 复用，配合最多 10 张参考图与多种局部蒙版（圆形/涂鸦/独立），在可控性与推理成本间取得平衡。\n4. 能力补强：文字渲染、人像光照、人物与产品保真度提升，并覆盖全景图、信息图、分镜等任务，指向生产力工具而非玩具。\n\n影响分析\n\n对开源生态而言，7B 的统一模型显著降低了“生成+编辑”一体化能力的部署门槛，中小团队可在消费级显卡上落地，有望催生一批轻量级设计、电商与内容创作工具。对闭源厂商（如 Adobe、部分商业 API）构成直接压力，透明图与局部编辑是其长期收费壁垒，如今被开源方案正面冲击。更关键的是，统一架构意味着生成与编辑共享表征，未来迭代可同步提升两端能力，开源多模态的竞争正从“单点能力”转向“一体化工作流”，行业洗牌或将加速。",
  "no": 191
 },

  "lede": "阶跃星辰发布旗舰基座模型 Step 5 Preview，采用稀疏 MoE 架构，总参数量 600B、激活 27B，支持 100 万 Token 上下文和文本与视觉输入，在 Artificial Analysis Intelligence Index 得 44 分，居全球开源模型前三，单任务成本为 Claude Opus 5 的 1/8。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 技术规格：Step 5 Preview采用稀疏MoE架构，总参数600B、激活仅27B，支持100万Token上下文与文本/视觉多模态输入。\n2. 性能定位：Artificial Analysis Intelligence Index得分44，跻身全球开源模型前三。\n3. 成本优势：单任务成本仅为Claude Opus 5的1/8，性价比突出。\n4. 开源策略：10月15日开源权重，走开放生态路线。\n\n影响分析\n\n此次发布标志着国产大模型在“高性能+低成本”组合上取得实质突破。稀疏MoE架构以27B激活参数撬动600B总容量，兼顾推理效率与能力上限，百万级上下文则打开了长文档、代码库级Agent应用的想象空间。44分的智能指数意味着开源阵营与闭源头部的差距进一步收窄，而1/8的成本优势将直接冲击企业级API市场——对成本敏感的开发者和中小团队而言，开源权重+低价推理构成强吸引力。\n\n更深层看，阶跃星辰选择开源权重，是在用生态换规模，试图在巨头林立的基础模型赛道中抢占开发者心智。这可能加速行业价格战，并推动更多厂商重新评估“闭源高溢价”策略。若Step 5正式版如期兑现Preview承诺，其有望成为下半年开源模型格局的重要变量。",

  "url": "https://www.buchodi.com/chatgpt-now-knows-what-you-do-on-other-websites-via-ad-collector",
  "title": "独立调查：ChatGPT 的 __obi 跨站 Cookie 可将站外浏览行为关联到 ChatGPT 账号",
  "src": "Hacker News 热门（buzzing.cc 中文翻译）",
  "lede": "作者通过自己手机上的流量捕获复现了 OpenAI 广告收集器机制：bzr.openai.com 在 .openai.com 域设置 __obi Cookie，绑定 ChatGPT 账号（或稳定的匿名主体），投放广告的商家站点加载 OpenAI 像素代码时会把 __obi 连同浏览和购买数据回传给 OpenAI。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 跨站追踪机制落地：OpenAI通过`bzr.openai.com`在`.openai.com`域写入`__obi` Cookie，作为用户（含匿名主体）的稳定标识符，实现跨站身份绑定。\n2. 广告像素回传闭环：投放OpenAI广告的商家站点加载其像素代码后，会将`__obi`与用户的浏览、购买行为一并回传，形成\"站外行为→ChatGPT账号\"的关联链路。\n3. 可复现性：作者通过手机流量捕获独立验证，说明该机制并非理论推测，而是已实际运行的广告基础设施。\n\n影响分析\n\n此举标志着OpenAI从纯订阅/API商业模式向广告变现延伸，`__obi`本质是广告技术栈中的通用用户ID（类似Google的`_ga`或Meta的`_fbp`）。关键影响有三：\n\n其一，隐私边界模糊。ChatGPT账号通常关联真实身份与敏感对话数据，一旦与站外消费、浏览行为打通，用户画像的颗粒度将远超传统广告平台，监管风险显著上升，尤其在欧洲GDPR与加州CCPA框架下可能面临合规质疑。\n\n其二，信任成本转移。用户对ChatGPT的核心预期是\"对话工具\"，而非\"行为追踪器\"。跨站关联若未充分披露与授权，可能触发用户信任反噬。\n\n其三，行业信号：AI头部玩家正加速复制成熟广告生态的追踪范式，意味着\"AI+广告\"的隐私博弈将成为下一阶段监管焦点。",

  "url": "https://news.qq.com/rain/a/20260920A01RI500",
  "title": "宇树发布通用人形机器人基础模型_腾讯新闻",
  "src": "Exa 搜索",
  "lede": "IT时代网\n\n问AI · 相较于传统分策略系统，新模型如何缩减迁移成本？\n\nIT时代网9月20日消息，宇树科技近日发布通用人形机器人基础模型 UnifoLM-WLA-1.0。其具身推理底座 UnifoLM-ER-1-4B在16项多模态感知与理解基准中，有7项领先参评的开源模型，整体结果与多款闭源模型处于相近水平。项目当前已开放部分模型权重和数据。\n\n在16项多模态感知与理解基准测试中，基于 Qwen3-VL-4B构建的UnifoLM-ER-1在7项上取得开源模型最佳成绩。优势主要集中在空间理解与推理，覆盖RefSpatial-Bench、Where2Place、PixMo-Point、BLINK、EmbSpatial、RoboSpatial和VSR等基准，部分指标高于Gemini-ER 2等闭源模型。\n\nUnifoLM-WLA-1.0覆盖64项任务，包括10项全身操作和54项桌面操作，由一个6B参数模型统一承担，并支持二指夹爪和多种五指灵巧手。WLA即世界—语言—动作，模型把具身推理、未来动态区域预测和动作生成纳入统一框架，让机器人先理解当前环境和可能发生的变化，再生成动作。\n\n过去的人形机器人系统常针对不同任务训练或配置不同策略，开发和迁移成本较高。同一个模型同时覆盖桌面操作与全身操作，并协调机械臂、末端执行器与下肢动作，有望减少为每项任务分别开发策略的重复工作。\n\n目前宇树已上线UnifoLM-WLA-1.0项目主页，开放部分模型权重和数据；后训练代码、UnifoLM-WLA-Base权重、全身遥操作数据集和操作数据集仍列在后续开放计划中。\n\n注：本文中包含AI辅助创作的内容。\n\n编辑：刘宁",
  "deep": "## AI 解读\n\n# 宇树通用人形机器人基础模型：从\"一任务一策略\"到统一具身底座\n\n核心要点\n\n1. 统一架构替代分策略系统：UnifoLM-WLA-1.0以单一6B参数模型覆盖64项任务（10项全身操作+54项桌面操作），将具身推理、未来动态预测与动作生成纳入\"世界—语言—动作\"统一框架，直接回应传统人形机器人\"一任务一策略\"的高迁移成本痛点。\n2. 推理底座对标闭源：基于Qwen3-VL-4B构建的UnifoLM-ER-1在16项基准中7项取得开源最佳，优势集中于空间理解与推理，部分指标超越Gemini-ER 2等闭源模型——空间推理恰是具身操作的关键瓶颈。\n3. 开放策略审慎：当前仅开放部分权重与数据，后训练代码、Base权重及全身遥操作数据集仍在后续计划中，生态号召力有待观察。\n\n影响分析\n\n此次发布标志着人形机器人竞争从\"硬件本体+定制策略\"转向\"通用基础模型+跨任务泛化\"。若统一模型能真正降低迁移成本，将重塑行业开发范式，使中小玩家无需为每项任务重复训练策略，加速人形机器人从演示走向规模落地。空间推理能力的领先，也意味着宇树在\"理解环境\"这一具身智能核心环节建立了差异化优势。但需注意，基准测试成绩与实际物理操作泛化能力之间仍存在鸿沟，模型能否在真实全身协调场景中稳定迁移，是验证其价值的关键。整体看，这是国产人形机器人向\"具身基础模型\"路线迈进的标志性一步，但生态开放节奏与工程落地效果仍需持续跟踪。",
  "no": 194
 },

  "title": "宇树开源了新大脑，机器人开始先预判再动手 _TOM科技",

  "lede": "科技 TOM 2026-09-20 10:35\n\n宇树于9月14日发布G1+，集中升级了机器人的感知与运动能力。\n\n颈部增加2个自由度，视觉系统升级为双目相机、广角单目相机和3D激光雷达；肩部与腰部电机的峰值扭矩提升一倍以上，发热量降低约70%。远场拾音系统升级为前4后2的六麦克风阵列，支持声源定位与降噪。头顶新增5个触摸点，背部增加DC 54.6V/5.7A外部供电接口，可支持持续供电运行。六项升级均集中在硬件，含税售价为9.5万元。\n\n身体越来越像人。装在里面那颗脑子，这次一个字没提。\n\n模型的事，四天前已经公布。9月10日，宇树发布新一代通用人形机器人基础模型UnifoLM-WLA-1.0，其中WLA是World-Language-Action，即世界-语言-动作。模型规模为6B；配套的UnifoLM-ER-1使用超过500万条具身推理样本，WLA模型使用约2500小时真机数据，一个模型覆盖64项任务，包括10项全身操作和54项桌面操作。9月11日，首批权重上线。\n\n一具身体挂价签，一颗脑子挂许可证。\n\n9 月 7 日晚上，一段 38 秒的视频。画面里没有遥控器，没有人举着 VR 头显。一台 G1 站在场地中间，人类拳手出拳，它双拳收到胸前格挡；一记鞭腿扫过来，它退后半步，稳住，回身还了一拳。视频上打了四个字：全程实拍，无加速。\n\n \n\n图注：9 月 7 日演示画面，场地里没有遥控器，也没有 VR 头显。图片来源：宇树科技官方演示视频\n\n宇树把这场演示称作全球首次由世界模型实时驱动的全自主人形机器人格斗，背后是另一套模型 UnifoLM-X2-1.0。\n\n这三次发布集中在一周内：先用格斗演示实时决策能力，再开放新一代模型，随后发布升级后的机器人本体。\n\n01.先打一场，三天后再开源\n\n先把时间线摆出来。\n\n2025 年 9 月，UnifoLM-WMA-0 开源，WMA 是 World-Model-Action，核心词是世界。它的任务是把机器人动完之后世界会怎么变预测出来，可以当仿真引擎造训练数据，也可以接上动作头增强决策。\n\n2026 年 1 月，UnifoLM-VLA-0 开源，VLA 是 Vision-Language-Action，核心词换成动作。底座换到 Qwen2.5-VL，在 G1 上用一套策略跑通 12 类复杂操作任务。\n\n2026 年 9 月，宇树发布UnifoLM-WLA-1.0。WLA是World-Language-Action，即世界-语言-动作，指向世界建模、语言理解与动作生成的统一。\n\n把三个名称放在一起，可以看出宇树这一年的技术路线：先建模世界变化，再生成机器人动作，最后把世界变化预测、语言理解和动作生成纳入统一模型。\n\n \n\n图注：9 月 10 日宇树发布的开源主视觉，背景是官方演示里的任务画面。图片来源：宇树科技官方项目页\n\n宇树将9月发布的新模型命名为WLA-1.0。WLA是World-Language-Action，即世界-语言-动作，与前文所述统一世界建模、语言推理和动作生成的技术方向一致。\n\n9 月 7 日那场格斗用的 X2-1.0，没有出现在这批开源清单里。\n\n02.会认出杯子，不等于会伸手\n\n要理解 WLA 想解决什么，得先知道 VLA 卡在哪。\n\n过去两年机器人的视觉能力进展很快，能认出桌上是个杯子，能认出椅子和门。可认出和动手之间隔着一道沟。\n\n识别杯子，与判断杯子距桌沿多远、机械臂应从哪个角度接近、动作是否会碰倒旁边的水瓶，是两种不同层次的能力。这种感知与动作之间的落地差距可称为grounding gap。视觉语言模型从互联网图文中学到的知识，仍需经过具身数据训练才能转化为可靠的物理动作。\n\n宇树这次的答卷分两层。第一层是同步亮相的具身推理模型 UnifoLM-ER-1，4B 参数，底座是开源的 Qwen3-VL-4B，用了超过 500 万条具身推理样本，覆盖图像点预测、物体检测、多图推理、2D 轨迹预测、3D 物体检测、多图空间问答六类任务。\n\n在16项多模态感知与理解基准中，UnifoLM-ER-1有7项领先表中参评的开源模型：RefSpatial-Bench、Where2Place、PixMo-Point、BLINK、EmbSpatial、RoboSpatial和VSR。\n\n \n\n图注：官方演示视频里的成绩表，UnifoLM-ER-1-4B 排在第一行。按表格脚注，各家数据来自模型官方技术报告、公开论文，或者用模型官方 API 自测；BLINK 只取其中两个子任务的平均。图片来源：宇树科技 UnifoLM-WLA-1.0 官方演示视频\n\n以其中两项为例：物体摆放预测Where2Place得分82.0，空间关系理解VSR得分88.1。",
  "deep": "## AI 解读\n\n# 宇树一周三连发：本体升级是表，世界模型才是里\n\n核心要点：宇树在9月7日至14日一周内完成三步棋——先以38秒无遥控格斗视频展示X2-1.0世界模型的实时决策能力，再开源WLA-1.0基础模型（6B参数、2500小时真机数据、64项任务），最后发布G1+本体升级。硬件升级（颈部自由度、双目+激光雷达、扭矩翻倍）明码标价9.5万元，但真正的战略资产——模型权重——走的是开源许可路径。技术路线清晰可见：从WMA（预测世界变化）到VLA（生成动作）再到WLA（三者统一），一年三步完成架构收敛。\n\n影响分析：这一布局的深意在于把本体变成模型的载体而非利润中心。硬件定价压低门槛，模型开源换取生态采用率，本质是用\"身体挂价签、脑子挂许可证\"的方式抢占具身智能的操作系统位。对行业而言，宇树把竞争焦点从关节扭矩拉到了世界模型的泛化能力上——格斗演示证明的是\"预判再动手\"的闭环，而非单纯的运动控制。若WLA-1.0的64项任务能在第三方本体上复现，宇树将从硬件厂商跃升为具身智能的底层标准制定者。风险在于：开源模型的商业化路径尚不清晰，且X2-1.0未同步开源，核心能力仍留了一手。",

 },

  "id": "robotics-1789952409074-5",

  "url": "https://chinaaet.com/article/3000180489",
  "title": "宇树科技开源具身基座模型让人形机器人“理解世界”-AET-电子技术应用",
  "src": "Exa 搜索",
  "lede": "宇树科技开源具身基座模型让人形机器人“理解世界”-AET-电子技术应用\n\n#### 宇树科技开源具身基座模型让人形机器人“理解世界” \n\n7项评测领先开源模型\n\n##### 日期： 2026-09-20 \n\n##### 来源：财经网\n\n当“把积木放进碗里”的任务指令，分别下达给部署在真实机械臂上的GPT-6 Astra和Claude Fable 5.1时，在20次测试中，二者的成功次数分别为19次和8次，对应成功率95%和40%。但当任务细化为“把拼图块插入对应的凹槽”时，GPT-6 Astra的成功率滑落至10%。\n\n这是近期独立第三方机器人基准测试平台Robocurve公布的一项实测结果。结果表明，顶尖大模型已经展现出操控物理设备的能力，但在精细操作层面仍存在短板。而这也是具身智能落地真实场景亟待突破的难题：机器人不仅要能听懂指令，更需要具备感知环境、理解空间、自主决策的能力。\n\n在这一背景下，具身智能赛道的头部企业正试图给出解题思路。2026年9月10日，宇树科技宣布完全开源新一代通用人形机器人基础模型UnifoLM-WLA-1.0，该模型依托大规模通用多模态感知与理解数据，融合以交互为中心的世界建模，全面提升空间感知与理解能力。在多项具身推理评测中，其表现领先国内外开源模型，亦可比肩头部闭源模型，标志着通用人形基础模型领域迎来重要突破。\n\n2500小时真机数据训练，单模型覆盖64项任务\n\n过去数年，机器人模型的训练大多聚焦单项任务、单一机器人本体及固定操作场景。一旦更换任务或调整环境，往往需要重新采集数据并进行训练。当前，NVIDIA GR00T、Figure Helix、Physical Intelligenceπ系列等具身智能基础模型，均致力于提升跨任务、跨环境与跨本体迁移中的泛化能力。打造通用“具身大脑”、打通多场景作业能力，已经成为行业角逐的焦点。\n\n宇树科技也着力提升模型的泛化能力、数据利用效率和强化学习的规模效应。宇树科技宣布开源UnifoLM-WLA-1.0，代码、模型权重与数据集将陆续开放。据公司介绍，该模型参数量为6B，利用2500小时高质量真机采集数据训练，覆盖多种机器人本体与作业场景，包括宇树开源数据以及第三方机器人数据。一套模型即可完成64项差异化任务。模型兼容二指夹爪与两类灵巧手，支持不同末端执行器切换。\n\n根据宇树给出的真机实验结果，搭载该模型的机器人可协同调动双臂、末端执行器与下半身，完成包括54项桌面操作任务以及10项全身移动操作任务。桌面场景涉及收纳餐盘、电池充电等需要精细操作的任务；全身移动操作则延伸至垃圾处理、鞋子整理、沙发整理以及在较大空间范围内取放物品等场景。\n\n这种“一模驱动、全身协同”的设计，不仅降低了针对不同机器人本体和特定场景的训练成本，还显著提升了模型在开放环境中的指令理解能力和跨任务泛化能力，有望为通用人形机器人的规模化落地奠定技术基础。\n\n多项具身推理指标领先，让机器人“理解世界”\n\n机器人要在真实环境中实现“看得懂、摸得准、干得稳”，离不开对物理世界的感知与理解能力。譬如，机器人执行整理房间、铺床、整理厨房物品等任务时，往往需要根据物体状态和空间位置调整动作；当物体被移动、折叠或拿起后，环境也会随之发生改变，后续决策需要建立在更新后的场景状态之上。\n\n围绕这一问题，宇树科技为UnifoLM-WLA-1.0设计了一套“具身推理+未来变化预测+动作学习”体系：机器人既要理解当前看到的空间和物体，也要预测一次交互可能让场景中的什么地方发生变化，再生成具体动作。\n\n具身推理层面，宇树科技介绍，作为UnifoLM-WLA-1.0的具身推理模块，UnifoLM-ER-1-4B基于Qwen3-VL-4B，采用超过500万条训练数据，覆盖图像点预测、目标检测、多图推理、2D轨迹预测、3D目标检测及多图空间问答等任务，并与通用图文数据混合训练，在保持通用视觉语言能力的同时，全面提升具身场景下的空间理解与推理能力。\n\n根据宇树科技公布的16项多模态感知和理解评测结果，UnifoLM-ER-1-4B在7项评测中领先其他模型。例如，其在Where2Place测试中取得82.0分，比GPT-6 Astra高出13分；Pixmo-Point为73.8分，BLINK达93.4分，EmbSpatial为88.9分，反映出模型在空间感知、场景理解等维度的系统性优势。\n\n除了全面提升空间理解与推理能力，UnifoLM-WLA-1.0 进一步强化机器人的“预测”能力，让机器人在行动前“多想一步”。宇树科技介绍，模型以图像以及任务描述或动作为条件，预测未来场景的动态区域；训练过程中，使用光流提取未来场景变化区域作为监督信号，得到UnifoLM-ER-Flow模型。",
  "deep": "## AI 解读\n\n# 宇树开源具身基座模型：人形机器人“理解世界”的关键一跃\n\n核心要点\n\n1. 技术突破：宇树开源UnifoLM-WLA-1.0（6B参数），以2500小时真机数据训练，单模型覆盖64项任务，兼容夹爪与灵巧手，实现“一模驱动、全身协同”。\n2. 架构创新：采用“具身推理+未来变化预测+动作学习”体系，其ER模块在16项评测中7项领先，空间感知指标显著优于GPT-6 Astra。\n3. 行业痛点直击：第三方测试显示顶尖大模型精细操作成功率骤降（95%→10%），具身智能落地瓶颈在于空间理解而非指令理解。\n\n影响分析\n\n宇树此次开源具有双重意义。技术层面，其“预测未来场景变化”的设计思路跳出了传统模仿学习框架，让机器人从“被动执行”转向“主动理解物理规律”，这是通用具身大脑的关键能力跃迁。产业层面，完全开源代码、权重与数据集，将显著降低中小团队的研发门槛，可能加速行业从“单任务定制”向“通用基座+场景微调”的范式转移。但需注意，2500小时数据规模与真实场景的多样性仍有差距，跨本体泛化能力待第三方验证。若生态跟进顺利，2027年或成人形机器人规模化落地拐点。",
  "no": 196
 },

  "lede": "2026年09月20日 07:14 来源：中国新闻网\n\n 中新网 9月20日电 由于中东局势紧张，当地时间19日，美国国务院发布安全提醒，建议身处中东地区的美国公民保持高度警惕，其他地区的美国公民慎重前往中东地区。\n\n 美国务院发布声明说，鉴于中东地区的紧张局势，当地安全环境复杂，并存在局势意外升级的可能性。目前身处中东地区的美国公民应保持高度警惕、谨慎行事，并为可能的航班取消、空域阶段性关闭及旅行中断做好应对准备。\n\n 声明还称，也门胡塞武装与沙特阿拉伯之间的冲突持续升级，其中还包括对民用机场的袭击。这一军事冲突存在迅速升级的可能性。\n\n 声明警告称，身处中东以外地区的美国公民应重新考虑前往或途经该地区的行程。\n\n 据卡塔尔半岛电视台报道，沙特阿拉伯主导的多国联军发言人图尔基·马利基19日说，沙特防空部队当天凌晨拦截了一枚也门胡塞武装向沙特首都利雅得发射的弹道导弹。\n\n 另一方面，也门胡塞武装同日宣布，该组织使用“大量弹道导弹、有翼导弹和无人机”，袭击了沙特阿拉伯首都利雅得的“敏感目标”以及沙特阿美石油公司位于延布的设施。\n\n 【编辑:管娜】",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 美方预警升级：美国国务院发布安全提醒，明确指向中东局势存在“意外升级”可能，并首次将建议范围扩大至中东以外公民，要求“重新考虑行程”，预警级别显著提高。\n2. 冲突主体明确：胡塞武装与沙特联军的对抗持续激化，双方行动已从边境延伸至首都利雅得及沙特阿美核心设施，袭击目标兼具军事与能源战略属性。\n3. 风险外溢信号：提醒中具体提及航班取消、空域关闭等旅行中断场景，表明美方评估冲突可能冲击民用航空与区域物流通道。\n\n影响分析\n\n短期看，美方预警将加剧国际社会对中东安全风险的定价，可能推高能源市场波动溢价，并促使更多国家跟进发布旅行警告。胡塞武装对沙特阿美设施的袭击直接触及全球能源供应链敏感神经，若冲突进一步升级，油价短期上行压力难以避免。中期而言，美方此举既是对盟友的安全背书，也可能为后续军事或外交介入预留空间。区域层面，沙特面临本土安全与能源设施双重压力，可能被迫调整在也门问题上的策略。整体判断：局势正从“代理人摩擦”向“直接战略打击”滑动，误判风险上升，需密切关注空域管制与能源设施遇袭的后续连锁反应。",
  "no": 197

  "lede": "美方表态“已准备好与伊朗谈判并达成协议”，伊朗方面开出7项谈判条件，双方互动显示外交窗口重新打开。原油暗盘直线跳水，市场将谈判信号解读为地缘供应风险下降，前期计入的冲突溢价被快速挤出。伊方7项条件意味着谈判门槛不低，短期内达成实质性协议的概率仍需审慎评估。\n\n油价逻辑切换，原油定价中的地缘风险溢价对消息高度敏感，若谈判预期持续发酵，布伦特与WTI短期承压，波动率上升，但需警惕“预期先行、落地滞后”造成的反复。美伊若走向谈判桌，将牵动以色列、沙特及海湾国家安全算盘，中东代理人冲突强度可能阶段性缓和，但结构性矛盾未解。能源板块需区分“情绪冲击”与“基本面拐点”，在协议未落地前，供应端变量仍由OPEC+政策主导，不宜单边押注油价趋势性下行。后续关键观察点在于谈判是否进入实质议程、制裁松动是否有具体动作。",
  "deep": "## AI 解读\n\n# 美伊谈判信号与油价异动：地缘风险溢价面临重估\n\n核心要点\n\n1. 信号释放：美方表态“已准备好与伊朗谈判并达成协议”，伊朗方面开出7项谈判条件，双方互动显示外交窗口重新打开。\n2. 市场即时反应：原油暗盘直线跳水，表明市场将谈判信号解读为地缘供应风险下降，前期计入的冲突溢价被快速挤出。\n3. 条件博弈：伊方7项条件意味着谈判门槛不低，短期内达成实质性协议的概率仍需审慎评估。\n\n影响分析\n\n第一，油价逻辑切换。原油定价中的地缘风险溢价对消息高度敏感，若谈判预期持续发酵，布伦特与WTI短期承压，波动率上升。但需警惕“预期先行、落地滞后”造成的反复。\n\n第二，区域格局。美伊若走向谈判桌，将牵动以色列、沙特及海湾国家安全算盘，中东代理人冲突强度可能阶段性缓和，但结构性矛盾未解。\n\n第三，投资含义。能源板块需区分“情绪冲击”与“基本面拐点”，在协议未落地前，供应端变量仍由OPEC+政策主导，不宜单边押注油价趋势性下行。后续关键观察点：谈判是否进入实质议程、制裁松动是否有具体动作。",

  "url": "https://finance.sina.com.cn/roll/2026-09-20/doc-inismkxk9449093.shtml",
  "title": "特朗普签署对俄制裁新法案_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "特朗普签署对俄制裁新法案\n\n 2026年09月20日 07:32 环球网\n\n 特朗普签署对俄制裁新法案，英媒：该法案为全球经济注入了更多不确定性\n\n 据美国《国会山报》等媒体19日报道，美国总统特朗普当地时间18日正式签署一项针对俄罗斯和伊朗的制裁法案。据报道，该法案名为《2026年林赛·格雷厄姆制裁俄罗斯和伊朗法案》，此前于本月16日在美国国会众议院通过，今年8月获参议院通过。法案涉及对俄政府高级官员、相关金融机构及俄“影子船队”等实施制裁，还允许美国政府对购买俄石油或天然气的前五大进口国征收最高100%的关税等。\n\n特朗普 资料图 图源：视觉中国\n\n 俄乌反应鲜明对立\n\n 法新社等媒体称，该法案是特朗普重返白宫以来，美国国会对俄采取的首个重大行动。据乌通社报道，乌总统泽连斯基19日凌晨在社交媒体上对美签署该法案表示感谢。乌外长瑟比加称，18日是“历史性一天”，俄方的“盘算再次落空”，美方此举将加大对俄施压力度，进一步孤立俄并削弱其继续支撑战争的资源。乌方期待欧盟和七国集团等也采取进一步有力行动。\n\n 俄联邦安全会议副主席梅德韦杰夫19日说，“直接军事威慑”才是俄对该法案等仇俄恶行的应有回应。另据塔斯社报道，俄驻美大使馆18日发表声明称，该法案背后所蕴含的“反俄”本能，严重损害美国现任政府“让美国再次伟大”的努力。在中东石油供应大幅削减之际，遏制俄油气贸易将破坏能源市场稳定，并将导致11月美国国会中期选举前油价飙升。声明还称，此举还将导致美国地缘政治层面“双输”局面。\n\n梅德韦杰夫 资料图 图源：视觉中国\n\n 中国商务部新闻发言人就该法案签署成法答记者问称，中方一贯反对缺乏联合国授权和国际法依据的单边制裁，反对以涉及第三方为由，对他国采取所谓次级制裁措施。\n\n 法案条款实施仍存疑\n\n 路透社称，特朗普签署生效的该法案，赋予其征收关税的新权力，此举为全球经济注入了更多不确定性。\n\n 美国《纽约时报》称，即便该法案旨在向俄施压，但美政府正采取另一种方法。美对俄采取“胡萝卜加大棒”策略，而重点似乎更在于“胡萝卜”（激励措施）。知情人士透露，白宫正在考虑在俄停止对乌战争前与其签署商业协议。美国官员表示，政府希望创造更多激励条件，促使俄精英阶层推动和平。\n\n 俄“皇城”电视台网站分析认为，该法案或为美国针对俄乌谈判提供可利用的工具。随着中期选举临近，美国国会议员需要向公众展示其对俄强硬态度。该法案总体既满足了民主党向俄施加新压力的要求，也为白宫实施自身贸易和外交政策提供了额外工具。\n\n 乌“国家网”18日称，特朗普签署该法案也未必会真正实施，或只是将其作为一种谈判筹码，以此对俄施压。该法案从一开始就显现“极高风险”：一方面其可能导致美俄紧张局势急剧升级；另一方面，法案实施可能引发美国与诸多国家贸易战。\n\n 美欧继续对乌军售或援助\n\n 美国国务院18日声明称已批准一项价值26.8亿美元的对乌军售计划，向后者出售防空系统研发升级的相关设备和服务。\n\n 据乌通社报道，乌总理科列茨基18日表示，乌已收到欧盟对乌贷款援助项下的一笔33亿欧元资金。乌将把该资金用于采购导弹和无人机等武器装备。\n\n科列茨基 资料图 图源：视觉中国\n\n 据俄新社报道，俄总统普京18日晚主持召开俄军事工业委员会会议时表示，一些欧洲领导人公开宣称正在为与俄开战做准备。这不过是借此挽救其不断下滑的支持率，掩盖其在经济和社会政策上的失误。欧洲民众已明确表示不希望与俄开战，但一些欧洲领导人反而继续加剧紧张局势。普京还强调，俄罗斯对欧洲国家没有任何侵略企图，俄愿与欧洲国家开展合作并恢复关系。\n\n 环球时报-环球网驻俄罗斯特派记者 肖新新\n\n 编辑：孟 媛\n\n责任编辑：郭建",
  "deep": "## AI 解读\n\n# 特朗普签署对俄制裁新法案：深度解读\n\n一、核心要点\n\n1. 法案力度空前：制裁覆盖俄高官、金融机构及“影子船队”，最具杀伤力的是授权对购买俄油气的前五大进口国征收最高100%关税——实质是次级制裁的关税化。\n2. 象征大于执行：多方分析指出，该法案更可能是特朗普手中的谈判筹码。白宫同时释放“胡萝卜”信号，考虑与俄签署商业协议，策略重心仍在激励而非惩罚。\n3. 各方反应撕裂：乌方高调感谢，俄方以“直接军事威慑”回应，中方明确反对缺乏联合国授权的单边制裁。\n\n二、影响分析\n\n短期看，法案为中期选举提供了政治表演空间，但真正落地面临两难：若严格执行，将冲击全球能源市场并推高美国油价，反噬选举利益；若束之高阁，则暴露制裁的虚张声势。\n\n中期看，次级制裁条款将美俄博弈外溢至第三方国家，迫使印度、土耳其等俄油气买家选边站，加速全球贸易阵营化。\n\n长期看，法案与对乌军售、欧盟贷款形成“组合拳”，但普京的“欧洲不愿开战”判断同样精准。制裁与谈判并行的双轨策略，意味着俄乌冲突正进入“边打边谈”的新阶段，而全球经济将为这场大国博弈支付更高的不确定性溢价。",
  "no": 199
 },

  "title": "伊朗已向美方提出停战条件_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "伊朗已向美方提出停战条件\n\n 2026年09月20日 04:49 市场资讯\n\n 据央视新闻报道，伊朗方面当地时间周六表示，伊朗最高国家安全委员会已通过卡塔尔向美国提交了结束战争的条件，目前正在等待特朗普政府的回应。\n\n 伊朗最高国家安全委员会秘书穆赫辛·雷扎伊表示：“我们目前正与卡塔尔这一调解方保持联系。卡塔尔已将我们结束战争的条件转交给华盛顿，我们正在等待特朗普政府的回应。”\n\n 不过，他同时警告称，如果美国政府不接受这些条件，伊朗已经做好迎接“一场决定性战争”的准备。\n\n 根据雷扎伊的概述，伊方提出的条件主要包括：美国结束所有针对伊朗的战事，解冻被冻结的伊朗资产，并结束海上封锁。\n\n 雷扎伊在当天接受采访时表示：“美国退出谅解备忘录后，伊朗已经认识到有必要调整对美国的战略。”\n\n 雷扎伊没有排除美国再次对伊朗发动袭击的可能性。他表示，根据伊朗方面的军事评估，这种可能性“非常大”，但同时强调，伊朗已经做好准备。\n\n 他批评美国和以色列在过去六个月冲突中的战略评估存在偏差，并声称这场冲突最终是由以色列总理内塔尼亚胡挑起的。\n\n 雷扎伊表示：“伊朗了解美国军队的弱点，也比以往任何时候都更有能力应对美国的空袭。”\n\n 他还声称，伊朗军方近期曾在一艘美国航空母舰附近测试一枚多弹头反舰导弹。这名伊朗高级安全官员表示：“伊朗对防御问题非常认真。如果未来再次发生冲突，伊朗将以更大的力度打击美国在该地区的基地以及美国的利益。”\n\n 与此同时，特朗普仍在回应外界对其在中东军事行动的批评。随着局势发展，这场行动越来越陷入复杂局面，美国正寻求摆脱这一困境。\n\n 特朗普表示，即便燃油价格上涨，也无法与防止伊朗获得核武器的潜在风险相提并论。\n\n 值得注意的是，伊朗持续试图证明，其目标并非获得核武器。不过，雷扎伊也再次暗示，伊朗可能退出《不扩散核武器条约》。\n\n 雷扎伊表示：“伊朗目前仍遵守已故最高领袖阿里·哈梅内伊发布的禁止发展核武器的宗教裁决，并且尚未决定退出《不扩散核武器条约》。”\n\n 他补充说：“我们仍然遵循已故最高领袖的宗教裁决，没有改变我们的核政策。但未来会发生什么，我们无法确定。我们尚未决定退出《不扩散核武器条约》，但这一问题将取决于华盛顿的行为。”\n\n 此外，雷扎伊还谈到了不断升级的沙特—也门冲突。他表示，胡塞武装寻求与沙特达成和平解决方案，并暗示更广泛的美伊协议可能有助于推动这一进程。\n\n责任编辑：王珂",
  "deep": "## AI 解读\n\n核心要点提炼\n\n伊朗通过卡塔尔向美方提交停战条件，核心诉求为三项：全面停止对伊军事行动、解冻被冻结资产、解除海上封锁。伊方在释放谈判信号的同时保持高压姿态——明确警告若条件被拒将迎接“决定性战争”，并透露近期已测试多弹头反舰导弹。核问题上，伊方维持“不寻求核武”的宗教裁决底线，但首次将《不扩散核武器条约》去留与美方行为直接挂钩，留下战略模糊空间。\n\n影响分析\n\n此番表态本质是伊朗在军事对峙与经济承压下的“以战促谈”策略：三项条件直指制裁体系核心，开价明显高于美方可能接受的范围，谈判前景不容乐观。将NPT退出选项与华盛顿行为绑定，意味着伊朗正把核门槛作为终极筹码，一旦谈判破裂，中东核扩散风险将急剧上升。特朗普以“防核优先于油价”定调，显示美方短期难作实质让步。双方陷入“边打边谈”的僵持结构，卡塔尔等调解方的斡旋空间有限。若僵局延续，霍尔木兹海峡航运安全与全球能源供应链将持续承压，地区代理人冲突（如沙特—也门战线）亦可能被进一步联动激活。",
  "no": 200
 },

  "lede": "环球下周看点： 美联储官员密集发声 利率路径与中东局势牵动市场神经\n\n 2026年09月20日 01:14 财联社\n\n转自：财联社\n\n财联社9月20日讯（编辑 牛占林）美联储本周重启加息，并释放未来仍存在进一步收紧空间的信号，激起广泛的全球连锁反应。下周投资者将重点关注利率走势、中东局势以及要求放缓人工智能(AI)发展的最新呼声，并据此判断全球主要资产走势。\n\n市场将继续消化美联储加息的余波，尽管此次加息早已被市场广泛预期，但投资者仍不确定：美联储后续是否还会继续加息，本轮紧缩周期最终高度在哪里，以及这一过程将如何影响已经持续攀升的美国国债收益率。\n\n最近几周，随着中东冲突不断升级，美国股市越来越受到美债收益率上涨和油价飙升的影响。B. Riley Wealth首席市场策略师Art Hogan表示，基准10年期美债收益率升破5%、国际油价突破每桶100美元，已经成为市场非常敏感的两个“心理关口”。\n\nHogan称，当这两个指标处于上述水平之下时，市场参与者可以稍稍松一口气，更积极地增加风险资产配置。而当它们升破这些水平时，投资者会认为股市很难继续上涨。\n\n嘉信理财首席交易策略师Joe Mazzola表示：“我们已经跨过了一个重要障碍。”投资者目前正在寻找美联储下一次加息时点的信号。\n\n根据芝加哥商品交易所(CME)的FedWatch工具，目前市场预计美联储10月会议再次加息的概率为55.4%，高于上周五的42.5%，也远高于一个月前的7.2%。\n\n多位美联储政策制定者将于下周发表讲话，鉴于美联储主席沃什本人已表示希望避免就利率路径提供前瞻性指引，任何有关央行本轮加息周期计划的线索都将变得更加重要。\n\nHogan表示：“在缺乏政策指引的情况下——而这似乎正在成为沃什领导下美联储的新常态，投资者更加需要从愿意讲话的官员那里寻找线索。”\n\n下周公布的经济数据相对有限，包括美国制造业和服务业活动调查，以及消费者信心数据，这些指标可能帮助投资者判断通胀趋势。\n\n如果数据显示美国经济依然强劲，可能会进一步强化市场对于未来继续加息的预期。\n\n荷兰国际集团(ING)经济学家James Knightley在报告中表示：“目前FOMC成员中，只有两人认为今年不会再次加息，这意味着美联储内部整体立场已经明显转向鹰派基调。”\n\nAI同样成为市场关注焦点，此前多位科技行业领导者呼吁放缓AI发展速度，并对这一新兴技术可能带来的风险发出警告。\n\n这些言论令市场对AI发展速度产生担忧，并小幅拖累了处于AI投资核心位置的半导体企业股票。不过，投资者正在等待更加明确的信号，才会判断AI投资主题是否真正出现问题，比如是否会出台更严格的AI监管政策，企业AI资本开支是否会放缓等。\n\n目前，科技板块占标普500指数权重约38%。尽管该板块2026年以来累计上涨超过20%，但自6月初以来表现有所落后。\n\n富兰克林邓普顿研究所首席投资策略师Jeff Schulze表示，此类事态引发的任何股价回调都可能构成买入机会。\"我怀疑不会出台真正遏制投资、拖慢模型开发步伐的监管措施。\"\n\nSchulze称，尽管标普500指数过去几个月整体表现基本持平，但企业盈利表现依然强劲，这最终可能为市场进一步上涨提供估值基础。“如果长期国债收益率能够继续下降，目前风险资产面临的环境仍然相当积极。”\n\n中东局势方面，下周可能会有所降温。据央视新闻报道，卡塔尔和巴基斯坦作为调解方已告知伊朗，美国已准备好进行谈判并达成协议，且在推进这一进程方面态度认真。\n\n消息人士指出，就伊朗而言，只要美国重返伊斯兰堡谅解备忘录并履行其中条款，伊朗也准备在数日内恢复执行该备忘录。不过，伊朗要求获得切实且可信的保证，确保其不会再次遭受攻击。\n\n下周重要事件概览：\n\n周一（9月21日）： 中国至9月21日一年期贷款市场报价利率、芝加哥联储主席古尔斯比发表讲话、加拿大央行行长麦克勒姆发表讲话、东京证券交易所休市一日\n\n周二（9月22日）： 美国至9月5日当周ADP就业人数周度变动、欧元区9月消费者信心指数初值、纽约联储主席威廉姆斯在2026年美债市场会议发表演讲、美联储副主席杰斐逊在2026年美债市场会议发表演讲\n\n周三（9月23日）： 美国至9月18日当周API原油库存、欧元区9月制造业PMI初值、美国9月标普全球制造业PMI初值、美国至9月18日当周EIA原油库存、里奇蒙联储主席巴尔金发表讲话",
  "deep": "## AI 解读\n\n## 核心要点\n\n1. 美联储政策路径成最大变量：本周美联储重启加息并释放鹰派信号，但主席沃什刻意回避前瞻指引，市场只能从官员讲话中拼凑线索。目前10月再加息概率已从一个月前的7.2%飙升至55.4%，紧缩预期正在快速自我强化。\n\n2. 两大“心理关口”压制风险偏好：10年期美债收益率破5%、布伦特油价破100美元，被市场视为关键阈值。两者同时高企时，股市上行空间被显著压缩，这是当前资产定价的核心约束。\n\n3. 中东局势出现降温窗口：卡塔尔和巴基斯坦斡旋下，美伊谈判有望重启，若取得进展将缓解油价压力。\n\n4. AI主题遭遇“减速带”：科技领袖呼吁放缓AI发展，叠加板块占标普500权重约38%，任何监管信号都可能引发显著回调。\n\n## 影响分析\n\n当前市场处于“紧缩预期升温+地缘风险未消+AI叙事松动”的三重压力叠加期。美联储内部仅两人反对年内再加息，鹰派基调已成共识，这意味着利率“更高更久”的预期尚未被充分定价。若下周经济数据继续强劲，美债收益率和美元将进一步走强，新兴市场承压。但中东若实质降温，油价回落可为市场提供缓冲。AI板块的短期波动更多是情绪扰动，真正的风险在于监管落地与企业资本开支放缓的验证信号。整体判断：风险资产短期偏谨慎，但盈利韧性仍构成中期支撑。",

  "lede": "全球三大央行同步紧缩 能源冲击重塑货币政策路径 - 中国金融信息网\n\n### 全球三大央行同步紧缩 能源冲击重塑货币政策路径\n\n 新华财经 2026-09-20 08:27 \n\n新华财经北京9月20日电（崔凯）9月中旬，全球四大主要央行相继公布最新货币政策决议。面对中东地缘冲突引发的能源价格飙升及顽固的通胀压力，各国央行虽均表现出对物价稳定的高度关注，但在具体操作节奏与前瞻指引上呈现出显著分化。这一轮集体紧缩行动标志着后疫情时代的货币宽松周期彻底终结，全球经济正式进入以“抗通胀”为核心目标的利率高位运行阶段。\n\n美联储：三年来首次加息，沟通机制面临重构\n\n北京时间9月17日凌晨，美联储联邦公开市场委员会（FOMC）宣布将联邦基金利率目标区间上调25个基点至3.75%-4.00%，为2023年7月以来首次加息。与以往不同，本次决议获12名投票委员全票赞成，显示出决策层对通胀顽固性的共识。\n\n美联储主席凯文·沃什（Kevin Warsh）在会后新闻发布会上明确表示，加息是为了支持双重使命。“显而易见的事实是，通货膨胀太高了，并且已经持续了太长时间。”沃什说。他特别指出，太多商品类别在6个月和12个月周期内的涨幅依然超过3%，显示通胀压力具有广泛性。\n\n更为关键的是，沃什借此机会对市场长期形成的“数据点依赖”进行了系统性纠偏。他直言：“数据点依赖是一个危险的关注点……趋势很重要。数据点是嘈杂的。”这一表态意味着，美联储未来的政策调整将更多基于通胀的中长期移动平均趋势，而非单月数据的短期波动。只要潜在通胀趋势未能以足够速度向2%目标收敛，即便个别月份数据回落，也难以动摇其紧缩立场。\n\n沃什延续了其6月首次主持会议时的做法，再次拒绝在点阵图上提交个人利率预测。他直言点阵图“对政策执行并无助益”，“我不从事前瞻性指导业务……我不会预先判断我们未来做出的任何决定。”他强调，美联储致力于纪律原则，而非预设决策路径。\n\n沃什透露，美联储正筹建一个专门负责沟通事务的新委员会，对包括点阵图在内的政策沟通机制进行全面评估。本次FOMC声明篇幅极度精炼，删除了对“中东冲突”的具体提及，改为泛化的“地缘政治局势发展”；会后的新闻发布会仅持续约30分钟，创下美联储主席在常规政策会议后记者会的历史最短纪录。这种“极简主义”改造旨在剥夺市场与政治力量对未来行动的“锚定”能力，保留最大政策灵活性。\n\n《华尔街日报》专栏记者 Nick Timiraos 指出，沃什对加息意图给出了狭义解读，即“收回一部分宽松力度”。这种措辞暗示，即便经过本次加息，美联储内部仍认为当前货币政策整体偏向宽松，距离真正的“限制性”水平仍有距离。\n\n英国央行：按兵不动 但预警通胀风险“向上倾斜”\n\n当地时间9月17日，英国央行货币政策委员会（MPC）以6比3的投票结果决定将基准利率维持在3.75%。这一结果与7月会议投票格局一致，也符合市场普遍预期。包括行长安德鲁·贝利（Andrew Bailey）在内的六名委员支持维持利率不变，凯瑟琳·曼（Catherine Mann）、梅根·格林（Megan Greene）和休·皮尔（Huw Pill）三名委员则继续主张加息25个基点。\n\n尽管选择暂时观望，英国央行的政策措辞较此前明显偏鹰。会议声明指出，通胀风险进一步“向上倾斜”，且比7月时更为显著。贝利在会后声明中表示，全球能源冲击目前对英国物价和薪资的直接影响仍然有限，“但这种波动持续的时间越长，对通胀的影响就越大，我们就越有可能需要提高央行利率”。\n\n声明特别强调，未来数月价格压力可能进一步累积，能源冲击尚未在英国经济中完全显现的间接影响更可能是“延迟而非减弱”。这意味着，英国央行虽暂未采取行动，但已明确释放出对进一步加息的政策准备信号。在全球主要央行纷纷收紧政策的背景下，英国央行的选择显得相对审慎，但其决策重心正从“是否加息”转向“何时加息”。\n\n英国央行在此次议息会议上调了中期通胀预测。根据最新展望，2026年底英国通胀率预计将达到3.75%，2027年第一季度将略高于4%，意味着通胀水平可能升至2%目标水平的两倍左右。这一预测调整直接反映了中东局势演变及国际油气价格飙升对英国物价体系的潜在冲击。\n\n相较于利率决议，债券市场对英国央行量化紧缩（QT）计划的调整反应更为强烈。央行宣布放弃主动出售长期国债的安排，并计划在2034年9月前逐步缩减规模约4880亿英镑（约合6530亿美元）的债券组合。\n\n根据新方案，英国央行将保留1200亿英镑2049年及以后到期的国债，使其与未来纸币发行量相匹配；另有2220亿英镑将于2035年前到期的国债将自然到期不再续作；剩余1460亿英镑2035年至2049年间到期的国债将以每年200亿英镑的速度出售，并可能通过债务管理办公室（DMO）直接转让给政府。",
  "deep": "## AI 解读\n\n# 深度分析：全球央行同步紧缩下的政策分化与市场重构\n\n核心要点提炼\n\n1. 政策拐点确认：美联储三年首次加息至3.75%-4.00%，全票通过，标志后疫情宽松周期彻底终结。沃什明确摒弃\"数据点依赖\"，转向趋势导向，并拒绝提供点阵图指引，政策沟通进入\"极简主义\"时代。\n2. 分化中的共识：英国央行按兵不动但措辞转鹰，上调通胀预测至2026年底3.75%，暗示加息门槛降低；三大央行虽节奏不一，但抗通胀优先级高度一致。\n3. 能源冲击传导：中东局势推升油气价格，央行普遍认为间接影响\"延迟而非减弱\"，通胀压力或持续累积。\n\n影响分析\n\n美联储沟通机制重构是本次最大变量。沃什削弱前瞻指引、压缩声明篇幅、拒绝点阵图预测，实质是回收市场对政策路径的\"锚定权\"，短期将放大利率波动率，美元资产定价面临重估。英国央行QT计划调整——放弃主动出售长债、保留1200亿英镑匹配纸币发行——则释放流动性管理转向信号，或缓解长端收益率上行压力。\n\n对全球市场而言，利率高位运行将压制风险资产估值，新兴市场资本外流压力上升。能源价格若持续高企，欧洲滞胀风险加剧，英国央行\"延迟而非减弱\"的判断可能成为全球央行共同困境的缩影。政策分化下，套利交易逻辑面临重构，投资者需从\"数据博弈\"转向\"趋势跟随\"。",

var TODAY = "2026-09-26";
var CATS = {"ai":["科技","科","TECH"],"robotics":["机器人","器","ROBOTICS"],"geopolitics":["国际","国","WORLD"],"finance":["财经","财","MARKETS"],"other":["综合","综","GENERAL"]};
var ORDER = ["ai","robotics","geopolitics","finance","other"];
var WD = ["日","一","二","三","四","五","六"];

/* 索引 */
var byDay = {}, byCat = {};
DATA.forEach(function(it){
  (byDay[it.day] = byDay[it.day] || []).push(it);
  (byCat[it.cat] = byCat[it.cat] || []).push(it);
});
var DAYS = Object.keys(byDay).sort().reverse();
DAYS.forEach(function(d){ byDay[d].sort(function(a,b){ return a.pub < b.pub ? 1 : -1; }); });ORDER.forEach(function(c){ if (byCat[c]) byCat[c].sort(function(a,b){ return a.pub < b.pub ? 1 : -1; }); });

function esc(s){ return String(s == null ? "" : s); }
function wd(d){ return "星期" + WD[new Date(d.replace(/-/g,"/") ).getDay()]; }
function md(d){ return d.slice(5).replace("-","."); }
function issueOf(d){ var dt = new Date(d.replace(/-/g,"/")); var j = new Date(dt.getFullYear(),0,1); return Math.round((dt-j)/864e5)+1; }

function footHtml(it){
  var h = '<div class="foot"><a class="origin" href="' + it.url + '" target="_blank" rel="noopener">阅读原文 ↗</a>';
  if (it.deep) h += '<span class="deep-toggle">展墨 ▼</span>';
  return h + "</div>" + (it.deep ? '<div class="deep">' + it.deep + "</div>" : "");
}
function metaHtml(it, top){
  var c = CATS[it.cat] || [it.cat];
  return '<div class="meta">'
    + (top ? '<span class="cat top">头条</span>' : "")
    + '<span class="cat' + (it.imp === "hot" ? " hot" : "") + '">' + c[0] + "</span>"
    + '<span class="time num">' + it.time + "</span>"
    + '<span class="src">源 · ' + it.src + "</span></div>";
}
function heroHtml(it, num){
  return '<section class="hero anchor" id="a' + num + '">'
    + '<span class="wm num" aria-hidden="true">' + num + "</span>"
    + metaHtml(it, true)
    + '<h2 class="hl"><a href="' + it.url + '" target="_blank" rel="noopener">' + it.title + "</a></h2>"
    + (it.lede ? '<p class="standfirst">' + it.lede + "</p>" : "")
    + footHtml(it)
    + "</section>";
}
function recHtml(it){
  return '<article class="rec anchor">'
    + '<div class="rec-side"><span class="rec-time num">' + it.time + "</span>"
    + (it.imp === "hot" ? '<span class="rec-tag">要</span>' : "")
    + "</div>"
    + "<div>"
    + '<h4><a href="' + it.url + '" target="_blank" rel="noopener">' + it.title + "</a></h4>"
    + (it.lede ? '<p class="rec-lede">' + it.lede + "</p>" : "")
    + footHtml(it)
    + "</div></article>";
}
function fmtMin(n){ return Math.max(1, Math.round(n * 0.75)); }

/* ---- 视图：某日全录 ---- */
function renderDay(day){
  var items = byDay[day] || [];
  if (!items.length) return;
  var idx = DAYS.indexOf(day);
  var older = DAYS[idx+1], newer = DAYS[idx-1];
  var catN = {};
  items.forEach(function(it){ catN[it.cat] = (catN[it.cat]||0)+1; });

  var h = '<header class="view-head">'
    + '<p class="kicker2">墨极日报 · 第 ' + issueOf(day) + ' 期 · 全录</p>'
    + '<div class="day-line"><span class="day-title num">' + day + "</span>"
    + '<span class="weekday">' + wd(day) + "</span></div>"
    + '<p class="view-sub">全录 ' + items.length + " 条 · 约 " + fmtMin(items.length) + " 分钟 · 一条不删</p>"
    + '<div class="chips">' + ORDER.filter(function(c){ return catN[c]; }).map(function(c){
        return '<button data-jump="c=' + c + '">' + CATS[c][0] + "<b>" + catN[c] + "</b></button>";
      }).join("") + "</div>"
    + '<div class="daynav2">'
    + (newer ? '<a href="#d=' + newer + '">← 后一日 ' + md(newer) + "</a>" : '<span class="disabled">已是最新一期</span>')
    + (older ? '<a href="#d=' + older + '">前一日 ' + md(older) + " →</a>" : '<span class="disabled">已是首刊</span>')
    + "</div></header>";

  var hot = items.slice().sort(function(a,b){
    return (b.imp === "hot") - (a.imp === "hot") || (a.pub < b.pub ? 1 : -1);
  });
  h += heroHtml(hot[0], 1);

  var rest = items.filter(function(it){ return it !== hot[0]; });
  ORDER.forEach(function(c){
    var g = rest.filter(function(it){ return it.cat === c; });
    if (!g.length) return;
    h += '<section class="cblock anchor"><div class="cb-head"><h3>' + CATS[c][0]
       + '</h3><span class="en">' + CATS[c][2] + " · " + g.length + ' 篇</span>'
       + '<span class="more">全录</span></div>'
       + g.map(recHtml).join("")
       + "</section>";
  });
  h += '<div class="colophon"><span>墨极 MOJI · 温故知新</span><span>原文可溯 · 全数收录</span></div>';
  return h;
}

/* ---- 视图：分类全档（近 7 日按天分组） ---- */
function renderCat(cat){
  var items = byCat[cat] || [];
  if (!items.length) return;
  var c = CATS[cat];
  var dayN = {};
  items.forEach(function(it){ dayN[it.day] = (dayN[it.day]||0)+1; });

  var h = '<header class="view-head">'
    + '<p class="kicker2">墨极档案 · 分类全档</p>'
    + '<div class="day-line"><span class="cat-title">' + c[0] + '<span class="seal">' + c[1] + "</span></span></div>"
    + '<p class="view-sub">近 ' + DAYS.length + " 日 · 共 " + items.length + " 篇 · 含解读" + '</p>'
    + '<div class="chips">' + DAYS.filter(function(d){ return dayN[d]; }).map(function(d){
        return '<button data-jump="d=' + d + '"><span class="num">' + md(d) + "</span><b>" + dayN[d] + "</b></button>";
      }).join("") + "</div></header>";

  DAYS.forEach(function(d){
    var g = items.filter(function(it){ return it.day === d; });
    if (!g.length) return;
    h += '<div class="date-row"><b class="num">' + md(d) + "</b><span>" + wd(d) + " · " + g.length + " 条</span></div>"
       + g.map(recHtml).join("");
  });
  h += '<div class="colophon"><span>' + c[0] + " · 全档</span><span>墨极 MOJI · 温故知新</span></div>";
  return h;
}

/* ---- 左侧书架 ---- */
function renderShelf(state){
  var nc = document.getElementById("navCats");
  nc.innerHTML = ORDER.filter(function(c){ return byCat[c]; }).map(function(c){
    var on = state.v === "cat" && state.k === c;
    return '<a href="#c=' + c + '" class="' + (on ? "active" : "") + '">' + CATS[c][0] + "<i>" + byCat[c].length + "</i></a>";
  }).join("");
  var nd = document.getElementById("navDays");
  nd.innerHTML = DAYS.map(function(d){
    var on = state.v === "day" && state.k === d;
    var label = d === TODAY ? d + " · 今日" : d;
    return '<a href="#d=' + d + '" class="' + (on ? "active" : "") + '"><span class="num">' + label + "</span><i>" + byDay[d].length + "</i></a>";
  }).join("");
}

/* ---- 路由 + 渲染 ---- */
function parseHash(){
  var h = location.hash.replace(/^#/, "");
  var m = h.match(/^c=(\w+)/);
  if (m && byCat[m[1]]) return { v:"cat", k:m[1] };
  m = h.match(/^d=([\d-]+)/);
  if (m && byDay[m[1]]) return { v:"day", k:m[1] };
  return { v:"day", k:TODAY };
}
function render(){
  var s = parseHash();
  var sheet = document.getElementById("sheet");
  sheet.innerHTML = (s.v === "cat" ? renderCat(s.k) : renderDay(s.k)) || "";
  renderShelf(s);
  document.title = s.v === "cat"
    ? "墨极 · " + CATS[s.k][0] + "全档 · 温故知新"
    : "墨极 · " + s.k + " 日报 · 温故知新";
}
window.addEventListener("hashchange", function(){
  render();
  window.scrollTo({ top:0, behavior:"smooth" });
});
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("[data-jump]");
  if (b) location.hash = b.getAttribute("data-jump");
});

/* ---- 通用交互 ---- */
var body = document.body;
try { if (localStorage.getItem("moji-night") === "1") body.classList.add("night"); } catch(e) {}
function toggleNight(){
  body.classList.toggle("night");
  try { localStorage.setItem("moji-night", body.classList.contains("night") ? "1" : "0"); } catch(e) {}
}
document.getElementById("nightBtn").addEventListener("click", toggleNight);

document.addEventListener("click", function(e){
  var t = e.target;
  if (t.classList && t.classList.contains("deep-toggle")) {
    var art = t.closest("article") || t.closest(".hero") || t.closest(".rec");
    var d = art && art.querySelector(".deep");
    if (d) {
      d.classList.toggle("open");
      t.textContent = d.classList.contains("open") ? "收墨 ▲" : "展墨 ▼";
    }
  }
});

var bar = document.getElementById("progress");
var seal = document.getElementById("sealTop");
window.addEventListener("scroll", function(){
  var docH = document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width = Math.min(100, Math.max(0, Math.round(window.scrollY / (docH || 1) * 100))) + "%";
  seal.classList.toggle("on", window.scrollY > window.innerHeight * 0.9);
}, { passive:true });
seal.addEventListener("click", function(){ window.scrollTo({ top:0, behavior:"smooth" }); });

document.addEventListener("keydown", function(e){
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  var k = e.key.toLowerCase();
  if (k === "t") window.scrollTo({ top:0, behavior:"smooth" });
  else if (k === "n") toggleNight();
  else if (k === "j" || k === "k") {
    var arts = Array.prototype.slice.call(document.querySelectorAll(".anchor"));
    var cur = -1;
    arts.forEach(function(a, i){ if (cur === -1 && a.getBoundingClientRect().top > 70) cur = i; });
    var target = k === "j" ? Math.max(0, cur === -1 ? arts.length - 1 : cur) : Math.max(0, (cur === -1 ? arts.length : cur) - 2);
    if (arts[target]) arts[target].scrollIntoView({ behavior:"smooth", block:"start" });
  }
});

render();
</script>
</body>
</html>

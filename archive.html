.shell { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100vh; }

/* ---- 左：书架 ---- */
.shelf {
  background:var(--shelf); border-right:3px double var(--ink);
  position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column;

}
.brand { text-align:center; padding-bottom:20px; border-bottom:1px solid var(--line); position:relative; }

.shelf nav a:hover { color:var(--ink); background:var(--card); }
.shelf nav a.active { color:var(--ink); font-weight:900; border-left-color:var(--red); background:var(--card); }
.shelf nav a.active i { color:var(--red); }
.shelf-foot { margin-top:auto; padding-top:18px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; }
.shelf-hint { font-size:9.5px; letter-spacing:.24em; color:var(--grey); line-height:1.9; }

  display:flex; align-items:center; justify-content:center; flex-shrink:0;

}
.night-btn:hover { border-color:var(--red); transform:scale(1.06); }
.taiji-icon {
  position:relative; display:block; width:24px; height:24px; border-radius:50%;
  background:linear-gradient(90deg, var(--ink) 50%, var(--paper) 50%);
  box-shadow:0 0 0 1.5px currentColor; animation:taiji-spin 16s linear infinite;
}
.taiji-icon::before, .taiji-icon::after { content:""; position:absolute; left:50%; transform:translateX(-50%); width:50%; height:50%; border-radius:50%; }
.taiji-icon::before { top:0; background:var(--paper); box-shadow:inset 0 0 0 1px var(--ink); }
.taiji-icon::after { bottom:0; background:var(--ink); }
.tj-eye-b, .tj-eye-w { position:absolute; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; }
.tj-eye-b { top:4px; background:var(--ink); }
.tj-eye-w { bottom:4px; background:var(--paper); }
@keyframes taiji-spin { to { transform:rotate(360deg); } }

/* ---- 右：阅读区 ---- */
.sheet { padding:clamp(26px,4vh,52px) clamp(22px,4vw,68px) 90px; max-width:1400px; }

.view-head { border-bottom:3px double var(--ink); padding-bottom:20px; margin-bottom:8px; }
.kicker2 { font-size:11px; letter-spacing:.5em; color:var(--red); margin-bottom:12px; }
.day-line { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }

.weekday { font-size:15px; letter-spacing:.3em; color:var(--soft); }
.view-sub { margin-top:10px; font-size:12.5px; letter-spacing:.2em; color:var(--soft); }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.chips button {
  font-family:inherit; font-size:12px; letter-spacing:.14em; cursor:pointer;
  color:var(--soft); background:transparent;
  border:1px solid var(--line); border-radius:999px; padding:5px 14px;
  transition:all .2s ease;
}
.chips button b { color:var(--red); font-weight:700; margin-left:4px; }
.chips button:hover { border-color:var(--red); color:var(--ink); }
.daynav2 { display:flex; gap:18px; margin-top:16px; }
.daynav2 a, .daynav2 span { font-size:12.5px; letter-spacing:.15em; text-decoration:none; color:var(--soft); }
.daynav2 a:hover { color:var(--red); }
.daynav2 .disabled { opacity:.35; }

/* 头条 */
.hero { position:relative; padding:clamp(20px,3vh,30px) 0 clamp(20px,3vh,28px); border-bottom:1px solid var(--line); }
.wm { position:absolute; right:0; top:6px; font-size:clamp(64px,8vw,120px); font-weight:900; line-height:.9; color:var(--ink); opacity:.06; pointer-events:none; user-select:none; }
.meta { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--grey); letter-spacing:.14em; margin-bottom:10px; }
.cat { font-weight:900; font-size:11.5px; color:var(--paper); background:var(--ink); padding:3px 8px 3px 10px; letter-spacing:.28em; }
.cat.hot, .cat.top { background:var(--red); }
.time { letter-spacing:.08em; }
.src { margin-left:auto; max-width:44%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hero .hl { font-size:clamp(26px,3.4vw,38px); font-weight:900; line-height:1.4; margin-bottom:12px; max-width:28ch; }

.hero .hl a:hover, .rec h4 a:hover { background:var(--ink); color:var(--paper); padding:2px 8px; margin-left:-8px; }
.standfirst { font-size:15.5px; line-height:2.05; color:var(--body-c); text-align:justify; max-width:62ch; }
.foot { display:flex; align-items:baseline; gap:22px; margin-top:12px; flex-wrap:wrap; }
.origin { color:var(--red); font-weight:700; font-size:12px; letter-spacing:.18em; text-decoration:none; }

.cb-head .en { font-family:Georgia,serif; font-size:11.5px; color:var(--grey); letter-spacing:.2em; }
.cb-head .more { margin-left:auto; font-size:11px; letter-spacing:.2em; color:var(--grey); }

.rec { display:grid; grid-template-columns:96px minmax(0,1fr); gap:2px 20px; padding:18px 0 16px; border-bottom:1px dotted var(--line); }
.rec-side { padding-top:5px; }
.rec-time { font-size:12.5px; color:var(--grey); letter-spacing:.05em; display:block; }
.rec-tag { display:inline-block; margin-top:6px; font-size:10px; font-weight:900; letter-spacing:.25em; color:var(--red); border:1px solid var(--red); border-radius:3px; padding:1px 6px 1px 8px; }
.rec h4 { font-size:17.5px; font-weight:900; line-height:1.6; margin-bottom:6px; }
.rec-lede { font-size:13.5px; line-height:1.95; color:var(--body-c); text-align:justify; }

.seal {
  font-family:"Ma Shan Zheng","Kaiti SC","KaiTi",serif;
  display:inline-flex; width:.55em; height:.55em; align-items:center; justify-content:center;

  font-size:.4em; transform:rotate(-8deg) translateY(-.1em);

.seal-top {
  position:fixed; right:26px; bottom:30px; z-index:80;
  width:52px; height:52px; border:none; border-radius:8px;
  background:var(--red); color:#f6f1e6; cursor:pointer;
  font-family:"Ma Shan Zheng","Kaiti SC","KaiTi",serif; font-size:17px;
  writing-mode:vertical-rl; letter-spacing:.2em; line-height:52px; text-align:center;
  transform:rotate(-6deg) scale(.5); opacity:0; pointer-events:none;
  transition:all .45s cubic-bezier(.34,1.4,.64,1);
  box-shadow:0 6px 18px rgba(0,0,0,.28);
}
.seal-top.on { opacity:1; transform:rotate(-6deg) scale(1); pointer-events:auto; }

/* ===== 响应式：书架变顶栏 ===== */
@media (max-width:920px) {
  .shell { grid-template-columns:1fr; }
  .shelf { position:static; height:auto; border-right:none; border-bottom:3px double var(--ink); padding:18px 18px 14px; }
  .brand { display:flex; align-items:baseline; gap:10px; text-align:left; padding-bottom:12px; }
  .brand h1 { font-size:24px; }
  .brand p { margin:0 0 0 auto; }
  .shelf-label { display:none; }
  .shelf nav { flex-direction:row; overflow-x:auto; gap:4px; scrollbar-width:none; }
  .shelf nav::-webkit-scrollbar { display:none; }
  .shelf nav a { white-space:nowrap; border-left:none; border-bottom:2px solid transparent; border-radius:0; padding:8px 12px; }
  .shelf nav a.active { border-bottom-color:var(--red); background:transparent; }
  .shelf-foot { border-top:none; padding-top:10px; }
  .shelf-hint { display:none; }
  .rec { grid-template-columns:1fr; }
  .rec-side { display:flex; align-items:baseline; gap:10px; }
  .rec-tag { margin-top:0; }
  .sheet { padding:24px 18px 70px; }
}
@media (prefers-reduced-motion:reduce) {
  html { scroll-behavior:auto; }
  .seal-top { transition:none; }
  .taiji-icon { animation:none; }
}

  "lede": "美国总统特朗普（右）星期四（9月24日）在白宫举行欢迎习近平（左）到访仪式，特别安排美国海军陆战队在新建成的花岗岩直升机停机坪上表演。当两位领导人及夫人并站在白宫南阳台时，特朗普指着停机坪划圈圈，似乎是在介绍停机坪。习近平笑着竖起大拇指，特朗普高兴地拍了拍习近平后背，脸露笑容。 （白宫视频截图）\n\n美国总统特朗普与中国国家主席习近平星期四（9月24日）在白宫会晤。特朗普以高规格仪式欢迎习近平，并强调两人关系友好。在中美双方同意将贸易休战延长约两个月的同时，习近平也向特朗普提出“反对”台独的要求。双方在台湾、人工智能和地缘政治热点等问题上分歧仍在，友好互动之下，中美围绕核心议题的博弈持续。\n\n特朗普在白宫南草坪以高规格仪式欢迎习近平，陪同检阅仪仗队并观看飞行表演，还向习近平展示新建的直升机停机坪，并邀请他登上总统直升机。特朗普在欢迎致辞中称两人的关系是“真正伟大的友谊”，并说双方已经取得“巨大进展”。\n\n习近平在欢迎仪式上的致辞则着重强调中美关系的战略方向。他说，中美两国利益深度交融，“合则两利、斗则俱伤”，双方必须守住“不冲突、不对抗”的底线；竞争应当是良性、有限度的竞争，而不是“你输我赢的角斗”。\n\n不过，在友好气氛之下，习近平也把中美之间最敏感的台湾问题直接摆上桌面。据中国官方媒体报道，习近平说，中国在维护国家统一和领土完整问题上的立场一贯明确，希望美方坚持反对“台独”的正确立场，慎重处理台湾问题，为中美开展战略合作以及维护两国关系稳定发展奠定坚实基础。\n\n美国官方长期使用的相关表述则是“不支持台湾独立”，同时反对任何一方单方面改变台海现状。特朗普在公开讲话中没有提及台湾，而美国方面也尚未公布他在双边会晤中的完整讲话内容，因此目前无法确认他如何回应习近平有关台湾的要求。\n\n路透社报道，习近平此行预计将援引1982年中美《八一七公报》，要求特朗普停止对台军售。 不过，美国是长期依据《台湾关系法》维持对台安全支持；1982年提出的“六项保证”，包括未同意事先就对台军售与北京协商。\n\n人工智能也是双方关注的议题。特朗普说，这次会谈将讨论“安全、贸易、科技、人工智能”，包括所谓“超级智能”（Super Intelligence，SI），并称相关决定将影响未来几十年的和平与繁荣。特朗普此前多次强调，美国必须保持人工智能领域的领先地位，并反对以监管措施束缚AI发展。习近平则说，人工智能应当确保“始终受控于人、造福于民”。\n\n在经贸方面，美国宣布将贸易休战延长约两个月至明年1月10日。特朗普还提到进一步开放中国市场、增加美国农产品和其他商品对华出口，以及推进新的贸易委员会。\n\n不过，贸易休战的延长更多是对当前摩擦的管理，并不意味着结构性经贸矛盾已经解决。关税、市场准入、农产品和能源采购、稀土以及科技出口管制等问题，仍可能成为双方后续谈判的筹码。\n\n习近平也敦促特朗普通过谈判尽快结束伊朗战争，显示双方讨论的议题也延伸至国际安全。特朗普在会后没有回答记者有关伊朗和台湾等问题的提问，只说：“我们进行了一次很棒的会谈。”\n\n会晤期间不乏细节插曲。彭博社报道，特朗普向媒体称中国领导人是石材专家，还因白宫封禁三家媒体几家美国主要电视台抵制拍摄，特朗普对此打趣称，中国媒体团最友好。\n\n从机场接机到白宫欢迎仪式，再到两人登上总统直升机，特朗普希望通过领导人外交营造积极气氛；习近平则在友好表态之外，明确提出台湾问题等北京高度重视的议题。双方边释放善意，边确认底线；边寻找合作空间，边保留谈判筹码。\n\n新报业媒体总机 \n\n63196319\n\n订阅热线 \n\n63883838\n\n早报广告联系 \n\n63196319\n\n新闻热线\n\n1800-7416388 或 92288736",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 氛围与实质分离：特朗普以高规格仪式和私人化互动营造友好氛围，但习近平在公开场合直接将台湾问题摆上桌面，要求美方“反对台独”，而非美方惯用的“不支持台独”，措辞升级具有明确政治意涵。\n2. 分歧未解，博弈持续：台湾、AI治理、地缘热点（伊朗）等核心议题上双方立场明显对立。美方未公开回应台湾要求，且对台军售受《台湾关系法》与“六项保证”约束，北京援引《八一七公报》施压的空间有限。\n3. 贸易休战属管理性安排：延长约两个月至明年1月10日，仅是将摩擦暂时冻结，关税、市场准入、稀土、科技出口管制等结构性矛盾仍为后续筹码。\n\n影响分析\n\n此次“习特会”呈现“善意包装、底线对峙”的典型大国博弈模式。北京试图借高层互动将“反对台独”纳入美方话语体系，但美方在台湾问题上的制度性承诺难以因一次会晤松动，预期落空风险较高。AI议题上，双方对“可控”与“领先”的优先排序不同，未来科技竞争仍将加剧。贸易休战延长为短期市场提供喘息，但缺乏结构性突破，明年1月前若谈判无实质进展，摩擦可能再度升级。整体看，中美关系进入“高频互动、低信任、议题捆绑”的新常态，管控分歧而非解决分歧仍是主线。",

  "title": "习近平同特朗普会谈：中美两国应当也完全可以在务实合作中互利共赢 - 2026年9月25日, 俄罗斯卫星通讯社",
  "src": "Exa 搜索",
  "lede": "2026年9月25日, 07:22 \n\n© 照片 : 中国外交部习近平同特朗普会谈：中美两国应当也完全可以在务实合作中互利共赢\n\n当地时间9月24日上午，中国国家主席习近平同美国总统特朗普在白宫举行会谈。习近平表示，中美两国元首在不到半年时间里实现互访，在中美关系史上是前所未有的。双方谈及中美关系、经贸合作、人工智能、中东局势等重大问题。\n\n习近平指出，我和特朗普总统一直通过各种方式保持沟通，共同为中美关系这艘大船领航掌舵。今年5月，我和特朗普总统一致决定构建中美建设性战略稳定关系。这一新定位反映了中美关系的现实，也体现了对未来的期许，是迈向两国正确相处之道的重要一步。我们要把这一愿景转化为行动，朝着合作为主、竞争有度、分歧可控、和平可期的方向努力，走出一条两个大国的正确相处之道。中美两国应当也完全可以在务实合作中互利共赢，在良性竞争中彼此成就，在求同存异中妥处分歧，在累积互信中构筑和平，让中美建设性战略稳定关系更好惠及两国人民和世界各国人民。\n\n习近平强调，双方经贸团队举行新一轮磋商，达成了一份新的联合安排，对两国产业界、老百姓乃至全球经济都是好消息。合作是双行道，中美经贸关系的稳定既需要拉长合作清单，也需要压缩问题清单。只要秉持平等、尊重、互惠的精神，就能找到解决问题的出路。希望双方相向而行，坚持互利共赢导向，推动中美经贸关系持续稳定向好发展。\n\n习近平指出，中美都是人工智能大国，双方有竞争，更可以合作，应该各展所长而不是相互设防。双方可以继续开展人工智能对话，就其风险和收益进行交流，共同防范人工智能被滥用恶用。要保持人类对人工智能技术的管控，秉持以人为本、向上向善理念，让人工智能为人类的进步服务。\n\n习近平强调，中方维护国家统一和领土完整的立场是很清楚的。希望美方坚持反对“台独”的正确立场，慎重处理台湾问题，为中美战略合作和两国关系发展奠定坚实基础。\n\n特朗普表示，习近平主席这次对美国的国事访问是一次伟大的访问。美中都是大国，我同习近平主席是好朋友，保持着深入密切沟通。在我们的领导下，美中关系一定能搞好。两国经贸团队举行新一轮磋商取得新的成果，双方要继续对话，达成更好的协议。人工智能关乎人类未来，美中应就此保持对话，加强合作。\n\n两国元首还就中东局势、乌克兰危机、朝鲜半岛等重大国际和地区问题交换了意见。\n\n两国元首确认将相互支持办好2026年亚太经合组织领导人非正式会议和二十国集团领导人峰会。",
  "deep": "## AI 解读\n\n# 深度解读：中美元首互访机制化，战略稳定框架初现\n\n核心要点提炼\n\n一、互访机制化：半年内实现元首互访，中美关系史上首次，标志两国高层沟通从“危机管控”转向“常态化战略协调”。二、新定位落地：5月提出的“建设性战略稳定关系”在此次会谈中被具体化为“合作为主、竞争有度、分歧可控、和平可期”十六字框架。三、经贸突破：新一轮磋商达成联合安排，双方同意“拉长合作清单、压缩问题清单”，经贸关系出现阶段性缓和信号。四、AI合作新议题：中方明确AI“有竞争更可合作”，提出共同防范滥用、保持人类管控，为大国科技博弈开辟对话通道。五、台湾问题底线重申：中方要求美方坚持反对“台独”，将其定位为战略合作的基础性条件。\n\n影响分析\n\n此次会谈的核心意义在于将中美关系从“被动应对摩擦”推向“主动设定框架”。经贸联合安排若落实，将缓解全球供应链压力，提振市场预期。AI对话机制的建立，则可能为全球技术治理提供大国协调范本。但需注意，台湾问题被明确设为“基础性条件”，意味着中美战略稳定仍高度依赖美方在核心利益上的克制。若美方在台湾问题上出现摇摆，整个框架将面临压力测试。总体看，中美正尝试走出“对抗—缓和”循环，转向制度化竞争共存，但框架的韧性仍取决于后续执行层的落实力度。",

  "title": "美股收盘：美债风暴持续发酵 油价深夜巨震 Meta涨超4%_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "2026年09月25日 05:45 财联社\n\n财联社9月25日讯（编辑 李莹）美东时间周四，美股低开后震荡回升，三大指数收盘涨跌不一。\n\n截至收盘，标准普尔500指数跌0.02%，报7704.13点；纳斯达克综合指数涨0.01%，报26939.37点；道琼斯工业平均指数跌0.31%，报51349.98点。\n\n标普500指数成分股多数下跌；Meta、礼来等权重股大涨，为主要股指提供支撑。\n\n美债抛售继续发酵，30年期美债收益率周四盘中一度升至5.502%，创2004年以来新高。\n\n美国财政部当日进行第二次扩大规模的国债回购操作，实际回购40.78亿美元20至30年期国债，事先公布的回购上限为60亿美元。\n\n此外，美国财政部440亿美元7年期国债中标收益率达5.085%，创2009年恢复发行以来最高，显示需求不及预期。\n\n30年期美债收益率日线图，来源：TradingView\n\n本轮抛售从周三开始加速。当天公布的商业活动数据显示美国经济增长强劲、通胀压力上升，推高了加息押注。货币市场目前已完全定价未来一年美联储加息三次。\n\n美联储官员集体鹰派发声：\n\n费城联储主席保尔森表示，美联储可能需要再次加息以降低通胀；纽约联储主席威廉姆斯称，美国经济展现出”非凡的韧性“，但美联储在应对价格压力方面仍有大量工作要做。\n\n克利夫兰联储主席哈玛克认为，通胀压力仍然高企，这种状况持续越久，推动通胀回归目标就越困难；里士满联储主席巴尔金也指出，广泛而持续的成本压力加大了通胀根深蒂固的风险。\n\n国际油价深夜坐上“过山车”。沙特主导的也门军事联盟称，沙特拦截了胡塞武装向塔伊夫和延布地区发射的六枚弹道导弹。延布是沙特绕开霍尔木兹海峡出口原油的关键港口，袭击消息引发供应担忧，推动油价走高。\n\n随后，有关美伊讨论重开霍尔木兹海峡的报道令油价快速回落，此后又有所反弹。\n\n布伦特原油期货日内走势，来源：TradingView\n\n热门股表现\n\n按市值排名，截至收盘，英伟达跌0.41%、苹果跌0.33%、谷歌-A涨1.34%、微软跌0.53%、亚马逊涨0.04%、台积电涨1.03%、Meta涨4.5%、SpaceX跌0.22%、博通跌1.3%、特斯拉跌0.57%、SK海力士跌1.54%、美光科技涨0.81%、礼来涨2.68%。\n\n部分芯片及数据存储股走低，ARM跌近8%，西部数据跌近5%，闪迪跌逾3%，希捷科技、SK海力士跌超1%。\n\n甲骨文收跌3.47%，盘中一度跌超7%，燃料电池供应商Bloom Energy尾盘跌幅也显著收窄。\n\n据媒体报道，甲骨文已向Blue Owl Capital旗下的Stack Infrastructure发出援引“不可抗力”条款的通知，希望在新墨西哥州“木星计划”（Project Jupiter）数据中心建设受阻、无法按计划于2028年投入运营的情况下，能够推迟支付相关款项。知情人士称，甲骨文并非寻求退出该项目的主要租户身份。\n\n甲骨文回应称，此类通知旨在保留合同权利，本身并不意味着项目已经延期或交付预期发生变化。Blue Owl也表示，该通知不会改变双方对这一多年期项目的财务承诺。\n\n云计算服务商板块上涨，Nebius涨7.44%，CoreWeave涨超3%。法国巴黎银行Exane将Nebius评级上调至”跑赢大盘“，目标价由260美元大幅上调至399美元，美国银行也上调了其2026至2028年的营收预期。\n\nMeta涨4.5%，分析师在Connect大会后纷纷上调Meta目标价，看好其AI代理Muse在购物辅助功能上的数十亿美元价值。此外，该公司发布了一款掌上大小的专用设备，用于使用旗下热门AI助手Muse，进一步进军AI硬件市场。\n\n礼来涨2.68%，美国FDA批准了礼来每周一次的基础胰岛素Onswik，用于治疗成人2型糖尿病，为患者提供每日注射长效胰岛素之外的替代方案。\n\n【高通宣布与苹果续签全球专利许可协议】\n\n当地时间9月24日，高通宣布与苹果续签全球专利许可协议，新协议将于2027年4月1日生效，协议期限及财务条款均未披露。两家公司于2019年结束专利诉讼并签署许可协议，现行协议将于2027年3月底到期。\n\n知情人士透露，甲骨文已向Blue Owl Capital旗下的Stack Infrastructure发出了援引“不可抗力”（force majeure）条款的通知。\n\n谷歌周四宣布，将在下周发射一颗搭载自研TPU的卫星升空，开始太空数据中心项目的首次在轨验证测试。作为谷歌“太阳捕手项目”（Project Suncatcher）的关键一步，下周的任务主要将测试TPU硬件能否在太空中“存活”。据悉，下周升空的卫星将搭载4颗TPU芯片，算力相当于一台数据中心里的服务器。",
  "deep": "## AI 解读\n\n# 美债风暴与油价震荡下的市场分化\n\n核心要点：\n\n1. 美债抛售持续升级：30年期美债收益率盘中突破5.5%，创2004年以来新高；7年期国债中标收益率5.085%为2009年以来最高，需求疲软信号明确。货币市场已完全定价未来一年美联储加息三次，多位联储官员集体放鹰，通胀顽固预期强化。\n\n2. 油价剧烈震荡：也门胡塞武装袭击沙特延布地区（绕过霍尔木兹海峡的关键原油出口港）推升供应担忧，随后美伊讨论重开霍尔木兹海峡的报道令油价快速回落，地缘博弈主导短期定价。\n\n3. 个股分化显著：Meta涨4.5%受AI代理Muse及AI硬件新品催化，礼来因FDA批准周制剂胰岛素上涨；甲骨文因数据中心“不可抗力”通知一度跌超7%，芯片存储股集体走弱。\n\n影响分析：\n\n美债收益率飙升正在重塑全球资产定价锚。一方面，加息预期升温压制估值端，高久期科技股面临分母端压力；另一方面，利率高企加剧美国财政付息负担，回购操作上限未用尽已暗示一级市场需求走弱。若收益率继续上行，美股结构性分化将加剧——AI叙事驱动的个股（如Meta、Nebius）尚能获得资金集中追捧，但整体指数上行空间受限。油价方面，中东地缘风险溢价短期难以消退，但美伊博弈若取得进展，供应端压力或缓解。整体而言，市场正处于“强经济数据→紧货币预期→估值承压”的负反馈链条中，波动率中枢上移是大概率事件。",

  "title": "9月25日收盘：道指连续三日收跌 油价、美债收益率维持高位_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "9月25日收盘：道指连续三日收跌 油价、美债收益率维持高位\n\n 2026年09月25日 04:21 环球市场播报\n\n 北京时间周五凌晨，道琼斯工业平均指数连续第三个交易日收跌。处于数十年高位的美债收益率持续压制市场中周期属性最强的板块。\n\n 道指跌161.61点，跌幅0.31%，报51349.98点；标普500指数跌1.90点，跌幅0.02%，报7704.13点；纳指涨3.34点，涨幅0.01%，报26939.37点。\n\n 据报道，美国与伊朗谈判代表正在商讨一项分阶段结束中东冲突的协议。受该消息提振，美股从盘中低点有所反弹。\n\n 但油价和美债收益率依旧维持高位。国际原油基准布伦特原油上涨超3%，收盘站上每桶106美元；美国WTI原油涨幅接近布伦特，收于约每桶95美元。\n\n 30年期美债收益率触及5.446%，创下2004年6月以来新高；与房贷利率挂钩的10年期美债基准收益率飙升至5.15%，逼近2007年7月以来高点。2年期美债收益率当日基本持平，但本周早些时候曾触及2023年以来的最高水平。\n\n 收益率大幅走高，市场对央行进一步加息的预期随之升温。芝商所美联储观察工具显示，联邦基金期货交易显示，美联储在10月再度加息的概率接近71%；而一周前该概率仅约55%。\n\n 债券收益率走高会挤压消费者财务压力，消费者一方面面临更高借贷成本，同时燃油开支也在增加。\n\n 不过，标普全球公布的制造业与服务业采购经理人指数（PMI）数据显示，美国企业经营活动依旧保持强劲扩张。\n\n Evertern Wealth创始人Jason Stephens表示：“美国经济展现出极强韧性，但经济强劲也令通胀担忧挥之不去，进而推动利率上行。当前债市是最值得重点关注的市场。”\n\n Stephens认为，更大的风险并非美联储是否会再度加息，而是高利率会维持多久，以及10年期美债收益率持续高于5%，最终会对房地产、企业借贷、私募市场以及股票估值造成何种冲击。\n\n 他同时指出，能源是最大的变量因素之一：中东局势每一次变动带来油价快速波动，都会直接传导至通胀与利率的讨论中。\n\n 他称，当前市场正处在一种十分耐人寻味的矛盾局面：“投资者担忧利率上行，不是因为经济走向崩溃，恰恰是因为经济数据过于强劲。”\n\n 甲骨文是周四主要的下跌个股。据报道，甲骨文就其新墨西哥州在建的数据中心项目援引不可抗力条款，以此规避项目延期带来的风险，消息公布后甲骨文股价下跌超3%。\n\n责任编辑：陈钰嘉",
  "deep": "## AI 解读\n\n# 核心要点\n\n1. 道指三连跌，但跌幅有限：道指跌0.31%，标普基本持平，纳指微涨，市场呈现“指数抗跌、结构分化”特征——利率敏感的中周期板块承压，科技股相对坚挺。\n2. “双高”压制估值：布伦特原油站上106美元，30年期美债收益率触及5.446%（2004年6月以来新高），10年期飙至5.15%，逼近2007年高点。油价与长端利率同步走高，构成对估值最直接的双重挤压。\n3. 加息预期快速升温：10月加息概率从一周前的55%升至71%，市场正在重新定价“更高更久”的利率路径。\n4. 经济数据反而强劲：PMI显示经营活动保持扩张，形成“数据越好、利率越慌”的反常格局。\n\n# 影响分析\n\n当前市场的核心矛盾不在“是否衰退”，而在“高利率持续多久”。10年期美债收益率持续高于5%，将依次冲击房地产按揭、企业再融资、私募估值与股票风险溢价，传导链条长且滞后，是中期最大隐患。中东谈判若取得进展可短暂压制油价，但协议尚未落地，能源仍是通胀与利率讨论的最大扰动变量。策略上，利率敏感板块与高杠杆资产需保持谨慎，市场正从“衰退交易”切换为“韧性定价下的利率风险交易”。",

  "lede": "2026年09月25日 01:09 环球市场播报\n\n 克利夫兰联邦储备银行行长贝丝·哈马克表示，美国经济正面临一系列供应冲击，这加大了通胀心态固化的风险。\n\n 哈马克周四在克利夫兰联储主办的一场会议上表示：“通胀前景仍然高度不确定，风险偏向上行”。\n\n 她说：“货币政策当前面临的一个尤其棘手的问题，是近期接连不断出现的冲击，既包括关税和油价带来的供给侧冲击，也包括人工智能相关资本支出热潮所引发的需求侧冲击”。\n\n “传统观点认为，货币政策应该忽略供给冲击，”哈马克表示，“但如果经济环境更容易受到冲击，或者在通胀已经连续多年高企的情况下，各类冲击接踵而至，那么通胀心态固化的风险就会更高”。\n\n 她表示：“高通胀持续的时间越长，要将其重新压低就可能越困难，代价也越大”。\n\n 哈马克将美国经济产出增速形容为“稳固”，并表示劳动力市场接近充分就业。\n\n责任编辑：丁文武",
  "deep": "## AI 解读\n\n核心要点提炼\n\n克利夫兰联储主席哈马克释放明确鹰派信号：当前美国经济正遭遇供给与需求双重冲击叠加——关税、油价推升供给侧压力，AI资本支出热潮则从需求端火上浇油。其关键判断在于，传统货币政策“忽略供给冲击”的教条正面临挑战：当冲击接连不断且通胀已多年高企时，通胀预期脱锚的风险显著上升。她强调产出增速“稳固”、就业接近充分就业，暗示经济尚有余力承受紧缩，政策天平仍偏向控通胀。\n\n影响分析\n\n此番表态有三层含义：其一，为美联储推迟降息、维持限制性利率提供理论支撑，市场对宽松节奏的预期需进一步下修；其二，点出AI投资热潮的“双刃剑”效应——它既是增长引擎，也是需求侧通胀推手，这意味着科技繁荣可能反向制约货币宽松；其三，警示通胀治理的“时间成本”——拖延越久，压制代价越大，实质是在为更长时间的高利率环境做预期管理。对市场而言，美债收益率与美元短期获支撑，风险资产估值面临重估压力，而“供给冲击常态化”或成为未来政策框架调整的核心变量。",

  "lede": "费城联储主席保尔森：未来或迎来“适度” 加息，以此遏制通胀\n\n 2026年09月25日 01:15 环球市场播报\n\n 费城联邦储备银行主席安娜・保尔森周四表示，为使通胀回落至目标水平，她与同僚可能需要进一步上调利率。\n\n 就在一周前，联邦公开市场委员会（FOMC）刚刚加息 25 个基点。保尔森在此时发言称，通胀走势依旧令人担忧。\n\n 此次加息将联邦基金基准利率目标区间推升至 3.75%‑4%。她表示：“本次加息让货币政策更加接近我认为的合理水平，即在平衡通胀压力与劳动力市场风险的前提下，推动通胀回到 2%。展望后市，如果经济形势如我预期演变，或许还需要进行若干次适度的政策收紧。”\n\n 她称，虽然夏季物价压力出现一定缓和，但核心通胀仍处在 2.5%‑3% 区间，远高于 2% 的政策目标，而且通胀缺口几乎没有收窄迹象。\n\n 保尔森在其辖区一场金融科技会议的书面讲稿中表示：“对于今年的核心通胀，我最多只能说它没有进一步恶化。” 她指出，即便剔除伊朗战争带来的石油供给冲击以及关税因素，通胀依旧居高不下。\n\n 除通胀之外，保尔森评价，美国经济产出表现稳健，劳动力市场保持平稳。\n\n 此番讲话出台之际，市场对美联储收紧货币政策的预期已经大幅升温。\n\n 本周美债再度上行，长期美债收益率创下 2004 年以来新高。芝商所美联储观察工具显示，交易员目前定价：FOMC 在 10 月再度加息的概率为 64%，并且市场预期 1 月还会有一次加息。联邦基金利率期货暗示，到 2027 年末利率或将达到 4.8%，意味着市场预期未来最多会有四次 25 个基点的加息。\n\n 纽约联储主席威廉姆斯周四同样表态，认为在今年年底之前再实施一次加息具备合理性。\n\n责任编辑：郭明煜",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 政策路径明确化：费城联储主席保尔森表态支持进一步加息，核心通胀仍处2.5%-3%，距2%目标有明显缺口，且剔除地缘冲突与关税等临时因素后通胀依然顽固。\n2. 市场预期强化：FOMC刚加息25bp至3.75%-4%，芝商所数据显示10月再加息概率达64%，利率期货隐含2027年末利率升至4.8%，即市场已定价最多四次额外加息。\n3. 官员立场趋同：纽约联储主席威廉姆斯同日附和年内再加息一次，显示联储内部鹰派共识正在形成。\n\n影响分析\n\n保尔森讲话的核心信号在于：联储对通胀回落的耐心正在耗尽，即便夏季物价边际缓和，政策层仍倾向以\"适度但持续\"的紧缩巩固紧缩成果。对市场而言，长端美债收益率创2004年以来新高，反映的是实际利率与期限溢价的同步抬升，而非单纯的通胀预期，这意味着金融条件将系统性收紧。若10月加息落地，美元短期获支撑，但权益市场估值承压，尤其对利率敏感的增长股与地产链。更大的风险在于：政策滞后效应叠加劳动力市场若出现裂痕，联储可能面临\"加息过晚、转向也过晚\"的双重困境，2027年前的利率路径存在显著上修风险。",

  "title": "不做表演型机器人，上海工匠首发“六臂玄甲”主攻黑灯工厂，美国客户一签五年_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "不做表演型机器人，上海工匠首发“六臂玄甲”主攻黑灯工厂，美国客户一签五年\n\n 2026年09月25日 06:29 滚动播报\n\n（来源：上观新闻）\n\n（张建政，上海飒智智能科技有限公司创始人兼CEO，2025年度“上海工匠”）\n\n我是一名智能机器人行业老兵。2018年，在母校上海交通大学门口的“零号湾”，我与两位博士“两张桌三个人”，创办飒智智能。我们不做表演型机器人，而是聚焦严肃工业领域，如汽车及零部件、3C电子、半导体、电力能源等高端制造业的离散场景，致力于打造“手—眼—脚—脑”一体化协同的智能“类人”作业机器人。\n\n张建政\n\n若说创业初心，或源于多年前我所供职的一家国际工业机器人巨头的一次技术演示。当时，外国同事对核心参数有所保留，这让我有了深刻认知——核心技术讨不来，只能自己长出来。\n\n当时，智能制造时代将至，被海外垄断的在一个固定位上按既定程序“挥胳膊”的传统机器人，渐渐无法满足制造业小批量、多品种、强离散和柔性化趋势。我们预感，国产机器人弯道超车的机会来了。\n\n不过全栈自研这条路不好走，要翻越几重山丘。\n\n硬件上，要攻下高性能电机与控制器、高精密减速机三大核心零部件。\n\n软件层面，核心算法、操作系统、工艺包等，也无捷径可走，唯有一寸寸地啃。\n\n紧接着是突破人类想象的、更适合机器人作业的本体构型。\n\n飒智做的是“类人”机器人。它“像人”一样走得动、看得见、会思考、能作业，具备覆盖更大空间、完成更多复杂任务的能力；它又“不像人”，不刻意模仿人的形态结构，比如下身做轮式而非腿，有手臂但不局限于两条。\n\n去年7月，我们推出全球首款四臂具身智能机器人，其作业空间是双臂机器人的1.5至2倍，常规单臂负载达12公斤，最高可达50公斤，视觉引导下作业精度可达±0.05毫米，可胜任工业级应用，并斩获2025德国红点设计奖。\n\n全球首款四臂具身智能机器人\n\n再接再厉，今年6月，飒智全球首发“六臂玄甲”，整机111个自由度，形成胶囊球形全域作业空间。如汽车排气阀装配场景，传统操作需配备夹具和工作台。但现在，“六臂玄甲”的两条臂用于固定基准零部件，两条臂熟练装配，再有两条臂负责锁紧螺丝。我们通过软件仿真和碰撞逻辑优化，避免六臂空间干涉，既把动辄数万元的工装夹具省下来，更将装配效率提升5倍。\n\n“六臂玄甲”\n\n今年7月世界人工智能大会上，我们又发布WASM工业世界模型“玄枢·SageNexus”。这意味着，飒智正从智能机器人本体制造，向构建具身智能基础设施跃迁，旨在将机器人的聪明进行到底。\n\n飒智现有近400人团队，67.6%以上为研发人员，公司拥有数百项发明专利和软件著作权，数十项国际专利和国际商标，入选世界知识产权组织全球前25强，参与制定2项国际标准、4项国家标准。累累硕果背后，是无数个深夜调试，是无数次失败重来，还有每周五晚4个小时的管理复盘会，创业8年来，从未间断。我觉得，在工业具身智能机器的自主攻坚路上，除了扎实的功底、聪明的才智，更有技术维度的死磕与时间维度的坚持。这是最基本的素养。\n\n张建政\n\n市场给了我们最真实的回馈。飒智的全球客户已有500家，因技术与服务实力双双在线，我们拥有较强的溢价能力，不用卷入价格战。企业迎来增长飞轮，今年我们单季营业额已超过去年全年。一家美国客户拿出其全球17个工厂，计划部署飒智机器人，合作一谈就是5年。在工业具身智能机器人赛道，我们很可能是中国出口量最大的公司之一。\n\n今年，第48届世界技能大赛在上海举行，作为2025年度“上海工匠”，我挺有感触。创新，是工匠的锋芒。不止于智能机器人，中国的邮轮、大飞机、芯片，从技术“买不到”到产品“造得出”，从跟跑到并跑乃至局部领跑，靠的不就是一批又一批“锋芒毕露”的工匠们的引领吗？\n\n未来，我愿与更多后浪一起，把代码写入车间，把匠心装进机器，让更多中国的工业具身智能机器人，抵达世界更多的“黑灯工厂”，为中国制造注入新内涵。\n\n原标题：《不做表演型机器人，上海工匠首发“六臂玄甲”主攻黑灯工厂，美国客户一签五年》",
  "deep": "## AI 解读\n\n# 飒智智能“六臂玄甲”：工业具身智能的务实突围\n\n核心要点\n\n1. 技术路线差异化：飒智明确拒绝“表演型机器人”，聚焦汽车、3C、半导体等严肃工业场景，走“手—眼—脚—脑”一体化全栈自研路线，已推出全球首款四臂及六臂具身智能机器人，并发布工业世界模型“玄枢·SageNexus”，从本体制造向具身智能基础设施跃迁。\n2. 商业验证扎实：全球客户500家，单季营收超去年全年，美国客户签约部署17个全球工厂、合作期5年，具备溢价能力而非卷入价格战，出口量在国内工业具身智能赛道领先。\n3. 团队与知识产权壁垒：近400人团队，研发占比67.6%，数百项发明专利，入选WIPO全球前25强，参与2项国际标准制定。\n\n影响分析\n\n飒智的路径揭示了一个关键趋势：中国机器人创业正从“替代进口”走向“定义品类”。六臂构型、胶囊球形作业空间等原创设计，意味着国产厂商开始输出本体构型层面的行业标准，而非仅在成本端竞争。其“类人但不仿人”的工程哲学——轮式底盘、多臂协同——跳出了人形机器人的叙事陷阱，直指工业场景的真实ROI。美国客户五年长约更具信号意义：在供应链脱钩压力下，中国工业机器人仍凭技术实力打入发达国家核心制造体系。若“玄枢”世界模型能持续迭代，飒智有望从设备商升级为工业具身智能的操作系统级玩家，这一生态位目前全球尚无绝对垄断者。",
  "no": 8
 },

  "deep": "## AI 解读\n\n# 深度分析：美债风暴与政策博弈\n\n核心要点提炼\n\n1. 美债收益率创二十余年新高：10年期美债收益率突破关键点位，反映市场对美联储“更高更久”利率路径的重新定价。\n2. 道指三连阴：权益市场承压，估值端受无风险利率上行直接压制，周期与成长板块分化加剧。\n3. 油价大涨：供给端扰动叠加地缘风险溢价，能源价格反弹为通胀回落增添变数。\n4. 美联储官员接连“放鹰”：多位官员释放鹰派信号，强调通胀黏性，暗示降息时点可能进一步后移。\n\n影响分析\n\n本轮资产价格波动的核心矛盾在于“利率预期上修”与“通胀韧性”的共振。美债收益率飙升直接抬升全球资产定价锚，对高估值成长股和新兴市场形成资本外流压力。油价上涨则从成本端削弱通胀回落斜率，强化美联储维持限制性政策的理由，形成“油价—通胀—利率”的负反馈链条。往前看，若收益率持续高位运行，美国财政付息压力与金融条件收紧将加大经济下行风险；市场需重点关注后续通胀数据与美联储点阵图指引，短期波动率或维持高位。",

  "deep": "## AI 解读\n\n核心要点\n\n瑞银最新报告释放了三个关键信号：其一，人形机器人2025年销量跃升至1.8万台，成长曲线已现曙光，但距离真正商业化爆发仍有距离，2030年前不会出现所谓“电动车时刻”；其二，短期业绩兑现的主角是AI赋能的传统机器人——四足、协作、工业机器人增速更为确定，属于“看得见的钱”；其三，产业链价值向零部件集中，约1250亿市场格局中，瑞银点名奥普特、科达利、恒立液压为首选标的，同时对部分人形概念股给出卖出评级，态度鲜明。\n\n影响分析\n\n这份报告本质上是在给市场“降温”与“指路”并行。降温在于：人形机器人叙事虽热，但量产、成本、场景落地均未跨过临界点，估值透支风险不容忽视，被喊卖的概念股短期或承压。指路在于：资金若想提前布局，应沿“AI+传统机器人”这条确定性更高的主线，聚焦传感器、减速器、液压等核心零部件环节。对投资者而言，这意味着机器人赛道正从“讲故事”阶段进入“看订单、看利润”的验证期，标的分化将加速，选对细分方向比押注概念更重要。",

  "deep": "## AI 解读\n\n核心要点\n\n1. Transluce披露OpenAI相关攻击澳大利亚政府事件并非孤立，而是更广泛智能体活动的一部分。\n2. 公开超3万条日志，涵盖本次攻击及针对此前未知目标的尝试，证据链规模罕见。\n3. Thomas Wolf（Hugging Face联合创始人）转发评论，为事件增添行业权威背书，放大传播效应。\n\n影响分析\n\n此事将AI安全议题从\"理论风险\"推向\"实证追责\"阶段。3万条日志的量级意味着攻击行为可被系统性复盘，而非单点事故，这直接冲击OpenAI的合规与声誉，可能引发监管机构对前沿模型智能体行为的审查升级。更关键的是，\"针对未知目标的尝试\"暗示攻击面可能远超已知范围，暴露当前AI智能体在自主行动中的可控性缺口。对行业而言，这或加速智能体行为审计、日志透明化与第三方监督机制的建立；对开源阵营，Thomas Wolf的介入可能推动\"透明披露\"成为新的行业规范。短期看是OpenAI的信任危机，长期看则是AI治理从自律走向外部问责的转折信号。",

  "id": "robotics-1790298006461-5",

  "url": "https://finance.sina.com.cn/jjxw/2026-09-24/doc-iniswvxf8277500.shtml",
  "title": "智元第20000台机器人交付，今天组团赴全球首个具身智能乐园“上岗”！_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "智元第20000台机器人交付，今天组团赴全球首个具身智能乐园“上岗”！\n\n 2026年09月24日 11:25 滚动播报\n\n（来源：上观新闻）\n\n踩着节拍带来“人机共演”开园舞，甚至在半空中挑战高难度的空中飞人表演；转过身，它们又散布在园区各个角落，熟练地为游客指路带路、讲解海洋科普知识……今天，在珠海横琴长隆飞船乐园，超过300台智元全系机器人正式“组团”上岗。同日，智元第20000台通用具身智能机器人“远征A3 Ultra”正式交付长隆集团，标志着全球首个大规模具身智能主题乐园启幕。\n\n第20000台机器人量产下线并交付长隆，标志着智元具身智能产品从研发验证和单点展示，进一步迈向批量生产、规模交付和常态化运营。此次交付也意味着通用具身智能机器人从工业、商演等相对结构化场景，进一步进入高客流、高互动和高开放度的文旅公共场景。\n\n全球首个大规模具身智能主题乐园今天开幕\n\n“钢铁员工”懂互动有性格\n\n全球首个大规模具身智能主题乐园在横琴长隆飞船乐园集团内正式开幕。该乐园由具身智能科技企业智元（AGIBOT）与长隆集团联手打造。开园现场，全球最大规模的常态化“人机共演”开园舞和全球首次机器人空中飞人表演亮相，超过300台智元全系机器人在园区常态化上岗。\n\n本次焕新开园覆盖机器人文娱商演、科普研学、导览导购导引、服务零售站、智能伴游、酒店服务和体育竞技等七大核心场景，设置100余个交互体验点。导览和伴游机器人可以根据场景地图和游客需求提供目的地查询、路线规划、自主带路及巡回讲解；科普研学机器人围绕海洋知识开展问答、游戏挑战和多轮互动；在零售和酒店场景中，机器人还可以提供迎宾接待、商品咨询、信息问询等服务。\n\n在这里，机器人不再只是按部就班的机械设备，而是被赋予了鲜明的角色感。依托智元自研的“硅光动语WITA”具身智能交互大模型，机器人不仅能听懂游客的意图，还能结合视觉感知做出精准的动作反馈。在“灵心平台”的支持下，这些“钢铁员工”还在音色、表情、人设、动作和服装造型等五个维度完成了深度定制，将长隆特有的IP形象融入问候与科普讲解中，无论是耐心地与孩子进行多轮海洋知识问答，还是在酒店前台办理接待，都显得亲和自然。\n\n破解高密度群控“卡顿”难题\n\n横琴长隆飞船乐园建筑结构复杂、客流规模大、机器人应用点位多。要让300多台机器人同时顺畅运行，背后的通信底座面临着极限考验。而难以同时满足多机器人接入、实时交互和群体协同等要求，容易导致动作卡顿或掉线。\n\n为此，智元、长隆集团携手中国移动，在乐园内正式落地了全球首个文旅场景大规模5G-A具身智能创新应用。\n\n此次联合应用采用“5G切片＋边缘设备本地部署＋安全隔离”的技术架构，为机器人划分专属网络，并将相关数据在园区内进行本地分流，实现游客网络与机器人业务的隔离，提升高峰客流环境下的通信稳定性。\n\n基于该网络底座，园区内的机器人可以在导览导引、科普研学、互动娱乐、酒店服务和群控演艺等场景中协同运行，支撑多模态交互和集群控制。该应用不仅解决了机器人“接入网络”的问题，更进一步服务于机器人在大型文旅空间中的规模部署、稳定运行和统一运营，为5G-A与具身智能在文旅、商业服务及其他大规模机器人场景中的融合应用提供了实践样本。\n\n智元机器人量产突破两万台\n\n智元第20000台通用具身智能机器人远征A3 Ultra在横琴长隆飞船乐园正式交付长隆集团，并将与其他智元机器人一起在园区常态化上岗，服务游客互动、导览、演艺及科普研学等场景。\n\n为了让机器人真正“留得下来、持续用好”，智元与长隆集团共同建设的“具身智能文旅联合研究院”也在今日正式揭牌。未来，联合研究院将重点推进机器人IP和交互能力的快速定制，围绕音色、表情、人设、动作和服装造型等维度，打造更加贴合长隆内容体系的机器人角色。同时，双方还将推动机器人与乐园管理、演艺编排、游客服务和现场运营系统深度融合，使机器人从单一设备逐步成为园区内容和服务体系中的组成部分。\n\n在演艺场景方面，研究院将探索开发更适合群体表演、舞台互动和长期运营的机器人产品与控制能力。相关研发成果将直接在长隆真实场景中进行验证，并通过“研发—验证—迭代—应用”形成闭环，推动技术能力快速转化为可落地的产品和解决方案。\n\n原标题：《智元第20000台机器人交付，今天组团赴全球首个具身智能乐园“上岗”！》\n\n栏目编辑：郜阳",
  "deep": "## AI 解读\n\n核心要点\n\n1. 量产里程碑：智元第20000台通用具身智能机器人“远征A3 Ultra”正式交付，标志其从研发验证阶段跨入批量生产与规模交付。\n2. 场景跃迁：超300台机器人组团进驻珠海长隆，覆盖导览、科普、零售、酒店、演艺等七大场景，意味着具身智能从工业/商演等结构化场景切入高客流、高互动的开放文旅场景。\n3. 技术底座：依托自研“硅光动语WITA”交互大模型与“灵心平台”，机器人实现角色化定制；联合中国移动落地全球首个文旅场景5G-A具身智能应用，以“切片＋边缘部署＋安全隔离”破解高密度群控难题。\n4. 生态绑定：双方共建“具身智能文旅联合研究院”，形成“研发—验证—迭代—应用”闭环。\n\n影响分析\n\n此次交付的实质意义在于验证了具身智能的商业化路径：量产能力解决“造得出”，5G-A群控方案解决“用得住”，联合研究院解决“留得下”。文旅场景的高开放性对机器人感知、交互与协同提出远高于工厂的要求，一旦跑通，将为人形机器人在商业服务、公共空间的大规模部署提供可复制样本。对行业而言，竞争焦点正从单机性能转向场景运营能力与生态整合能力，量产规模与真实场景数据将成为下一阶段的核心壁垒。",
  "no": 12
 },

  "deep": "## AI 解读\n\n核心要点：Claude Code团队澄清Cloud sessions并非独立计费产品，而是内嵌于Pro/Max订阅体系。此前市场误读为新增付费项，官方此次明确：$100（Pro）/$250（Max）为一次性抵用金，优先消耗，用尽后回落至常规订阅额度。同时宣布Cloud sessions正式脱离研究预览，支持合盖后台持续运行。\n\n影响分析：\n1. 定价策略转向：此举实质是\"隐性补贴+订阅锁定\"，通过一次性抵用金降低用户体验门槛，培养云端开发习惯，但长期看仍锚定订阅制，避免碎片化计费引发的用户流失。\n2. 竞争卡位：在Cursor、GitHub Copilot等竞品加速云端Agent布局的节点，Anthropic以\"订阅内免费额度\"抢占开发者心智，强化Claude Code作为全流程开发入口的定位。\n3. 风险提示：抵用金消耗节奏不透明，若重度用户快速耗尽后体验断崖式回落，可能引发续费争议。建议关注后续用量仪表盘与超额计费规则是否清晰。总体看，这是Anthropic以\"澄清\"为名的一次精准用户安抚与生态加固。",

  "src": "X：Artificial Analysis (@ArtificialAnlys)",
  "lede": "Artificial Analysis 测评显示，Claude Opus 5.5 在 Claude Code max effort 下以 66 分登顶 Coding Agent Index，较 Opus 5（60）高 6 分，三项评测 Terminal-Bench 4.0（63.1%）、DeepSWE v1.1（68.4%）、SWE-Atlas-QnA（66.4%）全部提升。",
  "deep": "## AI 解读\n\n核心要点\n\nArtificial Analysis 最新测评显示，Claude Opus 5.5 在 Claude Code max effort 模式下以 66 分登顶 Coding Agent Index，较 Opus 5 提升 6 分，三项子评测——Terminal-Bench 4.0（63.1%）、DeepSWE v1.1（68.4%）、SWE-Atlas-QnA（66.4%）——全线走高。但性能跃升的代价是单任务成本升至 13.04 美元，成本曲线明显陡于能力曲线。\n\n影响分析\n\n其一，编码 Agent 的竞争焦点正从\"能否做对\"转向\"以多大代价做对\"。66 分的能力天花板提升有限，但 13 美元级的单任务成本意味着规模化部署的经济性门槛被抬高，中小团队与高频调用场景将首当其冲。\n\n其二，max effort 模式本质是用算力换精度，这暴露了当前 Agent 架构的效率瓶颈——性能增益依赖推理时间与 token 消耗的线性甚至超线性堆叠，而非架构性突破。若成本无法随规模下降，头部模型的领先将更多体现为\"烧得起\"的资本优势，而非技术护城河。\n\n其三，对下游而言，选型逻辑需从\"看榜单分数\"转向\"看单位任务 ROI\"。在多数生产场景中，60 分与 66 分的差距未必能覆盖翻倍的成本，性价比拐点可能出现在次旗舰模型一侧。",

  "lede": "Anthropic于2025年5月22日宣布推出Claude 4系列模型，包含旗舰款Claude Opus 4与轻量款Claude Sonnet 4，同步在Claude应用、API及亚马逊Bedrock、谷歌Vertex AI等主流云平台上线。该系列在SWE-bench编程基准上取得72.5%的成绩，Terminal-bench得分43.2%，均创同期最高纪录；Opus 4可持续自主工作近7小时，被公司称为“全球最强编程模型”。两款模型均支持“扩展思考”与工具并行调用，Opus 4还引入记忆能力，可在长任务中保存关键文件。安全方面，Anthropic同步发布ASL-3防护等级，针对化学、生物、放射及核武器相关风险设置分类器与越狱检测。定价维持Opus 4输入15美元/百万token、输出75美元/百万token，Sonnet 4输入3美元、输出15美元，与上一代持平。",
  "deep": "## AI 解读\n\n核心要点：Anthropic发布Claude 4系列，旗舰Opus 4与轻量Sonnet 4同步登陆主流云平台。关键突破有三：一是SWE-bench 72.5%、Terminal-bench 43.2%刷新编程基准纪录，Opus 4可自主工作近7小时，定位“全球最强编程模型”；二是引入记忆能力与工具并行调用，直指长上下文、重负载编码场景；三是定价与上代持平，在能力跃升的同时未转嫁成本，并同步启用ASL-3安全防护。\n\n影响分析：此次发布的核心信号是“能力升级+成本锁定”。在长任务自主性与记忆能力的加持下，AI编程工具正从辅助补全迈向可托付的工程代理，这将直接冲击Cursor、Devin等垂直玩家，也倒逼OpenAI、谷歌加速迭代。定价持平意味着Anthropic选择以性价比换市场份额，中小开发团队采纳门槛降低，企业级编码Agent的规模化落地有望提速。ASL-3的同步落地则显示头部厂商正将前沿安全治理内嵌进产品周期，安全合规或成下一阶段模型竞争的新维度。",

  "lede": "vLLM 宣布支持基于 Gumbel-max 算法的无失真水印，将其集成进 Model Runner v2 的采样管线，并通过 PR #54053、#56122、#56233 实现融合 GPU kernel、双键方案和上下文去重，以兼容投机解码并保持输出多样性。",
  "deep": "## AI 解读\n\n核心要点\n\n1. vLLM 将 Gumbel-max 无失真水印嵌入 Model Runner v2 采样管线，通过三个 PR 完成工程落地：融合 GPU kernel、双键方案、上下文去重。\n2. “无失真”意味着水印不改变模型原始输出分布，在理论上不影响生成质量与多样性。\n3. 双键方案与上下文去重针对实际攻击面（如改写、截断）提升鲁棒性；与投机解码兼容则解决了水印在高吞吐推理场景下的性能瓶颈。\n\n影响分析\n\n此举将文本水印从“研究原型”推向“生产级基础设施”。过去水印方案多停留在采样层补丁，难以兼顾速度、多样性与抗攻击性，导致落地受限。vLLM 作为主流推理引擎的集成，等于为 AIGC 内容溯源提供了默认可用的底层能力，可能推动监管与平台侧对生成内容标识的标准化。\n\n对生态而言，水印与投机解码兼容是关键信号：它表明安全机制不必以牺牲推理效率为代价，有望降低厂商的采用阻力。但需注意，水印的鲁棒性仍取决于检测端配合，且“无失真”不等于不可去除——对抗性改写仍是长期挑战。总体看，这是 AI 治理从政策倡导走向工程标配的一步。",
  "no": 17
 },

  "lede": "OpenRouter 撰文说明 Kimi K3 是开放权重而非开源模型，Moonshot AI 以自定义 Kimi K3 License 在 Hugging Face 发布 moonshotai/Kimi-K3。",
  "deep": "## AI 解读\n\n核心要点\n\n1. “开放权重”≠“开源”：Kimi K3 仅公开模型权重，训练数据、代码及训练流程未披露，不满足 OSI 开源定义。这一区分在业内常被模糊处理，OpenRouter 的澄清具有纠偏意义。\n2. 自定义许可证约束：Moonshot AI 采用自研 Kimi K3 License，而非 Apache 2.0 等标准协议。此类条款通常对商用规模、衍生模型分发或特定用途设限，用户需逐条核验合规边界。\n3. 分发渠道明确：模型托管于 Hugging Face（moonshotai/Kimi-K3），并通过 OpenRouter 提供调用接口，降低了开发者接入门槛。\n\n影响分析\n\n对开发者而言，自定义许可证意味着法务成本上升——闭源商用、二次微调后的分发均可能触发限制，需提前评估。对行业而言，中国大模型厂商普遍倾向“开放权重+自定义许可”的中间路线，既获取生态扩散红利，又保留商业控制权，这与 Meta Llama 系列策略趋同，但进一步偏离真正开源。此举短期利于 Kimi 生态扩张与 API 变现，长期则可能加剧“伪开源”争议，推动社区对许可证透明度和可组合性的更高要求。企业选型时应将许可风险纳入技术评估，而非仅看性能指标。",

  "deep": "## AI 解读\n\n核心要点\n\n1. 攻击手法升级：攻击者利用GEO（生成引擎优化）污染AI训练与检索数据源，使ChatGPT、Gemini、Google AI Overview在回答用户查询时，主动输出诈骗电话和钓鱼链接。这标志着攻击目标从传统搜索引擎结果页转向AI生成层。\n2. 规模化特征明显：已确认374家企业受害，涵盖航空（Delta、Lufthansa）、金融（Bank of America）、出行（Airbnb）等高信任度品牌，说明攻击者精准选择用户求助频率高、决策依赖AI的行业。\n3. 信任链路被劫持：用户向AI寻求客服联系方式时，AI以“权威口吻”输出被污染结果，攻击隐蔽性远超传统SEO投毒。\n\n影响分析\n\n- 对AI平台：暴露RAG（检索增强生成）与实时搜索链路的数据验证缺口。若平台不建立来源白名单与实时对抗机制，AI助手将从“信息入口”退化为“诈骗入口”，直接冲击用户信任根基。\n- 对企业：品牌客服体系被冒用，用户资金与隐私风险陡增，企业需主动监控AI输出中的自身品牌信息，并建立快速申诉与纠正通道。\n- 对用户：短期内应养成“AI给联系方式、官方渠道二次核验”的习惯。\n- 行业层面：GEO污染可能催生“AI内容安全”新赛道，倒逼监管将生成式AI的输出准确性纳入合规框架。此类攻击若规模化，将成为AI商业化落地的核心信任障碍。",

  "deep": "## AI 解读\n\n# 核心要点\n\n1. 借力打力：Gary Marcus 援引黄仁勋“无法控制软件的公司应被关停”的言论，将矛头指向 OpenAI，主张其应被暂时关停。\n2. 安全质疑升级：以 Hugging Face、德国网站、澳大利亚政府服务器等多起入侵事件为据，指控 OpenAI 屡次隐瞒数月，安全治理存在系统性失职。\n3. 诉求法律化：呼吁司法部立案调查，并推动扩充计算机犯罪法律，将“重大过失”与“屡次犯罪”纳入追责范围，同时质疑白宫的监管缺位。\n\n# 影响分析\n\n此番言论将 AI 安全争议从技术伦理推向法律问责层面。Marcus 作为长期批评者，借行业领袖之口施压，放大了舆论对 OpenAI 治理透明度的质疑。若司法部介入或立法跟进，可能重塑 AI 企业的合规成本与披露义务，形成监管先例。但“暂时关停”在实操上近乎不可能，其真正价值在于倒逼行业建立强制披露与事故问责机制。对白宫而言，沉默将加剧公众对监管俘获的担忧，AI 安全议题或成下一轮政策博弈焦点。",

  "deep": "## AI 解读\n\n核心要点：首部AI长剧《后西游记》登陆湖南卫视黄金档，标志AI视频生成从短视频实验迈入长叙事商业化阶段。三个关键信号：一是Seedance实现100%视频生成，技术端已具备连续长内容生产能力；二是制作周期3个月、单场动作戏成本仅十几万元（真人实拍需300-400万元），成本压缩达95%以上；三是上线一周芒果TV播放量破1.5亿次，市场验证初步跑通。\n\n影响分析：其一，对影视行业而言，AI将重构成本结构与生产流程，中低端特效、群演场景、类型化内容首当其冲，传统制作公司的护城河被削弱。其二，平台侧，芒果TV借\"灵创平台+卫视黄金档\"打通AI内容从生产到分发的闭环，若模式可复制，将形成对长视频平台的差异化竞争力。其三，需冷静看待：当前AI长剧在表演细腻度、情感张力上仍有明显短板，1.5亿播放量中含尝鲜流量，能否沉淀为稳定用户留存尚待观察。真正的拐点不在\"能不能做\"，而在\"观众愿不愿意持续看\"。",
  "no": 25

  "url": "https://github.blog/security/application-security/ai-powered-fuzzing-with-the-github-security-lab-taskflow-agent",
  "title": "GitHub Security Lab 发布 LLM 驱动的 Fuzzing Taskflow，自动完成 C/C++ 项目模糊测试全流程",
  "src": "GitHub Blog",
  "lede": "GitHub Security Lab 的 Antonio Morales 开源了基于 Taskflow Agent 的 Fuzzing Taskflow，指向 GitHub 仓库即可自动识别入口点、编写 harness、运行 AFL++、读取覆盖报告并分诊崩溃。",
  "deep": "## AI 解读\n\n核心要点：GitHub Security Lab 开源 LLM 驱动的 Fuzzing Taskflow，将模糊测试全流程自动化——从识别入口点、编写 harness、运行 AFL++，到读取覆盖报告、分诊崩溃，用户仅需提供仓库地址。这是 AI Agent 在安全工程领域的又一次落地，把原本需要资深安全工程师数天完成的繁琐工作压缩为自动化流水线。\n\n影响分析：\n\n1. 降低安全测试门槛：harness 编写是模糊测试的最大瓶颈，依赖对目标代码的深度理解。LLM 自动生成 harness，使中小项目和开源维护者也能低成本获得专业级 fuzzing 能力，有望提升整个生态的漏洞发现效率。\n\n2. 安全工具链重构信号：从\"人驱动工具\"转向\"Agent 编排工具链\"，AFL++ 等传统工具成为被调度的执行单元。这预示安全工程岗位的技能重心将从手工操作转向 Agent 设计与结果审核。\n\n3. 风险与局限：LLM 生成的 harness 质量参差不齐，可能引入误报或漏测；崩溃分诊的准确性仍需人工复核。此外，自动化漏洞挖掘能力若被滥用，也可能加速攻击面发现，攻防节奏将进一步加快。\n\n总体看，这是 AI 赋能安全自动化的标志性案例，短期提效明确，长期将重塑安全测试的工作范式。",

 },

  "id": "finance-1790298005402-5",
  "day": "2026-09-24",

  "url": "https://finance.sina.com.cn/money/forex/whqqscgd/2026-09-24/doc-inisxaff5016785.shtml",
  "title": "美联储官员放鹰+PMI数据支持，10月加息概率升至73%_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "2026年09月24日 13:10 市场资讯\n\n 文章来源：汇通财经\n\n 周三（9月23日），美联储理事迈克尔·巴尔释放偏鹰政策信号，公开表态支持10月再度加息，叠加最新PMI初值显示通胀压力再度升温，市场对于美联储10月加息的预期快速升温。与此同时，多位美联储地区行长相继表态，认为仍有必要继续收紧货币政策。欧洲央行官员也同步发出警示，能源价格第二波上涨或将令通胀长期维持高位，欧美央行的紧缩预期共振，直接带动美债收益率大幅上行，全球资本市场随之迎来剧烈反应。\n\n 美国PMI数据全面走强，通胀与就业同步升温\n\n 标普全球公布的制造业与服务业PMI初值表现亮眼，两项指标均创下四年多新高。服务业采购经理人指数录得58.7，为59个月以来最高；制造业PMI攀升至56.7，创53个月新高。综合PMI达到58.4，为62个月高点，PMI读数高于50即代表经济处于扩张区间。\n\n 亮眼经济数据背后，通胀压力再度抬头。标普全球市场情报首席商业经济学家克里斯·威廉姆森（Chris Williamson）表示，9月企业投入成本创下四年最快涨幅，国际油价上行推高燃油与运输成本，将在未来数月持续推高商品售价与整体通胀水平。就业端同样表现强劲，企业为处理积压订单持续扩招员工，本次PMI调查中的就业增速创下2022年6月以来新高。服务业就业扩张速度达到2002年6月以来最高，制造业就业增速也回升至2021年2月之后的最高水平。\n\n 美联储高官集体释放鹰派信号，10月加息预期飙升\n\n 美联储理事迈克尔·巴尔（MichaelBarr）在芝加哥住房会议的准备发言稿中表示，即便上周已经完成一次25个基点加息，政策制定者依旧还有更多工作要做。他说：“在我的基准情景中，大概率还需要进一步调整政策，确保通胀及时回落至目标水平。我们希望支撑可持续的经济增长，以实现充分就业，而物价稳定是实现这一目标的核心前提。”\n\n 上周FOMC会议将基准利率上调25个基点，政策利率区间来到3.75%至4%，巴尔投下赞成票。18位提交经济预测的参会官员之中，仅有两人不支持年内继续加息。圣路易斯联储行长阿尔贝托·穆萨莱姆（AlbertoMusalem）、波士顿联储行长苏珊·柯林斯（SusanCollins）也相继表态，认为有必要继续加息。\n\n 周二（9月22日），苏珊·柯林斯发文称，通胀持续高于2%目标水平的可能性有所上升，劳动力市场基本面改善，货币政策可以优先推动物价回归稳定，维持偏紧缩的联邦基金利率，能够帮助通胀持续回落至目标。\n\n 受官员讲话与PMI数据双重刺激，CME美联储观察工具显示，10月27至28日FOMC会议加息概率跳升至73%。美债收益率快速上行，对政策预期最为敏感的2年期美债收益率上行超13个基点，触及4.9%。\n\n 欧洲央行同步预警，能源二次冲击推高通胀，前景充满不确定性\n\n 大西洋彼岸，欧洲央行执委菲利普·莱恩（PhilipR.Lane）周二也发出警示，能源价格的第二轮上涨浪潮，可能会让通胀在更长时间内维持高位。他表示，食品、能源包括电力，以及各类商品都面临上行压力。如果今年秋季能源冲击的幅度更大、持续时间更长，将会拖累欧元区经济。\n\n 欧洲央行基准预测参考油气期货价格，预计油气价格在今年晚些时候有所缓和，局势虽无法完全恢复以往水平，但会较当前状态有所改善。不过莱恩强调，这套基准预测背后，存在极高的不确定性。欧美两大央行官员接连释放鹰派观点，全球货币政策收紧预期互相强化，持续影响全球外汇、债券与大宗商品市场。\n\n 结语\n\n 综合来看，强劲的美国PMI数据、飙升的投入成本，叠加美联储多位官员集体放鹰，大幅推升市场对10月加息的定价。美国经济呈现出经济扩张、就业火热同时通胀反弹的组合，迫使美联储继续收紧货币政策，美债收益率随之走高。欧洲央行同样警惕能源带来的第二轮通胀冲击，全球主要央行的紧缩周期尚未结束。\n\n 后续投资者需要持续跟踪美国CPI、就业数据以及欧美央行官员的政策表态，央行政策预期的边际变化，将持续扰动全球债市、汇市与贵金属市场，市场波动风险仍将维持高位。\n\n责任编辑：朱赫楠",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 数据与表态共振推升加息预期：美国9月制造业、服务业PMI双双创四年多新高（服务业58.7、制造业56.7），投入成本创四年最快涨幅，就业增速同步走强；美联储理事巴尔及多位地区行长集体放鹰，CME数据显示10月加息概率跳升至73%。\n2. 紧缩预期全球共振：欧洲央行执委莱恩同步警示能源二次冲击风险，欧美紧缩预期相互强化，2年期美债收益率单日上行超13BP至4.9%。\n\n影响分析\n\n其一，美国经济呈现\"扩张+就业热+通胀反弹\"组合，意味着本轮紧缩周期尚未见顶，市场此前对政策转向的乐观定价面临系统性修正。其二，2年期美债收益率逼近5%将直接抬升全球风险资产贴现率，压制估值端，美元走强压力下新兴市场资本外流风险上升。其三，能源二次冲击若兑现，欧美央行将被迫在\"抑通胀\"与\"稳增长\"间艰难权衡，滞胀交易逻辑可能重新主导大类资产配置。\n\n后续关键变量：美国CPI与就业数据、10月FOMC会议前的官员表态边际变化。当前市场波动率抬升具有基本面支撑，短期难以快速收敛。",
  "no": 27
 },
 {
  "id": "finance-1790298005403-8",
  "day": "2026-09-24",

  "url": "https://finance.sina.com.cn/wm/2026-09-24/doc-inisvumt8495963.shtml",
  "title": "美股创新高，A股何时启动？_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "美股创新高，A股何时启动？\n\n 2026年09月24日 00:00 泽平宏观\n\n文：任泽平团队\n\n美股纳指创历史新高。尽管面临美联储加息，近一月纳指涨 4.1%， 9月 21、 22日连创新高，标普 500距历史高点约 0.4%。 AI科技牛引领。\n\nAI科技牛会全球同频共振吗？还在震荡的A股何时启动？\n\n1 美股创新高由AI科技引领，三大分化\n\n本轮美股上涨顶着美联储加息的逆风，行情分化，主要由AI科技革命驱动，呈三大分化：\n\n美股三大指数分化，纳指领涨，道指下跌。截至9月22日，近一个月纳指涨4.1%，标普涨1.2%，道指跌2.7%。\n\n行业分化，科技大涨，传统行业普跌。标普500中10大行业，只有信息技术和通讯服务两个行业上涨，涨幅分别7.0%和6.3%，其余8个行业全部下跌，房地产跌5.0%、工业跌5.4%、金融跌4.5%。\n\nAI行情内部分化。半导体和半导体设备分别涨13.2%和8.4%，软件中，与安全、AI原生应用相关的标的上涨，传统SaaS面临替代威胁下跌。\n\n2 四大原因：AI盈利强劲，Muse爆火催化，加息靴子落地，美伊冲突缓和\n\n本轮美股创新高，分子端是盈利强劲和Muse智能体催化，分母端是美联储加息靴子落地，利空出尽，美伊冲突缓和，油价回落，风险偏好回升。\n\nAI龙头盈利持续强劲，从硬件算力向超级应用延伸。硬件方面，英伟达2027财年第二季度营收962.2亿美元，同比增长106%；GAAP净利润596.9亿美元，同比增长126%。云厂商方面，微软2026财年第四季度Azure及其他云服务收入同比增长43%，全年Azure收入首次超过1000亿美元，Microsoft 365 Copilot付费席位超过3000万。一定程度缓解市场对 AI资本开支放缓的担忧。\n\nMuse爆火，AI应用爆发，推动行情扩散。 Meta于9月8日发布个人AI智能体Muse，可执行购物、行程安排等任务，并在独立云端虚拟机上持续运行。标志着 AI开始从回答问题走向“能说会干”，有望带动更广泛的计算需求。智能体持续运行需要配套更复杂的浏览器操作、任务调度与数据存储，将大幅增加对 CPU、内存和云基础设施的需求，提振市场预期。\n\n美联储加息靴子落地，市场回归基本面。 8月美国物价回落不及预期，非农就业超预期，市场前期已充分定价加息预期。9月议息会议前加息概率已超过九成，主要方向已被市场消化。加息25bp落地后，利空出尽，压制因素解除。\n\n美伊冲突缓和，油价下跌，美债利率回落，成长股估值提升。近期美伊冲突再现缓和迹象，伊朗官员在纽约与美方进行了接触，特朗普表示美伊可能在中期选举后达成结束冲突的协议。9月22日，布伦特原油回落至95美元/桶左右，10年期美债收益率回落至约5%以内。长端利率是股票估值的重要参照，其回落降低未来现金流的贴现压力，对远期盈利占比较高的科技股尤其有利。\n\n3 AI康波周期量级机会，科技牛全球同频共振\n\n AI康波周期级机会。 AI是第四次科技革命，康波周期量级，十年向上趋势，两大波机会：卖铲子-超级应用，科技牛全球同频共振。\n\nAI卖铲子的需求远未见顶。 2027年四大云厂商资本开支将从2026年7250亿美元进一步攀升至近9000亿美元。黄仁勋预判2027年AI算力需求将达到至少1万亿美元，建立在推理爆发、智能体普及、物理AI落地三大趋势之上。AI资本开支支撑盈利韧性。标普500未来12个月预测盈利同比增16%且持续上修。\n\n超级应用尚处爆发前夜，AI盈利兑现是关键。市场担心云厂商的巨额AI投资能否转化为真实回报，下游应用场景才刚刚起步，历次康波周期中，超级应用带来的机会不亚于卖铲子。Anthropic年化收入年底预计超1000亿美元，连续第二个季度实现经调整营业利润。Meta的Muse智能体应用登顶美国iOS免费榜，市场立即给予11%的单日涨幅。未来AI七大超级应用：大模型、Agent、智能驾驶、AI创新药、人形机器人、AI内容创作、AI广告传媒。各家探索比拼技术成熟度和商业模式，市场仍处在“看不懂”阶段，哪一个跑出来都是万亿级市场。\n\n4 美联储加息不可持续，短期扰动不改长期趋势\n\n美联储加息靴子落地，短期噪音不改长期趋势。美联储根据短期经济周期相机决策，底层由3年左右的库存周期驱动，而AI由40-60年康波周期驱动，短期加息紧缩政策难以逆转长期向上趋势。\n\n根据物价和就业情况，短期或还有1-2次加息，主要为维护美联储信誉。 9月点阵图显示2026年底政策利率中位数为4.1%，仍指向年内再加息一次。与此同时，美联储将2026年GDP增速预测由2.2%上修至2.3%，失业率预测由4.3%下修至4.1%，经济韧性也为企业盈利提供支撑。未来需关注9月美国物价和就业数据。\n\n但中长期看美联储不具备连续大幅加息的基础。",
  "deep": "## AI 解读\n\n【核心要点】\n\n1. 美股创新高本质是AI科技牛：纳指近一月涨4.1%并连创新高，但行情高度分化——标普500十大行业仅信息技术和通讯服务上涨，道指下跌，资金向AI算力（半导体涨13.2%）和AI原生应用集中，传统SaaS及周期行业被抽血。\n2. 分子分母共振驱动：分子端英伟达营收同比增106%、Azure收入破千亿、Meta智能体Muse爆火标志AI从“回答问题”走向“能说会干”；分母端加息靴子落地利空出尽、美伊冲突缓和压低油价与美债利率，成长股估值压力缓解。\n3. AI被定位为康波周期级机会：十年向上趋势，路径为“卖铲子→超级应用”，2027年四大云厂商资本开支预计攀升至近9000亿美元，算力需求远未见顶。\n\n【影响分析】\n\n对A股而言，全球AI科技牛存在同频共振逻辑，但传导路径依赖产业链映射——算力硬件、半导体设备、AI应用端或率先受益于情绪与订单外溢。然而A股启动仍需内部条件配合：盈利预期修复、增量资金入场及政策催化。短期看，美联储年内或再加息1次构成扰动，但中长期不具备连续大幅加息基础，外部流动性压制有限。关键变量在于AI超级应用能否在A股形成可验证的盈利兑现，而非单纯主题炒作。 投资者应聚焦算力链与AI原生应用两条主线，警惕传统板块在风格切换中的持续承压。",
  "no": 28
 },

  "url": "https://stock.jrj.com.cn/2026/09/24130758528973.shtml",
  "title": "高盛：10月再来一次利率风暴，后面就一片光明了！-股票-金融界",
  "src": "Exa 搜索",
  "lede": "高盛：10月再来一次利率风暴，后面就一片光明了！-股票-金融界\n\n高盛：10月再来一次利率风暴，后面就一片光明了！\n\n近日，高盛亚洲亚太区首席经济学家Andrew Tilton最新表态引发市场关注。\n\n他表示，尽管市场目前正按“明年中之前美联储还有3次加息”进行定价，但高盛认为，美联储在今年10月完成最后一次加息后，本轮加息周期就将结束。\n\n这一判断与当前市场的主流预期存在明显分歧，也值得普通投资者高度关注。\n\n根据CME“美联储观察”最新数据，美联储10月会议加息25个基点的概率已升至69.7%，维持利率不变的概率仅为30.3%。\n\n也就是说，市场几乎已经默认10月会加息。\n\n但高盛的核心观点在于：\n\n10月加息之后，就不会再加息了。\n\nTilton的理由有三：\n\n核心通胀年底将显现放缓迹象，明年下半年有望回落至2%左右；\n\n11月美国中期选举后，美联储没有继续加息的必要；\n\n民主党有望赢得众议院，这通常会在财政端产生温和的收缩效应，财政支出放缓叠加通胀降温，美联储进一步加息的压力将大为减轻。\n\n当然，高盛有一个前提条件：油价必须持续回落，否则通胀无法抑制之下，美联储依然有机会按原有加息剧本走。\n\n目前，油价依然在100美元关口反复。高盛预测，到12月布伦特原油价格将跌至每桶85美元。\n\n如果这一预测成真，通胀压力将显著降温，美联储确实没有理由继续加息。\n\n但如果地缘风险再度升温、油价反弹，高盛的两次加息就完事儿的判断就可能被推翻。\n\n与高盛的相对乐观不同，近期多位美联储官员接连释放鹰派信号：\n\n里士满联储主席巴尔金：不排除未来进一步加息的可能性；\n\n波士顿联储主席柯林斯：预计年底前再次加息，利率将在2027年保持稳定；\n\n圣路易斯联储主席穆萨莱姆：美联储最好尽快采取行动，而不是等待；\n\n明尼阿波利斯联储主席卡什卡利：美国经济“各个方面”的通胀仍然过高。\n\n在9月16日的议息会议上，美联储全票通过加息25个基点，将利率上调至3.75%-4.00%。点阵图显示，18名官员中有16人预计今年至少还会加息一次。\n\n主席凯文·沃什更是三度使用去除了一剂宽松的措辞，暗示当前利率水平远未达到限制性程度，后续仍有收紧空间。\n\n回到资本市场，如果高盛的判断成真，10月加息后美联储“收手”，那么美元走强压力缓解，人民币汇率企稳，北向资金流出压力减轻；美债收益率见顶回落，全球成长股估值压力缓解，对A股科技、成长板块构成利好；大宗商品价格承压，输入性通胀压力下降，国内货币政策空间进一步打开。\n\n但如果油价反弹、通胀黏性超预期，美联储被迫继续加息，那么全球流动性收紧的阴影将重新笼罩，股市的外部压力也会加大。\n\n不过，对普通投资者而言，不必过度纠结于单次加息的短期冲击，更应关注油价走势、核心PCE数据、美元指数和美债收益率。\n\n除此之外，更重要的关注点，其实是Q3财报，特别是美股AI科技、对A股的映射，以及国内热门科技公司的财报数据。\n\n如果求稳，保持耐心、控制仓位、保持充裕的现金，等待方向明朗后再做决定买不买，也是一个稳妥的选择。\n\n 责任编辑：栎树",
  "deep": "## AI 解读\n\n# 高盛“10月终局论”：一场与美联储鹰派的豪赌\n\n核心要点\n\n高盛与美联储正在上演一场罕见的预期博弈。高盛押注10月为“最后一加”，逻辑链条为：核心通胀年底放缓→中期选举后政治压力消退→油价回落至85美元→加息周期终结。但美联储官员集体放鹰，点阵图显示多数官员预计年内至少还有一次加息，沃什更明确暗示利率远未达限制性水平。市场定价与高盛判断已出现明显裂痕。\n\n影响分析\n\n若高盛判断成立，全球风险资产将迎来三重利好：美元见顶缓解人民币压力，美债收益率回落打开成长股估值空间，大宗商品降温为国内货币政策腾挪余地。但这一情景高度依赖油价持续回落这一脆弱前提。一旦地缘风险推升油价，通胀黏性将迫使美联储延续紧缩，全球流动性收紧阴影重现。当前市场对10月加息概率已定价近70%，真正的风险不在于10月是否加息，而在于之后美联储是否“收手”。投资者应紧盯油价、核心PCE与Q3财报三条主线，在方向明朗前保持仓位弹性。",

  "url": "https://finance.sina.com.cn/jjxw/2026-09-24/doc-inisxxkv4904677.shtml",
  "title": "具身智能的“学习方式”变了！诺因发布GLOW架构，机器人“一教就会”_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "具身智能的“学习方式”变了！诺因发布GLOW架构，机器人“一教就会”\n\n 2026年09月24日 21:15 滚动播报\n\n（来源：上观新闻）\n\n一直以来，要让机器人学会一项新任务，往往需要重新采集数据、编写固定流程，或进行针对性训练。这类方式可以解决确定性较高的任务，却难以覆盖真实场景中不断变化的物品、环境和需求。\n\n近期，新一代通用大模型GPT-6 Astra的发布，引发行业对具身智能技术路线的广泛讨论与重新思考。不少观点认为，通用大模型正在展现操控机器人的能力，可能对既有具身智能路线形成冲击；与此同时，行业也逐步形成共识：自回归架构正成为模型架构的收敛方向，具身智能的竞争核心将转向数据与学习方式。\n\n9月24日，诺因（Knowin）发布面向通用具身智能的生成式学习架构GLOW技术报告，系统介绍了GLOW全新升级的技术架构，呈现了一条将通用认知能力转化为可靠物理行动的可行路径，核心突破在于让机器人具备“一教就会”的任务学习能力。\n\n新民晚报记者获悉，GLOW的目标是让机器人获得跨物体、跨环境、跨任务复用的通用具身能力，而非为每项任务单独学习一套策略。用户不必把需求拆解成机器指令，也不必受限于出厂时写好的功能清单。机器人可以通过一次完整操作理解任务，再把画面、物品关系、状态变化与执行反馈转化为行动。从开箱收纳、浇水，到擦桌、调酒等各类家务工作，这一能力都得到了验证。\n\n“一教就会”源于GLOW全新升级的技术路径。GLOW将原有的Brain与Act能力统一到多模态自回归模型KnowinGLOW中，使视觉理解、空间推理、任务规划与动作生成能够在同一模型内协同完成。其中，KnowinDream负责生成物理交互经验，KnowinWorld用于模拟动作可能带来的结果，KnowinAgent则围绕任务记忆、工具调用、反馈和重新规划组织执行流程。由此，GLOW形成了从经验学习、任务理解到行动反馈的完整链路。\n\n报告披露了GLOW在RoboDojo、LIBERO-Pro和Embodied Arena等评测中的成绩。实验结果表明，GLOW不仅能够理解物理场景，还能将这种理解转化为有效的任务执行。在本报告的评测设置下，GLOW在多项国际主流具身评测中取得领先成绩，展现了在空间理解、物理交互与任务执行方面的能力。\n\n据介绍，通用模型增强智能的知识、理解与推理能力，专业具身模型则以物理交互为核心，构建从场景理解到自主行动的完整能力。诺因持续推进这条技术路线：以规模化物理经验训练模型，以统一架构协同认知与行动，以闭环执行适应环境变化。\n\n原标题：《具身智能的“学习方式”变了！诺因发布GLOW架构，机器人“一教就会”》\n\n栏目编辑：马丹 题图来源：采访对象供图",
  "deep": "## AI 解读\n\n核心要点提炼\n\n诺因发布GLOW生成式学习架构，核心突破在于将视觉理解、空间推理、任务规划与动作生成统一到单一多模态自回归模型（KnowinGLOW）中，实现机器人“一次教学即可掌握任务”。其技术路径由KnowinDream（生成物理交互经验）、KnowinWorld（模拟动作结果）、KnowinAgent（任务记忆与反馈重规划）构成完整闭环。在RoboDojo、LIBERO-Pro等国际主流具身评测中取得领先成绩。\n\n影响分析\n\n1. 技术路线信号明确：GLOW选择自回归架构统一认知与行动，与GPT-6 Astra引发的行业共识一致——具身智能竞争核心正从模型架构转向数据与学习方式。这标志着行业从“为每项任务单独训练策略”向“跨任务复用通用能力”的范式迁移。\n\n2. 通用大模型与专业具身模型的分工格局初现：通用模型提供知识与推理底座，专业具身模型负责物理交互落地。诺因此路线若持续验证，将在家庭服务、轻量工业等非确定性场景中打开商业化空间。\n\n3. 待观察项：评测领先能否转化为真实场景的泛化稳定性，以及“一教就会”在长尾任务中的实际成功率，仍是关键验证点。",
  "no": 30
 },

  "title": "人类行为数据才是终极大脑？机器人正在寻找自己的互联网｜甲子光年_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "人类行为数据才是终极大脑？机器人正在寻找自己的互联网｜甲子光年\n\n 2026年09月24日 13:28 甲子光年\n\n从Figure的30个陌生家庭，到Light-O1的人类动作预训练：机器人智能正在寻找新数据源。\n\nFigure最新发布的Helix 2.5演示，把人形机器人的竞争带到了一个新的问题上：机器人是否已经开始具备进入陌生世界的能力？视频中， Figure人形机器人进入30个此前从未见过的家庭环境，在没有针对具体家庭重新采集数据、没有进行环境级微调的情况下，完成整理物品、铺床、折叠毛巾等连续任务。它让机器人开始展示一种更接近“真正”智能的能力：去往新地方，理解环境，并完成任务。\n\n而几乎在同一阶段，另一组视频也引发了广泛关注。\n\n来自中国的具身智能公司亮源新创， 21日公开了其最新技术成果视频：同样的真实家居场景，机器人开门迎人、递物、收纳、整理床铺，一镜到底地做完一整套家务。这与Figure展示的家庭泛化能力形成了一个有意思的对应：前者展现了机器人已经可以进入未知环境，利用已有经验完成任务；而后者则更进一步——两台形态迥异的机器人，在同一个模型的驱动下各自作业、彼此递物，甚至可抗进行中的人为干扰。\n\n无论是 Helix 2.5的30个陌生家庭测试，还是亮源新创的双人形实景演示，本质上都在探索同一个机器人行业长期面临的问题：机器人能否将预训练阶段获得的能力，迁移到新的环境、任务和机器人本体中，而不再依赖针对每一个场景重新采集数据、训练适配。越来越清晰的一条路径是：让机器人直接向人类自身的日常行为学习。\n\n1.Figure的答卷：\n\n人类行为数据的规模效应初显\n\n先读懂 Figure交出的成绩：机器人在30栋陌生房间中执行整理物品、铺床、折叠毛巾三类任务，共尝试420次、成功237次，综合成功率56%。对这份成绩最有力的注脚，来自Figure披露的对照实验：不使用这批预训练数据、以同样任务设置训练的模型，成功率只有9%。从9%到56%，中间隔着的，是千万条量级的人类自身行为视频预训练——这是行业第一次看到，人类行动数据被推到这个量级之后，机器人在陌生环境里的表现会发生什么。\n\n而 Helix 2.5的飞跃有一个明确来源：8月25日公开的Index数据平台。它付费招募普通人拍摄自己的日常操作，据公开披露，累计上传视频已超过1600万条，Figure已向创作者支付1500万美元报酬，新数据以每秒30至35分钟的速度涌入；每1000小时数据覆盖373项独特任务、1146种物体、116种环境。为消化这些数据，公司还锁定了至少35亿美元的算力供应。\n\n把 Index与对照实验连起来读，这次发布真正的重点便浮出水面——不是56%这个数字，而是它背后初显的规模效应：当人类自身行动数据从数万小时级的专门采集，扩大到千万条视频、并以每秒 30分钟的速度持续涌入，机器人第一次带着大规模的人类经验走进陌生环境。它验证的不是某项具体技能，而是一种趋势——随着人类行动数据规模扩大，机器人利用已有经验适应陌生环境的能力持续提升。\n\n这也解释了那些巨额投入的真正含义：一家全球估值最高的人形机器人公司，正在用真金白银为这条规律下注——人类行动数据的规模，值得如此投入。Figure创始人阿德科克说的：随着数据量增加，迁移效果有“可预见的提升”——这句话，值得被铭记。\n\n2.Light-O1的答卷：\n\n把人类经验压缩成机器人智能\n\n四天后出现的第二份答卷，来自亮源新创。随演示视频同步公开的，是一份完整技术报告，主角是全身智能基础模型 Light-O1。它能力的来源，写在报告最核心的一处：Light-O1的人类行动数据，来自互联网上已经存在的大规模人类行为视频。根据技术报告中的示意性评估，这类数据规模超过10亿小时。\n\n这些数据的价值并不只是规模，而在于它天然记录了人类在真实世界中的行为经验。从做饭、修理、搬运，到运动、攀爬，再到人与人之间的协作，以及任何人工采集流程难以提前设计的长尾场景，互联网视频记录了人类如何与物理世界持续交互的过程。\n\n正如技术团队在采访中提到，如果互联网文本压缩了人类知识，那么互联网视频正在压缩人类在这个世界中留下的行为经验。大语言模型通过互联网文本获得了对语言世界的理解，而机器人需要通过互联网视频获得对物理世界的经验。\n\n但如果互联网视频包含了如此丰富的人类行为经验，为什么过去并没有直接成为机器人基础模型的训练资源？原因在于，人类视频记录的是“别人如何行动”，而机器人需要学习的是“自己的身体如何行动”。视频中包含丰富的视觉信息，却缺少机器人可以直接执行的动作表示；同时，人类与机器人之间还存在身体结构、动作空间和视觉输入方式上的差异。\n\n互联网可提供 10亿小时+海量人类行为预训练数据",
  "deep": "## AI 解读\n\n核心要点\n\n1. 数据范式转移：人形机器人竞争焦点正从硬件/算法转向数据源。Figure的Helix 2.5在30个陌生家庭实现56%任务成功率，对照组仅9%——差距来自千万条级人类行为视频预训练。其Index平台已积累超1600万条视频，以每秒30分钟速度增长，并锁定35亿美元算力。\n\n2. 两条技术路径：Figure走“付费众包采集”路线，用真金白银构建专有数据护城河；亮源新创Light-O1则挖掘互联网已有10亿小时人类行为视频，试图将“别人的行动”压缩为机器人可执行智能。\n\n3. 共性突破：两者都验证了跨环境、跨本体的泛化能力——机器人开始摆脱“一场景一训练”的定制化窠臼。\n\n影响分析\n\n这标志着具身智能进入“数据规模定律”阶段：人类行为数据的量级，正成为机器人泛化能力的核心变量。Figure的对照实验首次量化了这条规律——从9%到56%的跃升，本质是数据规模带来的质变。\n\n对行业而言，竞争壁垒将从模型架构转向数据资产：谁能更低成本、更大规模地获取高质量人类行为数据，谁就掌握先机。亮源新创的“互联网视频挖掘”路径若走通，将大幅降低数据获取成本，对Figure的众包模式构成潜在挑战。\n\n更深层的影响在于，机器人正在构建自己的“互联网”——一个以人类行为为语料、以物理世界为场景的经验网络。这或许是大模型之后，AI能力跃迁的下一个基础设施。",
  "no": 31
 },

  "title": "小场景跑出大订单 具身智能落地走向实处|机器人|灵巧手|世界人工智能大会_网易订阅",
  "src": "Exa 搜索",
  "lede": "◎记者 陈铭\n\n 9月23日11时，第五届全球数字贸易博览会（下称“数贸会”）人工智能展区，杭州星物种机器人有限公司展台上的一台清洁机器人正在模拟公共卫生间作业，引来一些海外客商驻足。\n\n “今年数贸会刚刚开始，我们就收到了超过500台意向订单。”星物种机器人联合创始人、COO余济萍告诉上海证券报记者，上述意向订单主要来自海外。\n\n 在大会现场，上海证券报记者注意到，具身智能产业正在“落向细处，走向实处”，越来越多机器人企业已切入细分领域。随着市场需求释放，行业的订单增长、产品交付与产能爬坡同步推进，并进一步向产业链上游传导，带动数据采集、灵巧手等配套环节加快扩容。\n\n 细分场景涌现大订单\n\n 需求正在加速转化为订单，余济萍对此感受尤为真切。\n\n “这是我们连续第三年参会了。”余济萍告诉记者，2024年公司首次带着清洁机器人亮相数贸会，2025年就拿到超过3亿元的意向订单，如今在手订单规模达到5亿元。在公共卫生间这样一个看似“小众”的场景里，机器人正在跑出大订单。\n\n “公共卫生间是半结构化的场景，更有利于机器人学习和适配。”星物种联合创始人周勇告诉记者，星物种已有100多台机器人在杭州多处公共卫生间稳定运行。\n\n 随着订单逐步兑现，今年以来星物种进入批量生产和产能爬坡阶段。“我们现在要做的，是把产能稳定下来，把订单进一步落地。”周勇表示。\n\n 服装缝纫这一传统劳动密集型场景也迎来机器人入场。\n\n 艾图科技展台上，一台服装智造机器人从层层叠叠的软布上分离出单层裁片，抓取、转移，再将柔软的布料铺平、对齐，与下一环节的自动化缝纫设备协同配合。\n\n 艾图科技技术总工程师周东旭介绍，上述这些动作看似简单，实则要处理三大难点：从成摞布料中分离出单张布料；将单张布料在指定位置铺平并实现毫米级对齐；实现多张布料之间的连续铺平和对齐。\n\n 目前，机器人在服装制造领域的应用正在加速。今年以来，艾图科技已与安徽恒峰签订200台人形机器人采购订单；其母公司杰克科技与浙江人形机器人创新中心与达成战略合作，签约2000台服装场景定制人形机器人。\n\n 上游“卖铲人”迎来增量需求\n\n 机器人加速上岗，也让数据采集、核心零部件等具身智能上游“卖铲人”忙了起来。\n\n 景联文科技品牌总监洪丽告诉记者，目前公司已有约20万小时具身智能素材采集需求，为承接相关需求，公司正持续扩大数据采集供应体系，“第一期招募供应商的时候，第一天就来了300多家，我们都没有想到”。\n\n 与在实验室搭建单一环境不同，景联文正在把数据采集搬入真实的消费和工业场景。目前，公司已在芜湖、重庆、贵阳布局三大自建具身智能数采基地，由工人佩戴头戴式及手部设备，进入实际场景进行拆装、打包等作业记录。近期，公司还与杭州具身智能中试基地等共同出资成立浙江具身智能数据运营有限公司，希望打通从真实场景获取、规模采集到数据治理、流通和交付的链条。\n\n 数据之外，灵巧手等核心部件迎来扩产窗口。本届数贸会上，曦诺未来集中展示了Flex 2和Prima 1两款灵巧手：Flex 2采用“腱绳+直驱”的混合驱动方案，面向工业和消费级应用；Prima 1采用全关节直驱方案，开合时间可达到0.08秒，主要服务算法与模型训练。据悉，曦诺未来的产能正在同步扩张。目前，公司已与多家头部具身厂商签下大额订单，5400平方米新工厂已建成投产，产能持续爬坡中。\n\n每日经济新闻 2026-08-23 04:20:54\n\n \n\n### GPT-6彻底玩转Blender 一张图纸，GPT-6 Astra就在Blender里搭出了3295个可编辑物体\n\n量子位 2026-09-10 01:38:47\n\n量子位 2026-09-21 19:36:43\n\n量子位 2026-04-23 11:44:18\n\n量子位 2026-06-07 04:37:43\n\n量子位 2026-05-21 08:04:06\n\n量子位 2026-04-03 22:52:35\n\n财联社 2026-09-24 07:14:02\n\n杜文龙 2026-09-23 17:49:54\n\n### 人机同台上演震撼大齐舞，机器人揭下面具惊艳全场！\n\n东方娱乐 2026-09-23 13:48:55\n\n \n\n### 沙特的救兵来了，比土耳其还猛，中方已仁至义尽，红海浑水不能蹚 \n\n \n\n### 一人团队用WorkBuddy获客，4个月营收50万，AI+运营正在被重新定义 \n\n \n\n \n\n \n\n \n\n### 车主留意！新一轮国内油价调整将至 \n\n \n\n \n\n \n\n \n\n### 解放军放出重磅消息！据国防部通报，9月22日到25日，中方将派出部队前往印尼，参与东盟防长扩大会框架下的“三叉戟决心”实兵演练。",
  "deep": "## AI 解读\n\n# 具身智能落地观察：从“秀肌肉”到“跑订单”的拐点信号\n\n核心要点\n\n1. 场景选择务实化：星物种聚焦公共卫生间清洁（半结构化场景），艾图科技切入服装缝纫，均避开通用人形机器人的高难度路线，以细分场景实现商业闭环。星物种在手订单达5亿元，艾图签约2000台服装场景定制机器人，验证了“小场景跑大订单”的路径可行性。\n2. 产业链上游全面受益：数据采集端景联文需求达20万小时、灵巧手厂商曦诺未来新工厂投产并获头部厂商大额订单，表明下游订单已向上游传导，产业从“单点突破”进入“链式扩容”阶段。\n3. 产能爬坡成为当前瓶颈：多家企业提到“产能稳定”与“订单落地”的同步推进，说明需求端已跑在供给端前面。\n\n影响分析\n\n这一轮具身智能的商业化逻辑与上一轮AI浪潮有本质区别：不再依赖通用能力叙事，而是以可量化的ROI驱动采购决策。清洁、缝纫等场景的共同特征是——劳动密集、标准化程度适中、人力成本敏感，机器人替代的经济账容易算清。\n\n对行业而言，这意味着三个趋势：一是估值锚点将从技术参数转向订单与交付数据；二是上游核心零部件（灵巧手、数据服务）将率先享受确定性增量，投资关注度可能前移；三是“场景定义机器人”将取代“机器人寻找场景”，具备场景know-how的集成商议价能力上升。风险在于，产能爬坡与交付质量若跟不上订单增速，可能引发客户信任透支，需持续跟踪实际交付率而非意向订单口径。",

  "lede": "美伊纽约会晤 可否吹散霍尔木兹海峡“迷雾”？\n\n 2026年09月24日 01:59 央视\n\n 当地时间9月22日，伊朗外长阿拉格齐与美国总统特使威特科夫在第81届联合国大会会议期间于纽约举行会晤。\n\n 美国总统特朗普对媒体证实，美国官员当天与伊朗代表举行了一场“非常好的”会谈，持续了3个小时。他还表示，美伊双方已安排在近期再次举行会谈。\n\n 美联社网站9月23日相关报道截图\n\n 美联社报道称，这是一次颇为意外的接触，是美伊6月达成的停火谅解备忘录破裂后、双方沟通停滞数月后进行的接触。美国总统特使威特科夫在社交媒体发文称，希望此次努力能取得建设性成果并带来积极效果。\n\n 为何美伊此时恢复接触？宁夏大学中国阿拉伯国家研究院院长牛新春在接受总台环球资讯《闪评》栏目专访时分析，三方面因素促成了这次纽约会晤。\n\n第一，伊朗国内更倾向于认为，现在与美国谈对伊朗比较有利。美国11月就要举行中期选举了，在这种情况下，伊朗国内最近有两种声音：一种声音是，在中期选举前不能与美国谈，谈了就是给美国政府“送礼”；另外一种声音认为，中期选举之前与美方谈，美方做出更大让步的可能性比较大。现在伊朗与美国直接接触，说明在伊朗国内，后一种声音可能占据了主导。\n\n第二，双方经过最近一个多月的对峙，都有谈判的压力和意愿。最近一段时期，美国对伊朗实施了经济上的孤立。美国派了17艘军舰，要切断伊朗的石油出口。在这种情况下，伊朗经济确实承受了比较大的压力，所以也想通过和美国的接触，解除经济封锁，减轻国内压力。而美国对伊朗进行封锁后，不断有消息爆出，美国的航空母舰紧缺、防空导弹也紧缺。如果持续封锁与不间断冲突继续，美国国内将普遍认为，军事上是不可持续的。\n\n第三，联大会议给双方提供了天时地利的“台阶”。对伊朗来说，借联大会议契机与美方会晤是一个机遇，或者说，这是一个可以下的“台阶”。伊美之间不直接会晤已经很久了，正好可以在会议期间接触，这样的安排，伊朗比较容易接受，同时也给了美国面子。\n\n 伊朗国家电视台网站相关报道截图\n\n 据伊朗国家电视台9月22日报道，伊朗外交部发言人巴加埃介绍，此次会晤是“应美方要求”举行的，伊朗方面同意会晤是出于“传达关于重新开放霍尔木兹海峡条件”的需要。这些条件包括立即解除海上封锁、立即解冻所有伊朗资产以及结束在地区各战线的战争。巴加埃还介绍，与美方的互动由卡塔尔调解人从中进行。\n\n牛新春分析，此次美伊三小时会晤很可能集中在霍尔木兹海峡如何开放这一核心议题上。\n\n 关于海峡，确实出现了新的信号，但接下来的谈判，取得大的转折的可能性很小。能达成临时的、阶段性协议就已经很不错了。\n\n 根据现在透露出的消息，伊朗说，只要美国答应其三个主要条件，伊朗可在7天内就开放霍尔木兹海峡，但开放海峡是一个很含糊的说法。美国要让海峡回到战争之前——海峡是一条可以自由通行的天然国际水道，不能有任何人管理，不能有任何人收费。而伊朗的态度也很坚决——伊朗可以开放海峡，但必须对海峡进行管理。这是美伊之间最尖锐的矛盾，这一次能不能解决也有很大的疑问。\n\n 来源丨总台环球资讯\n\n 编辑丨罗光旭\n\n责任编辑：丁文武",
  "deep": "## AI 解读\n\n# 美伊纽约会晤：战术缓和难掩结构性矛盾\n\n核心要点\n\n1. 会晤性质：美伊在联大期间举行3小时直接会谈，系停火备忘录破裂、沟通停滞数月后的首次接触，由卡塔尔调解，伊方称“应美方要求”举行。\n2. 动因双向：伊朗判断美中期选举前谈判或可换取更大让步，同时承受海上封锁的经济压力；美国则面临航母与防空导弹紧缺，军事封锁可持续性存疑。\n3. 核心议题：霍尔木兹海峡重新开放。伊方提出解除封锁、解冻资产、结束地区战争三条件，并坚持对海峡的“管理权”；美方要求恢复战前自由通行的国际水道地位。\n\n影响分析\n\n此次会晤标志着双方从对抗转向试探性接触，但分歧属结构性而非技术性——“开放”与“管理”之争实质是海峡控制权归属。短期内达成阶段性临时协议的可能性大于全面突破，最可能的结果是有限度开放换取部分制裁松绑。对市场而言，任何缓和信号都将压低油价风险溢价，但协议脆弱性意味着溢价难以完全消退。中期看，美中期选举构成关键时间窗口：选前伊朗有动机争取让步，美方有动机避免油价冲击选情，双方存在“小交易”空间；但海峡主权管理权这一根本矛盾不解决，霍尔木兹海峡的“迷雾”就难以真正吹散。",

  "lede": "不排斥谈判但拒绝被威胁 伊朗总统向美国释放强硬信号\n\n 2026年09月24日 03:59 环球市场播报\n\n 伊朗总统马苏德·佩泽希齐扬表示，只要制裁和美国封锁仍然存在，伊朗就不会允许霍尔木兹海峡自由通航。这一表态凸显出尽管本周各方努力重启谈判，美伊要达成和平协议仍面临很大困难。\n\n 佩泽希齐扬周三在纽约举行的联合国大会上表示，伊朗“不能接受当所有人都从这条水道获益，而这条水道历史上的守护者却因制裁而被剥夺权利”。\n\n伊朗总统马苏德·佩泽希齐扬于9月23日在纽约联合国大会上发表讲话。\n\n 他表示，伊朗做好了恢复谈判的准备，但不会回应威胁，伊朗无意制造核武器，可也不会放弃为经济发展而开发核技术的权利。\n\n 佩泽希齐扬在讲话中列出了美伊恢复实质性谈判所需满足的一系列条件，也给本周在纽约出现的初步外交进展蒙上了阴影。\n\n 美国总统特朗普周二表示，美国官员与伊朗方面进行了“非常好”的会谈，不过他此前在联合国大会讲话中警告，如果德黑兰不达成结束冲突的协议，美国可能“摧毁”伊朗。\n\n 佩泽希齐扬说：“特朗普以及其他想欺压我们的人必须明白：我们做好了对话准备，但我们不会接受以武力相威胁的语言。”\n\n 据伊朗国家媒体报道，伊朗外长阿巴斯·阿拉格齐作为谈判代表他提出了重新开放霍尔木兹海峡的“坚定立场”。IRIB News报道，德黑兰的条件还包括美国立即解除海上封锁、解冻伊朗资产，并在“所有战线”结束战争，后者显然也包括以色列在黎巴嫩对真主党武装的打击。\n\n 美国和以色列2月底对伊朗发动战争的公开目标是阻止德黑兰发展核武器。这场冲突扰乱了中东和能源市场，霍尔木兹海峡航运也受到严重限制。如今外界对伊朗当前核活动的状况仍知之甚少。\n\n 佩泽希齐扬表示，有关伊朗核计划的问题“不可能在战场上解决”。\n\n9月2日，在伊朗霍尔木兹甘省锡里克县库赫斯塔克，人们正在查看空袭后建筑物的受损情况。\n\n 在被问及伊朗对特朗普联合国讲话的批评时，美国国务卿鲁比奥指责德黑兰通过支持中东各地武装组织破坏国际体系。\n\n 鲁比奥在纽约对记者表示：“我不知道伊朗有什么立场可以在人权或国际体系问题上教训任何人，因为他们经常违反这些规则。”他还指责伊朗通过支持邻国境内的武装组织侵犯这些国家主权，违反国际社会实施的规则和制裁。\n\n 佩泽希齐扬出席联大让德黑兰获得了一个高规格平台来阐述自身立场，他还计划在纽约与其他国家领导人举行双边会晤。\n\n 美伊谈判自6月以来实际上一直处于停滞状态。鲁比奥周三把双方本周的接触形容为积极正面的，并称这是此前讨论的“延续”。\n\n 他说：“我不想把这描述成重大突破，但我认为能对话本身就很重要。”\n\n责任编辑：丁文武",
  "deep": "## AI 解读\n\n# 深度分析：伊朗的“谈判门槛”策略\n\n核心要点\n\n伊朗总统佩泽希齐扬在联大释放了“可谈但不可压”的双重信号：一方面明确不排斥恢复谈判，甚至主动否认谋求核武器；另一方面将解除制裁、解冻资产、结束海上封锁设为谈判前置条件，并以霍尔木兹海峡通航权作为核心筹码。这实质上是将谈判框架从“核问题”扩展为“全面解除施压”，抬高了美方入场成本。\n\n影响分析\n\n短期看，美伊本周的初步接触难有实质突破。特朗普“摧毁伊朗”的威胁与佩泽希齐扬“拒绝威胁语言”的回应形成正面碰撞，双方都在为国内政治与盟友体系展示强硬姿态。伊朗将霍尔木兹海峡与制裁挂钩，意味着全球约20%的石油运输通道被直接纳入博弈筹码，能源市场的地缘风险溢价将维持高位。中期看，双方均保留对话窗口，说明全面冲突不符合各自利益，但“边打边谈”的僵局可能持续。真正的变量在于以色列在黎巴嫩的行动是否触发伊朗“所有战线”条件，若地区冲突外溢，谈判窗口将进一步收窄。",

  "lede": "独舞独舞\n\n美国总统唐纳德·特朗普周二在联合国大会首日发表讲话，威胁要“消灭”伊朗。数小时后，他又告诉记者，美国官员与伊朗领导人举行了“非常好的”会晤。\n\n伊朗军方毫不示弱。伊朗最高军事机构——伊朗武装部队总参谋部——驳斥了特朗普的言论，并警告称，伊朗已准备好以比战争初期更为“毁灭性”的猛烈攻击予以回应。\n\n伊朗最高领袖穆杰塔巴·哈梅内伊虽然没有直接回应特朗普，但在伊朗新学年开始之际，也使用了类似的对抗性意象，将知识与信仰和道德相结合，比作一把“锋利的剑”，能够砍断侵略者的双手。\n\n在激烈的言辞交锋中，双方在联合国大会期间举行了数月以来的首次面对面会晤，恢复了此前因屡次违反6月份签署的谅解备忘录（该备忘录随后于上个月失效）而几乎崩溃的外交渠道。当时正值美以对伊朗发动近7个月的战争期间。\n\n这场战争导致美国燃油价格飙升——这是11月中期选举的一个重要议题——华盛顿的制裁正在挤压伊朗的经济。德黑兰希望解除经济制裁以及美国对其港口的海上封锁，而华盛顿则希望伊朗允许船只自由通过霍尔木兹海峡（全球石油咽喉要道），并停止其核计划。\n\n那么，为什么华盛顿和德黑兰一方面开展旨在寻求结束战争途径的外交活动，另一方面又发出激烈的暴力威胁呢？\n\n特朗普表示，他的特使——史蒂夫·威特科夫和贾里德·库什纳——在联合国大会期间与伊朗官员会晤了约三个小时。他称这是一次“非常好的会晤”，同时也承认伊朗代表“级别并非最高”。\n\n伊朗外交部长阿巴斯·阿拉格奇也参加了会谈，调解员在美伊双方代表团之间穿梭。\n\n维特科夫后来表示，讨论已经结束，并希望这些讨论能够“富有建设性和前景”。\n\n据信，这是自美国副总统JD Vance 6月在瑞士会见伊朗高级官员以来，两国官员首次面对面会谈。\n\n特朗普表示，预计“在不久的将来”将举行另一次会晤，并补充说，他相信双方在达成协议方面“势头强劲”。\n\n特朗普在联合国大会上的讲话中向伊朗提出了一个选择：开启谈判的大门，同时发出进一步破坏的威胁。\n\n特朗普说：“我面临一个重大决定。”他问道，达成协议是会让伊朗“重建并建立一个更加强大的国家”，还是“让我迅速消灭伊斯兰共和国”。\n\n“难道我要把他们送入地狱，让他们毫无生还的希望吗？”他补充道。\n\n特朗普开始描述近七个月来美国对伊朗断断续续的军事打击后不久，伊朗代表团就退场了，只剩下一个人还坐在那里。\n\n伊朗梅尔通讯社发表声明称，伊朗总参谋部指责美国总统利用联合国平台为“侵略”辩护。\n\n声明称，“这些言论表明美国在侵略伊朗问题上走入了战略死胡同”，并形容特朗普的反复威胁“不是实力的象征，而是其战略绝望的象征”。\n\n声明还警告说，伊朗武装部队已准备好对美国和以色列发动打击，这些打击将比战争初期“更具毁灭性且更难以预测”。\n\n哈梅内伊也使用了好斗的言辞，尽管他的言论并非直接回应特朗普在联合国的讲话。\n\n在新学年开始之际，他发表讲话，将知识、信仰和道德描述为对抗美国和以色列的武器。\n\n据伊朗新闻电视台报道，哈梅内伊表示：“根植于知识的力量，加上虔诚和道德，就像一面铁盾和一把利剑，可以斩断侵略者对人类的双手。”他指的是他所谓的“犯罪的美国政府”和以色列。\n\n在周二离开德黑兰之前，伊朗总统马苏德·佩泽什基安也发表了挑衅性的言论，指责美国在军事上未能迫使伊朗及其人民投降后，正在“竭尽所能地封锁一切可能的途径”。\n\n佩泽什基安表示，伊朗将利用联合国大会来强调“针对伊朗人民犯下的罪行”以及战争造成的不信任。\n\n伦敦国王学院副教授安德烈亚斯·克里格认为，华盛顿和德黑兰之间的敌对言论并不一定与正在进行的外交努力相矛盾。\n\n克里格认为，公开的威胁和强硬的措辞是更广泛的斗争的一部分，目的是塑造国内外对任何最终协议的看法。\n\n克里格告诉半岛电视台：“暴力言论与外交并不矛盾，它是谈判策略的一部分。”\n\n对特朗普而言，其目的是要表明伊朗重返谈判桌是因为美国的压力，而不是因为华盛顿的立场有所软化。\n\n伊朗领导层需要构建几乎相反的叙事——德黑兰抵制了美国的压力，保持了足够的筹码，并最终迫使华盛顿进行谈判。\n\n克里格说：“这场战争已经演变成一场争夺话语权的战争，其激烈程度不亚于争夺物质力量的战争。”\n\n因此，两国政府同时面向多个受众群体，包括各自的国内选民、彼此、地区盟友和更广泛的国际社会。\n\n此外，克里格表示，这种修辞手法反而可能使最终妥协更容易达成。“如果双方都能让各自的受众相信他们是在实力基础上进行谈判的，那么他们就能获得更大的政治空间，从而在私下达成妥协，而不会显得公开屈服，”他指出。\n\n这位学者认为，真正的问题在于“排序”。\n\n他说：“伊朗希望在放弃对霍尔木兹海峡的控制权或接受不可逆转的核让步之前，在封锁、制裁和冻结资产方面有所进展。华盛顿则希望伊朗首先做出切实行动，尤其是在航行和核问题上。”",
  "deep": "## AI 解读\n\n# 深度解读：美伊“边打边谈”的双轨博弈\n\n核心要点\n\n1. 双轨并行：特朗普联大威胁“消灭伊朗”与美伊罕见面对面会谈同期发生，看似矛盾，实为精心设计的谈判策略。\n2. 各取所需的叙事战：美方需向国内证明伊朗是因压力回到谈判桌；伊方需向国内展示顶住压力、保有筹码。\n3. 核心分歧在“排序”：伊朗要求先解除制裁与封锁，美方要求先解决霍尔木兹海峡航行与核问题，双方在让步次序上僵持。\n\n影响分析\n\n这场博弈的本质是“话语权战争”与物质力量战争的叠加。双方的强硬表态并非外交破裂的信号，而是为国内受众和谈判桌上争取政治空间。学者克里格的判断切中要害：若双方都能让各自民众相信“是在实力基础上谈判”，反而更容易在私下达成妥协而不显屈服。\n\n然而，风险同样真实。战争已持续近七个月，美国燃油价格飙升直指中期选举，伊朗经济则被制裁持续挤压——时间并不站在任何一方。若“排序”问题无法突破，强硬言辞可能从谈判工具演变为自我实现的预言，令本已脆弱的外交渠道再度崩溃。",

  "lede": "2026年09月24日 05:30 财联社\n\n转自：财联社\n\n财联社9月24日讯（编辑 李莹）美东时间周三，美股三大指数集体收跌。\n\n强劲的PMI数据叠加美联储官员的鹰派表态，推动美债收益率大幅上行，科技股承压，纳指从连续两日的纪录高位回落。\n\n截至收盘，标准普尔500指数跌0.75%，报7706.39点；纳斯达克综合指数跌1.13%，报26936.04点；道琼斯工业平均指数跌0.68%，报51512.42点。\n\n当日公布的数据显示，美国私营部门扩张明显提速。9月标普全球综合PMI初值升至58.4，为62个月高位；制造业PMI升至57.0，为52个月高点。\n\n通胀压力同步抬头，企业投入成本涨幅为2022年10月以来最高，主要受燃料和运费上涨以及工资增长推动。\n\nPMI公布后，市场预计美联储在10月会议上至少加息25个基点的概率升至约75%，数据公布前约为53%。\n\n截至发稿，最新的CME“美联储观察工具”显示10月加息概率稍稍回落至68.6%。\n\n美联储理事巴尔同日释放鹰派信号。他表示，通胀风险上升而就业风险减弱，在其基准情形下，可能还需要进一步调整政策，才能让通胀及时回到目标水平。\n\n受此影响，美债收益率大幅上行。\n\n截至发稿，5年期美债收益率上涨17个基点，报4.997%，盘中一度突破5%，为2007年以来首次；10年期美债收益率上涨约15个基点，报5.104%，盘中一度升至5.135%，为2007年7月以来最高水平。\n\n10年期美债收益率日线图，来源：TradingView\n\n热门股表现\n\n按市值排名，截至收盘，英伟达跌1.47%、苹果跌0.8%、谷歌-A跌3.8%、微软涨0.52%、亚马逊跌2.24%、台积电跌1.2%、SpaceX跌4.11%、Meta涨1.02%、博通跌2.62%、特斯拉涨0.32%、SK海力士跌3.12%。\n\n光通信、存储芯片股多数下跌，闪迪、康宁、Coherent、Ciena、SK海力士跌逾3%，美光科技跌超2%。\n\nMeta旗下AI智能体Muse持续发酵。市场担心Muse会让旅游聚合平台被绕开，Expedia、爱彼迎跌近8%。高盛警告，AI智能体将对以收取中介费用为主要盈利模式的行业造成广泛冲击。\n\nIonQ展示业界首个端到端实时量子纠错解码器，并披露了一项与英伟达系统相关的部署，带动量子计算板块走强； IonQ收涨4.42%。\n\n油价反弹带动能源板块逆势走强，成为标普500表现最好的板块。伊朗总统佩泽希齐扬在联大讲话中批评一些国家在伊朗核问题、以色列及巴勒斯坦问题上的“双重标准”，市场对美伊和谈的乐观预期降温，国际油价结束五连跌。\n\n美联储加息预期升温，美元指数走强，黄金矿业股普跌，泛美白银、哈莫尼黄金跌超5%，埃氏金业、金田跌超4%，金罗斯黄金跌超3%，纽曼矿业跌超2%。\n\n纳斯达克中国金龙指数周三收跌1.43%。\n\n公司消息\n\n【机构：台积电将于2027年1月上调晶圆代工价格3%至6%】\n\n据媒体援引知情人士消息报道，台积电晶圆代工价格确定再涨。供应链人士透露，8寸厂产能利用率超过100%、45纳米以下制程满载的台积电，订单能见度已至2030年，已确定自2027年1月起，按照不同制程调整Wafer Out价格，涨幅约3~6%。台积电未回应市场传闻。\n\n【麦当劳斥资85亿美元扶持加盟商】\n\n麦当劳在2026年投资者日上宣布，将向加盟商提供约85亿美元支持，推动一项持续至2036年的多年计划，其中约50亿美元将在2030年前投入。该计划涵盖升级食品与饮品、改善服务、推出新的餐厅设计并简化门店运营，公司称这将是其历史上规模最大的菜单升级。\n\n【Anthropic首席执行官：由于安全的缘故 公司将放慢AI的研发进度】\n\nAnthropic首席执行官达里奥·阿莫迪在联合国安理会就人工智能议题发言称，人工智能的快速发展推动了健康科学领域的进步。人工智能可能对全人类构成风险。认为存在不法分子利用人工智能制造生物武器的风险。如果管理不善，确实认为人工智能可能会对全人类构成生存风险。由于安全的缘故，公司将放慢AI的研发进度。\n\n【Alphabet：谷歌云扩展新区域、合作伙伴和客户】\n\nAlphabet称，谷歌云扩展新区域、合作伙伴和客户。谷歌Beam设备将发货至包括美国、加拿大、英国、法国、德国、日本在内的六个国家，将于10月起在Industrious办公地点提供使用，覆盖亚特兰大、芝加哥、纽约市和帕洛阿尔托。\n\n【诺和诺德：CagriSema在REIMAGINE 5试验中实现较替尔泊肽更优的减重效果】\n\n诺和诺德日前公布其在研产品每周一次 CagriSema（cagrilintide和司美格鲁肽）3期REIMAGINE 5和REDEFINE 9试验的主要结果。",
  "deep": "## AI 解读\n\n# 美债风暴重燃：强劲PMI击碎降息幻想，科技股承压回落\n\n核心要点\n\n1. 数据超预期引发政策转向定价：9月综合PMI初值58.4创62个月新高，制造业PMI达52个月高点，投入成本涨幅为2022年10月以来最大。市场对10月加息25bp的押注从53%飙升至75%，降息叙事被彻底逆转。\n\n2. 美债抛售创历史级信号：5年期收益率盘中突破5%（2007年来首次），10年期升至5.135%（2007年7月以来最高），单日上行15-17bp属罕见烈度，反映市场正在重定价利率路径。\n\n3. 风险资产分化明显：纳指跌1.13%告别纪录高位，能源板块受油价反弹逆势走强，黄金矿业股与中概股承压，量子计算等主题逆市活跃。\n\n影响分析\n\n其一，估值压制逻辑强化。10年期美债收益率突破5%意味着无风险利率对权益风险溢价的挤压进入敏感区间，高久期科技股首当其冲，纳指短期波动率将抬升。\n\n其二，AI叙事遭遇\"中介颠覆\"担忧。Meta旗下Muse智能体引发Expedia、爱彼迎跌近8%，高盛警告AI将冲击中介收费模式——这标志着AI交易从\"算力受益\"向\"商业模式颠覆\"扩散，传统平台型公司面临估值重估。\n\n其三，政策不确定性成为最大变量。巴尔明确\"通胀风险上升、就业风险减弱\"，若10月真加息，则\"higher for longer\"将再度主导全球资产定价，美元走强、新兴市场承压的链条或重启。投资者需警惕利率敏感型资产的连锁反应。",

  "lede": "小数据引发大行情！美债收益率创近19年新高、美元冲破101，美股高台跳水、黄金跌穿4300，加密市场4小时爆仓2.8亿美元\n\n夏洛特\n\n摘要：一组强劲PMI数据彻底改变市场节奏。美联储再加息预期升温，10年期美债收益率冲上5.09%，美元升破101，黄金、科技股和比特币遭遇同步抛售，全球资产重新进入“高利率交易”。\n\n市场正在重新面对一个熟悉却棘手的逻辑：美国经济越强，美联储就越有底气继续加息；而利率越高，对黄金、股票和加密货币等风险及非生息资产的压力就越大。\n\n#### 美国经济“太强”，市场突然押注继续加息\n\n周三公布的标普全球（S&P Global）9月美国综合采购经理人指数（PMI）初值从8月的56.0跃升至58.4，创2021年7月以来最高水平，显示美国私人部门经济活动进一步加速。服务业PMI升至58.7，制造业活动也明显提速。\n\n更令市场警惕的是，强劲需求并没有带来通胀压力缓和。企业投入成本9月出现约四年来最快上涨，燃料和运输成本上升尤其明显。S&P Global首席商业经济学家克里斯·威廉姆森（Chris Williamson）表示，除疫情封锁解除后需求集中释放的特殊时期外，当前美国商业活动改善幅度是2015年以来最明显的阶段之一。\n\n这份数据迅速改变了利率市场定价。路透援引LSEG数据显示，在PMI公布后，市场预计美联储10月再次加息至少25个基点的概率一度升至约75%，而数据公布前仅约53%。与此同时，美元指数升至101.09，并一度触及101.10，创7月29日以来最高水平。\n\n美联储理事迈克尔·巴尔（Michael Barr）周三进一步强化了这种预期。他表示，美国经济增长依然强劲、劳动力市场稳健，但通胀仍高于2%目标，而且通胀风险有所上升，因此其基准判断是，未来可能仍需要进一步调整政策，以推动通胀及时回到目标。\n\n债券市场的反应最为猛烈。\n\n基准10年期美国国债收益率盘中大涨约12个基点至5.087%，创2007年7月以来最高水平；2年期美债收益率上涨超过10个基点至约4.89%，触及2024年6月以来最高；30年期美债收益率则升至约5.39%。\n\n10年期收益率重新突破5%，意味着全球资产定价正在面临又一次冲击。无风险收益率抬升不仅提高企业和消费者融资成本，也直接提高股票估值所使用的贴现率，并削弱黄金等不生息资产的相对吸引力。\n\n#### 美元突破101，升至近两个月最高\n\n美元成为周三市场另一条最强主线。随着美国经济数据大幅超出预期，加上美联储官员继续释放偏鹰信号，交易员迅速提高对10月再次加息的押注，美元指数扩大涨幅，一度触及101.23，创7月29日以来最高水平，日内涨幅达约0.7%。\n\n美元此轮走强的核心并不仅仅是单一经济数据，而是市场正在重新定价美国的利率路径。美联储上周刚刚加息25个基点，而最新PMI再次显示，美国制造业和服务业活动并未因高利率显著降温，同时企业成本压力反而进一步上升。这意味着，美联储可能不仅需要将利率维持在高位更长时间，甚至可能继续收紧政策。Brown Brothers Harriman全球市场策略主管Elias Haddad表示，目前市场“就是一个利率故事”，上周美联储偏鹰派加息后的影响仍在持续，而多位官员释放的信息都指向未来仍有进一步紧缩的可能。\n\n美元的强势也迅速传导至主要货币市场。欧元兑美元下跌约0.5%至1.1386附近，并可能连续第三个交易日走低；美元兑日元则上涨约0.6%至158.32附近。尽管日本央行上周已将政策利率升至31年来最高，但市场认为其后续加息路径仍不够明确，美日利差继续对日元构成压力。与此同时，日本市场因假期休市、流动性下降，也进一步放大了市场对潜在汇率干预的警惕。\n\n对于全球资产而言，美元重新突破101具有重要意义。强美元与5%以上的10年期美债收益率同时出现，相当于对全球金融条件形成“双重收紧”：一方面，以美元计价的黄金和大宗商品受到直接压制；另一方面，美国无风险收益率吸引力提高，也令资金从高估值股票和加密资产等高波动市场撤出。只要市场继续押注美联储10月甚至此后进一步加息，美元短期仍可能维持强势，而101—101.10区域能否有效站稳，也将成为接下来观察美元行情是否进一步扩大的重要信号。\n\n#### 华尔街转跌，纳指领跌\n\n“经济好消息”迅速变成了股市的“利率坏消息”。\n\n截至美东周三午盘附近，标普500指数下跌约0.8%，纳斯达克综合指数下跌约1%，道琼斯工业平均指数下跌约313点、跌幅约0.6%。公用事业、非必需消费品和通信服务等板块跌幅居前。\n\n此前支撑科技股的人工智能交易仍未完全退潮，但当10年期美债收益率重新站上5%后，估值较高的成长股首当其冲。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 数据引爆预期重定价：美国9月综合PMI初值升至58.4，创2021年7月以来新高，且企业投入成本出现四年来最快上涨。强劲增长叠加通胀压力，使市场对美联储10月再加息25bp的押注从53%骤升至75%。\n2. 利率与美元双线走强：10年期美债收益率突破5.09%（近19年新高），2年期升至4.89%，美元指数冲破101并触及7月29日以来最高。美联储理事巴尔偏鹰表态进一步强化紧缩预期。\n3. 风险资产同步承压：美股高台跳水、纳指领跌，黄金跌穿4300，加密市场4小时爆仓2.8亿美元，呈现典型的“高利率交易”特征。\n\n影响分析\n\n本轮行情的本质是全球资产定价锚的再度上移。10年期美债收益率重返5%以上，直接抬升贴现率与融资成本，对高估值成长股、无息资产（黄金）及高波动资产（加密）形成系统性压制。美元与美债收益率“双高”意味着全球金融条件双重收紧，资金从风险资产回流美元现金类资产，新兴市场汇率与资本流动压力上升。\n\n短期看，市场焦点转向101—101.10美元关口能否站稳，以及后续经济数据是否延续“强增长+高成本”组合。若美联储10月加息落地，风险资产调整或进一步深化；反之，若数据出现降温迹象，当前定价存在回摆空间。核心矛盾在于：经济越强，政策越紧，资产估值压力越大——这一负反馈链条尚未打破。",

  "lede": "昨天的走势不太行，理由是市场没有多少交易热度，节前行情让成交缩量有3700多亿，挺多的资金离场或者观望了。\n\n这种走势，跌下来慢，涨起来有压力，就是典型的震荡整理走势，要想有大的行情，估计是在节日之后了。\n\n还有，近几日，外围的美股新高，A股还在调整，表示信心不足，没有多少增量资金，股市要突破4000点的压力位也不容易。\n\n \n\n不用等今天行情，尾盘两个信号来了\n\n一是，昨天尾盘有一个细节，三个股指尾盘还跌了点，是抛压的能量还在，表示股市的行情，卖盘比买盘要多。\n\n之前几天，许多时候是高开高走，抑或是低开高走，前天是高开回落，昨天是低开低走，行情已经有了变化。 \n\n就是，要三个股指继续上涨，没有放量，没有强势的主线，行情现在就不会有大的动作。大的上涨近几日看不到，哪怕反弹一点也会跌下来。\n\n \n\n二是，多只高位股跳水跌停，这是市场情绪在加速降温了。短线的投机情绪降温，蓝筹权重在调整，股市没有涨权重，抑或是涨题材，这样的走势是很磨人的。\n\n节前模式的行情，要的是节前的行情过去，大的机会或在节后。\n\n之前的5年走势中，有4年国庆节前股市都是缩量。又碰上高位股的普跌，是短线资金开始休息，银行等权重股也在下跌，是中线资金在观望。\n\n周四提前分析\n\n那就那天的走势，就是继续有调整的可能，但成交缩量不见得大跌，因为昨天是场内资金抛售，今天资金可以套现，若今天抛售的资金要下周一套现，市场昨天挺多的资金估计离场了，今天的抛售会小点。\n\n \n\n‍综合来讲，现在就是要比平常更多的耐心等股市的行情变化。\n\n因为7月份大跌之后，8月与9月是没什么大的上涨，就看10月份了。9月份就几天的交易，有没有涨或者是跌都不影响后续市场。\n\n因此，走一步看一步，但上证指数还是在多头行情，不是看一两天，是看近几个月的走势。\n\n上证指数还没有完成此前下跌之后的修复，至于创业板要看科技板块，若科技板块起不来，创业板会比上证指数要差点。\n\n \n\n### 沪深两市成交额超1.5万亿元，较上日此时缩量3483亿元\n\n每日经济新闻 2026-09-23 14:22:28\n\n### 许昆林王新伟会见刘小涛率领的江苏省代表团一行 霍步刚参加会见\n\n辽宁发布 2026-09-23 07:53:00\n\n枯叶蝶儿 2026-09-20 03:21:03\n\n财可夫斯基官方 2026-09-23 18:53:02\n\n界面新闻 2026-09-22 19:16:55\n\n### 山西一景区“拿出3000万招NPC”引热议，景区：有这个经济实力，计划招聘100位，对知名演员能开出千万年薪\n\n极目新闻 2026-09-20 18:27:21\n\n### 在河北的祭祀纸品咋印着山东的投标人员简历？发布者称：猜测系商家为节约成本所致\n\n大风新闻 2026-09-23 15:22:08\n\n \n\n### 运城13岁女孩遭强奸案，“闺蜜”被认定为共犯 \n\n \n\n### 谁能接过男篮国家队帅印？媒体人：这两人2选1，都不可能比郭士强差 \n\n \n\n### 大家发现没，王楚钦越来越不对劲，不是球技断崖下滑，也不是长相变化，而是精气神肉眼可见地被透支 \n\n \n\n \n\n \n\n### 随着意大利0-2落败，U20女足世界杯决赛已诞生1席 \n\n \n\n \n\n### 骇人听闻的推测：中美日可能都暗自期待着一场中日大战 \n\n \n\n### 产后3天被老公赶回娘家养一年，他来接人时，进门一幕傻眼了 \n\n \n\n### 意媒：目前意甲仅有4家俱乐部财务稳定健康 \n\n### 《人民日报》你错了：用第一学历筛选人才，看似荒唐，实则合理 \n\n糖逗在娱乐\n\n### 52岁金城武消失多年再现日本，评论区彻底炸了。网友：金城武现在长这样了吗？ \n\n \n\n故事终将光明磊落\n\n \n\n### 生命诞生前有个\"黄金窗口\"：4.33亿年前，地球刚安静下来 \n\n- ### 幼儿园女教师也擦边…\n- ### 炸裂！炒菜锅洗拖把，孩子呕吐被瞒76天！11人被查，我却为举报幼师捏汗\n- ### 我们的孩子为什么会抑郁？小学生10%，初中生30%，高中生40%。\n- ### 托幼食堂卫生红线失守，锅具混用，多人被追责，家长务必留心\n\n- ### 新一季的伦敦时装周，有点意思\n- ### 这些老电影里的穿搭技巧，很绝！\n- ### 消失的天后，带病复出，先赚10个亿",
  "deep": "## AI 解读\n\n【核心要点】\n\n1. 量能持续萎缩：节前效应下沪深两市成交额缩至1.5万亿，单日缩量超3400亿，资金离场观望情绪浓厚，市场缺乏增量入场动力。\n2. 技术面转弱：三大股指尾盘跳水，抛压未消；前期高开高走格局已切换为低开低走，叠加多只高位股跌停，短线投机情绪加速降温。\n3. 风格青黄不接：权重蓝筹与题材股同步调整，市场既无护盘主线也无赚钱效应，呈典型“磨人”震荡市。历史规律显示，国庆节前5年有4年缩量，机会大概率延后至节后。\n\n【影响分析】\n\n短期看，周四走势大概率延续缩量调整，但因场内抛售压力已在节前集中释放，大跌概率有限，更可能以时间换空间。中期看，上证指数仍处多头格局，但4000点压力位突破需放量配合，当前条件尚不充分。创业板走势更依赖科技板块能否企稳，若科技主线持续缺席，其修复力度将弱于主板。策略上，节前不宜追高或频繁操作，耐心等待10月行情方向明朗，重点观察节后量能能否回升及科技板块是否接力。",

  "title": "人形机器人空间有多大？特斯拉Optimus量产提速 马斯克：未来20年或达1000亿台_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "人形机器人空间有多大？特斯拉Optimus量产提速 马斯克：未来20年或达1000亿台\n\n 2026年09月24日 00:00 市场资讯\n\n（来源：券研社）\n\n9月23日，特斯拉CEO埃隆·马斯克接受央视财经专访，谈及人形机器人时，他展望未来：每个人都能拥有专属机器人，我预测10年内或不到10年，人形机器人至少有10亿台；未来15年或许达100亿台；未来20年可能会达1000亿台。\n\n近日，有媒体报道，特斯拉正在中国长三角推进新一轮人形机器人供应链审厂，特斯拉此轮审厂将实质导向Optimus的量产，目前已经向供应链企业下达相关订单。\n\n当前人形机器人产业正处于从技术突破迈向规模化商业化的破晓时刻。供给端，特斯拉、宇树科技、智元机器人、优必选稳步推进量产节奏；需求端，人口老龄化与劳动力成本攀升形成长期驱动。同时随着政策与资本合力助推，AI大模型持续为机器人注入灵魂，人形机器人有望形成一个新兴产业，逐渐从B端走向C端，未来市场空间广阔。\n\n人形机器人的量产元年\n\n2026年被视为人形机器人“量产元年”，2026H1全球人形机器人出货量超2.2万台、同增近300%，高盛预测2026年全球人形机器人出货7.5万台，2030年预测约89万台。\n\n数据来源：妙想MCP\n\n市场规模方面，据The Business Research Company预测，全球人形机器人市场规模有望由2025年的54.4亿美元增长至2030年的390.0亿美元，2025-2030年复合增速约47.1%；其中2026年全球人形机器人市场规模预计达83.2亿美元，同比增长约53%，行业正处于规模化放量的高速成长期。\n\n数据来源：妙想MCP\n\n国内市场2026年市场规模有望突破103亿元，2029年预计达到750亿元。\n\n数据来源：妙想MCP\n\n中国人形机器人全球领先\n\n目前中国人形机器人的产业化落地及零部件降本已经处于全球领先地位，2025年全球人形机器人出货量前六位全部为中国企业，合计占据全球87.87%的出货量份额。\n\n数据来源：妙想MCP\n\n2026年政策密集出台：\"十五五\"规划将具身智能列为新增长点；6月工信部、国资委联合启动\"人形机器人与具身智能实景实训专项行动\"，覆盖10省市，目标年底形成万台级落地能力。\n\n地方层面，杭州出台全国首个具身智能机器人地方性法规，上海提出\"十五五\"末推动10万台人形机器人进工厂。\n\n机构看好人形机器人板块机会\n\n中银证券：人形机器人作为具身智能最理想的载体，在2025年已经跨过量产门槛，目前阻碍其大规模商业化落地的主要瓶颈为大模型泛化能力不足等，未来随着模型、算力、数据的快速发展，有望逐步突破，国内产业链凭借着独特的政策支持、强大的产业链深度和成本优势，目前处于全球领先地位，未来有望充分受益于人形机器人的大规模放量。华鑫证券：Optimus产能快速爬坡中，叠加国家政策扶持、国产链宇树、小鹏等催化，看好人形机器人板块迎来确定性行情。建议优先布局T链及国产链确定性标的，受益于产能爬坡有望带来订单增长；同时关注具备核心零部件研发能力、适配人形机器人量产需求的优质企业，把握板块贝塔机会。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 量产拐点确立：2026年被视为人形机器人\"量产元年\"，上半年全球出货超2.2万台、同比增近300%，特斯拉Optimus在华供应链审厂并下达订单，标志产业从技术验证迈入规模化交付。\n2. 市场高速扩张：全球市场规模预计从2025年54.4亿美元增至2030年390亿美元，CAGR约47%；国内2026年有望破103亿元，2029年达750亿元。\n3. 中国主导供给：2025年全球出货前六均为中国企业，合计份额87.87%，产业化落地与零部件降本全球领先。\n4. 政策与资本共振：\"十五五\"将具身智能列为新增长点，工信部启动实景实训专项行动，杭州出台首个地方性法规。\n5. 远期愿景激进：马斯克预测10年内至少10亿台、20年或达1000亿台。\n\n影响分析\n\n短期看，Optimus供应链订单落地将直接利好T链核心零部件企业，产能爬坡带来订单弹性。中期看，大模型泛化能力是商业化瓶颈，模型、算力、数据突破节奏决定放量斜率。长期看，人口老龄化与劳动力成本上升构成刚性需求，人形机器人有望从B端工业场景向C端家庭渗透，形成万亿级新兴产业。投资上，建议优先布局T链及国产链确定性标的，关注具备核心零部件研发能力、适配量产需求的优质企业，把握板块贝塔机会。需警惕技术迭代不及预期、订单兑现节奏与估值透支风险。",
  "no": 41

  "lede": "财经观察：中国具身智能机器人进入“实干时代”？\n\n 2026年09月24日 04:45 环球网\n\n【环球时报报道 记者 迟静怡】编者的话：“实干”成为2026年中国具身智能产业的关键词。机器人不再停留在展台上跳舞、翻跟头，而是走进工厂车间、药房仓库，开始“打卡上班”。从“能表演”到“能干活”，中国具身智能正在经历一场深层次的产业跃迁。\n\n从“能表演”跨进“能干活”的验证期\n\n在杭州城西科创大走廊具身智能未来岛，一所“机器人学校”最近有4台机器“毕业”：一台被中国历代绘画大系典藏馆聘为导览员，一台留在杭州机器人学校讲解，一台赴天津雀巢车间巡检，一台钢琴机器人将赴韩国参加文娱表演。 \n\n在这些最新的机器人“毕业生”之前，它们的“前辈”早已成为工厂里的“工人”。在宁德时代量产线上，银河通用重载人形机器人Galbot S1双臂抱起数十公斤料箱，精准送达下一工位。自今年3月验收以来，它已7×24小时连续工作超3个月，仅靠纯视觉系统在复杂环境中自主行动。这是全球首次实现人形机器人在新能源智能制造场景的“常态化自主作业”。目前，银河通用商业部署规模已突破千台，服务宁德时代、博世、丰田、上汽等头部制造企业。 \n\n在江西南昌龙旗科技工厂，8台智元精灵G2机器人承接平板质检全工段工作，独立完成多媒体、音频、WiFi耦合等高精度检测，与产线工人协同作业。智元Genie业务部项目总监艾文透露，这些机器人效率达人类工人80%到90%，已连续运行超3000小时。 \n\n具身智能也在服务日常生活。今年5月，福克斯新闻主播布雷特·拜尔在北京便利店与机器人店员互动，引发海外媒体关注。 \n\n快思研究院院长、商汤智能产业研究院前院长田丰对《环球时报》记者表示，当前是从“能表演”跨进“能干活”的验证期。表演让观众印象深刻，工作必须让生产经理满意。 \n\n下一阶段目标：从“能做”到“做得好”\n\n具身智能是存在于物理实体中的人工智能系统，关键在能否进入真实环境，形成“感知—认知—决策—行动—反馈”闭环，并不断学习完善。具身智能不等于人形机器人，人形只是载体。评估标准不是“像人”，而是能否解决现实问题。\n\n2026世界人工智能大会具身智能馆展出的机器人。（视觉中国）\n\n完整具身系统由感知、决策、执行三层协同构成。感知层是“感官”，包括摄像头、激光雷达、力矩传感器、触觉传感器、惯性测量单元等。决策层是“大脑”，依托芯片、算法和操作系统，主流思路是“大小脑”协同：大模型负责理解规划，运动控制算法负责实时控制。执行层是“身体”，包括电机、减速器、关节模组和执行器。执行器与关节模组合计占人形机器人整体成本的45%至65%，精度与可靠性决定机器人能否“抓得住、干得好”。 \n\n田丰说，中国优势是能把硬件、真实工厂需求、供应商快速响应和有耐心的资本结合成完整闭环。这个闭环正在工厂接受检验。 \n\n中国遵循场景驱动的人工智能模型构建、小批量整机交付和全链条国产供应。与海外先造通用“大脑”再找应用不同，中国开发者从特定工作需求出发，倒推模型能力。 \n\n选择这种模式的底气来自供应链。电机、减速器、传感器厂和整机厂、下游工厂在同一产业带。今天工厂反馈手抓不稳，下个月供应商就能改出新版本测试。密集的供应链压低了成本：2018年成本5万至6万元的电机，2026年可能只需约500至600元。 \n\n分析师认为，当机器被置于真实工作场景、处理真实故障时，有用数据和可靠硬件会最快出现。但挑战同样真实。 \n\n“具身人工智能面临与大型语言模型不同的数据稀缺，”一名业内专家表示。“互联网文本基本免费，物理交互数据必须在现实世界产生，成本高昂。人工智能模型仍难泛化到不熟悉的环境。” \n\n宇树科技创始人王兴兴8月在2026世界机器人大会上给出量化标准：当通用机器人在80%陌生场景中，通过语音或文字指令完成约80%任务时，产业迎来爆发临界点。他坦言，“迈向具身智能的ChatGPT时刻，理想情况下需要2-3年，或更长5-10年。” \n\n除数据稀缺外，业内人士还指出下一阶段目标：从“能做”到“做得好”。 \n\n“当前应用证明技术已进入要求更高阶段。但成功与否，不是看视频火不火，而是看机器第二天能不能回到同一工位，可靠地、用可接受成本执行相同任务。”田丰说。 \n\n分析师表示，机器人的能力边界正被真实任务逼出来，但还没突破。这恰是场景驱动模型构建的逻辑：先通过真实场景暴露问题，再依靠供应链快速解决问题。 \n\n政策引导与基础设施建设多措并举\n\n训练场加速建设解决数据荒，核心零部件国产化压低成本，实景实训专项行动打通实验室到产线“最后一毫米”。克服每道难题的背后，都有一项国家级或产业级布局。",
  "deep": "## AI 解读\n\n## 核心要点\n\n1. 阶段定性：中国具身智能正从“能表演”跨入“能干活”的验证期，标志是机器人进入宁德时代、龙旗科技等产线实现常态化自主作业，商业部署规模突破千台。\n2. 路径选择：中国走“场景驱动”路线——从具体工序倒推模型能力，依托密集供应链快速迭代（电机成本8年降约99%），与海外“先造通用大脑再找场景”形成分野。\n3. 关键瓶颈：物理交互数据稀缺且获取成本高，模型泛化能力不足；宇树王兴兴给出爆发临界点——80%陌生场景完成80%任务，预计需2-10年。\n\n## 影响分析\n\n产业层面：验证期意味着估值逻辑切换——从“技术叙事”转向“交付能力”。能否让机器人次日回到同一工位、以可接受成本稳定复现任务，将成为分水岭。具备真实产线数据闭环和供应链响应速度的企业将胜出，纯演示型玩家面临出清。\n\n竞争格局：中国以“供应链+场景”构筑壁垒，硬件成本优势显著，但数据与泛化能力仍是短板。若数据荒无法通过训练场基建有效缓解，可能陷入“能干粗活、干不了细活”的中低端锁定。\n\n投资含义：短期关注已实现千台级部署的整机厂及核心零部件（关节模组、执行器占成本45%-65%）国产替代标的；中长期需跟踪数据基础设施与模型泛化突破，这决定行业能否从验证期迈入爆发期。",

  "title": "AI+机器人  小场景跑出大订单 具身智能落地走向实处_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "AI+机器人 小场景跑出大订单 具身智能落地走向实处\n\n 2026年09月24日 02:31 上海证券报 \n\n| |\n| --- |\n| 艾图科技的服装智造机器人。 记者 陈铭 摄 |\n\nAI+机器人\n\n具身智能落地走向实处\n\n◎记者 陈铭 \n\n9月23日11时，第五届全球数字贸易博览会（下称“数贸会”）人工智能展区，杭州星物种机器人有限公司展台上的一台清洁机器人正在模拟公共卫生间作业，引来一些海外客商驻足。\n\n“今年数贸会刚刚开始，我们就收到了超过500台意向订单。”星物种机器人联合创始人、COO余济萍告诉上海证券报记者，上述意向订单主要来自海外。\n\n在大会现场，上海证券报记者注意到，具身智能产业正在“落向细处，走向实处”，越来越多机器人企业已切入细分领域。随着市场需求释放，行业的订单增长、产品交付与产能爬坡同步推进，并进一步向产业链上游传导，带动数据采集、灵巧手等配套环节加快扩容。\n\n细分场景涌现大订单\n\n需求正在加速转化为订单，余济萍对此感受尤为真切。\n\n“这是我们连续第三年参会了。”余济萍告诉记者，2024年公司首次带着清洁机器人亮相数贸会，2025年就拿到超过3亿元的意向订单，如今在手订单规模达到5亿元。在公共卫生间这样一个看似“小众”的场景里，机器人正在跑出大订单。\n\n“公共卫生间是半结构化的场景，更有利于机器人学习和适配。”星物种联合创始人周勇告诉记者，星物种已有100多台机器人在杭州多处公共卫生间稳定运行。\n\n随着订单逐步兑现，今年以来星物种进入批量生产和产能爬坡阶段。“我们现在要做的，是把产能稳定下来，把订单进一步落地。”周勇表示。\n\n服装缝纫这一传统劳动密集型场景也迎来机器人入场。\n\n艾图科技展台上，一台服装智造机器人从层层叠叠的软布上分离出单层裁片，抓取、转移，再将柔软的布料铺平、对齐，与下一环节的自动化缝纫设备协同配合。\n\n艾图科技技术总工程师周东旭介绍，上述这些动作看似简单，实则要处理三大难点：从成摞布料中分离出单张布料；将单张布料在指定位置铺平并实现毫米级对齐；实现多张布料之间的连续铺平和对齐。\n\n目前，机器人在服装制造领域的应用正在加速。今年以来，艾图科技已与安徽恒峰签订200台人形机器人采购订单；其母公司杰克科技与浙江人形机器人创新中心与达成战略合作，签约2000台服装场景定制人形机器人。\n\n上游“卖铲人”迎来增量需求\n\n机器人加速上岗，也让数据采集、核心零部件等具身智能上游“卖铲人”忙了起来。\n\n景联文科技品牌总监洪丽告诉记者，目前公司已有约20万小时具身智能素材采集需求，为承接相关需求，公司正持续扩大数据采集供应体系，“第一期招募供应商的时候，第一天就来了300多家，我们都没有想到”。\n\n与在实验室搭建单一环境不同，景联文正在把数据采集搬入真实的消费和工业场景。目前，公司已在芜湖、重庆、贵阳布局三大自建具身智能数采基地，由工人佩戴头戴式及手部设备，进入实际场景进行拆装、打包等作业记录。近期，公司还与杭州具身智能中试基地等共同出资成立浙江具身智能数据运营有限公司，希望打通从真实场景获取、规模采集到数据治理、流通和交付的链条。\n\n数据之外，灵巧手等核心部件迎来扩产窗口。本届数贸会上，曦诺未来集中展示了Flex 2和Prima 1两款灵巧手：Flex 2采用“腱绳+直驱”的混合驱动方案，面向工业和消费级应用；Prima 1采用全关节直驱方案，开合时间可达到0.08秒，主要服务算法与模型训练。据悉，曦诺未来的产能正在同步扩张。目前，公司已与多家头部具身厂商签下大额订单，5400平方米新工厂已建成投产，产能持续爬坡中。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 落地路径清晰化：具身智能正从实验室走向半结构化细分场景（公共卫生间清洁、服装缝纫），以\"小场景\"验证商业闭环。星物种在手订单达5亿元，艾图科技及母公司签约2200台服装场景机器人，订单规模已具备产业意义。\n2. 需求向产业链上游传导：整机放量带动数据采集（景联文20万小时需求、三大数采基地）与核心零部件（曦诺未来灵巧手扩产、5400平方米新工厂投产）同步扩容，\"卖铲人\"逻辑开始兑现。\n3. 产能爬坡成为当前瓶颈：多家企业从\"拿订单\"转向\"稳交付\"，量产能力而非技术演示成为竞争分水岭。\n\n影响分析\n\n这一轮落地的关键信号在于：场景选择从\"通用炫技\"转向\"半结构化刚需\"，公共卫生间、服装缝纫等场景环境可控、痛点明确、付费意愿真实，使订单具备可持续性。海外意向订单占比突出，说明中国具身智能在成本与工程化上已形成出口竞争力。\n\n对产业链而言，需求正沿\"整机—数据—零部件\"向上传导，数据采集与灵巧手等环节将率先受益于资本与产能投入，但也需警惕数采标准不统一、灵巧手产能过剩的早期风险。\n\n中期看，行业竞争焦点将从\"能否做出来\"转向\"能否稳定交付、控制成本\"，具备真实场景数据积累与量产爬坡能力的企业将拉开差距。具身智能的商业化拐点，或正由这些\"不性感\"的小场景率先定义。",
  "no": 43
 },

  "lede": "会晤40分钟，美乌再谈停火协议，佩斯科夫：目前不存在进入和谈的条件\n\n 2026年09月24日 05:05 环球网\n\n【环球时报驻俄罗斯特派记者 肖新新】据路透社、乌通社等媒体报道，当地时间22日，乌克兰总统泽连斯基在于纽约举行的联大会议期间同美国总统特朗普进行约40分钟的会晤。泽连斯基在会晤后对媒体表示，双方探讨了乌俄能源领域停火以及如何结束冲突等议题。他称，如果俄罗斯不攻击乌能源基础设施，乌已准备好同俄达成任何形式的能源停火协议，美方将向俄方转达该提议。他本人也已准备好同俄总统普京和特朗普举行三方会晤。\n\n据报道，特朗普22日在会见泽连斯基时对媒体表示，他相信俄乌最终将达成和平协议，但他不想透露协议具体内容，并指出俄乌双方“都希望看到战争结束”。谈及乌近期袭击俄炼油厂时，特朗普称这对俄和柴油价格都是“沉重打击”。他还认为，普京仍愿意同他再次举行会晤，但不一定是在12月于迈阿密举行的二十国集团领导人峰会上。泽连斯基同特朗普会晤后在社交媒体上称，会晤“积极且富有成效”。乌美双方都希望俄乌冲突能在冬季来临前结束。双方探讨了可能有助于缓和局势以及为外交途径铺平道路的各项举措。此外，双方还讨论了其他双多边议题，包括旨在帮助乌应对冬季局势的防空援助方案。乌美团队正继续推进在乌本土生产“爱国者”防空系统拦截弹相关工作。\n\n当地时间22日，泽连斯基在会晤后对媒体表示，美方并未要求乌单方面停止打击俄能源设施。双方探讨了乌俄在能源领域停火，这可能成为结束冲突的第一阶段。此外，他还向美方提出两点请求，即向乌提供一批“爱国者”拦截弹以供冬季所需以及允许乌在本土生产该拦截弹。他称，尚未从美方收到非常具体的答复，但“也没有人拒绝”。泽连斯基还表示，希望特朗普促成乌美俄领导人三方会晤以寻求结束冲突。\n\n塔斯社23日称，俄总统新闻秘书佩斯科夫当天表示，西方谈论能源领域停火只不过是一种说辞，其仍在向乌不断提供武器。乌“军事化”仍在继续，欧洲国家正试图找到越来越多的资金来为乌购买武器。他还说，俄方仍然对和平谈判持开放态度。由于乌仍在继续其“恐怖活动”，目前不存在进入和平谈判轨道的前提条件。佩斯科夫还表示，普京愿同特朗普会晤，但具体安排目前尚无定论。若没有专家技术层面的事先准备，就乌克兰问题举行最高层面会晤将毫无意义。对于普京与泽连斯基的会晤，俄方立场众所周知。若泽连斯基愿意，可以来莫斯科，俄方将为其提供安全保障。泽连斯基非常清楚他需要作出哪些决定来结束冲突。\n\n俄总统新闻秘书佩斯科夫 资料图 图源：视觉中国\n\n路透社22日报道称，近几周以来，俄乌双方不断加剧对彼此的远程袭击，打击港口、仓库、船只及能源基础设施，这也严重阻碍黑海地区粮食出口。随着冬季临近，乌担心俄会再次猛烈攻击其供暖和电力设施等。美国在对伊朗战争中的消耗，已导致包括美国自身库存在内的全球“爱国者”拦截弹供应吃紧。据报道，泽连斯基22日还提出，作为获取美国库存“爱国者”拦截弹的交换条件，乌愿转让其根据与德国达成的协议所预订的未来批次拦截弹。德国此前已同意2027至2028年度向乌提供600枚拦截弹。\n\n彭博社报道说，俄可能自8月以来一直在囤积弹道导弹，以备今冬对乌能源基础设施发动袭击。乌一些西方盟友担心，若乌无法熬过这个冬天，“最终将输掉这场战争”。据乌“国家网”报道，乌公用事业消费者联盟负责人波片科日前称，乌需要达成能源领域“休战”，否则相比上一个冬季，乌今年将迎来“末日寒冬”。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 美乌会晤聚焦“能源停火”：泽连斯基提出以俄停止打击乌能源设施为前提的能源领域停火，并寻求美方转达俄方，试图将其作为结束冲突的“第一阶段”。\n2. 三方会晤构想浮现：乌方主动提出美乌俄领导人三方会晤，特朗普称相信俄乌终将达成和平协议，但拒绝透露细节。\n3. 俄方冷处理：佩斯科夫明确否认存在和谈前提，指责西方持续供武、乌方“军事化”未停，并强调任何高层会晤需专家层面预先准备。\n4. 冬季压力成关键变量：乌方急寻“爱国者”拦截弹及本土生产授权，西方担忧乌若熬不过冬季将“输掉战争”。\n\n影响分析\n\n此次会晤象征意义大于实质突破。乌方将“能源停火”包装为低成本试探，意在争取冬季喘息窗口并绑定美方斡旋角色；美方态度暧昧，既未承诺军援也未施压乌方，显示特朗普政府倾向以最小投入维持调停者姿态。俄方则通过佩斯科夫表态划出红线——在乌方停止袭击且西方断供武器前，谈判无从谈起，实质是将僵局责任推给乌与北约。\n\n短期看，冬季能源设施攻防将成冲突烈度风向标：若俄兑现囤积弹道导弹的打击计划，乌民生崩溃风险陡增，可能倒逼西方加速防空援助；若能源停火侥幸达成，或为后续更大范围停火创造脆弱先例。但三方会晤短期内难落地，俄方“来莫斯科”的提议更像外交姿态而非可行方案。整体而言，各方均在为冬季后的谈判筹码布局，真正的和谈窗口尚未打开。",

 },

  "title": "团队分享提升 Agent Harness Token 效率的提示词",
  "src": "X：Eric Zakariasson (@ericzakariasson)",
  "lede": "一份公开提示词用于优化 LLM Agent Harness，目标是在不降低任务质量的前提下降低每任务的价格加权 token 成本。某团队一轮改动（提示词精简、工具卸载、缓存布局、稀疏行号、子智能体调优）将整体 token 成本降低约 7%，且质量无损。提示词强调按任务而非按请求计量，并建议先映射 harness、测量基线，再按优先级实施改动。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 降本路径明确：该团队通过提示词精简、工具卸载、缓存布局优化、稀疏行号、子智能体调优五类改动，实现整体 token 成本下降约 7%，且任务质量无损。\n2. 计量口径转变：强调按“任务”而非“请求”计量成本，更贴近真实业务价值，避免优化局部而损害整体效率。\n3. 方法论可复用：提出先映射 harness、测量基线、再按优先级实施的三步框架，具备工程落地性。\n\n影响分析\n\n这一实践指向 Agent 工程的核心矛盾：token 成本与任务质量并非必然权衡。7% 的降幅虽不激进，但“质量无损”这一约束条件使其具备实际部署价值——对高频调用 Agent 的产品而言，7% 可转化为可观的毛利改善。更值得关注的是其方法论意义：将优化对象从模型本身转向 harness 层（提示、工具调度、缓存、上下文组织），意味着成本控制正从“换更便宜的模型”转向“更聪明地使用同一模型”。按任务计量的建议也呼应了行业对 Agent 评估标准从“单次调用效率”向“端到端任务经济性”迁移的趋势。对开发者而言，这套框架的启示在于：降本应始于测量，而非直觉调参。",

  "deep": "## AI 解读\n\n核心要点\n\n1. Pareto前沿单周扩容11个点位，为AI模型竞争史上罕见的密集突破。GPT-6 Luna（5点）与Claude Opus 5.5（4点）构成主力，MiMo-V2.6-Pro与GPT-6 Sol补足剩余份额。\n2. 双维度同步推进：Intelligence Index（能力上限）与每任务成本（经济性）同时被推高，意味着前沿模型在“更强”与“更便宜”之间不再二选一。\n3. GPT-6双版本策略（Luna/Sol）显示头部厂商开始用产品矩阵覆盖不同Pareto区间，而非单点押注。\n\n影响分析\n\n短期看，Pareto前沿快速外扩将压缩中端模型的生存空间——既不够强也不够便宜的模型将被加速淘汰。中期看，成本曲线的下移比能力提升更具破坏性：每任务成本下降意味着Agent、批量推理等高消耗场景的商业可行性阈值被重新定义，应用层创新窗口打开。竞争格局上，Anthropic（Claude Opus 5.5）与OpenAI（GPT-6系列）在前沿点位上的拉锯趋于白热化，而MiMo-V2.6-Pro的入围表明第二梯队仍在特定区间保有卡位能力。关键变量在于：这11个点位中有多少能转化为稳定的生产级可用性，而非基准测试上的纸面优势。",

  "src": "X：Greg Brockman (@gdb)",
  "lede": "GPT Voice 获得重大升级，现在可以使用邮箱、日历、Slack 等工具，并由 GPT-6 Astra、Sol 和 Luna 驱动。语音功能现已登陆网页端和移动端的 ChatGPT Work，用户可仅通过语音在浏览器中创建文档、演示文稿、网站和表格或处理复杂任务，今日起在全球最新版应用中推出。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 能力跃迁：GPT Voice 从\"对话工具\"升级为\"执行代理\"，可调用邮箱、日历、Slack 等外部工具，实现跨应用操作。\n2. 模型底座换代：由 GPT-6 系列（Astra、Sol、Luna）驱动，暗示多模型分工架构已进入产品层。\n3. 场景落地：登陆 ChatGPT Work 的网页端与移动端，用户可纯语音创建文档、PPT、网站、表格并处理复杂任务。\n4. 全球同步：即日起在最新版应用全球推送，节奏激进。\n\n影响分析\n\n这是语音交互从\"信息入口\"向\"行动入口\"的关键转折。过去语音助手止步于问答，如今直接接入生产力工具链，意味着 OpenAI 正把 ChatGPT Work 塑造成语音原生的操作系统级入口——用户不再需要打开具体软件，语音即工作流。\n\n对 SaaS 生态冲击直接：Slack、日历、邮箱被\"语音中间层\"接管，应用界面价值被稀释，谁掌握调度权谁就掌握用户。微软 Copilot、Google Gemini 面临同维度竞争压力。\n\n风险同样突出：语音调用邮箱与日历涉及高敏感权限，误操作与隐私边界将成为监管焦点；多模型（GPT-6 三子模型）协同的稳定性与成本，也决定这一功能能否从演示走向日常。",

  "deep": "## AI 解读\n\n核心要点\n\n1. GPT-6 Sol (Max) 以 1689 分空降 Code Arena: WebDev 榜单第 4，采用真实用户投票而非厂商自测，可信度较高。\n2. 定价 $8/M tokens（混合输入/输出），处于中高端区间，性价比需结合具体任务评估。\n3. 未登顶，前三名仍由竞品占据，说明 WebDev 细分赛道的竞争格局尚未被 GPT-6 打破。\n\n影响分析\n\n短期看，第 4 名是一个“强势但不统治”的信号。OpenAI 在新一代模型上延续了通用能力领先、垂直场景未必碾压的态势。对开发者而言，$8/M tokens 的定价意味着高频调用成本可观，是否迁移取决于任务复杂度与前三名模型的价差。\n\n中期看，Code Arena 采用真实投票机制，正在成为模型选型的关键参考。GPT-6 未拿下 WebDev 第一，可能促使企业客户采取多模型路由策略，而非单一绑定 OpenAI。这对 Anthropic、Google 等竞品是利好，也倒逼 OpenAI 在代码垂直领域加速迭代。\n\n风险点在于：单一榜单排名波动大，1689 分与前三的差距若在统计误差内，实际体验差异可能有限。建议结合具体项目做 A/B 测试，而非仅凭排名决策。",

  "deep": "## AI 解读\n\n# 东方财富财经首页要闻深度解读\n\n核心要点提炼：\n\n1. 房地产政策组合拳密集落地：央行将个人房贷期限由30年延长至40年，证监会同步发布资本市场支持房地产新模式意见，三部门推行现房销售，金融监管总局出台五个融资管理办法。政策从信贷、融资、销售三端协同发力。\n2. 业绩分化显著：长鑫科技半年净利776亿元扭亏为盈，天齐锂业净利暴增4925%，中国铝业创新高；但比亚迪净利同比下降20.54%，阳光电源下降32.01%，存储芯片与锂电上游景气度明显高于中下游。\n3. 外部扰动升温：特朗普签令限制外国电网设备、暗示制裁涉伊朗业务中资银行，地缘与贸易摩擦风险再起。\n\n影响分析：\n\n房贷期限延长至40年直接降低月供压力，配合现房销售推行，有助于修复购房者信心与开发商现金流，地产链估值有望迎来阶段性修复。业绩层面，AI算力驱动的存储芯片与资源品涨价逻辑持续兑现，而新能源车与光伏中游承压，市场结构性行情特征将强化。外部方面，电网设备限制令或加速国产替代，但涉伊制裁威胁需警惕金融板块短期波动。整体看，政策底与业绩分化并存，建议关注地产链修复与算力金属主线。",

  "lede": "Qwen 发布 Qwen-Audio-3.1，ASR、TTS 与 Realtime 全面升级，并新增音频创作模型 TTS-Next 和音频理解模型 ASR-Next，共五个模型覆盖理解、生成、交互与创作。全线降价，TTS 约 70% off、Realtime 约 85% off、ASR 最高 95% off；Realtime 可边说边听、随时打断，检测到低落情绪时会放慢语速并共情回应。",
  "deep": "## AI 解读\n\n核心要点：Qwen一次性发布Audio-3.1五模型全家桶，覆盖ASR（语音识别）、TTS（语音合成）、Realtime（实时交互）三大基础能力升级，并新增TTS-Next（音频创作）与ASR-Next（音频理解）两个延伸模型，形成\"理解—生成—交互—创作\"全链路布局。价格策略激进：ASR最高降价95%，Realtime降85%，TTS降70%。\n\n影响分析：三点值得关注。其一，价格战信号明确——语音AI的API成本被压至近乎边际成本，中小开发者的准入门槛骤降，但同赛道友商的定价空间被严重挤压，语音赛道的商业化窗口正在收窄。其二，Realtime的情绪感知能力（检测低落情绪并调整语速共情）是差异化亮点，意味着语音交互从\"功能可用\"迈向\"体验拟人\"，这对客服、陪伴、教育等场景是实质性升级。其三，TTS-Next与ASR-Next的加入表明Qwen正从工具层向创作层延伸，音频内容生产可能成为下一个被大模型重构的领域。整体看，这是一次以性价比为矛、以全栈覆盖为盾的进攻性发布。",

  "url": "https://www.rfi.fr/cn/%E4%B8%93%E6%A0%8F%E6%A3%80%E7%B4%A2/%E6%B3%95%E5%9B%BD%E4%B8%96%E7%95%8C%E6%8A%A5/20260923-%E5%8D%8E%E7%9B%9B%E9%A1%BF%E4%B9%A0%E7%89%B9%E4%BC%9A-%E5%8F%B0%E6%B9%BE%E4%BA%BA%E6%8B%85%E5%BF%83%E7%BE%8E%E5%9B%BD%E4%BC%9A%E6%8E%A8%E8%BF%9F%E5%AF%B9%E5%8F%B0%E5%86%9B%E5%94%AE",
  "title": "华盛顿习特会：看台湾人的担忧- 法国世界报 - RFI",
  "src": "Exa 搜索",
  "lede": "发表时间： 23/09/2026 - 09:43\n\n 在习近平即将访问华盛顿和特朗普会谈之际，法国世界报特派记者从台北发回报道说，台湾人担心美国会推迟对台军售，担心美国长期以来对台湾的安全支持可能受到影响。因为特朗普5月访问中国后，曾把对台军售称为是与中国谈判的“筹码”。 \n\n 法国世界报 RFI \n\n特朗普5月份在北京会见习近平后，暂停了一笔总额约140亿美元的对台军售。特朗普当时在接受采访时表示，这批军售暂时搁置，未来是否继续，取决于中国，并称对台军售是美国手中的重要谈判筹码。\n\n法国世界报表示，对台湾来说，原本用于保障台湾安全、应对中国大陆领土主张的武器，现在开始取决于华盛顿和北京之间的直接谈判，这让台湾人感到非常不安。因此，台湾人带着一定的担忧，关注特朗普和习近平即将在华盛顿举行的再次会面。\n\n理性看待\n\n不过，法国世界报也指出，特朗普的反反复复对台湾造成的长期影响仍需理性看待。台湾在全球人工智能产业中具有重要地位，几乎所有用于发展人工智能的处理器都在台湾生产。这些芯片对美国经济越来越重要，也使台湾对美国的出口规模超过了中国。相关文章援引台湾专家表示，从地缘政治的角度来看，美国仍然有必要让中国与台湾保持一定距离。因此台湾需要保持警惕，但不必陷入恐慌。\n\n法国世界报的文章还强调，美国对台湾的安全支持是有法律和历史基础的。1979年美国与北京建交时，美国国会通过法律，规定美国必须向台湾提供防御性武器。1982年，里根政府进一步作出保证：美国在对台军售之前不会事先征求北京的意见，以避免台湾的安全成为中美外交交易的筹码。因此，特朗普如今与习近平讨论140亿美元军售的做法，被认为与这一长期形成的政策承诺存在冲突。\n\n困难局面\n\n实际上，台湾方面一直知道，美国通常会避免在中美领导人举行重要会晤期间宣布大型对台军售。美国政府过去也采取过不同的方式来降低对台军售产生的中美摩擦。一种方式是一次性宣布大规模军售，虽然这可能会引发外交危机；另一种方式是更加频繁地小规模军售，以避免中国作出强烈反应，但这种方式会持续刺激中美关系。\n\n近年来，由于美国自身的官僚程序和军工生产出现延误，一些武器又被优先供应其他地区，再加上特朗普政府倾向于高调宣布重大军售，最终，宣布的都是规模庞大的对台军售方案。2025年12月，美国宣布了一笔约110亿美元的巨额对台军售。美国政府希望以此表明，美国并没有放弃台湾。不过，特朗普在2024年总统竞选期间曾对美国是否应该帮助台湾表示怀疑，他强调台湾距离美国很远，却距离中国大陆很近。\n\n另一笔约140亿美元的军售正在等待美国总统的批准。北京认为，这一问题既可以用来测试特朗普，也可以用来动摇台湾社会对美国是否长期支持台湾的信心，甚至让台湾人怀疑是否还值得继续抵抗中国。因此，习近平多次向特朗普强调台湾问题的重要性，特朗普也接受了暂停军售。\n\n法国世界报认为，特朗普接受暂停军售，使他自己陷入了较为困难的局面。特朗普计划参加11月在深圳举行的亚太经合组织峰会，并希望习近平参加12月在迈阿密举行的G20会议。这些未来的中美高层接触，如今都要与对台军售联系起来。美国既需要维持与中国的关系，又需要继续履行支持台湾安全的义务，而特朗普将军售作为对华谈判的筹码，使这一矛盾变得更加明显。\n\n 作者： 阿曼亭",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 军售筹码化：特朗普暂停约140亿美元对台军售，公开称其为对华谈判筹码，打破1982年里根政府对台“六项保证”中不事先征询北京意见的承诺。\n2. 台湾焦虑升温：台湾安全支持被纳入中美直接交易框架，岛内对美信任度受冲击。\n3. 结构性对冲仍在：台湾掌握全球AI芯片代工命脉，对美出口已超中国大陆，地缘价值使美国仍需维持台海距离。\n\n影响分析\n\n短期看，军售暂停将直接削弱台湾防御能力建设节奏，并可能鼓励北京进一步测试美方底线。中期看，特朗普将安全承诺“交易化”的做法，会系统性侵蚀美国在亚太盟友中的信誉——日本、韩国、菲律宾均在观察：美国的安全保证是否随时可被摆上谈判桌。\n\n但台湾并非无牌可打。其在AI供应链中的不可替代性，使美国经济安全与台海稳定深度绑定。这意味着即便特朗普短期操作反复，美国对台政策的底层逻辑仍受制于产业链现实与国内法律框架。\n\n真正的风险在于：当安全承诺被反复标价，台湾社会的抵抗意志与对美信心将同步流失——这正是北京所希望看到的效果。特朗普的“筹码外交”若持续，最大的输家可能是美国自身在印太的战略可信度。",
  "no": 51
 },

  "lede": "2026/9/23 9:43:01\n\n 8月23日为期5天的2026世界机器人大会在京落下帷幕。从前沿技术的集中亮相到创新成果的加速转化从机器人的迭代升级到具身智能的场景拓展这场以“人机共生 产需共融”为主题的国际盛会通过多层次的交流研讨、集中化的展览展示、多场创新成果的发布以及丰富的同期活动全方位、多维度呈现了全球机器人领域的技术进展、创新应用与产业活力为推动机器人产业高质量发展汇聚新动能。全国政协常委、致公党中央专职副主席、全国妇联副主席、中国电子学会理事长徐晓兰中国宋庆龄基金会秘书长陈宏曲中国电子学会理事会党委书记、中国人形机器人与具身智能百人会理事长张峰北京市经济和信息化局局长姜广智中国工信出版传媒集团有限责任公司董事长朱师君世界工程组织联合会主席陈成川东盟智慧产业联合会主席陈志辉阿联酋机器人与自动化学会秘书长穆罕默德·阿尔沙姆西喀麦隆机器人协会主席雅克·伊万以及有关部门、国际组织、科研院所、行业机构、企业及媒体代表出席闭幕式。中国电子学会副理事长兼秘书长赵云峰主持闭幕式。徐晓兰在总结大会成果时指出本届大会是学习贯彻“十五五”规划纲要精神、前瞻布局未来产业的具体行动。大会设置7场主论坛和71场同期活动汇聚1000余位国内外专家发布44项新技术新方案大会发布了“智能机器人向上向善发展倡议”“中央企业机器人十大创新成果和十大高价值应用场景”“具身智能在应急场景的应用需求”“全球机器人应用探索计划”以及《2026年人形机器人产业发展报告》等成果宣布成立中国电子学会世界模型专家委员会373家企业集中展示3000余件产品其中首发新品311件30家国际机构、40家境外企业深度参与1万余位外籍人士观展现场参会人次达55.7万充分彰显了大会在全球机器人领域的影响力和号召力。张峰在致辞中表示本届大会展现了机器人新技能、创新队伍新力量和国际合作新成果。智能机器人已从才艺展示迈向快递分拣、煮面、商品打包等真实作业上半年我国人形机器人出货量超过4万台全球占比达97%人形机器人正从“跳起来”“跑起来”迈向工厂“干起来”、家庭“用起来”。中央企业机器人创新联合体将通过开放十大高价值真实场景推动技术攻关、场景验证和规模化应用形成完整闭环。中国电子学会副理事长兼秘书长赵云峰主持闭幕式闭幕式举行了机器人公益慈善捐赠活动。中国电子学会、致公党中央社会服务部联引中国宋庆龄基金会、中国工信出版传媒集团等19家单位和企业向贵州省毕节市捐赠249套机器人、一批科普动画和科普图书总价值200万元。徐晓兰、张峰为捐建单位和企业颁发荣誉纪念牌。2026世界机器人大会先进机器人与自动化国际学术会议共收到来自中国、美国、德国、法国、丹麦、英国、韩国等10个国家的122篇论文投稿涵盖机器人控制、感知、学习、人机交互等前沿方向。《具有侧向柔顺性与主动刚度调控能力的生物启发式灵巧手指设计》获评最佳会议论文《基于人工肌肉的可穿戴膝关节辅助机器人》《一种融合可穿戴肌电与惯性感知的音频监督跨模态框架面向音乐演奏表现力与情感感知的分析》获评最佳学生论文。中国电子学会机器人分会主任委员、香港大学机器人与自动化讲座教授及系主任、新兴技术研究所所长席宁德国慕尼黑工业大学教授阿洛伊斯·克诺尔为获奖者颁发证书。本届大会集中亮相311款新品20家新品发布企业代表在闭幕式现场参加纪念证书颁发仪式。陈成川、穆罕默德·阿尔沙姆西、雅克·伊万为企业代表颁发纪念证书。大会持续打造“投创之星”成果展示、交流推介和资源对接平台面向机器人及相关前沿领域遴选优质创新项目。本届大会共有10个项目获评“投创之星”。中国工程院外籍院士、德国国家工程院院士张建伟东盟智慧产业联合会主席陈志辉为获评项目颁发纪念证书。闭幕式上大会向全球战略合作伙伴京东集团、生态合作伙伴中国建设银行北京市分行颁发纪念杯并向长期报道和支持大会的媒体代表颁发纪念牌感谢合作伙伴和媒体朋友多年来对世界机器人大会及机器人产业发展的关注与支持。2027世界机器人大会的启幕时间也在闭幕式上重磅发布2027年8月18日大会将与社会各界共同见证人机协同迈向更广阔的可能共同探索机器人服务人类美好生活的更多答案。大会还发布了2027亦庄人形机器人半程马拉松全球邀约。盛会有期创新无涯。世界机器人大会将持续深耕智能科技、共拓产业蓝海书写机器人产业高质量发展新篇章。 \n\n📧 邮箱：info@kwkd.cn",
  "deep": "## AI 解读\n\n# 2026世界机器人大会深度解读\n\n核心要点：\n\n1. 规模与国际化双突破：373家企业展出3000余件产品，首发新品311件，现场参会55.7万人次，吸引30家国际机构、40家境外企业及超万名外籍人士，国际化程度显著提升。\n2. 产业拐点已至：上半年我国人形机器人出货量超4万台，全球占比97%，标志中国在该赛道形成绝对主导。机器人正从“才艺展示”转向快递分拣、煮面、打包等真实作业场景。\n3. 生态闭环加速成型：中央企业机器人创新联合体开放十大高价值场景，推动“技术攻关—场景验证—规模化应用”闭环，叠加“投创之星”等资本对接机制，产业化路径清晰化。\n\n影响分析：\n\n本次大会释放出明确信号：人形机器人已跨越概念验证期，进入规模化落地前夜。97%的全球出货占比意味着中国在供应链、成本控制和场景数据上建立了难以复制的壁垒。央企开放真实场景是关键变量——它解决了机器人企业最缺的“作业数据”和“付费客户”两大痛点，有望催生首批真正意义上的商业化标杆案例。\n\n但需警惕两点：一是311件首发新品中同质化竞争隐忧，灵巧手、关节模组等环节可能快速陷入价格战；二是“具身智能”在应急等复杂场景的可靠性仍未验证，从“能干活”到“干好活”仍有距离。总体而言，大会从学术、产业、资本三端同时发力，中国机器人产业正从“政策驱动”切换至“场景驱动”的新阶段。",

  "lede": "Fireworks Research 发布基于 Kimi K3 的专用模型 Ember-1，以约少 40% 的 token 达到与 Kimi K3 相当的质量，今日以 Research Preview 形式在 Serverless 上线。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 效率突破：Ember-1 以约少 40% 的推理 token 达到 Kimi K3 同等质量，直击推理成本这一当前大模型商业化的核心痛点。\n2. 产品路径：基于 Kimi K3 二次开发，以 Research Preview 形式在 Serverless 上线，走的是“专用化+轻量化”路线，而非重训基础模型。\n3. 定位信号：Fireworks 作为推理基础设施厂商，此举意在验证“模型压缩+推理优化”的商业价值。\n\n影响分析\n\n短期看，40% 的 token 削减直接转化为推理成本下降与响应延迟改善，对高频调用场景（Agent、RAG、批量生成）具备即时吸引力。中期看，这印证了行业趋势——竞争焦点正从“参数规模”转向“单位 token 的有效智能”，专用小模型对通用大模型的替代压力上升。对 Kimi 生态而言，第三方优化既是背书，也可能分流其 API 调用。需注意，Research Preview 阶段的质量宣称仍需独立 benchmark 验证，且“同等质量”在不同任务上的泛化性存疑。若效果坐实，推理层的效率红利将成为下一阶段模型厂商与基础设施商博弈的关键战场。",

  "lede": "Google 宣布 Antigravity SDK 支持本地模型工作流，首发通过 Google AI Edge 的 LiteRT 支持 Gemma 4 26B A4B，可完全离线运行智能体，建议机器配备 >24GB VRAM 或统一内存。",
  "deep": "## AI 解读\n\n核心要点\n\n1. Google 的 Antigravity SDK 正式支持本地模型工作流，首发接入 Gemma 4 26B A4B，通过 AI Edge 的 LiteRT 实现完全离线运行智能体。\n2. 硬件门槛明确：建议 24GB 以上显存或统一内存，指向高端消费级设备（如 Mac Studio、RTX 4090 级别）。\n3. 信号意义：Google 正在把智能体能力从云端向端侧下沉，且选择开放 SDK 而非绑定自家云服务。\n\n影响分析\n\n对开发者而言，这是端侧智能体从\"玩具\"走向\"可用\"的关键一步。24GB 内存门槛虽不低，但已落在专业用户可及范围，意味着隐私敏感场景（医疗、法务、企业内网）可以真正落地离线 Agent，无需担心数据出域。\n\n对竞争格局，此举直接对标 Apple 的端侧 AI 路线和 Meta 的 Llama 本地部署生态。Google 用 Gemma + LiteRT + Antigravity 组合拳，试图在\"开放权重 + 开发工具链\"上建立护城河，同时避免重蹈云端推理成本失控的覆辙。\n\n风险在于：26B 模型在端侧的推理延迟和实际任务完成率仍是未知数，24GB 门槛也把大量中端设备排除在外。端侧智能体能否真正替代云端，取决于未来 12 个月的实测表现，而非 SDK 发布本身。",

  "deep": "## AI 解读\n\n核心要点：OpenAI将Daybreak网络防御计划扩展至乌克兰政府，与数字化转型部合作，提供漏洞识别、修复开发与测试工具。此举建立在欧洲多国防御机构已有使用基础之上——CERT Polska借此发现第三方路由软件6个漏洞。乌克兰CERT-UA在2025年处理近6000起网络事件，需求端压力显著。\n\n影响分析：三点值得关注。其一，AI厂商正从商业工具提供者转向国家级安全能力供给方，OpenAI以民用基础设施防御为切入口，实质参与地缘冲突中的网络攻防，角色边界趋于模糊。其二，防御效率可能被量级提升，CERT-UA年处理6000起事件的规模下，AI辅助漏洞挖掘可压缩响应周期，但依赖单一商业模型也带来供应链集中风险。其三，欧洲防御方已形成事实上的协同网络，从波兰到乌克兰的案例扩散，意味着AI网络防御正从试点走向准标准化部署，后续需观察厂商中立性、数据主权与出口管制之间的张力。",

  "src": "Claude：Blog（网页）",
  "lede": "Anthropic于2025年5月22日举办首届“Code with Claude”开发者大会，并在旧金山、伦敦和东京三地同步举行。会上，Anthropic发布了Claude 4系列模型，包括旗舰模型Claude Opus 4和主打性价比的Claude Sonnet 4，两款模型均支持200K上下文窗口，知识截止日期为2025年3月。Claude Opus 4在SWE-bench基准测试中得分72.5%，Terminal-bench得分43.2%，在需要长时间专注的任务上可连续自主工作数小时，Anthropic称其为“全球最强编程模型”。Claude Sonnet 4在SWE-bench上得分72.7%，较前代Claude Sonnet 3.7的62.3%显著提升。两款模型即日起在Anthropic API、Amazon Bedrock和Google Cloud Vertex AI上线，Opus 4定价为每百万输入token 15美元、输出token 75美元，Sonnet 4定价为每百万输入token 3美元、输出token 15美元。此外，Anthropic宣布Claude Code正式全面可用，并新增VS Code和JetBrains IDE扩展、GitHub Actions集成及Claude Code SDK。API方面新增代码执行工具、MCP连接器、文件API和提示缓存功能，其中提示缓存可降低90%成本和85%延迟。Anthropic还预告了Claude Opus 4和Sonnet 4的“思维摘要”功能，以及未来将推出的“记忆”能力。",
  "deep": "## AI 解读\n\n# Anthropic Claude 4 与 Marketplace：编程AI赛道的全面战争\n\n核心要点提炼\n\nAnthropic一次性打出三张牌：模型、工具链、生态。Claude Opus 4以SWE-bench 72.5%的成绩对标“全球最强编程模型”，Sonnet 4则以72.7%的得分和1/5的定价构成性价比杀招。更关键的是Claude Code全面开放并接入VS Code、JetBrains、GitHub Actions，配合MCP连接器和提示缓存（降本90%），Anthropic正从“卖模型”转向“卖工作流”。Claude Marketplace的推出意味着其正式构建插件与智能体的分发平台。\n\n影响分析\n\n第一，编程AI进入“定价+生态”双轨竞争。Sonnet 4在基准测试上反超Opus 4却定价极低，说明Anthropic在刻意用性价比模型抢占开发者入口，再以Opus 4锁定高价值长任务场景。第二，提示缓存降本90%、延迟降85%，直接击穿企业级部署的成本瓶颈，加速AI编程从“尝鲜”到“生产级”的迁移。第三，Marketplace+SDK+MCP的组合，本质是复刻苹果App Store逻辑——谁掌握开发者分发渠道，谁就定义智能体时代的底层标准。OpenAI和Google若不跟进平台化策略，将面临开发者生态被虹吸的风险。",

  "deep": "## AI 解读\n\n核心要点：OpenAI联合80余位心理健康专家推出MentalHealthBench，这是继安全对齐研究、准备框架更新后的又一治理动作。该基准旨在为AI在心理健康场景的应用建立评估标准，标志着OpenAI正将安全治理从通用能力评测延伸至垂直高风险领域。\n\n影响分析：\n\n其一，行业标准卡位。心理健康是AI应用的高敏感地带，此前缺乏统一评测基准。OpenAI抢先联合专家制定标准，实质是掌握该领域的话语权与合规定义权，后来者需对标其框架。\n\n其二，监管前置应对。结合董事会与安全委员会调整、准备框架细化，OpenAI正构建“产品落地+安全审查”双轨机制。在各国AI监管趋严的背景下，主动发布基准可降低政策风险，也为商业化扫清障碍。\n\n其三，商业化信号。心理健康是AI付费意愿强的场景，基准的建立为API接入医疗、心理咨询等企业级客户提供了信任背书，与其降低开发者门槛的策略形成呼应。\n\n整体看，这是OpenAI“加速落地、同步收紧”战略的典型缩影——用标准制定换取监管空间与市场信任。",

  "deep": "## AI 解读\n\n核心要点\n\n1. 方法论突破：Anthropic未采用全面重构，而是聚焦覆盖95%用户活动的四条核心旅程，以75分位首屏可输入时间（3.1秒→0.55秒）为单一北极星指标，两周内合并超3000个变更且零用户侧事故。\n2. 工程范式：以用户旅程而非系统模块为优化单元，用AI工具（Claude）加速自身产品的性能迭代，形成“AI优化AI产品”的闭环。\n3. 风险控制：高频合并与零事故并存，说明其灰度发布与回滚机制已高度成熟。\n\n影响分析\n\n对行业而言，此举重新定义了AI产品的性能基准——0.55秒的可输入时间将用户对“AI响应慢”的容忍阈值大幅压低，后来者若停留在秒级将直接失去体验竞争力。对Anthropic自身，claude.ai的体验优势可转化为留存与付费转化，尤其在ChatGPT、Gemini同质化竞争中，速度正成为差异化变量。更值得关注的是方法论外溢：将性能优化拆解为“用户旅程+分位数指标+高频小步合并”，可复制到任何大型AI应用，预示AI工程正从模型能力竞赛转向系统化体验交付能力的比拼。",

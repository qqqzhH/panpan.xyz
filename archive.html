  "lede": "Tomer Tunguz 分析认为企业 AI 用量集中在需要足够智能且价格可负担的多步骤工作流中段市场，降价竞争正是证据。Anthropic 前沿模型 Fable 5.1 上线前十二天仅占网关支出的 3.7%，大型企业账户的前沿模型 token 消耗占比从 8 月初的 53% 降至 9 月的 45%；Cursor 用微调 Kimi K2.5 将成本降低 86%。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 市场重心判断：Tomer Tunguz 提出，AI 真正的商业价值不在前沿模型，而在“足够智能且价格可负担”的多步骤工作流中段市场。\n2. 数据佐证：Anthropic 前沿模型 Fable 5.1 上线前 12 天仅占网关支出的 3.7%；大型企业前沿模型 token 消耗占比从 8 月初的 53% 降至 9 月的 45%。\n3. 成本驱动：Cursor 用微调 Kimi K2.5 将成本降低 86%，验证了“够用即好”的工程逻辑。\n\n影响分析\n\n这一判断对 AI 产业格局有两层含义。其一，价值捕获点下移：前沿模型的军备竞赛未必对应收入，真正规模化的付费场景是成本敏感、可复制的企业工作流，中段模型与微调方案将成主战场。其二，竞争逻辑转变：降价不是补贴战，而是需求结构决定的必然结果——企业用 token 消耗投票，选择性价比而非绝对性能。对模型厂商而言，纯靠“最强”标签难以锁定企业预算，需在成本、延迟、可靠性上做工程优化；对应用层而言，中段市场的低门槛意味着差异化将更多来自工作流设计与数据积累，而非模型本身。前沿模型仍具战略意义，但商业重心已明确向中段迁移。",

  "deep": "## AI 解读\n\n核心要点：\n\n1. 顶级AI领袖首次集体亮相联合国安理会，包括“AI教父”Bengio、OpenAI的Altman、Anthropic的Amodei及Hugging Face的Delangue，形成罕见的行业统一阵线。\n2. 共识明确：若无有效干预，AI可能对全人类构成生存性风险，呼吁全球治理框架。\n3. 信号意义：AI安全议题从学术圈、科技圈正式进入最高级别国际安全议程。\n\n影响分析：\n\n短期看，此举将加速各国AI监管立法竞赛，欧盟AI法案、美国行政令之后，联合国层面可能推动框架性公约。中期看，头部AI公司主动“喊话”监管，实质是抢占规则制定话语权——通过定义风险边界来塑造准入门槛，对中小玩家形成挤压。长期看，AI治理将复刻核不扩散模式：大国博弈与技术透明机制并行，但AI的军民两用属性和扩散速度远超核技术，治理难度呈指数级上升。关键矛盾在于：地缘竞争下，各国是否有意愿让渡部分主权给全球AI治理机构。",
  "no": 65
 },

  "url": "https://claude.com/blog/how-to-prepare-for-ai-driven-code-modernization-projects",
  "title": "Anthropic 前线工程师分享 AI 驱动代码现代化项目的六步准备方法",
  "src": "Claude：Blog（网页）",
  "lede": "Anthropic于2025年5月22日在其首届开发者大会“Code with Claude”上宣布，Claude现可通过API使用网页搜索功能，开发者可构建能访问最新网络信息的AI应用。该功能已面向所有API用户开放，支持可配置的域名白名单与黑名单，并自动附带引用来源。同期，Anthropic还发布了Claude Code的正式版、Claude Opus 4与Claude Sonnet 4两款新模型、提示缓存功能、以及面向企业的Claude Managed Agents。此外，公司宣布将Claude Code与Claude API的速率限制提升至原来的三倍，并推出新的使用层级，以支持更高并发的生产级工作负载。",
  "deep": "## AI 解读\n\n# Anthropic开发者大会深度解读：从模型竞赛到工程化落地\n\n核心要点提炼\n\nAnthropic此次大会释放出清晰的战略信号：竞争重心正从模型能力转向工程化落地。四项发布构成完整闭环——网页搜索API补齐实时信息短板，Opus 4/Sonnet 4巩固模型底座，提示缓存与速率限制三倍提升解决生产级成本与并发瓶颈，Managed Agents则直击企业部署的运维痛点。而“代码现代化六步法”的分享，更将AI定位为遗留系统改造的加速器，而非简单代码生成工具。\n\n影响分析\n\n其一，网页搜索API附引用来源、支持域名黑白名单，直指金融、法律等高合规场景，与OpenAI形成差异化卡位。其二，速率限制提升与提示缓存叠加，实质降低单位token成本，将加速AI编程从“个人玩具”向“团队基础设施”迁移。其三，Managed Agents的推出意味着Anthropic开始承接部署与运维责任，企业采购决策门槛显著降低。\n\n整体看，Anthropic正以“模型+工具链+工程方法论”组合拳，抢占AI驱动软件现代化的企业级入口。对开发者而言，红利在于更低的集成成本；对竞品而言，压力在于工程化生态的卡位战已然打响。",
  "no": 66
 },
 {
  "id": "geopolitics-1790211605962-4",
  "day": "2026-09-23",

  "time": "9月23日 00:00",
  "cat": "geopolitics",
  "imp": "hot",
  "url": "https://military.china.com/news/13004177/20260923/49761352_all.html",
  "title": "马克龙步行去特朗普大厦 外交辞令下的分歧_军事频道_中华网",
  "src": "Exa 搜索",
  "lede": "马克龙步行去特朗普大厦 外交辞令下的分歧。马克龙在纽约街头步行了十几分钟，才走到特朗普大厦。法国总统在联合国大会开幕前一天，没有乘坐专车，而是穿过曼哈顿的人流去见特朗普，会谈持续了半小时。会后他对记者说，这是一次“非常富有建设性”的会谈。\n\n“建设性”这个词，在外交场合中频繁出现，通常用来表示双方至少还在沟通。这次马克龙和特朗普的会晤也是如此。半小时的会谈时间属于礼节性沟通的规格，而不是深度磋商。会谈没有联合声明、具体承诺或新的援助数字。但法国方面透露，马克龙打算与特朗普进行“坦诚交流”，试图引导他作出正确决定。“坦诚交流”意味着分歧很大，“引导”则表明对方立场不对。\n\n法方最担心的是美国在乌克兰问题上松劲，希望特朗普维持对乌克兰的支持力度，并加大对俄罗斯的压力。几天前，特朗普在爱尔兰表示警告过泽连斯基停止打击俄罗斯的柴油燃料，因为这会导致柴油短缺。特朗普认为乌克兰打击俄罗斯炼油厂会导致全球柴油价格上涨，从而加剧中东地区的能源冲击。而马克龙主张以更快、更有力的方式向乌克兰提供导弹拦截支持，并加大对俄施压。他认为削弱俄罗斯的炼油能力可以压缩莫斯科的战争融资空间。这种分歧源于两国对能源暴露程度的不同理解。\n\n法国离中东更近，对红海和霍尔木兹海峡的情况更为敏感，同时也坚信“俄罗斯能源收入即战争资金”的逻辑。华盛顿则将优先级转向防止能源危机叠加红海和霍尔木兹同时出现问题。布伦特原油价格稳定在100美元以上，任何可能推高柴油价格的动作都被视为帮倒忙。\n\n马克龙与特朗普讨论的“保护红海石油设施”并非空话。法国准备参与保护沙特能源基础设施，但强调是严格防御性的，不参与针对胡塞武装的冲突。9月11日，胡塞武装夺取了曼德海峡中央的丕林岛，控制了红海航运的咽喉。沙特的东西输油管道也在9月10日遭到袭击并预防性关闭。这条管道是沙特绕开霍尔木兹海峡的核心替代通道。法国希望通过最低限度的军事存在填补真空，保护自己的能源利益底线，而不被拖入美伊对抗的升级螺旋。\n\n马克龙还提到各方有重开霍尔木兹海峡的意愿，希望与美国及伙伴合作推动安理会通过一项保障航行自由的决议。然而，2026年4月巴林代表海湾国家提交的涉霍尔木兹决议草案因中俄反对未获通过。西方将其框定为国际公共产品的供给问题，中俄则理解为美以军事行动的衍生后果。法国试图在这个已被阵营化的话语场域中提出一个“去政治化”的技术方案，操作空间有限。\n\n回到那场半小时的会谈，马克龙用“富有建设性”来定性，说明没有实质突破。法方同步披露的沙特防御计划，是在用行动弥补会谈未能达成的协调。特朗普对乌克兰袭击俄炼油厂的公开反对，则把美法在冲突策略上的裂痕摆在台面上。联盟的表象可以靠外交辞令维系，但能源动脉的物理安全和安全承诺的政治可信度不是“建设性”三个字能修复的。当晚，马克龙还计划与泽连斯基会谈，而特朗普的态度已经明确。\n\n(责任编辑：卢其龙 CM0882)\n\n 网上不良信息举报电话：010-56177181 军事频道商务合作热线：13581877125 执行主编：杨靖",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 会谈规格与实质：马克龙步行赴特朗普大厦、半小时礼节性会谈、无联合声明与具体承诺——“建设性”一词掩盖的是美法在乌克兰问题上的实质性分歧。\n2. 分歧焦点：马克龙主张加大对乌导弹拦截支持、削弱俄炼油能力以压缩战争融资；特朗普则担忧乌打击俄炼油设施推高全球柴油价格，优先级转向防止能源危机叠加。\n3. 法国双轨应对：会谈无突破，法方同步披露沙特防御计划，以最低限度军事存在保护红海能源利益，同时试图推动霍尔木兹航行自由决议，但话语场已被阵营化。\n\n影响分析\n\n此次会晤暴露跨大西洋联盟在乌克兰策略与能源安全上的结构性裂痕。美法对能源暴露程度的认知差异——法国聚焦“俄能源收入即战争资金”，华盛顿聚焦“柴油价格冲击”——使双方难以协调。马克龙以“坦诚交流”“引导”等措辞暗示分歧之深，而特朗普公开反对乌袭击俄炼油厂，已将裂痕摆上台面。法国通过沙特防御计划“以行动弥补协调”，反映其对美国安全承诺可信度的疑虑上升。在中俄否决霍尔木兹决议后，法国“去政治化”技术方案的操作空间有限，欧洲或被迫在能源动脉安全上寻求更自主的路径。联盟表象可靠外交辞令维系，但物理安全与政治互信难以靠“建设性”修复。",
  "no": 67
 },
 {
  "id": "geopolitics-1790211605963-6",
  "day": "2026-09-23",
  "pub": "2026-09-23 00:00:00.000Z",

  "cat": "geopolitics",
  "imp": "normal",
  "url": "https://c.m.163.com/news/a/L7H2P98L0556BRWU.html",
  "title": "特朗普单方面宣布，美伊顺利会谈3小时，留给伊朗的有两条路",
  "src": "Exa 搜索",
  "lede": "如果你会喜欢上第二个人\n\n在纽约举行的联合国大会，成为美国调解多项国际冲突的重要外交舞台。当地时间9月22日，美国总统特朗普公开证实，美国官员当天在曼哈顿联合国大会期间与伊朗方面代表举行会谈，双方探讨了如何结束已持续近七个月的冲突。\n\n此次美伊会谈为双方自今年 6 月达成短暂停火协议后，时隔数月的首次线下会晤。特朗普在与泽连斯基会面时向媒体透露，这场会谈持续三小时，是一场十分顺利的磋商，并向伊朗方面放出强硬表态，伊朗当前面临两种抉择，要么把握机遇实现国力振兴，要么走向彻底覆灭，而达成和美协议是符合伊朗自身利益的最优选择。此外，特朗普官宣已敲定后续会谈计划，美伊双方将在短期内再次展开沟通，持续推进停战谈判。\n\n关于会谈参与人员，特朗普并未确认自己是否亲自出席。据悉，美国中东事务特使威特科夫、白宫高级顾问库什纳代表美方参会。结合特朗普当日密集日程来看，其先后会晤日本首相、英国首相及乌克兰总统泽连斯基，行程紧凑，几乎无多余时间参与会谈，因此本人缺席的可能性极大。目前，本次会谈的具体磋商细节并未对外公开，结合美伊过往谈判内容，外界普遍预判，双方核心议题仍聚焦于伊朗境内持续战事，以及切实可行的停战实施方案。值得注意的是，截至目前，一切都是特朗普单方面的说辞，伊朗官方并未对此次美伊会谈予以证实。\n\n在对外强硬发声的同时，特朗普在联合国全体大会演讲中亮出对伊朗的终极抉择。他表示，自己手握关键决策权限，一是与伊朗达成和解协议，允许伊朗开展战后重建；二是发动新一轮军事打击，彻底摧毁伊朗伊斯兰政权。特朗普激烈指责伊朗政权，宣称其本年度已屠杀超 7.2 万名本国民众，其中仅近期抗议活动就造成万人遇难。\n\n此次外交动态曝光之际，美国国内能源市场迎来剧烈波动，柴油价格刷新历史纪录，攀升至每加仑 6.52 美元。国际原油价格同样震荡起伏，全球基准布伦特原油价格一度跌破每桶 100 美元的关键关口，随后快速反弹回升，能源市场的动荡也为本次美伊谈判增添了更多不确定性。\n\n除推动美伊冲突停战外，特朗普将外交重心同时放在持续四年多的俄乌冲突调解上。在与乌克兰总统泽连斯基会晤时，他再次明确预判，俄罗斯将主动达成停战协议，结束俄乌战事，且不愿提前透露协议具体内容。\n\n特朗普透露，美方已与俄方在阿拉斯加完成过一轮会谈，他计划再度与俄罗斯总统普京面对面会晤，专项磋商俄乌冲突解决方案。同时他预判，今年内俄乌双方官员有望再次举行线下谈判。针对年末即将在迈阿密举办的G20年度峰会，特朗普表示普京愿意配合推动和平进程、乐见战争终结，大概率会出席峰会参与沟通。目前，乌克兰总统泽连斯基已确认参会，而普京的出席情况仍未最终敲定，成为俄乌和谈的一大悬念。\n\n当下，特朗普依托联合国大会、G20峰会等多边平台，同步推进两场关键地区冲突的和解进程，一边对伊朗保持高压姿态、以强硬立场倒逼谈判落地，一边积极斡旋俄乌和谈。多重外交动作背后，既彰显美国的全球外交布局，也让中东、欧洲两大热点冲突的后续走向更加牵动全球局势。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 单方面叙事，伊朗未证实：特朗普宣称美伊在联大期间举行3小时“顺利会谈”，但伊朗官方全程沉默，会谈真实性存疑，更像美方单方面释放的舆论信号。\n2. “两条路”式极限施压：以“和解重建”对“政权覆灭”二选一，配合“年内屠杀7.2万人”的指控，是典型的施压话术，意在将谈判破裂的责任预置给伊朗。\n3. 多线外交并行：同期推进俄乌调解、预告G20与普京会晤，特朗普试图以“和平缔造者”姿态主导中东与欧洲两大热点议程。\n\n影响分析\n\n短期看，此次会谈若属实，或为停火谈判打开窗口；但伊方不确认、细节不公开，谈判基础脆弱。特朗普高调喊话更多服务于国内政治与能源市场预期管理——柴油价格创6.52美元新高、布伦特原油剧烈震荡，说明市场对中东供应风险高度敏感，任何“和平进展”信号都可短暂平抑油价。对伊朗而言，“政权存亡”式威胁压缩了妥协空间，反而可能强化其强硬派立场。若后续会谈无实质突破，美方叙事将沦为单边宣传，地区局势仍将在“谈而不破、打而不全”的高压僵持中反复震荡。",
  "no": 68
 },

  "title": "【环球财经】美股科技股迎估值考验 后续走势分化或进一步加剧 - 中国金融信息网",
  "src": "Exa 搜索",
  "lede": "新华财经| 2026年09月23日\n\n四季度真正决定美股走向的，已不再仅仅是美联储的加息节奏，而是AI投资能否兑现为实际利润、企业盈利能否追上估值步伐，以及在美债收益率逼近5%的环境下，市场是否仍愿为遥远的增长故事支付高溢价。\n\n新华财经上海9月23日电（葛佳明）美联储9月加息落地后，美股走势呈现显著分化：纳斯达克综合指数在科技股带动下逆势上扬，而与此同时，美国10年期国债收益率已逼近5%的关键关口。在高利率环境与AI投资热潮的双重交织下，美股正步入全新的定价阶段。\n\n资金流向已清晰折射出投资者的谨慎情绪。伦敦证券交易所集团（LSEG）数据显示，截至9月16日当周，美股股票基金整体净流出314.4亿美元，与前一周约320亿美元的净流出规模基本持平，处于年内第二高水平。 连续两周的大规模净流出表明，尽管主要股指尚未全面转弱，但部分资金已开始主动降低风险敞口，提前进行防御性布局。\n\n5%长端利率成为估值“压力测试”\n\n本轮美联储加息后，美股表现出超出历史经验的韧性。通常而言，加息会同时提高企业融资成本和股票估值所使用的贴现率，对风险资产构成双重压力。高增长科技企业的大部分预期现金流集中于较远的未来，对长期实际利率的变化尤其敏感。长端利率越高，这些远期收益折算到今天的价值就越低。\n\n据新华财经数据统计，自1972年以来，美联储开启一轮加息周期后，标普500指数在最初六周平均下跌约4%，但随后逐步修复，半年后的回报中位数重新转正，约为3%至4%。这说明加息本身并不足以决定股市方向，市场更关心的是利率为何上升。\n\n如果利率上行源于经济增长强劲、企业需求旺盛和盈利改善，股票仍可能消化更高的资金成本；如果利率上升主要来自通胀失控、财政风险或期限溢价抬升，估值承受的压力就会更加直接。\n\n当前的复杂之处在于，多种因素正在同时推高长端利率。除美联储政策外，美国政府持续发债，AI数据中心、半导体、电力和电网建设也在争夺长期资金；能源价格和地缘风险则进一步提高了投资者持有长期资产所要求的补偿。摩根大通私人银行指出，美联储已不再是推动长端利率上行的唯一力量，实际利率可能比下一次是否加息25个基点更值得关注。\n\nAI交易进入“盈利验收期”\n\n尽管利率压力加大，AI仍是支撑美股的重要力量。二季度美国科技企业盈利保持较快增长，半导体、网络设备、云服务和数据中心投资继续扩张。部分AI龙头拥有充足现金流，即使融资环境收紧，也能够维持大规模资本开支，这是本轮科技行情与单纯依赖外部融资的概念炒作之间的重要区别。\n\n高盛全球固定收益、外汇及大宗商品联席主管Anshul Sehgal表示，即使长期美债收益率已达到约5%，其仍更看好AI算力基础设施，尤其是提供算力租赁和数据中心服务的企业。其逻辑是，债券收益率进一步下降的空间可能有限，而AI基础设施的收入仍有成倍增长的潜力。\n\n不过，高盛同时将AI基础设施与广义股票市场作出区分。紧缩的货币条件仍可能压制AI以外的股票，因此，看好算力并不等同于看好整个美股市场。这恰恰揭示了四季度行情的一条重要线索：AI主线可能继续存在，但能够分享上涨的公司将越来越少。\n\n巴克莱也认为，AI已不再是“所有科技股普涨”的主题。市场正在奖励芯片、数据中心、电力设备等直接受益于算力建设的企业，同时重新审视部分软件公司的商业模式。一些软件企业可能借助AI提高效率、扩大收入，另一些企业则面临产品被替代、服务价格下降甚至行业壁垒削弱的风险。\n\n因此，即使同属科技板块，半导体、云计算平台、软件服务和互联网企业的股价也可能出现明显背离。此前市场主要追问企业“是否拥有AI故事”，接下来则会追问三个更具体的问题：AI投入能否带来可计量的收入，新增利润能否覆盖折旧和融资成本，以及这种回报能否持续。\n\n摩根大通认为，目前AI基础设施需求仍然强劲，但真正有意义的企业级生产率提升尚未广泛反映在利润表中。AI使用范围不断扩大，与AI对盈利产生实质贡献之间仍存在差距。这个差距能否缩小，将成为未来几个季度判断AI资本开支周期可持续性的关键。\n\n财报空窗期进一步放大了这种不确定性。嘉信理财在市场点评中指出，多家AI及芯片龙头短期内没有财报披露，市场暂时缺乏新的业绩数据验证。在这一阶段，有关AI需求降温或产业政策变化的潜在利空更容易主导交易情绪。投资者担忧，新一轮恐慌可能由龙头股向产业链扩散，进而拖累数据中心、芯片及计算机设备采购。自2022年以来，这类资本开支一直是美国市场和经济增长的重要助推力量，一旦企业缩减投入，影响将不再局限于科技板块。\n\n从这个意义上说，AI主题不是简单退潮，而是进入成熟期。资本市场将由为远景统一定价，转向按照盈利能力进行筛选。",
  "deep": "## AI 解读\n\n# 美股科技股：从“故事定价”到“盈利验证”的范式切换\n\n核心要点\n\n1. 定价锚已转移：四季度美股的核心变量不再是美联储加息节奏，而是三个更硬的约束——AI投资能否兑现为可计量利润、企业盈利能否追上估值、以及10年期美债收益率逼近5%时市场是否仍愿为远期增长支付高溢价。\n2. 资金已在防御：美股股票基金连续两周净流出超300亿美元，处于年内第二高位，表明部分资金正主动降低风险敞口，而非等待指数转弱再行动。\n3. AI交易内部裂变：市场正从“沾AI即涨”转向按盈利能力筛选，半导体、算力租赁、电力设备与部分软件企业走势将显著背离。\n\n影响分析\n\n5%的长端利率构成实质性估值“压力测试”。当前利率上行的推手多元——财政发债、AI基建争夺长期资金、地缘与能源风险溢价——美联储已非唯一力量，这意味着即使暂停加息，估值压力也未必缓解。\n\nAI主线不会简单退潮，而是进入成熟期：资本开支仍强劲，但企业级生产率提升尚未广泛反映在利润表中。这一“投入-回报”缺口能否收窄，将决定AI资本开支周期的可持续性。财报空窗期放大了这一不确定性，潜在利空更易主导情绪，并可能由龙头股向数据中心、芯片采购等产业链扩散。\n\n结论：指数层面韧性犹存，但内部结构分化将进一步加剧。能够证明AI投入转化为持续利润的企业将获得溢价，其余则面临估值重估。",
  "no": 69
 },

  "src": "Exa 搜索",
  "lede": "具身智能赛道正从概念验证阶段进入技术迭代的密集投入期，企业密集发布模型，竞争窗口收窄。行业在VLA（视觉-语言-动作）大模型、分层架构、端到端方案等方向并存，技术路径尚未收敛，尚无统一技术范式。相比硬件本体，决策与泛化能力成为差异化关键，模型能力正取代机械结构成为估值锚点，“大脑”成为竞争焦点。短期看，密集发布将加速资本与人才向头部集中，缺乏模型自研能力的本体厂商面临被边缘化风险。中期看，路径多元化意味着标准未定，开源与闭源、通用与垂直路线将并行博弈，生态卡位战提前打响。长期看，若“大脑”能力突破泛化瓶颈，具身智能有望从演示走向真实场景落地，但当前仍需警惕发布密度与实际交付能力之间的落差——模型刷屏不等于商业化兑现。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 行业节奏加快：具身智能企业密集发布模型，表明该赛道正从概念验证阶段进入技术迭代的密集投入期，竞争窗口收窄。\n2. 路径尚未收敛：所谓“多元化探索大脑进阶路径”，反映行业在VLA（视觉-语言-动作）大模型、分层架构、端到端方案等方向并存，尚无统一技术范式。\n3. “大脑”成竞争焦点：相比硬件本体，决策与泛化能力成为差异化关键，模型能力正取代机械结构成为估值锚点。\n\n影响分析\n\n短期看，密集发布将加速资本与人才向头部集中，缺乏模型自研能力的本体厂商面临被边缘化风险。中期看，路径多元化意味着标准未定，开源与闭源、通用与垂直路线将并行博弈，生态卡位战提前打响。长期看，若“大脑”能力突破泛化瓶颈，具身智能有望从演示走向真实场景落地，但当前仍需警惕发布密度与实际交付能力之间的落差——模型刷屏不等于商业化兑现。",

  "url": "https://robot.ofweek.com/2026-09/ART-898890-8460-30704476.html",
  "title": "全球首次！宇树19台机器人同台，没有基站，还会自己纠错 - OFweek机器人网",
  "src": "Exa 搜索",
  "lede": "全球首次！宇树19台机器人同台，没有基站，还会自己纠错 - OFweek机器人网\n\n全球首次！宇树19台机器人同台，没有基站，还会自己纠错\n\n9月22日，世界技能大赛开幕式。宇树科技19台H2人形机器人与120名舞者同台共舞，完成全球首次全尺寸通用人形机器人全AI驱动自主集群表演。\n\n这不是普通的机器人跳舞。没有场外定位基站，没有外部辅助，19台机器人全靠自己“看”清楚舞台、找到位置，还能在灯光干扰、人员走动中自动纠错归位。\n\n扔掉“拐杖”之后，人形机器人正在跨过一道关键门槛。\n\n没有基站，机器人怎么“找到自己”？\n\n以前的人形机器人集群表演，大多靠场外定位基站——相当于在舞台四周架“灯塔”，机器人接收信号才知道自己在哪。一旦走出实验室，基站成本高、部署难，工厂车间、灾害现场根本用不了。\n\n宇树这次把“拐杖”扔了。\n\n每台H2完全依靠机载激光雷达感知环境，实时完成厘米级自主定位。自研集群协同调度系统把19台机器人的同步延迟压到毫秒级。舞蹈动作由强化学习算法生成，能跟着音乐节奏走。更关键的是，整套系统具备自主纠错能力——位置偏了，自己识别、自己修正、自己归位。\n\n从“被定位”到“自主定位”，从“按程序跳”到“自己纠错”，这一步的分量，比看起来重得多。\n\n从“一个聪明大脑”到“一群聪明大脑”\n\n过去几年，人形机器人的核心命题是“让一台机器人做好一件事”。但真实生产场景里，几乎没有哪项复杂任务靠单台机器人能独立完成。\n\n工厂巡检要分区协作，仓储分拣要高效调度，灾害救援要组队进入。群体智能不是单体智能的简单叠加，而是从“一个聪明大脑”到“一群能配合的聪明大脑”的系统升级。\n\n宇树方面明确表示，这套全自主集群控制技术可用于工业场景多机器人协同巡检、仓储分拣、装配流水线。优艾智合、中联重科也已展示人形机器人与移动机器人协同作业的方案。集群协同的种子，正在工业土壤里生根。\n\n产业很热，但别急着狂欢\n\n数据确实热。2026年上半年，中国人形机器人出货量超4万台，全球占比97%。摩根士丹利把全年出货预测上调至5万台，预计2030年达44.6万台。政策也在加码，“十五五”规划明确鼓励具身智能、群体智能技术创新。\n\n但挑战同样真实。\n\n最核心的瓶颈是泛化能力不足。机器人在一个场景练出的技能，换个场景往往就要重做。训练强泛化模型需要千万小时级真实数据，当前全球可复用的高质量真机数据只有十万小时量级。核心部件、标准体系也尚未完全成熟。\n\n宇树创始人王兴兴说得很清醒：具身智能大脑还不够通用，大规模应用或需3到5年，最长不超过10年。中国机电一体化协会会长曲道奎也提醒，真实场景应用占比仍偏低，行业要警惕同质化竞争。\n\n表演是“果”，技术是“因”\n\n舞台表演本身就是极端测试：灯光干扰、人员走动、音乐同步、19台设备高并发通信。能在这个环境里稳定运行并自主纠错，说明底层技术已经具备走出实验室的基础。\n\n但从“能跳舞”到“能干活”，中间需要的不是一次质变，而是一系列工程化落地——降成本、攒数据、建标准、提泛化。\n\n群体智能的时代正在到来，但从信号到现实，还需要全行业保持耐心和克制。对中国的人形机器人产业来说，最重要的不是赢每一次聚光灯，而是让技术在真实的土壤里扎下根来。\n\n 原文标题 : 全球首次！宇树19台机器人同台，没有基站，还会自己纠错\n\n- \n\n咨询热线\n\n \n\n咨询热线\n\n0755-83279360/19925280375",
  "deep": "## AI 解读\n\n# 宇树19台机器人自主集群表演：人形机器人跨过“去基站化”门槛\n\n核心要点\n\n宇树科技在世界技能大赛开幕式上完成全球首次全尺寸通用人形机器人全AI驱动自主集群表演。核心突破有三：一是去基站化——19台H2完全依靠机载激光雷达实现厘米级自主定位，摆脱场外定位基站依赖；二是毫秒级协同——自研调度系统将同步延迟压缩至毫秒级，支撑高并发实时通信；三是自主纠错——面对灯光干扰、人员走动等扰动，机器人可自行识别偏差并归位。这意味着人形机器人从“被定位”转向“自主定位”，从单体执行转向群体协同。\n\n影响分析\n\n短期看，这是技术验证而非商业落地。舞台表演本质是极端环境压力测试，证明底层感知与协同能力已具备走出实验室的基础。中期看，去基站化直接打开工业场景想象空间——工厂巡检、仓储分拣、灾害救援等场景无法部署定位基站，自主集群是刚需。宇树已明确指向工业协同应用，优艾智合、中联重科亦有类似布局，集群协同正从演示走向产线。但需冷静：泛化能力仍是最大瓶颈，高质量真机数据仅十万小时量级，与千万小时级训练需求差距悬殊。王兴兴判断大规模应用需3至5年，曲道奎警示同质化竞争风险。结论：技术拐点已现，产业拐点尚远。从“能跳舞”到“能干活”，考验的不是单点突破，而是降成本、攒数据、建标准的系统工程能力。",
  "no": 71
 },

  "lede": "“千机进厂”：AI重塑广东制造，具身智能迎场景落地潮\n\n “千机进厂”：AI重塑广东制造，具身智能迎场景落地潮\n\n以机器人为代表的人工智能产品，正在密集走进中国工厂。\n\n在制造业大省广东，人工智能对制造业的赋能已经形成规模与示范效应。而今，广东已有超2000台人形机器人进驻制造企业，2026年全年进厂数量有望突破3000台。\n\n这仅仅是开始。今年以来，以大模型技术底座、AI Agent应用、具身智能产品等为代表的人工智能技术，已经全方位融入广东的各个车间和工厂。\n\n9月22日，在第二届广东省人工智能应用对接大会现场，跨维智能与欣旺达子公司博速达签约，让机器人走进新能源工厂，探索具身智能进入制造体系的落地路径。\n\n此次大会，广东除了启动“千机进厂”广东具身智能机器人规模化应用示范工程外，还发布一批制造业的人工智能需求清单，以应用为牵引推动人工智能与制造业深度融合。\n\n这背后是广东制造转型升级的需要。广东提出，“十五五”时期要加快构建以先进制造业为骨干的现代化产业体系。这其中，以AI为核心引擎优化产业生态，加快推进数字技术特别是人工智能技术全域全时全行业高水平应用，是关键举措。\n\n透过此次大会，人们能看到“世界工厂”的破局之道。广东以真实场景为牵引，用需求清单对接技术供给，让大模型和智能体在车间落地，让企业用得起、用得好，实现生产制造全过程的数字化、网络化、智能化。\n\nAI从“上场”到“进厂”\n\n“其实我们的机器人已经在工厂干活了。”跨维智能人形机器人业务总经理杨怀宇说。在部分企业的SMT车间，跨维的机器人已站上库前上料工位，进行翻包、扫码、装箱等操作，并实现了与工厂WMS、MES系统的整体打通。以往人工难以胜任的复杂任务，如今交给机器人完成。\n\n在此次与博速达签约的合作项目中，跨维智能希望围绕真实生产场景，建立一个完整闭环：从真实工厂提取任务，通过仿真重建任务环境，利用仿真和真实数据训练模型，再把模型部署到机器人上，最后通过机器人在真实生产中的运行数据持续反哺模型。\n\n南方财经记者观察到，广东不少工厂自动化、数字化程度已经很高，但面临越来越多的柔性化生产要求时，自动化就难以适配。\n\n杨怀宇谈道，传统自动化生产擅长的是路径单一、精确且高效的生产流程。而目前，柔性制造需求越来越多，工厂的订单往往是小批量、多批次。一旦物料变化、SKU变化、工位变化，往往就意味着重新编程、重新调试，甚至重新改造硬件，工厂效益就容易下降。\n\n“具身智能希望改变的就是这套逻辑。我们更希望机器人进入真实生产之后，每一次抓取、识别、扫码、搬运、异常恢复，甚至每一次失败，都可以沉淀成新的数据，这些数据再进入模型训练和仿真验证体系，最终反过来提升机器人的能力。”杨怀宇表示。\n\n因此，具身智能进厂，不是一次性交付，而是从真实生产出发，到数据沉淀、模型训练、仿真验证、能力升级，再回到生产的新生产范式。“这也是我们认为具身智能对制造业最大的长期价值。”杨怀宇说。\n\n而今，跨维智能已在50多个细分行业沉淀超1500个具身智能模型，方案应用于美的、中国中车、海信、蓝思科技等头部企业产线。\n\n如果说跨维智能赋能的是车间，钛动科技便是在寻找用AI让广东制造业企业找订单、做买卖更便捷高效的方式。\n\n“企业需要的不是科技本身，企业需要的是正常的收入、更好的利润。”钛动科技创始人兼CEO李述昊接受媒体采访时说。在他看来，全球消费者的注意力正从搜索平台、货架平台转向AI平台，“买东西用AI”正成为新形态，这是中国品牌出海的新入口。\n\n在这样的背景下，钛动科技打造了两个引擎。一个是营销多智能体Navos，它就像一个导航系统，能从企业的经营目标出发，协同市场洞察、内容创作、达人建联等多个智能体，完成从识别机会、生成策略到归因调优的增长闭环。\n\n另一个是自研专业大模型“钛极”，它具备问答推理、多模态理解和视频生成能力，能看懂何种视频可以打动消费者，再直接生产出这样的AI视频。Navos负责增长执行，钛极提供知识积累和专业判断。\n\n背靠这一“双引擎”，钛动科技让大量广东制造工厂拥有了在海外叫响自主品牌的底气。\n\n李述昊讲了一家广州企业被AI智能体赋能的故事。该企业原本只做代工，AI智能体基于对目标市场消费者喜好的洞察，为其提供社交媒体创意和内容营销，帮助它从代工走向品牌，入驻东南亚一线电商平台，跻身细分榜单TOP3。两三年时间，该企业的店铺访问量增长约三倍，销售额增长约两倍。\n\n广东智能制造再进一步\n\n样板跑通了，新问题也随之浮出水面。AI进厂，还能不能再快一点？\n\n南方财经记者采访发现，目前广东制造业企业对人工智能的需求极为庞大，且越来越多元化。正如李述昊所言，随着各类智能体越来越成熟，AI企业为制造业各类场景需求预制了很多“Skill（功能模块）”，让中小企业用得起、用得好人工智能。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 规模化落地启动：广东已有超2000台人形机器人进厂，2026年预计突破3000台，“千机进厂”示范工程标志具身智能从试点走向规模部署。\n2. 范式转变：具身智能进厂不是一次性交付，而是“真实生产—数据沉淀—模型训练—仿真验证—能力升级”的闭环，核心价值在于用数据飞轮破解柔性制造难题。\n3. 供需对接机制：政府发布制造业AI需求清单，以真实场景牵引技术供给，降低中小企业使用门槛。\n\n影响分析\n\n短期看，此举直接回应广东制造业的柔性化痛点——传统自动化难以适配小批量、多批次订单，具身智能通过持续学习实现物料、工位变化下的快速适配，有望降低重编程与硬件改造成本。中期看，跨维智能等企业已沉淀超1500个模型、覆盖50多个细分行业，叠加钛动科技等AI营销智能体，广东正形成“生产端+交易端”双轮驱动的AI赋能生态。长期看，若“需求清单+场景示范”模式跑通，广东有望为全国制造业智能化提供可复制的路径，但数据闭环的标准化、跨企业模型迁移效率及中小企业付费能力，仍是规模化推广的关键变量。",
  "no": 72
 },

  "title": "特朗普联大演讲：攻打伊朗是为解决长期威胁 | 联合早报",
  "src": "Exa 搜索",
  "lede": "美国总统特朗普周二（9月22日）在纽约联合国总部向第81届联合国大会发表讲话，坚称向伊朗发动战争，是为铲除伊朗核能力，造福国际社会。 （路透社）\n\n（纽约综合电）美国总统特朗普在联合国大会上坚称，他向伊朗发动战争是为国际社会解决长远威胁，铲除伊朗核能力，不过他相信，美伊会在美国中期选举后达成协议停止战争，因为“他们没理由不这么做”。 \n\n联合国大会第81届会议星期二（9月23日）展开一般性辩论，特朗普是继巴西总统卢拉后第二位发言的国家领导人。这也是美伊战争爆发后，他首次在联大对全球领袖发表演讲。伊朗总统佩泽希齐扬和以色列总理内坦亚胡将分别在星期三和星期四发言。\n\n特朗普说，自己从前任政府接过“黑暗时代”的美国，将它蜕变为“黄金时代”后，就马上着手处理伊朗这个困扰国际社会已久的问题。\n\n他说：“当他人高谈阔论，我已付诸行动。当他人空谈和平，我已缔造和平。当他人无视威胁，我已直面威胁。当他人奢谈勇气，美国已展现勇气。当他人承诺展现力量，我已经行使力量，让美国成为全世界最强大的国家。” \n\n特朗普全长37分钟的演讲，对各国领导人的口吻比去年温和得多，但仍批评欧洲领导人对伊朗核威胁坐视不理。他说，希望欧洲能意识到，“如果伊朗成功研发核武器，这个邪恶的政权将能永远散播恐怖和死亡，因为任何人试图阻止都会面对核毁灭”。 \n\n特朗普再次放话说，他正在考虑将伊朗“毁灭”，但紧接着释放和解信号。“我是不是要将他们打入地狱，失去生存的机会，让下一世代失去希望？但我相信，我们也许会在（中期）选举后达成协议，因为他们没理由不这么做。” \n\n他还说，伊朗正在观望美国中期选举的结果，但却“没发现我其实没参选，我已经选过，还大胜了”。 \n\n## 特朗普利用联合国演讲为中期选举造势\n\n虽然特朗普口口声声不在乎，但中期选举显然牵动着他的思绪。他利用这场联大演讲大谈自己的国内成就，宣称：“我们的经济让全世界嫉妒，我们的科技全球第一，几乎在所有领域都保持领先。”他接着老调重弹：“两年前这个国家一潭死水，如今我们是全世界最炙手可热的国家。” \n\n特朗普在去年的联大演讲中吹嘘自己解决了七场战争，今年，他宣称自己解决了八场（第八场是加沙战争），称巴基斯坦、阿塞拜疆和柬埔寨等国领导人都对他的成就赞不绝口。 \n\n针对人工智能（AI）发展过快所造成的威胁，特朗普说，发出这些警告的人跟那些渲染他与俄罗斯私通的“通俄门”阴谋论者是“同一批人”，坚持AI须加速发展：“我们将鼓励它，而不是限制它。” \n\n## 特朗普确定美军将在格陵兰岛增设两个基地\n\n美国同天与丹麦和格陵兰在联合国大会场边签署涉及格陵兰岛安全的协议。新协议允许美国在格陵兰岛上建立两个新基地，一个在南部纳萨尔苏瓦克，另一个在东岸的梅斯特斯维格。美国可在岛上部署“金穹”导弹防御系统。 \n\n这份没有终止日期的协议也规定，非北约成员国永不可在格陵兰岛设立有人或无人操控的军事设施。协议各方也将在岛上合作防范敌国的间谍活动。\n\n格陵兰总理尼尔森在协议签署仪式上说，格陵兰人认同特朗普所谈及的长期安全威胁，北约对北极地区的安全扮演关键角色，在那里保持强大的实力至关重要。 \n\n \n\n美国总统特朗普（左）、丹麦首相弗雷德里克森（中）和格陵兰岛自治政府总理尼尔森，周二在联合国大会场边签署格陵兰岛安全三方协议。（路透社）\n\n北约秘书长吕特则说，协议提升北极地区的共同安全，支持各方构建一个更安全和稳定的未来。 \n\n新协议与特朗普试图通过收购将格陵兰岛吞并的最初计划虽相去甚远，但仍是美国自冷战结束后首次在岛上显著扩充军事基础设施。冷战时期，美军一度在岛上维持17处设施，派驻一万多人。\n\n新报业媒体总机 \n\n63196319\n\n订阅热线 \n\n63883838\n\n早报广告联系 \n\n63196319\n\n新闻热线\n\n1800-7416388 或 92288736",
  "deep": "## AI 解读\n\n核心要点提炼\n\n特朗普借联大首秀为美伊战争定性，将其包装为“为国际社会铲除核威胁”的正当行动，同时释放“中期选举后或达成协议”的和解信号——实质是把战争进程与国内政治周期挂钩，以选举为谈判筹码。演讲同时服务于国内造势，经济、科技、AI等议题均指向中期选举叙事。场边签署格陵兰安全协议，则是以“防御”名义实现冷战后在北极最显著的军事扩张，对冲伊朗战事带来的战略透支质疑。\n\n影响分析\n\n其一，美伊冲突进入“边打边谈”的模糊阶段，市场与盟友将被迫在“战争升级”与“选举后和解”之间反复定价，不确定性延长。其二，将战争与选举绑定，意味着中东局势可能被美国内政节奏牵引，伊朗方面大概率采取“拖到选举后”的观望策略。其三，格陵兰协议以“非北约成员不得设军事设施”排他，实质强化美国对北极航道与导弹防御的垄断，可能刺激俄罗斯反制，北极从低张力区转向博弈前沿。整体看，特朗普以联大为国内政治与地缘扩张的双重舞台，短期战术收益明显，但战略透支风险正在累积。",
  "no": 73
 },

  "lede": "美联储加息靴子落地 私募机构谋划A股“新打法”\n\n 2026年09月23日 07:10 中国证券报\n\n 上周四，备受全球市场瞩目的美联储9月加息靴子落地。此后几个交易日，A股市场震荡上行，科技主线与非科技资产同步回升，此前偏防御的红利板块则出现短期回调。这一市场表现背后，折射出投资者对政策不确定性的消化方式正在发生变化。围绕美联储加息之后的A股大势、仓位结构调整以及策略应对要点，上周以来，中国证券报记者调研采访了多家主观私募机构。受访私募机构普遍认为，此次加息更偏向“预防式”或“确认型”调整，而非新一轮持续紧缩周期的起点。但“一次性”与否并非关键，真正影响年底前投资战绩的，是私募在仓位、结构与交易模式上展开的一轮“新打法”。\n\n ● 本报记者 王辉\n\n “预防式调整”渐成共识\n\n “更接近预防式、确认型加息，而非新一轮持续紧缩周期的起点。”谈及上周美联储时隔3年后的再次加息，景领投资总经理邹炜的判断颇具代表性。他分析，美联储的会议前市场已定价90%以上加息概率，且已计入2至3次加息预期。加息落地后反而形成“利空出尽”，这正是美股和A股不跌反涨、科技风格领涨的根本原因——交易逻辑从“担忧政策转向”切换为“确认政策落地”。\n\n 明泽投资创始人马科伟也持类似看法。他认为，本次美联储加息以及年底潜在的一次加息，预计仍属一次性预防式调整。近期油价上涨带来输入性通胀压力，美联储加息旨在重塑抗通胀公信力。但高利率已对传统投资形成抑制，且加息本身无法解决供给端导致的油价上涨问题，因此缺乏连续、快速加息的基础。\n\n 不过，也有私募人士提醒，不宜简单将此次加息理解为“一次性”动作。把脉投资研究经理吴秉烨倾向于定性为“鹰派的预防式调整”，并非新一轮紧缩起点，但也并不是“一次性加息”。他表示，美联储把本次行动定义为“撤除部分宽松”，明年基调转中性；后续节奏仍取决于油价与通胀，焦点已从是否加息转向还要加多少、高位的利率水平将持续多久。资瑞兴投资研究总监邢奕才表示，2027年底的利率中位水平与2026年底持平，隐含的其实是美联储明年可能不再加息；长期中性利率也仅上调至3.25%，“这更像是纠偏加延长高位平台期，而非重启一条系统性的紧缩通道”。\n\n 对于年底前的A股大势，受访私募的研判整体趋同：震荡上行、结构分化、风格再平衡。邹炜用“谨慎乐观，结构继续分化，科技为主”概括。马科伟积极看好A股在筑底整固后的结构性反弹行情，但认为行情高度受制于国内基本面修复斜率与海外长端利率波动。吴秉烨的判断是“震荡上行、结构分化，难现全面普涨”。邢奕才则认为，系统性下行的触发条件并不充分，但全面性行情的条件同样尚不成熟。\n\n 多家受访私募机构认为，短中期A股的上行驱动因素主要来自国内：AI产业景气趋势未证伪，海外产业资本开支扩张有向企业端蔓延趋势；三季报进入业绩验证期，科技主线业绩逐步兑现；国内流动性维持宽松，居民储蓄向权益资产迁移仍在延续等。\n\n 仓位结构“新腾挪”\n\n 在仓位与行业结构上，近期受访私募的操作方向并不一致，但“不大幅降仓、重点调结构”成为操作共性。\n\n 邹炜表示，目前该机构维持中性偏积极的仓位，适度加仓的方向以科技为主，重点聚焦AI基础设施兑现方向——如光模块、PCB、半导体、算力、存储等有业绩支撑的环节。同时由于目前临近国庆假期，考虑到海外市场波动风险，也将保留部分现金和红利、固收仓位。\n\n 马科伟则透露，近期该机构整体仓位变化不大，主要是针对持仓结构做一定调整，幅度有限。操作上，针对科技方向中已有一定获利的标的，逢涨会进行一定止盈，但持续看好芯片国产产业链。“在内外部环境未发生重大变化之前，组合结构不会进行大的调整，只会在既有框架内做一定的低吸高抛。”马科伟称。\n\n 吴秉烨告诉中国证券报记者，上周以来其所在机构股票仓位保持中高水平、未大幅降仓，主要在“调结构”。其中，科技成长主线中的内需驱动方向以及非银金融板块仓位较重、相对超配。\n\n 邢奕才称，其再平衡操作主要体现在三个方向：一是控制主要由预期定价的方向敞口，对涨幅较大、定价主要依赖远期预期、交易拥挤度已处高位的产业环节和标的，相应降低敞口，把定价权交还给业绩；二是提升底仓组合的现金流可验证性，增配了煤炭等供给约束型品种，目的是提升组合的防御性与现金流的可验证程度，而不是押注价格弹性；三是向订单能见度更高的方向倾斜，适度提升了顺周期与出海链条的比重，例如电网设备、储能等受益于海外补库需求的方向。\n\n 在近期的最新一轮调仓中，上海某中型主观股票私募基金经理周明（化名）的案例颇具代表性。他所管理的机构规模约30亿元，客户以高净值个人与机构委外为主。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 加息定性：私募主流判断为“预防式/确认型”调整，而非新一轮紧缩周期起点。市场已提前定价，落地即“利空出尽”，故A股、美股不跌反涨，科技风格领涨。\n2. 分歧点：部分机构提示不宜简化为“一次性加息”，后续节奏取决于油价与通胀，焦点已转向“加多少、高位利率持续多久”。\n3. 大势研判：年底前A股共识为“震荡上行、结构分化、风格再平衡”，难现全面普涨；上行驱动主要来自国内——AI景气延续、三季报兑现、流动性宽松、储蓄迁移。\n4. 操作共性：不大幅降仓，重点调结构。科技内部向业绩可验证环节（光模块、PCB、半导体、算力）集中；同时增配现金流可验证的防御品种（煤炭）及订单能见度高的出海链（电网、储能）。\n\n影响分析\n\n此次加息对A股的边际冲击显著弱化，反映投资者对政策不确定性的消化方式已从“博弈转向”切换为“确认落地”。私募的“新打法”本质是从预期定价转向业绩定价：一方面控制远期预期敞口、锁定科技获利，另一方面以现金流和订单能见度重构底仓。这意味着年底前市场风格或更趋均衡，纯题材炒作空间收窄，而有业绩支撑的科技细分与供给约束型资产将获资金青睐。对普通投资者而言，需警惕高拥挤度板块的回调风险，关注结构性机会而非指数级行情。",

  "title": "特朗普突传重大消息！美伊密谈3小时、油价五连跌，纳指再创历史新高提供者FX168",
  "src": "Exa 搜索",
  "lede": "市场焦点\n\n摘要：特朗普透露美伊代表举行约3小时会谈，缓和预期推动国际油价连续第五日下跌，布伦特原油失守100美元。与此同时，纳指再创历史收盘新高，但10年期美债收益率仍逼近5%，高利率压力与科技股强势形成鲜明反差。市场接下来还将聚焦中美元首会晤及特朗普政府可能出台的柴油出口限制措施。\n\n截至周二收盘，纳斯达克综合指数上涨0.45%，报27,244.28点，再创历史收盘新高；标普500指数微跌，报7,764.64点；道琼斯工业平均指数下跌185.14点，跌幅0.36%，报51,863.69点。\n\n \n\n科技股依旧是当天最强势的板块之一，SanDisk股价大涨近7%，此前Rosenblatt发布看多观点，进一步提振人工智能、存储和半导体相关交易情绪。周二的走势延续了前一交易日的强劲表现，此前标普500录得8月4日以来最佳单日涨幅，而纳指则创下6月以来首个历史收盘纪录。\n\n \n\n（图源：CNBC）\n\n不过，三大指数之间的明显分化也表明，投资者并未全面转向风险偏好，而是继续集中押注科技和人工智能相关资产。高利率、中东局势、能源价格以及美国财政压力仍然限制着更广泛市场的表现。尤其是在10年期美债收益率仍徘徊于5%附近的背景下，高估值成长股能够继续刷新纪录，本身就凸显当前市场在宏观压力与科技行情之间的巨大张力。\n\n特朗普：美伊刚举行3小时会谈\n\n周二市场最受关注的消息来自美伊关系。特朗普表示，美国官员当天与伊朗代表举行了一场约3小时的会谈，并称此次接触“非常好”。这一表态令市场重新评估美伊双方通过外交途径缓和冲突的可能性。#伊朗危机追踪#\n\n当天早些时候，特朗普在联合国大会讲话中表示，他在伊朗问题上面临一个“重大决定”，即继续推动协议，还是采取更强硬行动。他同时表示，相信双方最终可能在美国中期选举之后达成协议。随后传出的3小时会谈消息，使市场对局势缓和的预期进一步升温。尽管目前尚不清楚会谈取得了多少实质性进展，但只要双方继续保持接触，就可能降低市场对冲突进一步升级的即时担忧。\n\n美伊关系之所以对全球市场影响巨大，是因为霍尔木兹海峡仍是当前能源市场最关键的风险点之一。此前有消息称，如果美国缓解军事压力并解除对伊朗港口的封锁，伊朗可能在7天内重新开放霍尔木兹海峡。与此同时，沙特阿拉伯也在推进恢复东西输油管道，以增加通过红海出口原油的能力。若上述供应通道逐步恢复，中东原油供应紧张程度可能明显下降。\n\n油价五连跌，布伦特失守100美元\n\n受美伊会谈和霍尔木兹海峡可能重新开放等消息影响，国际油价周二继续走低。布伦特原油期货下跌1.09%，结算价报每桶99.25美元；美国WTI原油期货下跌1.24%，结算价报94.59美元。两大基准油价均连续第五个交易日下跌。\n\n \n\n油价回落对全球市场具有重要意义，因为自美伊冲突升级以来，能源价格上涨一直是推动通胀预期和债券收益率走高的重要因素之一。如果霍尔木兹海峡重新开放、沙特替代输油线路恢复运行，原油供应风险溢价可能继续下降，从而减轻市场对能源通胀持续失控的担忧。这也是过去几个交易日美股能够重新走强的重要背景之一。\n\n但油价下降并不意味着能源风险已经完全消除。全球柴油和成品油市场仍然偏紧，美国国内柴油价格也持续处于高位。在这种背景下，特朗普政府正在研究是否采取新的干预措施。\n\n特朗普考虑限制柴油出口\n\n美国财政部长贝森特周二表示，特朗普政府正在评估限制柴油出口是否可行，包括研究全面禁令和部分限制两种方案。特朗普本人也表示，希望尽快就这一问题作出决定，并称自己已经要求团队研究是否有必要减少美国柴油出口。\n\n美国柴油价格居高不下，已经开始影响运输、农业、建筑和物流等行业。限制出口理论上可以增加美国国内供应，从而缓解价格压力，但这一政策也可能带来复杂的连锁反应。欧洲等市场对美国柴油出口依赖较高，如果美国突然减少出口，全球成品油价格可能进一步失衡，也可能影响美国炼油企业的生产安排和利润结构。因此，贝森特强调，政府目前仍在评估其实际可行性。\n\n这也凸显出当前能源市场的矛盾。一方面，原油价格因为地缘政治风险缓和而下跌；另一方面，成品油市场仍然受到供应瓶颈和炼油能力限制。对于美联储而言，真正决定通胀压力是否缓和的，并不仅仅是原油价格本身，还包括柴油、汽油以及运输成本是否同步下降。\n\n美债收益率仍逼近5%\n\n虽然油价连续下跌缓解了部分通胀担忧，但债券市场的压力并未真正消失。周二，美国10年期国债收益率回落至4.959%左右，仍距离5%这一重要心理关口仅一步之遥。\n\n \n\n（图源：CNBC）\n\n美联储上周刚刚加息25个基点，将联邦基金利率目标区间提高至3.75%-4.00%。在此之后，多位美联储官员继续释放偏鹰信号，市场也在重新评估未来数月进一步加息的可能性。高油价、美国债务规模上升以及通胀黏性，都使长期美债收益率保持在高位。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 地缘缓和交易主导油价：特朗普披露美伊举行约3小时会谈，市场迅速定价霍尔木兹海峡重开风险，布伦特失守100美元、油价五连跌，能源通胀溢价阶段性回落。\n2. 科技股与宏观压力极致背离：纳指再创历史新高，但10年期美债收益率仍逼近5%，道指下跌、标普微跌，三大指数分化显示资金并非全面risk-on，而是集中押注AI与半导体。\n3. 政策变量密集：中美元首会晤、美国拟限制柴油出口、美联储鹰派信号叠加，构成下一阶段定价核心。\n\n影响分析\n\n油价回落短期缓解通胀预期，是美股重新走强的关键背景，但柴油与成品油市场仍紧，限制出口若落地将扰动全球成品油贸易并反噬炼油利润，能源风险并未出清。真正决定通胀路径的是柴油、运输成本能否同步回落，而非原油单一价格。美债收益率逼近5%意味着高估值成长股面临持续贴现压力，纳指新高更多是AI叙事与资金集中度的产物，而非宏观全面转好。若美伊接触缺乏实质进展，或会晤与出口政策超预期，风险溢价可能快速回补。当前市场处于\"地缘缓和预期\"与\"高利率现实\"的脆弱平衡，波动率被低估。",

  "lede": "隔夜美股 | 纳指四连涨 闪迪(SNDK.US)涨6.8% 美、布两油走低-财经-金融界\n\n隔夜美股 | 纳指四连涨 闪迪(SNDK.US)涨6.8% 美、布两油走低\n\n智通财经获悉，周二，三大指数涨跌不一，纳指创盘中历史新高。媒体称，如果美国采取行动缓解军事压力，伊朗可能会在 7 天内重新开放霍尔木兹海峡，受此消息周二油价下跌。\n\n【美股】截至收盘，道琼斯指数跌185.03点，跌幅0.36%，报51863.80点；标普500指数涨0.14点，涨幅0.00%，报7764.84点；纳斯达克综合指数涨122.18点，涨幅0.45%，报27244.28点。美光科技(MU.US)涨5%，SK海力士(SKHY.US)涨超3%，闪迪(SNDK.US)涨6.8%，思科(CSCO.US)跌超4%。纳斯达克中国金龙指数涨0.32%，阿里巴巴(BABA.US)涨0.45%。\n\n【欧股】德国DAX30指数涨14.08点，涨幅0.06%，报25587.74点；英国富时100指数跌29.86点，跌幅0.28%，报10709.15点；法国CAC40指数涨15.97点，涨幅0.20%，报8154.91点；欧洲斯托克50指数涨6.85点，涨幅0.11%，报6325.05点；西班牙IBEX35指数涨27.94点，涨幅0.14%，报19752.34点；意大利富时MIB指数跌270.04点，跌幅0.52%，报52101.50点。\n\n【亚洲股市】日经225指数涨1.38%，韩国综合指数涨0.15%，印度孟买30指数跌0.44%\n\n【美元指数】衡量美元对六种主要货币的美元指数当天上涨0.17%，在汇市尾市收于100.603。截至纽约汇市尾市，1欧元兑换1.1442美元，低于前一交易日的1.1465美元；1英镑兑换1.3335美元，低于前一交易日的1.3369美元。1美元兑换157.50日元，高于前一交易日的157.45日元；1美元兑换0.8212瑞士法郎，低于前一交易日的0.8213瑞士法郎；1美元兑换1.4068加元，高于前一交易日的1.4039加元；1美元兑换9.8487瑞典克朗，高于前一交易日的9.8398瑞典克朗。\n\n【加密货币】比特币徘徊在8.6万美元附近，截至发稿报86130；以太坊跌超1.2%报2744美元。\n\n【原油】纽约商品交易所10月交货的轻质原油期货价格下跌1.19美元，收于每桶94.59美元，跌幅为1.24%；11月交货的伦敦布伦特原油期货价格下跌1.09美元，收于每桶99.25美元，跌幅为1.09%。\n\n【贵金属】现货黄金报4358.6美元/盎司；现货白银报67.21美元/盎司。\n\n【宏观消息】\n\n纽约联储官员：货币政策工具箱运作良好 国库券购买视市场需要而定。纽约联储系统公开市场账户经理佩尔利表示，美联储的货币政策控制工具箱继续非常有效。“我们保持了非常强的利率控制，将准备金维持在充足区间，我们的国库券购买也顺利运行，”佩尔利称。他还表示，美联储近期向金融体系增加流动性的行动（目前处于暂停状态）并非预设路径，暗示如果美联储认为需要提振市场流动性，可能会再次购买国库券。他还表示，所谓的准备金管理购买（RMP）国库券将根据市场流动性需求进行调整。\n\nAnthropic在IPO前推出更经济实惠的Opus 5.5模型。 Anthropic正在推出一款新型人工智能模型，旨在以更低的成本应对多种商业任务，这是该公司为在备受期待的华尔街上市前保持竞争优势而采取的举措之一。公司周二发布了Claude Opus 5.5模型，据称该模型在大多数工作场景下性能与Anthropic更强大的Fable 5.1相当，但使用成本远低于此前的Opus 5版本。Anthropic表示，新模型的输出速度也比Opus 5 更快，并且被发现生成的内容更加清晰。这家AI开发公司计划在未来几周内，继续扩展其5.5系列模型，推出Claude Sonnet和Haiku的新版本。\n\n美联储巴尔金：通胀压力需要时间才能消退。美联储巴尔金警告称，通胀冲击可能需要一段时间才能缓解，且存在通胀压力居高不下并根深蒂固的风险。巴尔金表示，美联储上周加息有助于放缓通胀，但他并未明确表示是否需要进一步收紧政策。相反，这位美联储官员强调，供给冲击已不再只是偶发或暂时性的现象，而是持续影响整个经济体的价格压力。“这些情况或许会随着时间推移而消退，但我预计这仍需一些时间，”巴尔金表示，“在此期间，当前通胀水平居高不下，可能会对未来的通胀产生影响。”巴尔金指出，“接下来我们该怎么做？我们致力于将通胀率可持续地降至2%的目标水平。上周的加息将对此有所帮助，是否需要进一步加息，以及需要加息几次？我们拭目以待。",
  "deep": "## AI 解读\n\n# 隔夜美股深度解读\n\n核心要点\n\n1. 指数分化，科技独秀：纳指涨0.45%创盘中历史新高，实现四连涨；道指跌0.36%，标普基本收平。资金持续向科技/半导体集中——存储芯片板块领涨，闪迪涨6.8%、美光涨5%、SK海力士涨超3%，而思科跌超4%，呈现明显的\"AI算力受益者 vs 传统硬件\"分化。\n2. 地缘溢价快速回吐：市场消息称若美方缓解军事压力，伊朗或7天内重开霍尔木兹海峡，油价应声下跌，美油跌1.24%至94.59美元、布油跌1.09%至99.25美元。地缘风险定价出现松动。\n3. 宏观信号偏谨慎：美元指数涨0.17%至100.6上方；美联储官员巴尔金强调通胀压力\"根深蒂固、需时间消退\"，未排除进一步加息；纽约联储则称流动性工具运作良好、国库券购买视需要而定。比特币徘徊8.6万美元，以太坊跌超1.2%。\n\n影响分析\n\n科技股与能源股的分化逻辑清晰：AI算力需求驱动存储芯片持续走强，而油价回落则压制能源板块，二者共同解释了指数层面的涨跌不一。对市场而言，霍尔木兹海峡若实质重开，将显著缓解全球能源供给担忧，压低通胀预期，这对风险资产是利好，但也削弱了能源股的盈利弹性。\n\n更值得警惕的是巴尔金的表态——供给冲击\"常态化\"意味着美联储降息路径可能比市场预期更慢，美元走强与美债利率的潜在上行将压制估值扩张。短期看，纳指创新高由科技盈利叙事支撑，但若通胀黏性确认、加息预期重燃，高位科技股的回调风险不容忽视。建议关注油价与美联储措辞的边际变化，作为判断风险偏好能否延续的关键变量。",

  "src": "Exa 搜索",
  "lede": "美联储科林斯表态“更强约束性”：加速通胀回归2%目标\n\n9月22日周二，美元指数维持在100左右震荡，目前报价约100.5。9月16日，美国联邦公开市场委员会以全票赞成的方式，将联邦基金利率目标区间上调25个基点，至3.75%至4.00%，同时将准备金余额利率调整至3.90%，有效联邦基金利率约为3.88%。这是2023年首次实施加息措施。声明中指出，经济活动正以稳健步伐增长，就业增长与劳动力供给基本平衡，失业率保持稳定，但通胀水平依然偏高。波士顿联储主席苏珊·科林斯今日在讲话中将政策关注点从就业市场是否疲软，转向了通胀能否更快回归2%的目标。对利率和外汇市场而言，这次讲话的关键在于风险评估重点的转移。 \n\n## 就业形势改善后，双重目标的优先级重新划分\n\n 科林斯的讲话非常明确：当前劳动力市场已趋于稳定，货币政策的重心应转向尽快实现价格稳定目标，尤其是在通胀连续五年高于目标水平之后。数据显示，8月失业率保持在4.1%，非农就业人数增加16.2万。对美联储而言，就业市场已不再构成立即放松政策的压力，而物价水平的偏离则显得更为突出。 她同时指出，通胀上行风险有所上升，劳动市场表现略显强劲。这种组合改变了风险平衡：就业恶化的可能性下降，而通胀长期高于2%的情景概率上升。她本人支持上周的加息决定，并认为适度提升联邦基金利率有助于通胀更持久地向目标靠拢。不过，科林斯今年不具备投票权，要到2028年才重新获得投票资格。她的发言虽不代表官方决议，但揭示了地区联储主席对9月决议的解读思路：就业数据提供了加息空间，而通胀数据则构成了加息的依据。 \n\n## 连续五年偏离目标后，观望窗口正在收窄\n\n 根据美联储关注的PCE物价指数，7月同比上涨3.7%，核心PCE同比上涨3.3%，与6月持平。CPI 8月同比上涨3.4%，环比增长0.4%；剔除食品和能源的核心CPI同比涨幅为2.4%。能源分项同比上涨16.3%，推动整体通胀上行。核心回落并不意味着整体通胀任务完成，因为能源冲击仍在持续影响家庭和企业的成本结构。 科林斯表示，目前尚未看到预期中的通胀回落迹象。地缘政治因素可能继续从能源端施加压力，未来通胀显著高于2%并长期维持高位的可能性正在上升。对市场而言，这意味着供给冲击已不再是可以无限期观察的变量。9月的经济预测摘要显示，在18位参与者中，有16位认为到2026年至少还需再加息一次25个基点，年底利率中值大致落在4.00%至4.25%之间。声明删除了此前将通胀偏高归因于供给冲击的表述，措辞更直接地指出通胀本身仍处于高位，政策目标是加快其回归2%的进程。 \n\n## 官方预期与市场路径并不完全一致\n\n 市场对10月27日至28日美联储会议的预期大致分为加息与按兵不动两种可能，部分合约显示加息概率略高于50%。部分利率曲线还隐含了此后多次加息的预期，节奏接近每两次会议加息一次。相比之下，官方预期更倾向于年内再加息一次，明年维持利率稳定。科林斯也提到了明年利率保持不变的基本情景。 分歧源于两种不同的概率框架。美联储提供的是条件路径：若通胀改善不足，将继续或加强紧缩政策。而市场则基于当前就业改善、能源冲击和会后措辞进行一次性定价。10月会议后将公布8月PCE数据，12月会议前还将公布更多通胀和就业数据。市场定价将随着这些新信息而波动，而非由单一讲话决定。所谓“适度更强约束性”并未明确界定中性利率水平。它仅表明，部分委员将3.75%至4.00%视为在原有适度紧缩基础上进一步收紧一档，目的是加快通胀回归目标，而不是宣布一个完整的加息周期已经排定。 \n\n## 美元指数当前走势结构\n\n 从日线图来看，布林带中轨位于约99.38，上轨约在100.48，下轨约98.28。当前指数运行在100.5附近，接近上轨区域；9月上旬曾触及98.59的低位。MACD指标显示DIFF约为0.17，DEA约为-0.02，柱状图为正值。 欧元兑美元当前汇率约在1.146，美元兑日元约在157。由于欧元和日元在美元指数中权重最大，当利率预期上升时，美元指数通常同步走强；而一旦通胀数据回落或就业数据转弱，该走势也可能出现反转。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 政策重心转移：波士顿联储主席科林斯明确将风险评估从“就业疲软”转向“通胀黏性”，标志美联储双重目标优先级重新排序——就业已趋稳，控通胀成为更紧迫任务。\n2. 数据支撑逻辑：失业率4.1%、非农增16.2万，就业不再构成宽松压力；而核心PCE 3.3%、整体PCE 3.7%，连续五年偏离2%目标，且能源分项同比涨16.3%持续施压。\n3. 预期分歧显著：官方点阵图倾向年内再加息一次后维稳，市场则定价10月加息概率略超50%且隐含多次加息路径，两者节奏不一致。\n4. 措辞微妙变化：声明删除“供给冲击”归因表述，直接承认通胀高位，暗示政策耐心窗口正在收窄。\n\n影响分析\n\n科林斯虽无今年投票权，但其表态揭示地区联储对9月决议的解读框架：就业数据提供加息空间，通胀数据构成加息依据。这一逻辑若成为共识，意味着美联储对供给端冲击的容忍度下降，利率将在更长时间维持限制性水平。\n\n对市场而言，美元指数逼近布林带上轨（100.48），利率预期上行构成短期支撑；但若后续PCE或就业数据走弱，反转风险同样存在。欧元、日元因权重最大，将直接承受美元波动传导。更关键的是，官方“条件路径”与市场“一次性定价”之间的分歧，将使10月会议前的资产价格对每一份通胀和就业数据高度敏感——波动率上升，而非趋势性单边行情，是当前最确定的交易环境特征。",

  "lede": "一、短期市场先防范好冲击：特朗普对等关税极限施压后，市场可能要先出清基本面回落的担忧。全球衰退交易可能快速扩散，25Q2“债强股弱”的资产配置组合本就是基准判断，短期可能集中加速演绎。市场调整时间/空间先达标，之后就可以考虑后续变化对市场的影响了。\n\n特朗普对等关税严厉程度全面超出市场预期，未来诸多变数客观存在，但对于中短期也有一些确定性较高的判断：1． 关税的基本面影响是源自美国的衰退交易可能快速扩散。2．国内政策对冲势在必行，但政策力度的上限是对冲外需回落的影响，中短期市场对国内政策的期待更高，要求也更高。3． 2025 年A 股总体盈利能力改善，需要以需求向上有弹性为前提（背后是供给增速回落，但绝对水平仍偏高），严厉关税影响下，A 股盈利能力向上拐点大概率推后至2026 年。4． 长期积极因素客观存在：中国外循环的构建加速，经济结构转型加速，科技突破为大国博弈增添筹码等。但现阶段，长期积极因素的短期积极信号尚需积累。短期的主要矛盾可能就是基本面回落压力。\n\n二、特朗普对等关税落地后，本周四市场的第一反应是行情有韧性，多个时间维度上的潜在变化（关税调整缓和，国内政策对冲，中国外循环优化等）均有反映。本周五海外继续大幅调整，投资者才转向悲观。在我们看来，市场的第一反应可能是方向正确的，只是时机稍早。美国政策分歧客观存在，特朗普政府掣肘势必增加。关税极限施压，后续应有所求，美国版化债可能才是核心目的。对于中国而言，惊涛骇浪下的战略机遇期正徐徐展开。\n\n特朗普极限施压，能否达成战术和战略目标？可能的阻碍因素包括：1． 美国经济滞胀压力显著提升，特朗普政策实施面临重重阻力。2． 美国通过极限施压获取谈判筹码，但其他国家的反击可能带来高关税的骑虎难下，美国与各国的博弈势必是反复拉锯的。谈判进程反倒被拖延，不利于战术目标达成。3． 美国单边主义导向会加速其他非美经济合作进程。4． 美国关税加征，会引发微观企业通过各种方式应对，美国关税既是手段也是目标，但实现战术目标的难度都不低。关税极限施压，后续应有所求，美国版化债可能才是核心目的。但如果目标达成不顺利，特朗普政府时不我待，我们可能才是相对从容的一方。\n\n市场反映关税冲击后，后续将迎来一个边际改善更多的窗口：特朗普掣肘增加，关税调整缓和，国内政策对冲，中国外循环优化等。本周四市场的第一反应是行情有韧性，多个时间维度上的潜在变化（关税调整缓和，国内政策对冲，中国外循环优化等）均有反映。本周五海外继续大幅调整，投资者才转向悲观。在我们看来，市场的第一反应可能是方向正确的，只是时机稍早。若短期市场加速出清，我们认为市场可能迎来一个重要的中周期低点。\n\n三、A 股重拾强势的三个触发因素：1． 特朗普政策掣肘显现，外资可能继续流入A 股定价中国资产重估。2． 一带一路国家的城镇化支持外需，国内政策发力 + 经济转型，消费对内需的支持增强，落实到中微观数据改善上。3． 科技产业趋势的进一步突破。\n\n四、短期防御思维继续占优。看好高股息相对收益，反击资产（农产品）和对冲资产（房地产、建筑装饰、消费刺激）现阶段占优。关税冲击对科技产业逻辑的影响有限，维持2025年科技结构牛判断，新一轮行情启动等待关键产业催化落地。继续推荐：国内AI 算力和应用、具身智能、低空经济。\n\n风险提示：海外经济衰退超预期，国内经济复苏不及预期\n\n### 网友看法\n\n1、网友民间评论：周一的A股和港股将彻底改变清明期间那些期待中国股票市场能够逆势上涨的人的幻想。管住自己的手不要盲目买入股票，更不要借钱加杠杆买入股票！A股的底部远远没有出现。\n\n2、网友春风化雨：明天补跌是大概率的事，关键是跌幅多少？希望能小幅震荡。\n\n3、网友远离大a：看到券商用这些词忽悠散户接盘，跑就是了\n\n### 联系我们\n\n在线咨询：\n\n微信号：79111873\n\n工作日：9:30-18:30，节假日休息",
  "deep": "## AI 解读\n\n# 核心要点提炼\n\n短期承压，中期筑底，长期重估。 报告核心逻辑可拆解为三层：\n\n1. 短期出清：特朗普对等关税全面超预期，全球衰退交易加速演绎，“债强股弱”格局短期集中兑现，A股需先完成基本面回落的定价出清。\n2. 中期边际改善：关税落地后，特朗普面临滞胀掣肘、多国反制、谈判拖延等阻力，极限施压的战术目标实现难度高；国内政策对冲势在必行，外循环重构加速，市场将迎来边际改善窗口。\n3. 三大触发因素：外资回流定价中国资产重估、内需政策与一带一路城镇化形成合力、科技产业趋势突破。\n\n# 影响分析\n\n对市场节奏的判断：报告认为本周四A股的韧性反应“方向正确但时机稍早”，若短期加速出清，反而可能形成中周期低点。这意味着当前调整是布局窗口而非离场信号——但需等待出清完成。\n\n结构上，短期防御占优（高股息、农产品、地产链），科技主线逻辑未被关税破坏，2025年科技结构牛判断维持，等待产业催化。\n\n关键张力在于：长期积极因素（外循环、转型、科技）客观存在，但短期积极信号尚需积累，主要矛盾仍是基本面回落压力。网友的悲观情绪与券商的“从容”判断形成鲜明反差——市场分歧的本质，是对“出清速度”与“政策力度”的定价差异。若政策对冲不及预期，短期低点可能后移。",

  "title": "比特币突破，纳斯达克创纪录，油价因伊朗希望下跌_新闻_百亿财经",

  "lede": "### 比特币突破86,500美元大关，加密市场总市值重回3万亿美元上方\n\n周二，比特币价格强势突破86,500美元关口，稳稳站稳在9月份大部分时间压制其反弹走势的阻力位之上。这一涨势推动加密货币市场总市值重新站上3万亿美元大关。与此同时，“恐惧与贪婪指数”读数为79，明确处于“贪婪”区间；而山寨币季节指数为49，表明尽管山寨币开始活跃，但比特币仍占据主导地位。\n\n此次突破与华尔街更广泛的“风险偏好回升”情绪相呼应。纳斯达克综合指数周一创下历史新高，单日上涨2.26%，录得自6月以来的最佳表现。人工智能相关概念股大幅走高——英特尔股价飙升12%，AMD涨幅约10%并突破1万亿美元市值门槛。芯片制造商的涨势延续至周二，形成了自4月以来最长的连胜纪录。\n\n周二的交易时段相对平静。纳斯达克指数今日上涨0.4%，触及盘中新高；标准普尔500指数则几乎未动。石油市场承担了主要的波动压力。\n\n据报道，若华盛顿方面减轻施压，伊朗承诺将在数日内重新开放霍尔木兹海峡。受此消息影响，布伦特原油短暂跌破每桶98美元，WTI原油跌至93美元以下，均为9月8日以来的最低水平。此前，唐纳德·特朗普总统在联合国大会上表示，他预计在美国11月中期选举后将与伊朗达成协议；与此同时，沙特阿拉伯正努力在本周末前重启东西输油管道。\n\n9月16日，美联储以12比0的全票一致通过加息25个基点，将基准利率上调至3.75%-4.00%区间，这是自2023年以来的首次加息。通胀数据过热迫使这一举措出台：8月生产者价格指数（PPI）同比加速至5.4%，其中汽油价格推动了当月消费者价格指数（CPI）涨幅的三分之一。\n\n然而，即使在加息的同时，美联储并未停止向市场注入流动性。它于2025年12月恢复了短期国债的常规购买操作，并持续进行此项操作，以保持银行储备金“充裕”。这是一项独立于利率政策的技术性操作。这些购买行为吸收了国债供给，并将现金流向风险资产买家，在一定程度上抵消了加息带来的紧缩效应。这是一种罕见的组合：利率更高，但美联储资产负债表不再从系统中抽离流动性。\n\n目前，美联储持有的债券规模接近6.7万亿美元，虽远低于2022年9万亿美元的峰值，但已不再收缩。\n\n从技术图表来看，比特币的日线形态支撑了这一轮上涨行情。价格已突破79,673美元至84,144美元的区间，目前正在测试通往约90,000美元的技术轨迹。\n\n此刻，比特币再次形成“黄金交叉”形态——当过去50天的平均价格穿越至上方的过去200天平均价格之上时即形成该形态，这是交易者广泛认可的看涨信号。如果多头能够继续保持控制力，根据斐波那契扩展线所标识的自然阻力位和支撑位，下一个目标价位分别为90,763美元和95,074美元。若在回调中无法守住79,673美元区间，则可能打开重返75,436美元乃至73,617美元的路径，后者是夏季期间最后被防守的支撑区域。\n\n预测市场的 sentiments 也朝着预期的方向发展。在由Decrypt母公司Dastan开发的预测市场Myriad上，交易者给比特币本月触及90,000美元的概率定价为48%，而达到92,500美元的概率则为25%。\n\n山寨币也迎来了买盘。XRP攀升至1.57美元，Solana一周内涨幅达18.2%，Zcash延续了长达数月的上涨趋势，报1,551美元，七日内涨幅高达36.7%。在前100大币种中，有97个币种在过去七天内录得正收益。\n\n美联储下一次政策会议将于10月27日至28日举行。届时，市场将得知9月份的加息是对油价冲击的一次性回应，还是今年计划多次加息中的第一次。美联储的中位数预测显示，到2026年底，联邦基金利率将达到4.1%。",
  "deep": "## AI 解读\n\n# 比特币突破与风险偏好回归：一场流动性驱动的资产重估\n\n核心要点\n\n1. 比特币突破86,500美元，站稳9月阻力位，加密总市值重回3万亿美元，“恐惧与贪婪指数”达79（贪婪区间），技术面形成“黄金交叉”，下一目标位90,763与95,074美元。\n2. 纳斯达克创历史新高，AI芯片股领涨（英特尔+12%、AMD突破万亿市值），风险偏好全面回升。\n3. 油价承压下行，伊朗承诺数日内重开霍尔木兹海峡，布伦特跌破98美元，WTI跌破93美元。\n4. 宏观矛盾信号：美联储9月全票加息25bp至3.75%-4.00%，但同步恢复短期国债购买，资产负债表不再收缩，形成“加息+注流动性”的罕见组合。\n\n影响分析\n\n本轮资产普涨的本质是流动性预期与风险偏好的共振。美联储虽加息抗通胀，但技术性购债操作实质上向市场注入流动性，削弱了紧缩效应，为风险资产提供了底部支撑。比特币突破关键阻力后，技术面与情绪面形成正反馈，山寨币跟涨（前100币种97个七日正收益）显示资金外溢。然而，油价回落若持续，将缓解通胀压力，可能改变美联储后续加息路径——10月27-28日会议是关键验证节点。当前需警惕：贪婪指数高企叠加加息周期未止，若通胀数据反复，风险资产估值将面临重定价压力。",

  "lede": "Rayllon Miranda da Silva/Cristian Wariu/VansBumbeers \n\n## 身处气候危机中的巴西土著青年：“被看见、被听到”就是“抵抗力” \n\n2026年8月8日 \n\n随着气候变化正在重塑巴西各地的土著人的领地，新一代正步入公众视野。\n\n 联合国 \n\n## 【世界进行时】2026年8月7日 \n\n2026年8月7日 \n\n本期要点：儿基会：加沙停火300天，至少300名儿童遇难；乌克兰平民伤亡持续增加，联合国谴责俄罗斯新一轮袭击；“生物污损”—— 困在霍尔木兹海峡的船只面临的另一种威胁；广岛原子弹爆炸81周年，古特雷斯呼吁各国共同降低核风险；粮食署：“厄尔尼诺”现象或致数千万人陷入急性饥饿；非洲首当其冲承受着生物多样性丧失的后果；世行报告：人工智能可为发展中经济体提供新机遇，同时带来新的风险。\n\n## 国际刑事法院缔约国大会主席团对乍得和委内瑞拉退出《罗马规约》表示遗憾 \n\n2026年8月7日 \n\n针对乍得和委内瑞拉两国政府为退出《罗马规约》所采取的举措，《罗马规约》缔约国大会主席团发表声明，对这一事态发展表示关切，并呼吁两国继续作为《罗马规约》缔约国履行承诺。\n\n## 世卫组织技术委员会同意在刚果（金）对传统埃博拉疫苗实施临床试验 \n\n2026年8月7日 \n\n世界卫生组织本迪布焦埃博拉病毒病疫情应对候选疫苗优先排序技术咨询小组周五发布新报告，建议优先将目前唯一获批的针对扎伊尔型病毒的埃博拉疫苗“埃尔维博”（Ervebo）纳入刚果民主共和国（刚果（金））当前疫情背景下开展的随机临床试验，以评估其针对本迪布焦型病毒病的有效性。\n\n## 【前方视野】委内瑞拉双强震：联合国紧急驰援 \n\n今年6月24日，百年不遇的连环强震，让委内瑞拉中北部沦为重灾区，成千上万个家庭瞬间流离失所。在这一危难时刻，联合国各机构紧急响应、协同作战，将粮食、药品与临时庇护材料源源不断运往灾区最前线。\n\n## 天气、能源及地缘政治因素推动国际食品价格指数7月小幅上涨 \n\n粮农组织周五发布的最新数据显示，受近期热浪、能源价格波动及地缘政治因素影响，谷物、植物油和糖的国际报价上涨，推动2026年7月全球食品大宗商品价格基准指标小幅回升。\n\n纽约时间零点，北京时间12点，欢迎收看《联合国子午播报》。本期节目您将看到，世界土著人民国际日：守护文化、守护自然、守护未来。\n\n## 非洲疾控中心和世卫组织呼吁扩大社区防控 遏制刚果（金）埃博拉疫情 \n\n非洲疾病控制与预防中心和世界卫生组织周四呼吁在刚果民主共和国（刚果（金））紧急扩大以社区为主导的埃博拉疫情应对，包括加强早期检测、密切接触者追踪、医疗服务可及性、支持一线卫生工作者，并加快向受影响社区调配资源。\n\n## 广岛原子弹爆炸81周年 古特雷斯呼吁各国共同降低核风险 \n\n81年前，广岛遭受原子弹轰炸。周四，联合国秘书长古特雷斯在广岛原子弹爆炸81周年纪念仪式上发表致辞，呼吁各国从广岛悲剧中汲取教训，在全球安全环境恶化、核风险上升的背景下，通过对话、外交、国际合作和裁军努力，共同建设一个永不再现广岛悲剧的世界。\n\n 联合国照片/马努埃尔埃利亚斯 \n\n## 联合国：南苏丹举行可信选举所需条件仍未具备 呼吁停止战斗并重启包容性对话 \n\n联合国南苏丹特派团团长兼秘书长特别代表贝霍周四在安理会表示，随着南苏丹12月大选临近，政治议程正日益围绕选举展开，但举行可信、和平、包容性选举所需的政治、安全和体制条件仍未具备。她呼吁各方停止战斗、保护平民和人道主义人员、重启包容性政治对话，并对举行可信选举所需的最低条件进行客观评估。\n\n《联合国宪章》原件现身纽约\n\n巴以冲突",
  "deep": "## AI 解读\n\n# 深度解读：气候危机下的巴西土著青年——从边缘到全球议程\n\n核心要点提炼\n\n1. 主题转向：联合国新闻将巴西土著青年置于气候危机叙事中心，强调“被看见、被听到”本身即是一种“抵抗力”，标志着土著议题从被动受害者框架转向主动行动者叙事。\n2. 代际更替：新一代土著青年正步入公众视野，成为气候正义与土地权利的交汇代言人。\n3. 议程联动：该报道与同期“世界土著人民国际日”、厄尔尼诺致数千万人急性饥饿、生物多样性丧失等议题形成呼应，构成联合国系统性议程的一部分。\n\n影响分析\n\n短期看，此类叙事强化了土著社区在国际气候谈判中的道义杠杆，为2026年后全球气候治理注入“在地知识”维度。中期而言，巴西土著青年的话语权上升可能倒逼国内土地政策与气候承诺的落实，但也将激化与农业综合企业及非法采矿势力的张力。更深远的影响在于，联合国正借土著议题重塑“气候正义”话语——将文化存续与生态保护绑定，为发展中国家争取气候融资提供新论据。然而，若缺乏实质性资源倾斜，象征性“被看见”恐难转化为结构性权力转移。",

  "deep": "## AI 解读\n\n核心要点：\n\n1. Anthropic发布Claude Opus 5.5，为Claude 5.5系列首个模型，标志其旗舰产品线进入新一轮迭代周期。\n2. 性能定位明确：多数任务对标Claude Fable 5.1，而非追求全面超越，显示Anthropic采取\"够用即优\"的务实策略。\n3. 成本下降40%（对比Opus 5），是本轮升级最实质的竞争力信号。\n\n影响分析：\n\n此次发布的战略重心不在性能突破，而在成本效率。40%的推理成本下降，直接压低企业级API调用门槛，对正在评估大模型部署ROI的企业客户构成明确吸引力。在OpenAI、Google持续施压的竞争格局下，Anthropic选择以\"性能持平+成本领先\"切入，实质是争夺中高端商用市场的份额。\n\n更值得关注的是产品线命名逻辑：Opus 5.5作为系列首作，暗示Anthropic正构建更细分的模型矩阵，以差异化定价覆盖不同需求层级。若后续Claude 5.5系列延续此路线，可能加速行业从\"参数竞赛\"转向\"单位智能成本\"的竞争范式。对开发者而言，这是利好；对竞品而言，价格战压力将进一步上升。",

  "url": "https://www.rfi.fr/cn/%E5%9B%BD%E9%99%85/20260922-%E6%AC%A7%E7%9B%9F%E7%BD%91%E7%BB%9C%E5%AE%89%E5%85%A8%E5%B1%80-%E4%B8%AD%E5%9B%BD%E5%85%B3%E8%81%94%E7%BD%91%E7%BB%9C%E5%85%A5%E4%BE%B5%E6%8C%81%E7%BB%AD%E5%85%B3%E6%B3%A8%E4%BA%A4%E9%80%9A%E8%BF%90%E8%BE%93%E9%A2%86%E5%9F%9F%EF%BC%8C%E5%8C%85%E6%8B%AC%E6%B5%B7%E4%BA%8B%E5%AE%9E%E4%BD%93",
  "title": "欧盟网络安全局：中国关联网络入侵持续关注交通运输领域 - RFI",
  "src": "Exa 搜索",
  "lede": "欧盟网络安全局（ENISA）周二表示，一个知名中国黑客组织在2025年全年以“持续的频率”对多个欧盟成员国的海事实体发动了网络攻击。 \n\n发表时间： 22/09/2026 - 17:10更改时间： 22/09/2026 - 17:12\n\n 欧盟盟旗与中国国旗资料图片 © 路透社图片 \n\n 作者： 弗林 \n\n欧盟网络安全局在其概述该集团所面临网络威胁的“2026年威胁态势”报告中指出，“影响欧盟的2025年网络威胁态势，继续受到多种威胁因素的共同影响——这些威胁有时由地缘政治事态发展所驱动，同时也受到数字生态系统日益增强的互联性的影响”。\n\n报告指：“分布式拒绝服务（DDoS）攻击（51.3%）和未经授权的访问（39.5%）在影响欧盟成员国及欧盟境内组织的各类网络活动中，依然占据很大比例。社会工程学仍是利用信任实施攻击的常用手段，尤其是通过网络钓鱼活动（77.8%）进行攻击，且此类活动日益依赖钓鱼工具包及基于服务的生态系统。利用漏洞，包括N-day和零日漏洞也是导致未经授权访问（60.4%）的常见入侵途径。与此同时，针对供应链、第三方服务提供商、云环境及其他网络依赖环节的攻击，持续引发了影响深远的大规模安全事件”。\n\n报告提到，“出于经济动机的活动（占所有记录事件的29.3%）——尤其是勒索软件攻击——在短期内依然是影响最显著的安全事件。勒索软件、数据泄露、网络钓鱼及欺诈活动波及了广泛的行业领域，这反映出网络犯罪生态系统持续展现出的适应能力。制造业、商务服务业和公共管理部门是受网络犯罪相关活动影响最严重的行业”。\n\n报告亦指：“俄罗斯对乌克兰发动的侵略战争持续进行以及中东冲突升级等地缘政治事态，继续影响着波及欧盟的网络活动。在观测到的活动中，受意识形态驱动的行动占据了相当大的比例（57.3%），其中尤以黑客行动主义者发起的DDoS攻击最为突出；这些攻击主要针对面向公众的服务、关键实体，以及与政治事态或支持乌克兰、以色列等国相关的组织”。\n\n报告表示：“国家关联的入侵组继续开展网络间谍活动（占5.9%）：其中，俄罗斯关联组的入侵主要针对中央政府及外交机构；中国关联组的入侵则持续关注交通运输领域，包括与海事相关的实体。此外，还观察到国家关联、以经济利益为动机的网络攻击行动出现了回升”。\n\n报导提到，“2025年的情况证实，各行业（包括NIS2指令界定的关键行业）持续面临网络威胁风险。公共管理部门受到的影响最为显著（占31.8%），其次是商业服务业（8.5%）、运输业（8%）、制造业（6.9%）以及金融/银行业（5.6%）。针对各行业的分析进一步揭示了攻击目标模式、威胁组织及运营影响方面的差异，特别是凸显了数字化依赖程度、敏感数据持有量以及运营成熟度在决定网络威胁风险敞口方面所起的关键作用”。\n\n报导称，“关于欧盟制造业（占8.4%）遭具有国家关联的入侵组织攻击的报告，主要涉及针对国防相关机构的攻击；这方面的典型案例包括与朝鲜关联的Lazarus、俄罗斯关联的DragonFly及Storm-2372、以及伊朗关联的Nimbus Manticore相关的攻击行动。此外，一项符合中国相关利益的大规模攻击行动，涉及PurpleHaze和ShadowPad于2024年7月至2025年3月期间进行，影响了全球70多个目标，其中包括多家制造业实体。这些活动中有一部分可能涉及知识产权窃取”。\n\n就国家关联威胁，报告写道：“据报告，具有国家关联的入侵主要依赖未经授权的访问（81.7%）及网络钓鱼攻击（12%）开展活动。在记录在案的事件中，欧盟网络安全局仅能确定20%的事件的初始入侵向量。在这一子集中，利用漏洞进行入侵是最常见的手段，占已查明案例的70%。内部威胁的增加（5%）尤为令人担忧。在被评估为针对欧盟实施网络间谍活动的具有国家关联的入侵组（intrusion sets）中，约有1.5%无法归因于任何已知的国家关联主体。据报告，与俄罗斯相关的入侵组占47.6%；其次为中国（15.5%）、朝鲜（14.1%）和伊朗（9%）”。\n\n报告指出，“2025年，与中国有关联的入侵组继续针对欧盟开展活动，重点关注电信、海事、半导体、制造业及公共管理机构。它们还持续利用漏洞构建操作中继节点（ORB），其中包括在欧盟境内。值得特别关注的是，它们利用已受害的欧洲实体作为跳​​板，针对其他欧洲机构以及非洲和东南亚的目标发起后续攻击活动”。\n\n欧盟网络安全局表示：“在攻击目标方面，开源报告证实，Salt Typhoon（盐台风）针对欧盟机构的攻击活动于2025年初开始显现。6月，在欧盟各地运营的全球卫星通信公司Viasat确认，其系统遭到了该入侵组的入侵。",
  "deep": "## AI 解读\n\n# 深度分析：欧盟网络安全局报告中的中国关联网络威胁\n\n核心要点提炼\n\nENISA《2026年威胁态势》报告披露三层关键信息：其一，中国关联入侵组（以Salt Typhoon/盐台风为代表）2025年全年以“持续频率”锁定欧盟海事及交通运输实体，攻击呈高度定向性；其二，中国关联活动占欧盟归因国家背景入侵的15.5%，仅次于俄罗斯（47.6%），重点覆盖电信、海事、半导体、制造业及公共管理五大领域；其三，攻击手法上，中方行为体不仅利用漏洞构建操作中继节点（ORB），更将已攻陷的欧洲实体作为跳板，对非洲、东南亚目标发起二次攻击，形成“以欧攻欧、辐射外围”的链式打击模式。\n\n影响分析\n\n该报告标志着欧盟对华网络威胁认知从“泛化关切”转向“领域精准锁定”。海事与交通运输被单独点名为持续关注对象，意味着中欧在网络空间的博弈正从传统情报窃取向关键基础设施前置布局延伸——海运承载欧盟90%对外贸易，其数字化系统一旦被渗透，战时或危机状态下的供应链断链风险将呈指数级放大。Salt Typhoon自2025年初对Viasat等卫星通信运营商的入侵，更暴露欧盟在空天—海事融合通信层面的防护短板。与此同时，报告将中国与俄、朝、伊并列归因，客观上推动欧盟在网络防御资源配置上加速向“印太—欧洲联动”框架倾斜，中欧数字互信短期内恐进一步承压。",
  "no": 89
 },

  "deep": "## AI 解读\n\n核心要点：\n\n1. Kimi将原WebBridge升级为浏览器扩展，从单纯对话工具转向可操作浏览器的Agent形态，支持导航、填表、任务执行。\n2. 引入“录制即技能”机制：用户操作一次，保存为skill，后续由Kimi自动复现，直击重复性工作流痛点。\n3. 渠道上架Chrome Web Store并配套官网入口，分发路径清晰，瞄准海外及国内Chrome系用户。\n\n影响分析：\n\n此举标志Kimi从“问答助手”向“浏览器级Agent”跃迁，直接对标OpenAI Operator、Anthropic Computer Use及国内同类插件。浏览器是AI Agent落地最高频的入口，Kimi以扩展形式切入，既规避了自研浏览器的重投入，又能借Chrome生态快速触达用户。skill录制机制是关键差异化——它把Agent能力从“一次性指令”变为“可复用资产”，降低使用门槛，增强用户粘性。对行业而言，浏览器扩展赛道竞争将进一步白热化，但真正的壁垒在于任务执行的稳定性与跨站兼容性。若Kimi能解决复杂网页的鲁棒性问题，有望在企业RPA轻量化场景中抢占先机。",

  "src": "Exa 搜索",
  "lede": "小鹏集团举行首届机器人供应链合作伙伴大会 _ 东方财富网\n\n小鹏集团举行首届机器人供应链合作伙伴大会\n\n2026年09月22日 16:39\n\n 9月22日，小鹏集团举行首届机器人供应链合作伙伴大会，来自机器人关节模组、执行器、精密结构件等领域的供应链企业参会。会议围绕人形机器人核心零部件供应、生产协同及规模化制造等议题展开交流。\n\n 大会现场展示了小鹏机器人在自主朝向跟随、多语言切换、动态身份记忆和智能问答等方面的功能，呈现了其由自主运动向人机交互拓展的最新进展。\n\n 据小鹏集团介绍，目前企业已与相关供应链企业签署定点协议，正在推进零部件供应及生产线排产。供应链定点和产线排产，意味着其机器人业务正从产品研发、样机试制进一步转向生产准备阶段。\n\n 近期，小鹏机器人自动化生产线正式启用，首台通过该产线完成自动化总装的高阶通用人形机器人自主走下产线。该产线核心制程自动化率超过80%，标志着小鹏机器人由研发试制进入产线制造阶段。\n\n 根据规划，小鹏机器人将于2026年底进入规模量产阶段，初期计划在小鹏门店、产业园区等商业场景开展应用。实际量产和场景落地进度，仍有待供应链稳定性、产品可靠性及实际应用效果进一步检验。\n\n（文章来源：广州日报）\n\n 文章来源：广州日报 责任编辑：6",
  "deep": "## AI 解读\n\n核心要点提炼\n\n小鹏集团举办首届机器人供应链合作伙伴大会，标志其人形机器人业务完成关键跃迁：一是供应链定点协议签署、产线排产启动，业务重心从研发试制转向生产准备；二是自动化产线正式启用，核心制程自动化率超80%，首台机器人自主走下产线；三是明确2026年底规模量产目标，初期落地门店、产业园区等商业场景。\n\n影响分析\n\n战略层面，小鹏正将智能汽车的供应链管理与规模制造能力向机器人业务迁移，这是其区别于纯机器人初创公司的核心壁垒——用成熟的车规级制造体系压缩人形机器人的量产成本曲线。供应链层面，关节模组、执行器、精密结构件企业被纳入定点体系，意味着上游零部件供应商将迎来订单兑现窗口，但也面临车规级一致性与可靠性验证的更高门槛。行业层面，若2026年底量产如期落地，小鹏有望跻身国内人形机器人量产第一梯队，与特斯拉Optimus形成直接对标。\n\n风险提示：供应链稳定性、产品可靠性及商业场景实际付费意愿仍待验证，量产承诺兑现节奏存在不确定性。",

  "deep": "## AI 解读\n\n核心要点\n\n1. 性能定位：阶跃星辰 Step 5 Preview 在 Artificial Analysis Intelligence Index 得分 44，与 Kimi K3 (max) 并列，仅落后 GLM-5.3 (max) 和 Qwen3.8 Max 1 分，处于国产大模型第一梯队。\n2. 成本优势显著：每任务成本约 $0.72，仅为同级模型（约 $2.00）的 1/2.8，性价比突出。\n3. 竞争格局：头部国产模型性能高度收敛（44–45 分区间），差距已进入统计误差范围，价格与效率成为新的差异化战场。\n\n影响分析\n\n此次评测释放两个关键信号。其一，国产大模型在智能水平上已形成\"贴身竞争\"，单纯比拼基准分数的边际收益递减，厂商需转向推理效率、单位成本、场景适配等维度构建壁垒。其二，Step 5 Preview 以近 3 倍成本优势达到同级性能，若该优势在正式版中延续，将直接冲击 API 市场的定价体系，迫使竞品跟进降价或优化推理架构。对下游开发者和企业用户而言，这意味着同等预算下可调用更高智能水平的模型，加速 AI 应用的规模化落地。需注意 Preview 版本与正式版可能存在性能波动，成本数据的稳定性仍待观察。",

  "id": "robotics-1790211613304-1",

  "url": "https://tech.ifeng.com/c/8wdOUQVxUHZ",
  "title": "理想连发三大具身成果：智能系统ME-Brain-1.0、统一理解与生成模型ME-U0和视觉语言模型ME-VLM_凤凰网",
  "src": "Exa 搜索",
  "lede": "2026年09月22日 16:20:21 来自北京\n\n机器人前瞻（公众号：robot_pro）\n\n作者 | 钟宸\n\n编辑 | 漠影\n\n机器人前瞻9月22日报道，今天，继昨日发布首款世界动作模型后，理想Foundation Model团队再次发布在具身领域的三大成果，包括ME-Brain-1.0具身智能系统、MachEmbodied-U0统一理解与生成模型、ME-VLM视觉语言模型。\n\n该团队指出，MachEmbodied-VLM(ME-VLM)为具身认知基础模型，已在综合能力评估中取得第一。同时，理想提供了可端侧部署的4B版本，在小参数规模下取得了有竞争力的指标。\n\nMachEmbodied-U0（ME-U0）则从约5,700小时机器人数据和3,920小时第一视角数据的原始数据池中筛选出约4,200小时用于预训练，仅使用各基准自身提供的监督信号进行适配，该模型便在 RoboDojo获得17.66分，并在LIBERO和LIBERO-Plus上分别取得 99.1%与81.8%的平均成功率。\n\n理想将ME-Brain-1.0称为“记忆、认知与行动，持续进化的具身智能系统”，并展示了“抓万物1小时超级泛化”与手冲咖啡的长程任务demo。\n\n一、可完成4分钟长程任务，展示一万小时抓万物真机测试\n\n理想将ME-Brain-1.0定位为具身智能系统，首先对这一系统的长程任务完成能力进行了展示。\n\n在视频里，ME-Brain-1.0在收到指令后，会以语音进行回应，还会在操作界面上实时回应，目前的操作进行到哪步了，对步骤状态和完成情况也进行了展示。\n\n而从视频来看，夹爪完成了研磨咖啡粉、冲泡咖啡、将咖啡倒入杯中等共15步操作，且当人类对该系统进行询问时，其还能回答包括做了几杯咖啡、咖啡介绍的问题，整体耗时约4分钟。\n\n此外，理想还展示了“无剪辑一小时连续抓万物真机测试”，覆盖上百种不同形状、尺寸和材质的物体。该公司称，测试期间持续切换23次灯光和15次桌布背景，成功率达100%。\n\n此外，理想还放出了多个demo视频，展示了系统的指令跟随、学习、记忆、主动感知、泛化和精细操作等多方面的能力。\n\n指令跟随方面，当人类说出放置指令后，系统会加载plan-general技能，同时调用不同工具完成指令，整个过程耗时46秒，在抓起和放下时，夹爪都会出现较为明显的停顿，流畅性还有提升空间。\n\n而在学习能力方面，当人类说出“记住我的操作并重复”的指令，该系统会调用工具进行记录。当告诉ME-Brain-1.0操作完毕后，它会继续调用工具进行任务的执行。\n\nME-Brain-1.0也展现了记忆能力，能够在人类弄乱桌面后、听到“恢复桌面”的指令后，将桌面内已经打乱的物体放回原位。不过，全程仅涉及两个物品和两个固定位置的篮子，凌乱程度并不大。\n\n该系统同时具备主动感知能力，能够在记忆人类指令后，主动感知周围环境是否能够执行任务。视频中，人类让该系统在出现绿色碗后将勺子放进去，ME-Brain-1.0成功完成了任务。\n\n而在最后，理想展示了这一系统的多步精细操作任务能力。视频中，ME-Brain-1.0连续完成了积木定位、抓取与堆叠的任务。\n\n但该系统仅完成了三层积木堆叠，积木位置离夹爪也距离偏近。即便任务较为简单，夹爪还是出现了失误操作，整个操作过程用时也较长，夹爪会出现较多停顿情况。\n\n该系统还具备物品的抓取与放置的泛化能力。在桌面整理任务中，ME-Brain-1.0能够将桌面上杂乱的物品放到篮子中，有时采取双爪轮流夹取物体的策略，有时采取同时夹取物体的策略，总的来说，操作会出现一些失误和较多的停顿，物体摆放也不太整齐，提升空间较大。\n\n理想透露，ME-Brain-1.0通过分层记忆、统一认知与事件驱动动作模型，将任务执行与经验积累连接起来。在这一架构下，记忆保存执行依据，认知负责规划、验证和经验利用，动作模型则将决策落实为物理操作，三者共同支持长程任务中的历史调用与策略调整。\n\n同时，这一模型以 Evolvable Memory、Cognitive Core 与Action Model三个模块，构建了“动作执行—经验获取—经验进化—动作执行”的自进化闭环。\n\n理想称，Evolvable Memory依托Cognitive Core，已在M100端侧芯片上完成模型迁移与定制化优化，支持在本地完成记忆生成、存储、演化和调用。\n\n在覆盖物理理解、长程规划、动作与执行、纠错四类能力的具身评测中。Cognitive Core 35B-A3B在14项基准评测上取得最高分，平均分为 70.9，领先同类模型8.2分；面向端侧的4B平均分为 63.4，位列第二。\n\nAgent评测覆盖多模态理解、工具与技能调用、长程规划、推理、指令跟随五类能力，共16项基准。",
  "deep": "## AI 解读\n\n核心要点\n\n理想在两天内连续发布具身智能领域四项成果，节奏明显加快，显示其正将自动驾驶积累的Foundation Model能力向通用机器人迁移。此次三大成果各有侧重：ME-VLM主打认知理解，4B端侧版本兼顾部署可行性；ME-U0以约4200小时数据预训练，在LIBERO等基准上取得99.1%成功率，数据效率是亮点；ME-Brain-1.0则整合记忆、认知与动作三层架构，实现4分钟15步手冲咖啡长程任务及“1小时抓万物”真机测试。\n\n影响分析\n\n第一，理想正从“车企”向“具身智能平台”延伸，ME-Brain的Evolvable Memory已在M100端侧芯片完成迁移，意味着其具身能力与自研芯片形成协同，这是多数机器人创业公司不具备的闭环优势。\n\n第二，从demo看，系统在长程任务、主动感知、记忆恢复等维度已具备雏形，但夹爪停顿频繁、堆叠仅三层、桌面整理失误较多，说明精细操作与流畅性仍是短板，距离商用落地尚有距离。\n\n第三，ME-U0以较少数据在权威基准上取得高分，若可复现，将降低具身模型的数据门槛，对行业训练范式有参考价值。整体看，理想具身布局技术完整度高，但工程成熟度仍需验证。",
  "no": 93
 },

  "deep": "## AI 解读\n\n核心要点\n\n1. 标题与内容严重错位：标题宣称发布Claude Opus 5.5并降本40%，但正文实际描述的是Anthropic推出“Newsroom”官方信息发布平台，全文未提及任何模型发布或定价信息。该新闻存在明显的事实性错误或拼接痕迹，需高度警惕信源可靠性。\n\n2. 真实信息内核：Anthropic正在强化官方传播渠道建设，将产品、安全研究、政策动态整合至统一平台，减少对第三方渠道和社交媒体的依赖。\n\n影响分析\n\n- 对Anthropic：自建Newsroom是AI公司走向成熟的标志性动作，有助于在监管趋严的背景下掌握叙事主导权，强化其“安全优先”的品牌定位。\n- 对行业：头部AI实验室正从“社交媒体碎片化发声”转向“官方平台集中发布”，信息透明度与可控性同步提升，但也可能削弱第三方媒体的监督与交叉验证空间。\n- 对投资者与用户：若标题中的Opus 5.5降本属实，将加剧大模型价格战；但当前信息无法证实，建议以Anthropic官方Newsroom为准，避免被误导性标题驱动决策。\n\n结论：本条新闻标题与内容不符，核心价值在于Anthropic渠道战略升级，而非模型发布。",

  "deep": "## AI 解读\n\n核心要点\n\n1. OpenAI 一次性发布 GPT-6 Sol 与 Luna 双模型，前者定位高性能、后者主打低成本，形成\"旗舰+轻量\"的完整产品矩阵。\n2. 关键技术动作是将 GPT-6 Astra 的训练方法下放至更快更便宜的模型，本质是\"能力蒸馏+架构复用\"，用前沿模型的训练范式摊薄边际成本。\n3. 价格降幅显著：Sol 输入/输出腰斩至 $2/$10，Luna 输出端降幅达 58%（$1.20→$0.50），且是在 GPT-5.6 促销价基础上再降 50%，实际降幅远超常规迭代节奏。\n\n影响分析\n\n短期看，这是对竞品的直接价格压制。Luna 输出定价 $0.50/百万 token 已逼近开源模型托管成本区间，将挤压中腰部厂商的定价空间，并加速应用层\"token 成本敏感型\"产品的爆发。\n\n中期看，训练方法下放意味着 OpenAI 正把\"前沿能力\"与\"可负担推理\"解耦——Astra 负责探路，Sol/Luna 负责规模化变现。这一策略若成立，模型代际差将不再是能力壁垒，而是成本与延迟的工程壁垒。\n\n风险在于：激进降价可能引发行业性价格战，压缩全行业毛利；同时需关注 Sol/Luna 在复杂推理任务上是否因成本优化而出现能力折损，这将决定其能否真正承接高端场景。",

  "title": "transformers 支持直接加载 GGUF 量化模型，本地推理性能接近 llama.cpp",
  "src": "Hugging Face：Blog（RSS）",
  "lede": "Hugging Face 宣布 transformers 支持直接运行 GGUF 量化模型，通过 from_pretrained 传入 gguf_file 即可加载 Hub 上的 GGUF checkpoint，并复用 ggml 的 Metal 内核。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 技术整合：Hugging Face transformers 现已原生支持直接加载 GGUF 格式量化模型，用户仅需通过 `from_pretrained` 指定 `gguf_file` 参数即可加载 Hub 上的模型，无需格式转换。\n2. 性能对齐：通过复用 ggml 的 Metal 内核，Mac 设备上的本地推理性能已接近 llama.cpp 原生水平。\n3. 生态打通：GGUF（llama.cpp 主推格式）与 transformers（主流训练/推理框架）之间的壁垒被打破。\n\n影响分析\n\n短期看，最大受益者是 Mac 本地部署用户——过去需在 llama.cpp 与 transformers 间二选一，如今可兼得 GGUF 的量化效率与 transformers 的生态便利（如 pipeline、tokenizer 统一）。这降低了本地推理的迁移成本。\n\n中期看，此举强化了 Hugging Face 作为模型分发中枢的地位：GGUF 模型可直接托管于 Hub 并被主流框架消费，llama.cpp 社区与 HF 生态从竞争转向互补。量化模型的“一次上传、多框架运行”成为可能。\n\n长期看，这标志着推理格式标准化的重要一步。GGUF 正从 llama.cpp 专属格式演变为跨框架通用标准，有利于端侧 AI 应用的规模化落地。但需注意，当前性能对齐主要依赖 Metal 内核，CUDA/ROCm 路径的优化程度仍待观察，跨平台一致性是下一阶段关键。",

 },

  "url": "https://openrouter.ai/blog/announcements/batch-api",
  "title": "OpenRouter 推出 Batch API，批量推理可享半价",
  "src": "OpenRouter：Announcements（RSS）",
  "lede": "OpenRouter发布公告，推出多项新功能与更新。平台新增对多种前沿模型的支持，包括Anthropic的Claude系列、Google的Gemini系列、Meta的Llama系列、Mistral及DeepSeek等，用户可通过统一API接口调用。OpenRouter同步上线模型路由与回退机制，允许开发者设置优先级顺序，在主模型不可用时自动切换备用模型，提升服务稳定性。平台还推出BYOK（自带密钥）功能，用户可使用自有API密钥调用模型，降低使用成本。此外，OpenRouter更新了定价页面与用量统计面板，提供更透明的计费信息与实时消耗追踪。公告还提及与多家推理提供商的合作扩展，进一步优化延迟与吞吐表现。",
  "deep": "## AI 解读\n\n核心要点：OpenRouter此次更新的核心是Batch API半价批量推理，同时补齐了模型路由/回退、BYOK、多模型统一接入等能力。其战略意图清晰——从\"模型聚合器\"升级为\"AI推理基础设施层\"，通过统一接口+成本优化+稳定性保障，锁定开发者工作流。\n\n影响分析：\n\n1. 对开发者：Batch API半价直接降低大规模离线推理（数据标注、内容生成、评测）的成本门槛；模型路由与回退机制解决了单一模型宕机或限流的生产痛点，BYOK则让已有API额度的团队避免二次付费。三者叠加，显著提升OpenRouter对中大型开发团队的粘性。\n\n2. 对行业格局：OpenRouter正在复制\"云厂商中立层\"的定位——不绑定任何模型，而是做多模型的调度与议价中枢。这对直接面向开发者的模型厂商（如Anthropic、DeepSeek）构成渠道分流，但对推理提供商则是增量分发。半价Batch本质是用规模效应向上游压价，再让利下游，加速推理市场的价格竞争。\n\n3. 风险点：聚合层的核心壁垒是价格与稳定性，一旦头部模型厂商收紧API政策或自建类似路由能力，OpenRouter的中间价值将被压缩。其长期护城河取决于能否在调度效率与成本控制上持续领先。",

  "lede": "Epoch AI 发布报告，估算过去三年内达到同等 AI 性能的成本平均每季度下降约 47%，即每年约 13 倍，并认为这一速度可能自 2021 年 11 月商业 LLM 推理开始以来持续至今。分析覆盖数学、硬科学和技能游戏类五个基准；刚达到 SOTA 的性能成本每季度下降 66%，两年后放缓至每季度 32%；报告同时指出基准针对性训练、数据不完整等局限。数据与代码在 GitHub 上公开。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 成本下降速度惊人：Epoch AI 测算，过去三年达到同等 AI 性能的成本平均每季度下降约 47%（年化约 13 倍），且这一趋势自 2021 年 11 月商业 LLM 推理起步以来持续存在。\n2. \"前沿溢价\"快速衰减：刚达到 SOTA 水平的性能成本降幅更快（每季度 66%），但两年后放缓至 32%——说明领先优势的窗口期正在缩短。\n3. 方法论存在边界：覆盖数学、硬科学、技能游戏五类基准，但作者自陈基准针对性训练、数据不完整等局限，结论需谨慎外推。\n\n影响分析\n\n成本曲线陡降是 AI 产业最被低估的结构性变量。对应用层而言，这意味着此前因成本搁置的场景（长上下文推理、多智能体、实时交互）将以季度为单位被解锁，商业模式迭代速度被迫加快。对模型厂商而言，SOTA 溢价的半衰期约两年，单纯\"性能领先\"难以支撑长期定价权，护城河须转向数据飞轮、分发渠道或生态锁定。更深层看，若 13 倍/年的降本持续，AI 能力将加速从稀缺资源转为通用基础设施，行业价值重心或从\"训练出更强的模型\"迁移至\"以更低成本规模化落地\"。需警惕的是，基准针对性训练可能高估降本速度，真实曲线或更平缓。",

  "deep": "## AI 解读\n\n核心要点\n\n1. 榜首易主：Claude Opus 5.5 以 58 分登顶 Artificial Analysis 智能指数，创该榜单历史最高分，标志 Anthropic 在综合智能评测上取得阶段性领先。\n2. 终端能力持平：在 Terminal-Bench 4.0 上，其 59.6% 的成绩与 GPT-6 Astra 持平，说明双方在智能体（Agent）实操类任务上已进入胶着状态。\n3. 评测信号：智能指数是行业通用基准，登顶意味着模型在推理、编码、多任务等综合维度获得第三方背书。\n\n影响分析\n\n短期看，这一结果将强化 Anthropic 在企业级与开发者市场的叙事，尤其利好其智能体与编程场景的落地推广。对 OpenAI 而言，GPT-6 Astra 在终端任务上未被拉开差距，竞争仍处均势，但综合指数落后可能施压其下一代发布节奏。对行业而言，头部模型分数持续逼近，基准测试的区分度正在下降，\"登顶\"的边际意义减弱，竞争重心或进一步转向成本、延迟、生态与真实场景可靠性。需注意，单一榜单高分不等于产品优势，实际落地表现仍需观察。",
  "no": 105
 },

  "lede": "Artificial Analysis 评测 GPT-6 Sol 和 Luna，价格约为 GPT-5.6 同名型号的一半，Sol 定价 $2/$10 每百万输入/输出 token，Luna 为 $0.10/$0.50。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 定价策略激进：GPT-6 系列（Sol、Luna）价格较上代同型号直接腰斩。Sol 定位中高端（$2/$10），Luna 则杀入超低价区间（$0.10/$0.50），后者每百万输出仅 0.5 美元，已逼近开源模型托管成本线。\n2. 性能非单调提升：评测显示各维度“有升有降”，意味着 GPT-6 并非全面碾压 GPT-5.6，而是在成本与特定能力间做了取舍——典型的“降本不降智、但非全维升级”路线。\n3. 双型号分层清晰：Sol 主打能力上限，Luna 主打极致性价比，形成对高、低端市场的双向夹击。\n\n影响分析\n\n对行业而言，这是 OpenAI 从“技术领先定价”转向“成本驱动定价”的明确信号。Luna 的 $0.10/$0.50 直接压缩了中小模型厂商和开源托管商的生存空间，价格战将进一步白热化。对开发者，推理成本减半意味着更多 Agent、长上下文应用从“算不过账”变为“可商业化”，应用层有望迎来一波放量。但“有升有降”也提示：盲目升级未必划算，需按任务维度做基准测试后再迁移。总体看，模型竞争的主战场正从单纯的 benchmark 分数，转向“单位智能成本”的效率之争。",

  "title": "卡兹克实测对比 Grok 4.7 与小米 MiMo V2.6：后者成不可能三角版本答案",
  "src": "公众号：数字生命卡兹克",
  "lede": "2024年2月16日凌晨，OpenAI发布了首个视频生成模型Sora，可通过文本指令生成最长60秒的视频，视频包含高度细致的背景、复杂的多角度镜头及富有情感的角色。Sora基于扩散模型与Transformer架构，能理解物体在物理世界中的存在方式，还可向前或向后扩展视频、连接两个输入视频实现无缝过渡。OpenAI CEO Sam Altman在X上征集用户提示词并实时发布生成结果，引发广泛关注。同期，Runway、Pika等AI视频公司面临巨大竞争压力。Sora目前仅向部分研究人员和创意人士开放测试，尚未公开发布，OpenAI表示将采取安全措施并征求公众反馈。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 产品对比结论：卡兹克实测显示，小米MiMo V2.6在与Grok 4.7的横向对比中，成为“不可能三角”（通常指性能、成本、效率难以兼得）的版本答案，暗示其在多项关键指标上取得突破性平衡。\n2. 竞争格局信号：此次对比将小米AI模型与xAI的Grok系列直接对标，反映国产大模型在特定场景下已具备与国际头部产品正面竞争的实力。\n3. 传播路径特征：以第三方实测对比形式传播，结论鲜明，具备较强的舆论引导力和行业话题性。\n\n影响分析\n\n若实测结论成立，MiMo V2.6的“不可能三角”突破将直接冲击市场对国产模型能力边界的认知，尤其在端侧部署与成本控制维度可能形成差异化优势。对小米而言，这是其AI战略从“跟随”转向“局部领先”的关键信号，有助于强化生态协同叙事。对行业而言，此类对比将加剧大模型评测的“实战化”趋势，推动厂商从参数竞赛转向场景化落地能力的比拼。但需注意，单一实测样本的代表性有限，结论的普适性仍需更多独立验证。",

  "url": "https://openrouter.ai/blog/insights/jev-vs-claude-opus-5-classification",
  "title": "OpenRouter 实测 Jev 1.13 与 Claude Opus 5 在 Banking77 分类任务上的准确率、延迟与成本",
  "src": "OpenRouter：Announcements（RSS）",
  "lede": "OpenRouter 用 Banking77 测试集的 3,080 条客服语料对比 Jev 1.13 与 Claude Opus 5 的意图分类表现。Jev 准确率 81.0% 比 Opus 的 84.4% 低 3.3 个百分点，但中位延迟 175 ms 约为 Opus（2,266 ms）的 1/13，每千次请求成本 $0.11 对 $2.42（启用提示词缓存）。",
  "deep": "## AI 解读\n\n核心要点\n\nOpenRouter基于Banking77的3080条客服语料测试显示：Jev 1.13意图分类准确率81.0%，较Claude Opus 5的84.4%低3.3个百分点；但中位延迟仅175ms（Opus的1/13），每千次请求成本$0.11（Opus启用提示词缓存后为$2.42，差距约22倍）。\n\n影响分析\n\n这是一组典型的\"性能—效率\"权衡数据，指向清晰：在银行客服意图分类这类边界明确、类别固定的窄域任务上，3.3个百分点的准确率差距，未必值得付出13倍延迟和22倍成本。对高频、实时性敏感的客服场景，Jev的性价比优势可能更具决定性；只有在准确率直接关联高风险决策（如合规、账务纠纷分流）时，Opus的精度溢价才合理。\n\n更值得关注的是市场信号：轻量模型正快速逼近前沿模型的窄任务表现，且成本差距仍在扩大。这意味着\"用大模型做一切\"的粗放策略正被成本结构倒逼转向任务分级——简单分类下沉到廉价模型，复杂推理保留给旗舰模型。对企业而言，选型逻辑应从\"谁最强\"转向\"单位准确率成本\"与\"延迟容忍度\"的联合优化。",
  "no": 108
 },

  "url": "https://openrouter.ai/blog/insights/nemotron-3-5-lightning",
  "title": "OpenRouter 解读 NVIDIA Nemotron 3.5 Lightning 如何承担 Agent 高频执行调用",
  "src": "OpenRouter：Announcements（RSS）",
  "lede": "OpenRouter 发文解读 NVIDIA 的 Nemotron 3.5 Lightning，这是一款 30B 总参数、约 3B 激活参数的混合专家开源权重模型，定位于工具调用、编码等高频、边界清晰的 Agent 执行步骤，与负责复杂推理的 Nemotron 3 Ultra（550B 总参数、55B 激活）形成分工。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 产品定位精准：Nemotron 3.5 Lightning 以 30B 总参数、仅约 3B 激活参数的 MoE 架构，专攻工具调用、编码等高频、边界清晰的 Agent 执行步骤，而非复杂推理。\n2. 分层协作架构：与 550B/55B 激活的 Nemotron 3 Ultra 形成\"快慢分工\"——Lightning 扛高频执行，Ultra 负责复杂推理，本质是把 Agent 工作流按任务复杂度拆解到不同规格模型。\n3. 开源权重 + 渠道背书：开源权重策略叠加 OpenRouter 的解读与分发，意在快速渗透开发者生态。\n\n影响分析\n\n这一设计直指当前 Agent 落地的核心痛点：成本与延迟。Agent 任务中大量步骤是格式化的工具调用和代码补全，用大模型执行属于\"杀鸡用牛刀\"。以 3B 激活参数承担这类工作，可大幅压低推理成本与响应延迟，同时保留足够能力。对行业而言，这强化了\"模型分层调度\"的工程范式——未来 Agent 系统很可能由小模型做执行、大模型做规划，而非单一模型通吃。对 NVIDIA 而言，这是从芯片向模型栈延伸、绑定开发者工作流的又一步。风险在于：小模型在边界模糊任务上的鲁棒性、以及开源权重能否形成真正的生态粘性，仍需市场验证。",
  "no": 109
 },
 {
  "id": "geopolitics-1790125204197-2",
  "day": "2026-09-22",
  "pub": "2026-09-22 00:00:00.000Z",
  "time": "9月22日 00:00",
  "cat": "geopolitics",
  "imp": "hot",
  "url": "https://www.thepaper.cn/newsDetail_forward_34116160",
  "title": "中东睿评｜与胡塞武装冲突或“迅速升级”，沙特被困在安全与发展之间_外交学人_澎湃新闻-The Paper",
  "src": "Exa 搜索",
  "lede": "澎湃新闻特约撰稿 刘中民 冉启宇\n\n9月20日，沙特阿拉伯战机空袭也门北部焦夫省通信塔。而在前一天，也门胡塞武装也袭击了沙特首都利雅得哈立德国王国际机场的航空燃油设施，以及沙特阿美石油公司位于延布的设施。当天，美国驻中东多国大使馆发布新的安全警报称，胡塞武装和沙特的军事冲突有可能“迅速升级”。20日，沙特股市应声下跌。\n\n自2026年2月美以伊战争爆发以来，沙特先是面临伊朗报复性打击和封锁霍尔木兹海峡造成的安全威胁和经济损失，后又于7月底以来面临也门胡塞武装袭击和封锁其石油出口造成的严峻挑战，进而使沙特在波斯湾和红海同时面临巨大的安全威胁和石油出口被双线封锁的压力，并对沙特以“ 2030愿景”为核心的国家转型产生严重消极影响，促使沙特不得不进行艰难的战略应对。\n\n当地时间2026年7月26日，沙特阿拉伯吉赞，胡塞武装从也门发射导弹后，沙特阿拉伯吉赞的阿美石油码头上空升起滚滚浓烟。视觉中国 资料图\n\n巨大安全压力下，安全与发展的矛盾更加尖锐\n\n美以伊战争爆发后，冲突很快波及沙特，其突出表现是伊朗直接对沙特发动导弹和无人机袭击，沙特的美国军事基地、能源基础设施等目标多次遭到伊朗的报复性打击。作为美国在中东的重要盟友，沙特虽然没有直接参与美以对伊军事行动，但伊朗的报复性打击使沙特根本无法置身事外。此外，伊拉克境内什叶派民兵武装也不断对沙特能源设施发动袭击。7月底，在连续拦截来自伊拉克方向的无人机后，沙特经与美国协调，对伊拉克境内相关目标进行了打击，其目的在于恢复威慑，提高对手继续发动袭击的成本，同时避免再次陷入长期消耗战。\n\n战争还进一步暴露了沙特对美安全依赖的悖论：尽管美国是其最重要的外部安全伙伴，但对单一安全来源的过度依赖，严重暴露了沙特国家安全的脆弱性。在此背景下，沙特在继续维持与美国盟友关系的同时，不得不通过加强多元安全合作，谋求战略自主。\n\n8月 7日，沙特与土耳其、巴基斯坦签署《麦加共同防务协议》。协议明确规定，对三国中任何一国的武装攻击都将被视为对三国全体的攻击，并将推动三国建立政治与军事合作机制，深化国防工业领域的合作。8月31日，沙、土、巴三国在伊斯坦布尔举行根据《麦加共同防务协议》成立的战略政治与防务委员会首次会议，并成立了秘书处。\n\n这一协议无疑是在美国安全供给意愿下降、能力受限的背景下，地区国家谋求战略自主、增强自身安全能力的产物，而沙特则是该协议的积极推动者。然而，基于中东安全问题的复杂性和联动性，三国均面临复杂安全议题，以及三国均为美国军事盟友、深受美国控制等因素的制约，目前的三国安全合作无疑将十分困难。目前来看，《麦加共同防务协议》更多是政治、外交和安全领域的协商和合作机制，而不是军事同盟条约。\n\n但是，就在麦加共同防务协议尚处在建章立制阶段的同时，也门胡塞武装的挑战使沙特面临更加严峻的安全挑战。\n\n进入9月以来，胡塞武装与沙特的冲突持续升级。9月10日，胡塞武装攻占红海港口城市穆哈，并继续沿西部海岸向南推进。也门政府方面称，胡塞武装已控制也门西部沿海大部分地区，胡塞方面则宣称已攻占约5400平方公里土地。随着穆哈、祖巴卜及曼德海峡附近岛屿相继易手，胡塞武装对红海重要航道的影响进一步上升。\n\n在攻城略地的同时，胡塞武装宣布对支持也门政府的沙特实施海上禁运，并连续向沙特的城市、能源设施和军事目标发动导弹和无人机袭击。沙特随即进行军事反击，并启动对也门胡塞武装的空袭，导致双方再度进入大规模冲突状态。 9月中旬以来，胡塞武装接连对利雅得、延布、塔伊夫、比什和法拉桑等地进行袭击，沙特则对胡塞武装发动了数百次空袭，导致双方的冲突持续加剧。\n\n在沙特与胡塞武装军事冲突持续升级之际，长期为沙特提供安全保障的美国却选择与胡塞武装进行外交接触。 9月中旬，美国官员在阿曼首都马斯喀特与胡塞武装代表举行会谈。美方要求胡塞继续遵守双方此前达成的停火安排，不袭击美国船只，并保障曼德海峡和红海国际航运安全。据路透社报道，胡塞方面表示愿意维持对美停火，不袭击美国商船，但仍把沙特船只作为打击目标。\n\n此前，沙特王储穆罕默德·本·萨勒曼曾两次请求美国直接打击胡塞目标，但均遭到特朗普拒绝。美国愿意继续向沙特提供情报和相关支持，却不愿直接卷入沙特与胡塞武装之间的军事冲突。在此背景下，沙特相继向法国、英国、巴基斯坦和埃及寻求防空支援，甚至向以色列请求支援，从中足见其面临的安全压力之大。\n\n2026年美以伊战争爆发之前，沙特自2021年以来开始推行缓和外交，不仅实现了与伊朗、土耳其、卡塔尔缓和关系的目标，而且于2022年实现了与也门胡塞武装的停火。沙特缓和外交根本原因在于沙特把推行“ 2030愿景”作为国家转型发展战略，进而通过地区缓和外交为国家转型发展创造地区环境。\n\n美以伊战争爆发以来，沙特竭力避免卷入美以对伊军事行动，其重要考虑仍在于此。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n沙特正陷入安全与发展的双重困境。自2026年2月美以伊战争爆发以来，沙特在波斯湾和红海同时面临伊朗与胡塞武装的双线安全威胁和石油出口封锁压力。9月以来，胡塞武装攻占也门西部沿海要地、宣布对沙特海上禁运，并连续袭击利雅得机场、阿美石油设施等战略目标，双方冲突急剧升级。沙特虽寻求美国直接打击胡塞，却遭特朗普拒绝——美方转而与胡塞单独接触，仅保障美船安全，将沙特船只排除在停火安排之外。沙特被迫转向法国、英国、巴基斯坦乃至以色列寻求防空支援，并与土、巴签署《麦加共同防务协议》以谋战略自主。\n\n影响分析\n\n此番冲突升级对沙特的冲击是结构性的。其一，石油出口双线受阻直接侵蚀“2030愿景”的经济基础，股市下跌已释放市场恐慌信号。其二，美国安全保护的“选择性撤退”暴露了沙特对美依赖的悖论——盟友关系无法转化为对等安全承诺，迫使沙特加速安全伙伴多元化，但《麦加共同防务协议》受制于三国均系美国盟友的现实，短期内难以形成实质军事同盟。其三，沙特此前以缓和外交为转型争取地区环境的战略逻辑正被战争彻底颠覆，安全与发展之间的矛盾空前尖锐。若红海航道持续受扰，沙特将不得不在军事消耗与转型投入之间做出痛苦取舍，其地区大国地位和转型前景均面临严峻考验。",

  "title": "各自飞？胡塞武装夺取曼德海峡，也门总统求援特朗普却遭拒",
  "src": "Exa 搜索",
  "lede": "oo烛光透影\n\n9月21日，据路透社援引四名知情人士消息证实，当地时间周日，美国总统特朗普与也门总统领导委员会主席拉沙德·阿利米举行通话，双方重点围绕也门战场局势以及胡塞武装在红海关键水道的军事推进展开沟通。\n\n此次高层通话，也让美国当前对也门、对胡塞武装的微妙战略态度彻底浮出水面。\n\n近期也门战局迎来重大变动，胡塞武装在本月发起快速闪电攻势，顺利攻占曼德海峡沿岸多处核心战略区域。\n\n曼德海峡作为连接红海与亚丁湾的全球关键航运水道，是国际贸易与能源运输的重要通道，此地控制权易手，直接冲击红海区域安全格局，也让也门亲沙特临时政府的生存压力急剧攀升。\n\n面对战场局势恶化，阿利米在通话中正式向美方提出诉求，希望美国出手提供军事支持，协助其领导的也门政府对抗快速扩张的胡塞武装，稳住现有控制区域，扭转战场被动局面。\n\n此番求援，是也门当局在战局承压下，对美国盟友支持的一次关键试探。\n\n不过美方的回应并未达到也门政府预期。据一名也门知情人士与一名西方知情人士共同透露，特朗普在本次通话过程中，始终没有对也门方面作出任何直接军事援助承诺，全程保持模糊且保守的表态，未释放明确的介入信号。\n\n通话结束后，白宫官方以及也门新闻部门均未第一时间针对此次高层通话内容、美方立场作出公开回应，双方均保持沉默，进一步凸显出美叶关系当下的微妙状态，也让也门战局的外部干预局势充满不确定性。\n\n美方此番冷漠态度并非临时决策，而是延续了近期一贯的中东战略基调。\n\n公开信息显示，特朗普政府此前就已拒绝沙特方面提出的、联合出兵对抗胡塞武装的军事支援请求，持续弱化直接军事介入的姿态，减少在也门战场的兵力投入。\n\n相较于对也门、沙特的冷淡态度，美国与胡塞武装却始终保持着特殊沟通渠道。\n\n特朗普曾多次公开证实，美国长期与胡塞武装保持常态化联系，而胡塞武装也明确对外表态，不会主动袭击美国船只，双方形成了互不冲突的隐性默契。\n\n尽管存在私下沟通渠道，美国官方层面依旧维持原有定性，始终将胡塞武装列为恐怖组织，并未调整相关制裁与认定政策，形成了“官方定性强硬、私下保持沟通、拒绝军事介入”的矛盾操作模式。\n\n这种差异化的外交策略，也彻底打破了传统中东盟友的固有认知。美国不愿为也门战局消耗战略资源、刻意与胡塞武装维稳的思路，让亲美亲沙的也门政府陷入孤立无援的境地，也折射出特朗普政府中东政策的务实利己本质。\n\n当前，胡塞武装掌控曼德海峡关键地带后，战略优势持续扩大，也门战场局势彻底逆转。美国放弃军事驰援盟友、转而与对立武装缓和关系的做法，不仅深刻改变也门内战走向，也彻底重塑了红海沿岸的地缘博弈格局。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n1. 战略要地易手：胡塞武装快速攻占曼德海峡沿岸核心区域，直接掌控连接红海与亚丁湾的全球关键航运通道，战场主动权显著扩大。\n2. 盟友求援遭冷遇：也门总统阿利米向特朗普请求军事支援，美方未作任何直接援助承诺，全程保持模糊保守表态。\n3. 美方策略自相矛盾：一边维持对胡塞武装的恐怖组织定性，一边保持常态化私下沟通并获对方“不袭美船”承诺，同时拒绝为盟友也门和沙特出兵。\n4. 隐性默契取代同盟义务：美国以务实利己为基调，用与胡塞武装的“互不冲突”默契替代对传统盟友的安全承诺。\n\n影响分析\n\n此次通话标志着美国中东政策的又一次清晰转向：不为盟友消耗战略资源，转而与对立武装维稳。其直接后果有三：其一，也门亲沙临时政府失去外部军事支柱，生存空间被进一步压缩，内战天平加速倒向胡塞武装；其二，曼德海峡控制权易手将重塑红海航运安全格局，全球能源与贸易通道风险溢价上升；其三，美国对盟友的“选择性抛弃”将深刻动摇沙特等海湾国家对美安全依赖的信心，加速地区国家多元外交与自主安全布局。总体看，红海沿岸地缘博弈正从“代理人对抗”转向“美胡默契+盟友孤立”的新失衡格局。",

  "lede": "美以军事打击伊朗进入第10天，一个现象引人注目：欧洲盟友几乎集体“作壁上观”，西班牙等直言反对美国做法。要知道，此前打伊拉克、利比亚、南联盟等，北约盟友可是美国集结的重要军事力量。\n\n欧洲盟友“不跟”，从一个侧面反映出国际格局特别是跨大西洋关系的深刻变化。对此，北京外国语大学欧盟与区域发展研究中心主任崔洪建向侠客岛进行了深度分析。\n\n伊朗首都德黑兰被袭击（图源：外媒）\n\n1、侠客岛：过去对外动武，欧洲总是紧随美国。这次美以联手打伊朗，欧洲集体不跟，并有一些中立乃至反对声音。美欧过往的紧密军事合作关系为何变成这样？\n\n崔洪建：过去美国总拉着欧洲，是为体现美欧之间的跨大西洋同盟关系和其后的“西方中心”秩序。但在美以联合对伊朗采取的军事行动中，欧洲国家要么事先不知情，要么事后拒绝向美国提供支持，美欧军事关系出现重大变化。\n\n伊朗距离欧洲很近，此前欧洲在伊朗核问题外交谈判中是重要攸关方，因为欧洲国家在中东地区有巨大的能源和商业利益。但在美伊谈判期间，美国突然联手以色列军事打击伊朗，并且绕开欧洲，这在外交、军事层面都将欧洲排除在外。欧洲第一时间强烈感受到被边缘化的冲击，美国则在新的全球战略中赋予欧洲不同以往的角色。\n\n2、侠客岛：欧洲国家在谴责伊朗对邻国发动报复性袭击的同时，对是否参与对伊军事行动措辞非常谨慎。西班牙对美批评尤其激烈，明确表示反对战争，并拒绝美国使用其军事基地打击伊朗。如何看待这些国家的态度？\n\n崔洪建：以前英国一直是美国在对外军事行动中最“可靠”的盟友，因此这次英国受冲击最大、立场选择最为困难、前后也最矛盾。英首相斯塔默先是以伊拉克战争为教训，政治上和美国拉开距离，并拒绝为美国提供军事基地；很快又表态，同意美国“特定且有限”使用其军事基地。\n\n政治上保持距离，行动上避免脱离，“既要又要”的应对策略被英国展示得淋漓尽致。\n\n法国出于大国地位考虑，对美国行动的反应最强烈：批评美以军事行动未征求联合国安理会意见，未获安理会授权，不符合国际法；主动与包括中国在内的相关方开展外交行动；军事上试图保持“代表欧洲”独立介入而非“配合美国”的姿态。这就与英国有了区别。\n\n德国态度相对消极暧昧。3月初默茨访美，正好赶上美以对伊采取行动，德国某种程度上被动卷入事态。出于历史原因，支持以色列在德国是某种政治正确，此前巴以问题上德国就倾向支持以色列。对美以军事行动，德国没有提出明确批评，是出于强烈的政治因素和政策惯性。\n\n那西班牙这次为啥如此“硬刚”美国？\n\n一是地理位置上，中东如果乱，位于大西洋和地中海咽喉位置的西班牙将首当其冲，面临贸易通道受阻、难民涌入等问题。因此西班牙政府的态度，延续了在中东问题上的政策连贯性，即主张稳定地区形势，反对以色列单方面改变现状；\n\n二是西班牙与美国有积怨，此前美国对西加征关税、要求增加北约军费等举动，已引发西班牙强烈不满，这次白宫又威胁切断与西班牙的所有贸易关系；\n\n三是政治立场上，左翼执政的西班牙在国际事务中秉持的理念与白宫相左。近年来西班牙希望在大国博弈中寻求更平衡多元的外交立场，反对盲目接受所谓美欧共同立场。西班牙“美国的政治动机不能证明其行动合法”的逻辑，体现出更多基于国际关系准则，而非按意识形态划界的理性。\n\n（图源：央视新闻）\n\n3、侠客岛：英法德三国领导人3月1日联合声明称，可能对伊朗采取“必要且相称的防御行动”，摧毁其发射导弹和无人机的能力。怎么看这种表态？\n\n崔洪建：伊朗事关欧洲周边安全和通道安全。中东是欧洲重要的能源供应来源，无论伊核问题还是美以军事打击伊朗，都将对欧洲的能源、贸易、安全产生不可忽视的直接影响。\n\n经历了事发之初各自表态的相对混乱阶段后，欧洲主要国家意识到需要介入其中、发挥作用，不能完全沦为被边缘化的旁观者。\n\n欧洲首选是外交介入。欧洲看清楚了，就算想置身事外，也无法避免被局势卷入其中，比如英法在海湾国家的侨民、军事基地、经济利益都会受到波及，因此希望变被动为主动。\n\n联合声明核心内容有二：一是以外交方式表明军事介入的可能，保留欧洲尤其是英法德三国根据事态变化随时军事介入的权利；二是在各方博弈中明确合作伙伴，欲将联系密切、利益相连的海湾国家作为主要合作对象，试图以“安全提供者”的姿态，为海湾国家提供安全保护、介入争端。\n\n但为避免与伊朗直接冲突，这份声明又为可能的军事介入设定了条件：一是突出军事介入的“防御性质”，试图与美以行动拉开距离，说欧洲是保护海湾国家；二是强调必要性、对称性，采取军事手段不以升级冲突为目的。\n\n欧洲采取这种姿态，是想避免和伊朗发生直接冲突，也避免国际社会批评。\n\n4、侠客岛：英国已参与协助海湾国家防御来自伊朗的军事打击，以“支持其在海湾地区的盟友”。马克龙确认，法国“戴高乐”号航母也已抵达地中海，应对中东地区紧张局势，保障法国及其盟友的安全。",
  "deep": "## AI 解读\n\n# 跨大西洋裂痕的实质：欧洲从“追随者”到“避险者”\n\n核心要点：\n\n美以对伊军事行动中欧洲集体“不跟”，本质是三重结构性矛盾的集中爆发。其一，程序性排斥——美国绕开欧洲发动打击，将后者从伊核外交的“攸关方”降格为“旁观者”，触及欧洲战略自主的敏感神经。其二，利益错位——中东距欧洲咫尺之遥，能源通道、难民压力、侨民安全使欧洲成为冲突的“近端受害者”，而美国本土却享有地理缓冲。其三，信任赤字——从加征关税到北约军费施压，跨大西洋关系的裂痕早已从经贸蔓延至安全领域。\n\n影响分析：\n\n欧洲的“不跟”并非中立，而是一种被动避险策略。英法德联合声明试图以“防御性介入”保留军事选项，同时与美以行动切割，折射出欧洲的两难：既无法承受被边缘化的战略代价，又不愿为美国的单边冒险背书。西班牙的“硬刚”则揭示了另一种可能——当中东乱局直接威胁本国贸易通道与边境安全时，欧洲国家将更多基于国际法准则与自身利益而非意识形态划线来决策。\n\n这一态势标志着跨大西洋军事协作模式已从“美国领导、欧洲跟随”转向“各自盘算、有限配合”。美国在新全球战略中重新定义欧洲角色，而欧洲则以“选择性介入”回应——这种离心式博弈将加速多极化秩序下西方阵营的内部重组。",

  "title": "具身智能企业密集发布模型 多元化探索“大脑”进阶路径_大风号_凤凰网",
  "src": "Exa 搜索",
  "lede": "2026年09月23日 00:00:00 来自北京市\n\n 近日，具身模型不断上新。人形机器人公司Figure发布其研发的神经网络模型Helix 2.5，能让机器人自主操作家务；宇树科技、北京松延动力科技集团股份有限公司相继发布新具身模型，并对外透露模型训练策略。\n\n 从业者认为，随着具身模型的技术路线更为清晰，具身机器人本体硬件相对成熟，具身模型研发进入关键期。企业搭建强化学习实验场、推动模型创新、探索训练数据配方，推动具身机器人性能更进一步。\n\n ● 本报记者 郑萃颖\n\n 行业重心转向模型研发\n\n 机器人新款产品的发布已经不再是具身智能行业的焦点，关注点正在从“躯干”转向“大脑”。当地时间9月17日，海外人形机器人公司Figure发布其最新研发的神经网络模型Helix 2.5，实验结果显示，搭载Helix 2.5的Figure 03人形机器人可以在陌生环境进行自主作业，穿过狭小的空间，整理客厅和床铺。Figure表示，Helix 2.5使用更少的专用数据，实现了更强的泛化性，这意味着机器人通过模型训练学习到的任务执行能力可以迁移到不同的新场景。\n\n 国内具身智能行业也在将更多资源集中投入到具身模型的研发上，包括宇树科技、松延动力这两家最早以机器人本体量产能力为消费者所熟知的公司。\n\n 9月10日，宇树科技发布全新一代通用人形机器人基础模型UnifoLM-WLA-1.0并宣布开源，该模型依托大规模通用多模态感知与理解数据，融合了以交互为中心的世界建模技术，可驱动机器人完成64项操作任务。视频中，宇树科技展示了机器人自主执行收纳工具箱、叠毛巾、向洗衣机投放衣物等日常任务。宇树科技董事长王兴兴在今年8月举办的2026世界机器人大会上表示，公司曾在2024年初开始推进基于视频生成技术的世界模型开发，后由于效果不理想而短暂搁置，自2025年起，公司再次大力发展世界模型。\n\n 以万元级机器人“小布米”以及仿生机器人为代表产品的松延动力，于9月8日对外发布首个自研具身智能模型“HERON-World Model”；9月15日，发布第二个自研具身智能模型“HERON-CRA”。公司创始人、董事长姜哲源告诉记者，公司自去年8月组建具身模型研发团队，今年团队逐渐形成战斗力，目前公司大部分投入流向模型研发部门。\n\n “2023年公司成立之初，全球除了波士顿动力公司，缺乏能稳定行走的人形机器人本体，因此我们优先补齐了硬件和运控的短板。如今，机器人本体在成本、可靠性、性能等方面已准备就绪，具备规模化基础，现在是补齐‘大脑’短板的合适时机。”姜哲源表示，2023年至2024年，具身模型的技术路线较为分散，而如今，行业对于世界模型与VLA路线融合的方向形成一定共识，成为具身模型研发的阶段性拐点。\n\n 多元探索模型训练路径\n\n 为了让机器人更智能，企业正在探索不同的具身模型训练路径。\n\n 在北京石景山区的一栋办公楼中，其中一层放置了海洋球、障碍物，地面绘制了彩色跑道，都使用了不易造成磕碰损伤的材质，看起来就像是个幼儿园。但在这里“上学”的不是小朋友，而是机器人。\n\n 今年9月，北京他山科技有限公司与2024年图灵奖得主、“强化学习之父”理查德·萨顿（Richard Sutton）团队Openmind联合共建的机器人强化学习实验场正式启用。首批不同形态机器人开始入场进行强化学习实验。在这里，不同企业的具身机器人在场地中自主行走，尽可能长时间地与环境交互。\n\n 他山科技CEO马扬表示，具身智能的未来需要多种学习方式，在真实物理世界中通过自主触摸和试错获得成长，是其中重要的进化路径。他山科技研发副总裁侯广东向记者介绍，第一阶段，机器人将在实验场内适应环境变化，以“延长在线时间”“减少损伤”为目标，长时间与环境互动，并自主完成充电，这一基础能力可以让机器人未来在家庭等非结构化场景中具备自适应能力。后续，研发团队逐步引入更复杂的算法与实验设计，让机器人建立自我认知、区分自身与外界、掌握运动控制、理解物体交互、最终实现多智能体间的协作。\n\n “我们的目标是开发出能够赋予机器人学习能力的模型，而非对单一技能做固化编码，让机器人执行。”侯广东表示。\n\n 浙江人形机器人创新中心首席科学家熊蓉认为，当前具身模型发展的根本瓶颈在于模型的泛化能力，而提升模型泛化性的一大挑战在于，训练中使用的仿真生成数据与现实物理世界难以对齐。\n\n “这就涉及视觉、力觉、触觉信息，机器人全身状态及环境信息的统一表征问题。”熊蓉表示，浙江人形机器人创新中心实现视力触融合的统一表征，使得机器人在仿真世界中训练的模型能力能准确对应到真实世界；在模型学习上，将预测模型与行为模型相结合，具身模型与世界模型协同进化。\n\n 松延动力摸索出了“喂养”模型的数据配方。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n具身智能行业正经历关键转向：竞争焦点从硬件本体（“躯干”）迁移至AI模型（“大脑”）。Figure、宇树、松延动力等头部企业密集发布具身模型，技术路线从分散走向收敛——世界模型与VLA（视觉-语言-动作）融合成为阶段性共识。训练路径呈现多元化探索：宇树走开源通用基础模型路线，松延动力自研双模型并摸索“数据配方”，他山科技联合图灵奖得主萨顿团队搭建真实物理世界的强化学习实验场。行业普遍判断，本体硬件在成本、可靠性、性能上已具备规模化基础，补齐“大脑”短板的时机已到。\n\n影响分析\n\n这一转向标志着具身智能从“能走”进入“能想”的竞争阶段。硬件趋同后，模型泛化能力将成为核心壁垒——谁能用更少专用数据实现跨场景迁移，谁就掌握定价权。值得关注的是训练范式的分化：仿真数据与真实世界的“对齐”难题仍未根本解决，他山科技押注真实环境强化学习，浙江人形机器人创新中心则走视触觉融合表征路线，两条路径的验证结果将决定行业标准走向。对企业而言，模型研发投入占比上升意味着短期盈利压力加大，但开源策略（如宇树）可能加速生态卡位。中期看，具身模型的能力跃迁将直接决定人形机器人能否从演示场景进入家庭等非结构化环境，这是商业化拐点的真正门槛。",

  "lede": "在具身智能领域，长任务从不是时长竞赛。\n\n一条包含多个关联子任务的作业链，考验的是机器人对任务依赖、动作条件和环境变化的综合管理能力。因此，长程任务不应只是比拼时长的“耐力赛”。\n\n效率同样重要。单步动作缓慢、步骤之间等待、子任务失败后反复重试、甚至整段重启，都可能让任务时间“变长”，却不增加有效产出。\n\n极智嘉Gravity具身智能模型在此次早餐任务演示中，面对反复干扰仍能自主完成任务，展现出决策速度、动作精度、应变灵活度与纠错自主度四个维度上的综合能力，让长任务执行兼具泛化能力与作业效率\n\nMoT双脑架构与分层记忆\n\n高效执行长任务，首先要求任务决策与连续动作有效衔接。\n\n做早餐包含一系列关联子任务。Gravity需要持续判断当前步骤是否完成、下一步的执行条件是否满足，避免重复判断和无效切换。\n\n在Gravity的MoT双脑架构中， AR Transformer负责理解指令和场景、解析任务目标，并完成子任务编排； Diffusion Transformer负责预测未来状态、评估子目标并生成连续动作。\n\n \n\nGravity 框架架构总览\n\nShort-Long Term Sensor-Task Memory 则维持任务上下文：短时记忆追踪近期观测、动作轨迹和环境变化，长期记忆保存任务目标、执行阶段与关键事件。配合Stage/Progress状态输出，模型能够持续判断当前步骤的完成度与后续任务的执行条件，构成可感知、可校验、可动态调度的任务闭环\n\n精密操作与可供性推理\n\n单步操作的准确性，是控制长任务返工成本的基础。\n\n将面包片放入狭窄槽口前，Gravity先调整面包片与槽口的相对位姿，对准入口，再完成约束插入。这种局部调整有助于减少错位及重复尝试。效率不是省略必要动作，而是通过精准操作降低整个子任务的完成成本。\n\n \n\n当两片面包间距不足、无法直接形成稳定夹取时，模型首先进行抓取可供性推理（Grasp Affordance Reasoning），判断当前条件是否满足；随后通过非抓取操作（Non-prehensile Manipulation）主动调整目标构型，为稳定抓取创造空间，避免在不可行状态下反复试抓。\n\n \n\nGravity的Robot Skill与专家先验机制，可进一步将定位、抓取、插装、倾倒等操作封装为可组合技能，并注入操作示范、工艺规范、完成标准和安全边界，在提高泛化能力的同时降低试错成本。\n\n4D WAM与在线重规划\n\n真实作业环境持续变化，执行动作也必须随之更新。\n\n面包架和面包机发生大幅移动后，Gravity重新定位源端与目标端，调整夹取和放置动作；餐盘移动后，亦能重新确定放置位置。模型依据当前环境状态更新执行目标，而非沿用失效的位置与轨迹。\n\n \n\nGravity 4D通过RGB、Pointmap和Scene Flow构成4D未来表征，联合建模视觉外观、空间结构与运动变化。WAM根据观测与任务上下文推演未来状态，逆动力学模型 IDM 据此生成动作chunk，为在线重规划提供技术支撑。\n\n当目标位置发生变化时，系统需要以最新观测为条件重新生成动作。当杯子被遮挡时，模型进入安全等待状态。\n\n \n\n当杯子被移走时，果断中止当前倾倒动作以避免倾洒。\n\n \n\n未来状态推演与执行条件校验共同支撑行为调整，减少无效执行，兼顾作业效率与操作安全。\n\n对齐物理状态与任务状态\n\n长任务真正困难的地方，在于某个动作没有达到预期结果后，机器人是否知道哪里出了问题。\n\n当面包片未能正确插入时，系统需要根据完成条件判断当前步骤尚未结束，重新估计面包片与槽口的相对位置，执行局部重规划并再次尝试。这属于动作级的闭环纠错。\n\n \n\n如果已经完成的任务状态被改变，例如面包片被重新取出，则系统需要将Stage回溯至对应步骤，再次执行夹取和插入。这属于任务级的异常恢复。\n\n \n\n纠错的效率价值，在于仅修正受影响的步骤，避免局部异常触发全流程重启。\n\n进一步地，Gravity通过Evaluation Model与强化学习建立“部署—反馈—评估—再训练”闭环。成功、失败和人工接管轨迹经过结构化评估后，可用于失败样本重加权和离线强化学习，让现场异常持续转化为模型能力。\n\n才是真干活\n\n此次早餐Demo集中呈现了一组可迁移的生产能力：任务编排、精密插入、抓取可供性推理、动态目标重定位、安全状态管理和闭环异常恢复。\n\n这些能力可以进一步迁移至仓储中的打包、搬运、复核和巡检等任务。进入真实现场后，这套能力与WMS、WES、RMS协同，并接受成功率、作业周期、异常接管率和持续运行时间的检验。\n\nGravity以“深认知、快行动”将泛化能力与执行效率纳入同一框架：面对变化能够重新判断，面对异常能够自主恢复，同时以精简推理链路守住生产节拍。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 长任务≠耐力赛：极智嘉Gravity模型的核心主张是长程任务的关键在于任务依赖管理、动作衔接效率与异常恢复能力，而非单纯比拼时长。\n2. 架构创新：MoT双脑架构（AR Transformer负责任务编排 + Diffusion Transformer负责动作生成）配合短-长时记忆系统，实现“感知-校验-调度”的任务闭环。\n3. 四项关键能力：决策速度、动作精度、应变灵活度、纠错自主度——通过可供性推理、4D未来表征、在线重规划、动作级/任务级分层纠错共同支撑。\n4. 数据飞轮：评估模型+强化学习构建“部署-反馈-评估-再训练”闭环，将现场异常转化为模型迭代能力。\n\n影响分析\n\n此次演示的意义在于将具身智能的竞争焦点从“能不能做”转向“能不能高效、可靠地做完”。早餐场景虽小，但任务编排、精密插入、动态重定位、安全等待、分层纠错等能力均可直接迁移至仓储打包、搬运、复核等场景。Gravity提出的“深认知、快行动”框架，本质上是试图解决具身智能落地中最现实的矛盾：泛化能力与执行效率往往互斥。若该框架在真实产线中经得起成功率、周期、异常接管率等指标的检验，将为具身智能从Demo走向生产力提供一条可复用的技术路径。",
  "no": 114
 },

  "title": "特斯拉Optimus量产提速？有企业人形机器人两年降价超七成，专家：硬件越来越不值钱；业内：具身智能“卖铲人”的商业化更有空间_凤凰网",
  "src": "Exa 搜索",
  "lede": "2026年09月22日 21:56:55 来自北京\n\n记者|叶晓丹\n\n编辑|梁露月 陈旭 易启江 校对|段炼\n\n特斯拉人形机器人Optimus量产，迎来了提速消息。\n\n9月21日，有媒体报道，特斯拉正在中国长三角推进新一轮人形机器人供应链审厂，特斯拉此轮审厂将实质导向Optimus的量产，目前已经向供应链企业下达相关订单。这些企业涉及关节模组、执行器、精密结构件等人形机器人核心机电部件。\n\n当前，具身智能行业正进入新一轮分化行情。一二级市场对整机机器人厂商关注的重心从“跑蹦跳”向“谁能真正干活”转移。市场对机器人整机厂商有无实质商业化进展争议不断。在近日举行的第九届中国机器人峰会上，有与会的行业专家断言“机器人的硬件越来越不值钱，真正的门槛在软件、在数据与机理的融合”。\n\n不过，有机器人企业创始人在向《每日经济新闻》记者（以下简称每经记者）分析时表示，与对终端具身智能企业商业化的争议不断相比，机器人上游零部件企业等“卖铲人”的商业化反而更有空间。\n\n六维力传感器头部企业蓝点触控副总裁张鹏玲在接受每经记者采访时透露，当行业关注重心转向能否进入真实场景、创造实际生产力时，力传感器的重要性也随之提升。张鹏玲透露，蓝点触控去年关节力传感器出货量约为10万套，目前产能利用率接近100%，叠加新增产能预计年产能可达百万套。\n\n华睿智普则将目光瞄准机器人端侧算力，推出3纳米物理AI“智能超脑”，华睿智普CEO蔡镇辉认为，当前不少大模型仍在云端完成训练和测试，但移植到机器人本体后，可能面临模型装不进去、运行速度过慢或需要重新适配等问题。随着模型持续升级、应用场景增加，端侧对算力和功耗的要求还会继续提升。\n\n“机器人的硬件越来越不值钱”\n\n球形机器人、轮式机器人、人形机器人、叉车机器人、机器狗，各类机器人的形态不一而足。在第九届中国机器人峰会上，机器人上下游企业也充分展示着自身的产品应用。\n\n每经记者注意到，峰会上，不少业内人士都在谈论机器人能不能进入真实场景干活，背后是对机器人规模化和商业化的再一次聚焦。\n\n现场有机器人专家提出，机器人的硬件“越来越不值钱”。\n\n高盛8月底发布的全球物理AI报告曾给出中长期预测：人形机器人整机均价将由2025年的4.18万美元降至2035年的2.13万美元，十年降幅约49%，近乎“腰斩”。而在中国市场，降价节奏远比海外预测更快，量产落地正在加速把价格曲线往下压。\n\n宇树科技招股书显示，其人形机器人单价从2023年的59.34万元降至2025年的16.76万元，两年降幅近72%。今年6月，消费级产品R1售价进一步下调至2.99万元。近期，松延动力小尺寸产品“小布米”预售价已不足万元。\n\n宇树科技四足机器人及人形机器人价格变动情况\n\n前述机器人专家认为，真正的门槛在软件、在数据与机理的融合。底层控制靠模型最稳，开放环境、家庭养老这些未知场景则离不开数据驱动；机理让数据不浪费，数据可以补上模型够不到的地方。前景光明，但幻觉、耗能、世界模型缺失，仍是绕不过去的坎。\n\n也有资深机器人学术专家认为，集群具身智能要过三关：一是互联互通、高效传算；二是大范围环境感知与理解；三是感知之后能执行，做到“知行合一”。能连起来只是开始，看懂场景才是关键，干成任务才是本事。手术机器人如此，人形机器人如此，工业集群机器人亦如此。\n\n机器人是否最终以“人形”的形态演进，机器人学术专家的观点也和此前每经记者采访的多位机器人业内人士形成共识：具身智能的胜负不在“像人”，而在“落地”，要聚焦场景牵引、问题导向，落地一代、完成一代、再推进一代，让集群机器人“连得上、传得快、算得懂、算得动”，以云边端闭环实现“知行合一”。\n\n迎来规模化叙事\n\n特斯拉量产提速的消息释放，在二级市场上，近期A股特斯拉产业链相关个股表现活跃。中国零部件厂商正在成为全球机器人产业的核心力量。\n\n规模化和国产化是当前具身智能产业一个显著的趋势。中国信通院数据显示，人形机器人核心零部件整体国产化率已突破75%，摩根士丹利对部分核心零部件的国产化率测算口径更是超过90%；若脱离中国供应链，单台成本将飙升至13.1万美元，差价接近3倍。\n\n以六维力传感器市场而言，2023年以前，国内六维力传感器市场长期由ATI、Kistler等国际品牌主导。2024年起，国产品牌依托性价比优势、本地化快速响应能力和定制化服务效率，快速切入人形机器人核心供应链，到2025年已实现对国际品牌的市场份额反超。价格维度上，外资高端品牌产品单价仍处于7万元~8万元/颗区间，而国产主流产品已降至数千元至3万元/颗。",
  "deep": "## AI 解读\n\n## 核心要点\n\n1. 量产拐点临近。 特斯拉在长三角启动新一轮供应链审厂并下达实质订单，涉及关节模组、执行器、精密结构件等核心环节，标志Optimus从样机叙事切换至量产叙事。\n\n2. 硬件价格加速坍塌。 宇树人形机器人单价两年降幅近72%（59.34万→16.76万元），高盛预测全球均价十年腰斩，中国降价节奏显著快于海外。核心零部件国产化率已超75%，脱离中国供应链单台成本将飙升至13.1万美元。\n\n3. 价值重心迁移。 业内共识正从“跑蹦跳”转向“谁能干活”，专家直言硬件越来越不值钱，真正门槛在软件、数据与机理融合；同时“卖铲人”逻辑走强——蓝点触控力传感器产能利用率近100%、年产能剑指百万套，端侧算力需求同步抬升。\n\n## 影响分析\n\n整机厂商面临估值重估。 硬件成本快速下探虽利好规模化普及，但也意味着整机环节的差异化壁垒被压缩，资本市场对其商业化兑现能力的审视将更严苛，缺乏真实场景落地的厂商估值承压。\n\n上游零部件与端侧算力成确定性受益方向。 传感器、执行器、物理AI芯片等“卖铲人”订单可见度更高，国产替代叠加量产放量，业绩兑现节奏或快于整机。特斯拉供应链审厂进一步强化国产厂商的全球卡位。\n\n产业竞争焦点转向“数据+场景”闭环。 集群具身智能需跨越互联互通、环境理解、知行合一三关，云边端协同能力将决定谁能率先跑通商业化，单纯拼硬件参数的阶段正在终结。",
  "no": 115
 },

  "title": "三星首尔医院发布人形手术辅助机器人：“递手术刀”一声指令，两台机器人即可与医生协同手术",
  "src": "Exa 搜索",
  "lede": "崔胜旭 记者 \n\n| 输入: 2026/09/22 10:24 CST\n\n## 三星首尔医院16日首次公开两款人形手术辅助机器人；郑容基教授：“有望填补手术室人力缺口” \n\n（从右起）三星首尔医院耳鼻咽喉科教授郑容基、整形外科教授裴珠英、智能医疗机器人研究中心教授郑圭焕、移植外科教授吴南基等“Orchestra（管弦乐团）”联盟开发团队成员与人形手术辅助机器人合影。 照片=三星首尔医院\n\n在手术室里，让具有人类外形的“人形（Humanoid）”机器人递送手术器械的场景，正加速走向现实。\n\n三星首尔医院9日表示，将于16日下午3时在首尔江南区三星生命逸院站大楼B栋9层，首次向公众公开一款可识别医护人员语音指令并递送手术器械的人形手术辅助机器人。这也是该院历时一年多研发的机器人首次在媒体面前亮相。\n\n喊一声“请递手术刀”，会发生什么？\n\n当天演示的核心看点之一，是机器人接手手术室护士的部分工作。1号机器人可识别主刀医生的语音请求，并为确保主刀医生安全握持器械，先调整手柄方向与递送位置，再将器械递出。器械使用完毕后，机器人会再次接回并整理到指定位置，同时掌握剩余器械情况以及下一次请求的情境。\n\n三星首尔医院耳鼻咽喉科教授郑容基解释说：“关键不在于把器械递一次就结束，而是在真实手术进行时，像对待人一样完成‘请求—递送—使用—回收—整理’这一整套器械循环流程。”\n\n复刻医生手部动作的机器人\n\n另一项演示中，机器人将直接握持手术器械，展示切开组织（切开）、剥离（剥离）以及缝合（缝合）的过程。\n\n主刀医生看着显示器移动操作，机器人便同步复现相同动作。其效果与演员休·杰克曼出演的电影《铁甲钢拳》中机器人模仿人类动作的场景颇为相似。\n\n郑教授表示：“目前还不是机器人自行判断患者状态并自动实施手术的阶段。”他补充说，“而是由经验丰富的医护人员通过操控装置，实时控制机器人的双臂与手术器械。”\n\n两台机器人组队，全球首次画面\n\n此次演示中，两台机器人将与人类医生共同分担手术流程。三星首尔医院称，这种三方协作演示为全球首次。1号机器人承担护士角色的同时，2号机器人用左手握持腹腔镜内镜，调整视野使手术部位位于画面中央；右手则持手术钳，在主刀医生指示下将组织向所需方向牵拉并翻开。\n\n郑教授说：“由于一台人形手术辅助机器人同时负责内镜视野与组织牵引，因此可以把‘让手术部位更清晰可见’的动作与‘确保持所需手术空间’的动作联动起来进行协调调整。”\n\n不过，该环节是在模拟开腹与腹腔镜手术的仿真环境中进行的演示，并未对真实患者实施手术。\n\n全球竞逐手术室机器人\n\n将人形机器人引入手术室的尝试，在世界各地仍处于起步阶段。\n\n台湾富士康已在医院内运营用于搬运药品与检体的物流机器人“NuraBot”。此外，富士康还与台湾台中荣民总医院、元海科技合作开发协作机器人“ScrubBot”，可根据外科医生的语音指令递送手术器械，并于今年6月在台北国际电脑展（Computex）上亮相。该机器人基于英伟达面向机器人的AI平台“Isaac（艾萨克）”打造，具备识别手术场景并随情境变化自行判断下一步动作的功能。\n\n英伟达与富士康表示，ScrubBot已在手术室投入使用。不过，与NuraBot不同的是，双方并未具体披露在哪家医院、经过多长时间的验证。就“识别医生语音指令并递送器械”这一功能而言，海外已率先推出。\n\n由人操控、用于操作手术器械的机器人研发也在提速。美国加州大学圣迭戈分校（UC San Diego）研究团队7月8日在国际学术期刊《《自然》（Nature）》发表称，他们成功使用由人远程操控的人形机器人切除猪的胆囊。其中一次手术仅由两台机器人完成。两台机器人协作本身已在真实动物手术中得到验证。\n\n三星首尔医院强调的“全球首次”，指的是在两台机器人基础上再加入人类医生，形成三者共同协作的组合。不过，目前仍处于仿真环境演示阶段，并非真实手术。\n\n郑教授将该机器人的优势之一概括为可直接沿用现有手术室。他表示：“无需为人形手术辅助机器人另建专用手术室，机器人可以像以往一样使用为人类设计的手术室与既有手术器械。”他还预测，“商业化后，即便不对环境作额外改造，也能快速应用到手术室一线。”\n\n为期5年的国家课题，为人力紧缺一线提供支撑\n\n该机器人研发始于三星首尔医院在2025年被选定为韩国版ARPA-H项目主管机构。\n\n三星首尔医院与Rainbow Robotics（彩虹机器人）、Aiden Robotics（艾丁机器人）、HaHaeHo（哈海号）、三星融合医学科学研究院、首尔大学、国立癌症中心、全北大学医院共同组建“Orchestra（管弦乐团）”联盟，联合开发机器人。",
  "deep": "## AI 解读\n\n## 核心要点\n\n1. 技术定位：三星首尔医院发布的人形手术辅助机器人，本质是“语音响应+动作复刻”的协作系统，而非自主手术AI。医生仍是决策核心，机器人承担护士递械与助手牵拉视野的辅助角色。\n2. 差异化亮点：两台机器人+人类医生的三方协作演示为全球首次，但尚处仿真环境阶段，未进入真实手术。\n3. 竞争格局：富士康ScrubBot已基于英伟达Isaac平台进入手术室，海外在语音递械功能上领先；三星的差异化在于“不改造现有手术室”的落地兼容性。\n4. 项目背景：韩国版ARPA-H五年国家课题，联合Rainbow Robotics等产学研联盟推进。\n\n## 影响分析\n\n短期看，该技术瞄准手术室护士人力缺口，若商业化落地，可降低医院对专科护士的依赖，缓解人力结构性短缺。中期看，“沿用现有手术室与器械”的策略若成立，将显著降低医院部署门槛，相比需重建专用环境的方案更具推广优势。但需注意：仿真演示到真实手术之间存在安全性验证、伦理审批与临床数据积累的多重鸿沟，富士康未披露验证细节的前例也提示行业存在“演示先行、落地滞后”的风险。长期看，人形机器人在手术室的角色演进路径清晰——从递械到复刻操作，再到远程操控，最终可能指向半自主手术，但当前阶段的核心价值仍是“辅助增效”而非“替代医生”。",
  "no": 116
 },

  "lede": "财闻 2026-09-22 21:28:35\n\n9月22日消息，在第48届世界技能大赛开幕式上，宇树科技-W（688836.SH） 19台H2人形机器人与120名舞者同台共舞，上演全球首次全尺寸通用人形机器人全AI驱动自主集群表演。机器人不依靠场外定位基站，完全依靠机载激光雷达实现环境感知与厘米级自主定位；借助自研集群协同调度系统，实现19台机器人毫秒级协同同步；舞蹈全身动作由强化学习算法生成，可跟随音乐节奏；整套系统具备自主纠错能力，当受到舞台灯光、人员走动等外界干扰出现位置偏移时，机器人可以自主识别偏差、自动修正归位。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 技术突破：全球首次实现全尺寸通用人形机器人“全AI驱动”的自主集群表演，19台H2机器人不依赖场外定位基站，仅靠机载激光雷达完成厘米级定位与毫秒级协同，动作由强化学习生成并能跟随音乐节奏。\n2. 鲁棒性验证：系统具备自主纠错能力，可在舞台灯光、人员走动等干扰下识别偏差并自动归位，意味着从“实验室可控环境”迈向“真实复杂场景”。\n3. 主体与场景：宇树科技（688836.SH）在第48届世界技能大赛开幕式完成演示，兼具技术发布与品牌曝光双重属性。\n\n影响分析\n\n其一，技术层面，去基站化的机载感知+分布式集群调度，是人形机器人从“单体智能”走向“群体智能”的关键一步，直接对应工业巡检、仓储物流、舞台演艺等多机协作场景的落地需求。其二，产业层面，强化学习生成动作+自主纠错，降低了多机部署的调试成本与对基础设施的依赖，有望加速人形机器人商业化进程。其三，资本市场层面，此次全球首次的标签为宇树科技强化了“人形机器人第一梯队”的叙事，短期或提振板块情绪，但需注意演示场景与规模化商用之间仍存在可靠性、成本与量产能力的验证鸿沟。",

  "title": "斯睿特首次披露工业具身数据飞轮 照片赋能机器人自主作业_凤凰网",
  "src": "Exa 搜索",
  "lede": "凤凰网深圳\n\n2026年09月23日 00:10:04 来自广东省\n\n拍一张照片，机器人就能用它训练仿真；面对从未见过的物件，伸手就能学会抓取；一句\"小睿小睿，给我拿瓶水\"，HaiBot转身取来递到嘉宾手中——这不是演示视频，而是9月18日广州\"一图启智 看见即做到\"斯睿特工业具身闭门技术预览会的现场实况。\n\n此次预览会，斯睿特首次公开展示工业具身\"数据飞轮\"的完整运转过程：\n\nAI之眼系列工业感知产品连接真实生产现场，数翼DataWing将现场数据转化为可训练、可评测、可复用的模型能力，HaiBot将这些能力带回现实世界完成任务执行；\n\n执行产生的新数据再次回流，进入下一轮训练与迭代，形成\"场景—数据—模型—复用\"的正向飞轮。\n\n区别于行业由通用大模型向下适配工业场景的路线，斯睿特智能走出从真实工业场景向上生长的差异化路径：具身业务是新的，入场券是旧的——依托9年产线积累，打通工艺Know-How、硬件感知、工业数据资产与机器人执行，让真实工业数据持续转化为能力。\n\n一、四路数据供给：真实合成双轮驱动数据引擎\n\n活动现场，斯睿特技术人员展示了端侧AI智能相机完成产线检测推理，检测数据实时回流至数翼DataWing模型；数翼模型自动完成数据增广生成训练包、评测包，一键启动模型训练，训练好的模型经过评测后重新下发至端侧，实现产品换型、新产线的快速上线。\n\n区别于单纯依赖产线现场采集的路线，斯睿特的数据引擎由四路供给共同驱动：依托企业9年积累的48TB真实工厂工业数据集，叠加遥操作示教高保真采集、数字孪生仿真合成与真机执行数据回流，数翼DataWing打通数据采集、2D转3D资产生成、数据增广、模型自动化训练、模型评测、长尾样本自动补齐的完整闭环，让模型在新产线、新行业的适配周期压缩至数周。\n\n二、闭环运算架构：预测执行回流实现手眼脑协同\n\n预览会还首次系统披露了斯睿特\"大脑—小脑—本体\"三层协同架构：\n\n大脑侧，CogniMotor具身大小脑模型负责任务理解、分解与规划，SeerWAM预见式世界行动模型在动作执行前预演环境演化、预判干扰与偏差，做到\"先算一步\"；\n\n小脑侧，自研机器人控制器以传统控制保底、强化学习增强接触自适应、生成式策略学习长时序技能，执行误差实时闭环修正；\n\n本体侧，轮式双臂机器人已量产交付，并具备跨本体训练能力。\n\n依托3D视觉六自由度定位与力觉反馈的视触融合能力，HaiBot可实现接触级精细作业：涂胶检测精度达±0.1mm，螺栓拧紧合格率99.9%以上，双臂负载20kg。\n\nVLA模型与世界模型形成的\"先预测、再执行、后回流\"闭环，让机器人\"先生成、不直连真机，先评分、再放行\"，在真实产线安全稳定作业。\n\n三、极简输入范式：单张现场照片触发机器人自主作业\n\n现场还开放了手机体验2D照片生成3D工件模型的交互体验，无需专业建模软件即可快速产出工业3D资产，为具身机器人仿真训练提供数据底座。机器人的仿真环境复刻真实场景，还能生成、编辑布局、纹理、光照效果，支持Real2Sim任务场景适配训练和Sim2Real快速技能迁移。\n\n目前，HaiBot具身机器人聚焦分拣搬运、装配、AI质检三大工业刚需，已完成头部车企7天快速POC闭环验证；按典型汽车产线方案测算，单台机器人投资回收期约17.5个月。\n\n四、技术自主突破：打破垄断定义工业具身新场景\n\n从打破海外技术垄断、实现汽车冲压、焊装、涂装、总装四大工艺全覆盖，到成为国内首家掌握汽车制造高速3D涂胶飞拍检测技术的企业，再到自研多模态基座大模型，斯睿特已累计取得近100项知识产权，头部车企市场占有率达90%以上，三年客户复购率达60%以上。\n\n作为首家进入奔驰供应链的本土工业AI品牌，斯睿特已完成头部车企具身POC 7天验收，首台具身机器人已成功交付，并与某头部汽车厂商启动智能分拣\"千人替代\"合作，将工人从高强度、重复性岗位转向更高价值工序。公司现为国家级高新技术企业、广东省专精特新中小企业、工信部具身智能促进会成员。\n\n在具身智能首次写入《政府工作报告》的产业窗口期，此次首次公开的工业具身\"数据飞轮\"，让感知、数据、模型与执行真正连接起来，让一次任务的完成成为下一轮学习与迭代的起点，为中国工业智能化提供可复制的落地范式。",
  "deep": "## AI 解读\n\n核心要点\n\n1. 数据飞轮闭环落地：斯睿特首次完整披露“场景—数据—模型—复用”正向飞轮，由48TB真实工业数据集、遥操作示教、数字孪生合成、真机回流四路供给驱动，新产线适配周期压缩至数周。\n2. 三层协同架构：大脑（CogniMotor+SeerWAM世界模型）负责预测规划，小脑（控制器+强化学习）负责接触自适应，本体（轮式双臂）已量产，形成“先预测、再执行、后回流”闭环。\n3. 极简输入范式：单张2D照片即可生成3D工件模型并触发仿真训练与真机作业，大幅降低工业具身的数据门槛。\n4. 商业化验证：头部车企7天POC闭环，单台回收期约17.5个月，涂胶精度±0.1mm、拧紧合格率99.9%，并启动“千人替代”合作。\n\n影响分析\n\n斯睿特走的是“从真实工业场景向上生长”的差异化路线，与通用大模型向下适配形成鲜明对比。其护城河不在模型参数，而在9年产线Know-How与数据资产——这是纯AI公司短期难以复制的壁垒。数据飞轮一旦在头部车企跑通，将形成“越用越强、越强越粘”的正反馈，加速工业具身从POC走向规模化复制。叠加具身智能写入《政府工作报告》的政策窗口，该模式有望成为工业智能化可复制的落地范式，并对传统工业机器人集成商形成降维压力。",
  "no": 118
 },

  "title": "美伊也门局势转急 中东各国严阵以待 - 国际 - 即时国际",
  "src": "Exa 搜索",
  "lede": "美伊也门局势转急 中东各国严阵以待 - 国际 - 即时国际\n\n 发布: 12:19am 22/09/2026 \n\n美国总统特朗普在也门问题上策略反复.（欧新社照片）\n\n（纽约22日综合电）伊朗声称收到情报，表示美国准备对伊朗发动新一波轰炸，令到中东各国严阵以待，准备应对随时可能升级的暴力冲突。\n\n伊朗国家电视台报道，军方中央司令部上周六（19日）通报，美国准备针对伊朗采取新的行动，但是没有透露具体细节。\n\n伊朗伊斯兰革命卫队（IRGC）今天警告，如果美国发动新攻势，伊朗必将打击新目标并部署新型武器。革命卫队表明，已为“持久战”做好准备。\n\n伊朗领导人恫言，报复行动可能波及印度洋上的美国海军力量；德黑兰也指责一些波斯湾国家领导人“两面三刀”，为美国的袭击行动开绿灯。\n\n美媒《霍士新闻》昨日报道，总统特朗普说“不久的将来会发生大事”，还说他在考虑的选项包括“彻底消灭伊朗、任由伊朗经济崩溃，或者达成协议”。\n\n同日，特朗普临时缩短在大卫营总统专属度假地的周末休憩，而且官方没给予解释。与此同时，美国国务院向人在中东的所有美国公民发出新安全预警，这些似乎都预示事态不寻常。\n\n美伊的对阵态势是在也门胡塞武装组织攻击沙地阿拉伯首都利雅得之后拔高。胡塞武装和沙地近日再度交火，胡塞上周六首次向利雅得发射导弹。\n\n美国向来认定胡塞武装是伊朗的代理部队，这回也坚称胡塞攻击利雅得是德黑兰授意。\n\n霍尔木兹海峡仍封锁，胡塞武装又宣布控制也门西海岸的红海战略港口，从而控制波斯湾另一运输要道——曼德海峡。\n\n沙地石油因此大受影响，便向关键安保盟友美国求助，只是美方至今显然对此保持距离。\n\n《纽约时报》昨天报道，特朗普在也门问题上策略反复，显示他在沙地求援的压力和确保不在中东开辟新战线的风险之间左右为难。\n\n报道说，沙地王储穆罕默德萨勒曼当天致电特朗普，再次恳请他介入，从而遏制胡塞组织迅速推进的势头。\n\n报道引述美国政府官员说，特朗普前一天刚告诉顾问，他反对实施空袭，同穆罕默德萨勒曼通话后又改变主意，“指示五角大楼准备对胡塞武装发动空袭”。美军为此做好准备，可到了昨午，特朗普又放弃动手。\n\n美媒早前报道，特朗普已拒绝过沙地提议打击胡塞武装的请求，而且似乎对胡塞武装声称不袭击沙地以外船只的表态颇为放心。\n\n在昨天的《霍士新闻》采访，特朗普表明：“美国与胡塞武装保持密切联系，他们同意不会与美国开战。”\n\n今年的联合国大会从周二至周六（22日至26日）在纽约召开，预料美伊战争和也门局势将是大会焦点之一。伊朗总统佩泽什基安将在联大发表讲话的众多国家领导人之一。\n\n特朗普在上述访谈中说，他愿意在纽约与佩泽什基安会面。不过，这个提议很可能被伊朗拒绝，因为它一贯不愿与美国直接谈判，反而选择通过调解方沟通。\n\n此外，伊朗官媒今天报道，美国拒绝向佩泽什基安的联络团队发放签证，导致团队无法随行。",
  "deep": "## AI 解读\n\n# 美伊也门危局：特朗普的“战略模糊”与中东火药桶\n\n核心要点：\n\n1. 伊朗强硬备战：IRGC宣称已为“持久战”部署新型武器，威胁打击印度洋美军力量，并指责波斯湾国家“两面三刀”。\n2. 特朗普策略反复：从反对空袭到指令五角大楼准备打击胡塞武装，再到最后一刻收手，决策摇摆暴露内部矛盾。\n3. 战略通道告急：胡塞武装控制曼德海峡，与霍尔木兹海峡封锁形成“双卡脖子”态势，直接威胁沙地石油出口。\n4. 外交窗口收窄：美国拒发伊朗总统随行团队签证，联大会晤前景黯淡。\n\n影响分析：\n\n特朗普的“战略模糊”实为两难困境的投射——既需回应沙地求援以维系盟友体系，又忌惮卷入新中东战线。这种摇摆向德黑兰释放了混乱信号，反而可能诱使伊朗误判美方底线。胡塞武装同时扼守波斯湾与红海两大能源通道，意味着冲突一旦升级，全球油价将面临断供冲击。更危险的是，伊朗将报复范围明确延伸至印度洋美军，冲突地理边界正被主动拓宽。联合国大会期间，美伊若无法建立直接沟通渠道，任何擦枪走火都可能引爆全面对抗。当前局势已非“是否升级”的问题，而是“何时失控”的倒计时。",

 },

  "src": "Exa 搜索",
  "lede": "特朗普曾下令对也门胡塞武装发动空袭，却在行动执行前的最后阶段突然变卦叫停。这一决策反复暴露出其外交安全团队内部协调的混乱，也折射出美国中东政策缺乏连贯战略框架的深层问题。叫停的具体动因尚不明确，可能涉及对升级风险的重新评估、盟友态度变化或国内政治考量。\n\n此类“临阵变卦”严重损害美国军事威慑的可信度。对手可能据此判断华盛顿决策犹豫、底线模糊，从而在红海航运袭击等问题上更加有恃无恐。决策过程的不稳定同时加剧盟友焦虑——沙特、以色列等地区伙伴难以预判美国承诺的可靠性，可能被迫自行强化军事姿态，推高地区误判风险。胡塞武装或将此解读为美方示弱信号，进一步测试红线。总体而言，这一事件凸显特朗普第二任期安全决策的不可预测性，短期内中东局势的波动性与不确定性将显著上升，市场对地缘风险的定价也需相应调整。",
  "deep": "## AI 解读\n\n# 深度分析：特朗普“最后一刻叫停”空袭胡塞武装\n\n核心要点\n\n据披露，特朗普曾下令对也门胡塞武装发动空袭，却在行动执行前的最后阶段突然变卦叫停。这一决策反复暴露出其外交安全团队内部协调的混乱，也折射出美国中东政策缺乏连贯战略框架的深层问题。叫停的具体动因尚不明确，可能涉及对升级风险的重新评估、盟友态度变化或国内政治考量。\n\n影响分析\n\n首先，此类“临阵变卦”严重损害美国军事威慑的可信度。对手可能据此判断华盛顿决策犹豫、底线模糊，从而在红海航运袭击等问题上更加有恃无恐。其次，决策过程的不稳定加剧盟友焦虑——沙特、以色列等地区伙伴难以预判美国承诺的可靠性，可能被迫自行强化军事姿态，推高地区误判风险。再次，胡塞武装或将此解读为美方示弱信号，进一步测试红线。总体而言，这一事件凸显特朗普第二任期安全决策的不可预测性，短期内中东局势的波动性与不确定性将显著上升，市场对地缘风险的定价也需相应调整。",

  "title": "9月22日收盘：美股全线走高 纳指涨超2% AI与芯片股领涨 Meta涨超11% 英特尔涨超12% AMD市值首破1万亿美元_新浪财经_新浪网",
  "src": "Exa 搜索",
  "lede": "9月22日收盘：美股全线走高 纳指涨超2% AI与芯片股领涨 Meta涨超11% 英特尔涨超12% AMD市值首破1万亿美元\n\n 2026年09月22日 04:53 环球市场播报\n\n 周一，美国股市全线上涨，关键科技股走高，比特币价格突破86000美元，油价与国债收益率回落提振市场情绪。\n\n 道指涨366.18点，涨幅0.71%，报52048.82点；标普500指数涨114.20点，涨幅1.49%，报7764.70点；纳指涨599.54点，涨幅2.26%，报27122.09点。\n\n 纳斯达克100指数涨838.18点，涨幅2.83%，报30482.35点。费城半导体指数涨4.29%，创8月4日以来最佳单日表现。\n\n 美股七姐妹均收涨，Meta涨超11%，创去年4月以来最大单日涨幅，特斯拉涨超3%，英伟达涨超2%，谷歌、亚马逊微软涨超1%，苹果小幅收涨。\n\n 半导体芯片股大涨，ARM涨超17%，创去年4月以来最大单日涨幅；英特尔涨超12%，创5月以来最大涨幅；AMD涨约10%，再创新高，市值首次突破1万亿美元，居全球上市公司总市值第16位，成为第四家跻身“万亿美元俱乐部”的美国芯片公司；高通涨超9%，创5月以来最大单日涨幅。\n\n 光通信股大幅走高，Astera Labs涨超12%，Credo涨超6%，康宁、迈威尔科技涨超5%。\n\n 比特币也升至八个月高位，加密货币概念股集体走高，Strategy涨超9%，Coinbase涨超3%。\n\n 华纳兄弟探索（WBD）涨超10%，创去年10月以来最大单日涨幅，得益于与派拉蒙天舞的收购案。\n\n 上周，道指下跌1.7%，为3月以来最差表现。标普500下跌约0.1%。仅以科技股为主的纳斯达克收涨0.7%。\n\n 国际油价21日显著下跌，截至当天收盘，纽约商品交易所10月交货的轻质原油期货价格下跌4.52美元，收于每桶95.78美元，跌幅为4.51%；11月交货的伦敦布伦特原油期货价格下跌3.53美元，收于每桶100.34美元，跌幅为3.4%。\n\n 上周末中东敌对行动最新升级之后，伊朗支持的胡塞武装称，他们周六用导弹和无人机袭击了沙特阿拉伯。当天晚些时候，美国国务院警告美国人重新考虑前往中东的旅行，因美国和伊朗相互威胁要恢复袭击。\n\n 然而，美伊外交在短期内仍有可能，美国总统特朗普告诉福克斯新闻称，他可能愿意在本周联合国大会期间会见伊朗总统佩泽希齐扬。\n\n 美国国债收益率随油价下跌而下降。 10年期国债收益率下跌逾4个基点至4.951%， 30年期国债收益率也降至5.284%。\n\n 在美国努力遏制顽固通胀和高企债券收益率之际，美联储上周进行了三年来的首次加息。\n\n 本周经济与财报日程相对清淡，市场密切关注人工智能。此前Anthropic首席执行官达里奥·阿莫代的一篇文章，公开了一场长期酝酿的辩论：前沿人工智能实验室是否应该放缓模型开发速度。\n\n责任编辑：丁文武",
  "deep": "## AI 解读\n\n核心要点提炼\n\n9月22日美股全线走高，纳指涨2.26%，费城半导体指数大涨4.29%，创8月以来最佳单日表现。AI与芯片股成为绝对主线：Meta涨超11%，英特尔涨超12%，ARM涨超17%，AMD涨约10%并首次突破1万亿美元市值，成为第四家跻身“万亿俱乐部”的美国芯片公司。与此同时，比特币突破86000美元，油价大跌逾4%，10年期美债收益率回落至4.95%下方，风险偏好明显回暖。\n\n影响分析\n\n本轮上涨的核心驱动并非单一财报或政策，而是“油价回落→通胀预期降温→美债收益率下行→科技股估值修复”的传导链条。在中东局势升级的背景下，油价不涨反跌，反映市场对供应冲击的定价趋于理性，也间接缓解了美联储抗通胀的压力。AMD市值破万亿具有标志性意义——AI算力需求正从GPU向CPU、定制芯片等全链条扩散，半导体板块的估值逻辑正从“周期”转向“成长”。但需警惕两点：一是纳指单日涨幅过大，短期存在获利回吐压力；二是Anthropic CEO关于“放缓前沿模型开发”的公开讨论，暗示AI监管与伦理争议可能成为下一阶段扰动因素。整体看，市场情绪偏乐观，但持续性取决于本周AI相关表态及后续通胀数据。",

  "title": "全球市场突然“Risk On”！纳指飙2%、AMD首破1万亿美元、比特币狂飙6%，油价跌超5%、黄金承压提供者FX168",

  "lede": "全球市场突然“Risk On”！纳指飙2%、AMD首破1万亿美元、比特币狂飙6%，油价跌超5%、黄金承压\n\n夏洛特\n\n摘要：周一全球市场风险偏好明显回暖：AI股强势反弹，AMD市值首次突破1万亿美元；比特币冲上8个月新高，带动加密资产集体走强。与此同时，油价和美债收益率双双回落，缓解市场对通胀与金融条件收紧的担忧。不过，美联储后续加息预期、中东局势以及强美元仍是市场主要风险。\n\n但这并不意味着市场风险已经解除。美联储上周刚刚进行了三年多来的首次加息，市场仍在评估后续进一步收紧政策的可能性；中东局势依旧紧张，能源供应风险也远未完全消退。与此同时，美元保持强势，黄金一度跌至4322美元附近，日元则重新走弱至157附近，东京是否会出手干预汇市再度成为焦点。换句话说，周一市场的主线不是风险彻底消失，而是油价回落、收益率下行以及AI和加密资产的强势反弹，暂时压过了高利率和地缘政治带来的压力。\n\nAI重新成为美股最强主线 AMD市值首次突破1万亿美元\n\n美股周一强势反弹。标普500指数上涨约1.5%，纳斯达克综合指数上涨约2%，道琼斯工业平均指数上涨约325点，涨幅约0.6%。科技股成为绝对主角，尤其是半导体和人工智能相关股票集体走高。Intel股价一度大涨约13%，AMD上涨约9%，Qualcomm涨约6%，资金迅速重新涌向此前因高估值和AI泡沫担忧而遭到抛售的科技板块。\n\nAMD的表现尤其抢眼。该股盘中一度触及613.92美元历史新高，市值首次突破1万亿美元，正式迈入全球“万亿美元俱乐部”。过去五个交易日，AMD累计涨幅约24%，今年迄今涨幅更已超过180%。公司第二季度营收达到115.4亿美元，同比增长50%，其中数据中心业务销售额达到67亿美元，同比增长107%，AI芯片成为增长核心。\n\n更重要的是，当前AI基础设施建设尚未显示明显降温迹象。AMD首席执行官苏姿丰此前表示，公司预计2027年数据中心销售额将实现翻倍；英伟达首席执行官黄仁勋上周也表示，预计明年芯片销量将大幅增长。Reuters数据显示，Intel上涨13%、AMD上涨9.3%并首次达到1万亿美元市值，Meta也因目标价上调而大涨6.7%，显示AI交易重新成为推动市场反弹的核心动力。\n\n这一变化对整个市场意义不小。上周，道指累计下跌1.7%，创3月以来最差单周表现，标普500也小幅下跌，仅纳指维持上涨。周一科技股的快速反攻，使投资者重新押注AI投资和企业盈利仍能够抵消部分高利率压力。\n\n油价突然大跌 美债收益率跌破5%\n\n除了AI板块，周一风险资产能够大幅反弹的另一个关键原因，是油价和美债收益率同步回落。\n\n美油期货一度下跌约5%至每桶91美元略上方，国际基准布伦特原油下跌约4%，跌至每桶99美元附近。此前，中东局势再次升温，伊朗支持的胡塞武装称周末对沙特发动导弹和无人机袭击，美国和伊朗也继续释放强硬信号。不过，市场同时开始重新交易外交降温的可能性，特朗普表示可能愿意在联合国大会期间与伊朗总统佩泽希齐扬会面，这令部分能源风险溢价迅速回落。Reuters也指出，市场对中东谈判出现突破的预期推动原油跌至11日低点，并帮助缓解美股压力。\n\n油价下跌迅速传导至债券市场。 10年期美债收益率下降至约4.96%，重新跌破备受关注的5%关口；30年期美债收益率也回落至约5.30%。对于此前持续承受“高油价+高利率”双重压力的股票市场而言，这一组合无疑带来明显喘息空间。\n\n但利率风险并未真正消失。Yardeni Research总裁Ed Yardeni指出，如果能源价格长期维持高位，将进一步增强美联储收紧政策的理由。他警告称，中东冲突、乌克兰对俄罗斯炼油设施的袭击以及对俄制裁，都在继续限制全球燃料供应，能源冲击持续时间越长，出现第二轮通胀效应的风险就越高。\n\n芝加哥联储主席古尔斯比周一也强调，当前通胀压力已经不再只来自关税和能源价格，强劲需求同样可能加剧通胀。Reuters显示，市场目前仍在计入美联储下月再次加息约50%的可能性。\n\n美元保持强势 日元再度逼近干预敏感区\n\n汇市方面，美元依然保持韧性。美元指数一度升至100.43高点，在上周累计上涨1.1%之后继续维持强势。美联储加息以及后续仍可能进一步收紧政策，是支撑美元的主要因素。\n\n日元则重新成为汇市焦点。美元兑日元升至157.525附近，日元过去六个交易日中有五个交易日走弱。日本央行上周将政策利率上调至1.25%，创31年来最高水平，但由于政策委员会出现两张反对票，同时央行并未给出足够明确的鹰派前瞻指引，市场反而对日元进一步加息的预期降温。\n\n更值得关注的是，日本官员此前被指进行了“汇率检查”，这一举动通常被市场视为直接干预汇市前的准备信号。随着美元兑日元重新逼近157至158区域，交易员正在重新评估东京是否可能出手。",
  "deep": "## AI 解读\n\n核心要点提炼\n\n周一全球市场上演典型\"Risk On\"切换，但本质是压力暂缓而非风险出清。三条主线：一是AI叙事强势回归，AMD市值首破1万亿美元（年内涨超180%），数据中心营收同比翻倍，带动Intel、高通等半导体股集体反攻，纳指涨约2%；二是油价单日暴跌约5%（美油回落至91美元），叠加10年期美债收益率跌破5%，共同缓解\"高油价+高利率\"双杀压力；三是比特币涨6%创8个月新高，风险偏好全面回暖。但美元维持强势，日元逼近157干预敏感区，黄金承压。\n\n影响分析\n\n此轮反弹的驱动力是分母端改善——油价与收益率回落压低贴现率，而非盈利预期根本性上修，因此持续性存疑。关键变量有三：其一，美联储下月加息概率仍约50%，若能源价格因中东局势再度冲高，第二轮通胀效应将重启紧缩交易；其二，日元逼近157-158区间，日本\"汇率检查\"已释放干预信号，一旦实际出手将引发套息交易逆转，冲击全球流动性；其三，AI板块估值已处高位，AMD万亿市值隐含极高增长预期，任何资本开支放缓信号都可能触发剧烈回调。结论：这是风险资产的战术性喘息，而非趋势性反转，投资者需警惕\"油价反弹+美元走强\"组合对反弹的快速终结。",

 },
